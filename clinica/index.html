<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ala · a clínica</title>
<meta name="description" content="A manhã da clínica numa tela. Confirmação, sala, retorno e exame, sem um atropelar o outro.">
<link rel="canonical" href="https://akashahub.com.br/clinica/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--ward:#e4eee8;--chart:#f6faf7;--pulse:#10261f;--scrub:#0e6b52;--alarm:#8f2d24;--mist:#5c6b64}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ward);color:var(--pulse);font-family:Karla,sans-serif}
button,select{font:inherit;color:inherit;cursor:pointer}
h1,h2,.name{font-family:"Source Serif 4",Georgia,serif;font-weight:500;margin:0}
img{display:block;width:100%;height:100%;object-fit:cover}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;padding:16px 20px;border-bottom:1px solid rgba(16,38,31,.1)}
.nav{display:flex;gap:8px}
.nav button,.act{height:44px;border:0;padding:0 14px}
.nav button.on,.act.ink{background:var(--pulse);color:var(--chart)}
.act.leaf{background:var(--scrub);color:var(--chart)}
.act.ghost{background:var(--chart)}
.notice{background:var(--scrub);color:var(--chart);padding:8px 20px;font-size:14px}
.board{display:block}
.day button{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid rgba(16,38,31,.1);padding:12px 16px}
.day button.on{background:var(--chart)}
.kicker{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--mist)}
.alarm{color:var(--alarm)}
.mist{color:var(--mist)}
.stage{padding:18px 20px 40px}
.side{padding:16px 16px 28px;border-top:1px solid rgba(16,38,31,.1)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
@media(min-width:980px){
 .board{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;min-height:calc(100dvh - 78px)}
 .day{border-right:1px solid rgba(16,38,31,.1)}
 .side{border-top:0;border-left:1px solid rgba(16,38,31,.1)}
 .room{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;max-width:1000px;margin:0 auto}
}
</style>
</head>
<body>
<header>
 <div><p class="name" style="font-size:40px;line-height:1">Ala</p><p class="mist">A manhã da clínica, numa tela só.</p></div>
 <nav class="nav" id="nav"></nav>
</header>
<div id="notice"></div>
<main id="app"></main>
<script>
const media={desk:"media/desk.jpg",room:"media/room.jpg",hall:"media/hall.jpg"};
const roomName={"1":"Sala 1","2":"Sala 2",coleta:"Coleta"};
let visits=[
 {id:"h",name:"Helena Dias",time:"08:00",room:"1",reason:"Retorno da pressão",prep:"Traga a lista dos remédios.",allergy:"Nenhuma",status:"na espera",returnSet:null,paid:false},
 {id:"c",name:"Caio Nunes",time:"08:30",room:"1",reason:"Primeira consulta",prep:"Chegue 10 minutos antes.",allergy:"Dipirona",status:"falta confirmar",returnSet:null,paid:false},
 {id:"m",name:"Marina Luz",time:"08:00",room:"2",reason:"Dor no joelho",prep:"Vista uma roupa que suba acima do joelho.",allergy:"Nenhuma",status:"em sala",returnSet:null,paid:true},
 {id:"r",name:"Rita Paes",time:"09:30",room:"coleta",reason:"Coleta de sangue",prep:"Jejum de 8 horas.",allergy:"Nenhuma",status:"confirmado",returnSet:null,paid:false}
];
let labs=[{id:"lab",name:"Helena Dias",exam:"Hemograma",told:false}];
let walk={name:"Lúcia Prado",reason:"Dor de cabeça há dois dias"};
let lens="recepcao", openId="h", notice="";
const esc=s=>String(s).replaceAll("&","&").replaceAll("<","<").replaceAll(">",">");
function flash(t){notice=t;draw()}
function current(){return visits.find(v=>v.id===openId)||visits[0]}
function taken(room,id){return visits.some(v=>v.room===room&&v.status==="em sala"&&v.id!==id)}
function chart(v,pay){
 const acts=[];
 if(v.status==="falta confirmar") acts.push(`<button class="act ink" data-act="confirm" data-id="${v.id}">Confirmar</button>`);
 if(v.status==="confirmado"||v.status==="falta confirmar") acts.push(`<button class="act ghost" data-act="arrive" data-id="${v.id}">Chegou</button>`);
 if(v.status==="na espera"||v.status==="confirmado") acts.push(`<button class="act leaf" data-act="call" data-id="${v.id}">Chamar para a sala</button>`);
 if(v.status==="em sala") acts.push(`<button class="act ink" data-act="finish" data-id="${v.id}" data-back="1">Encerrar e marcar retorno</button><button class="act ghost" data-act="finish" data-id="${v.id}" data-back="0">Alta, sem retorno</button>`);
 if(pay) acts.push(`<button class="act ghost" data-act="pay" data-id="${v.id}">${v.paid?"Pago na recepção":"Em aberto na recepção"}</button>`);
 const extra=v.returnSet===true?"<p>O retorno já está na lista, ainda por confirmar.</p>":v.returnSet===false?"<p>Alta registrada. Ninguém fica esperando um retorno que não existe.</p>":"";
 return `<p class="kicker">${v.time} · ${roomName[v.room]} · ${esc(v.status)}</p><h2 class="name" style="font-size:36px;margin-top:6px">${esc(v.name)}</h2><p>${esc(v.reason)}. Alergia: ${esc(v.allergy)}.</p><p class="mist">${esc(v.prep)}</p><div class="row">${acts.join("")}</div>${extra}`;
}
function desk(){
 const v=current();
 const list=[...visits].sort((a,b)=>a.time.localeCompare(b.time)||a.name.localeCompare(b.name)).map(item=>`<button class="${item.id===v.id?"on":""}" data-act="open" data-id="${item.id}"><span class="kicker">${item.time} · ${roomName[item.room]}</span><span class="name" style="display:block;font-size:22px">${esc(item.name)}</span><span class="${item.status==="falta confirmar"?"alarm":"mist"}">${esc(item.status)}</span></button>`).join("");
 const pending=visits.filter(item=>item.status==="falta confirmar").map(item=>`<li>${esc(item.name)} ainda não confirmou as ${item.time}.</li>`).join("");
 const quiet=labs.filter(item=>!item.told).map(item=>`<li>${esc(item.exam)} de ${esc(item.name)} chegou e ninguém avisou. <button class="act ink" data-act="tell" data-id="${item.id}">Avisar</button></li>`).join("");
 const door=walk?`<li>${esc(walk.name)} está na porta, sem hora. ${esc(walk.reason)}. <button class="act leaf" data-act="walk">Encaixar às 09:00</button></li>`:`<li>O buraco das 09:00 foi preenchido, sem duas pessoas no mesmo horário.</li>`;
 const busy=visits.filter(item=>item.status==="em sala").map(item=>`<li>${esc(item.name)} está na ${roomName[item.room]}. A sala não recebe outra pessoa.</li>`).join("");
 return `<div class="board"><aside class="day"><p class="kicker" style="padding:16px 16px 8px">Hoje</p>${list}</aside><section class="stage"><img src="${media.desk}" alt="Recepção da clínica" style="height:176px"><div style="margin-top:16px">${chart(v,true)}</div></section><aside class="side"><p class="kicker alarm">O que ainda trava o dia</p><ul>${pending}${quiet}${door}${busy}</ul><img src="${media.hall}" alt="Corredor da clínica" style="height:140px;margin-top:14px"></aside></div>`;
}
function room(){
 const inside=visits.filter(v=>v.status==="em sala");
 const wait=visits.filter(v=>v.status==="na espera").map(v=>`<p style="border-top:1px solid rgba(16,38,31,.1);padding-top:10px">${v.time} · ${esc(v.name)}<span class="mist" style="display:block">${roomName[v.room]} · ${esc(v.reason)}</span></p>`).join("");
 return `<div class="stage room"><div><img src="${media.room}" alt="Sala de consulta" style="height:220px">${inside.length?inside.map(v=>`<div style="margin-top:16px">${chart(v,false)}</div>`).join(""):"<p>Ninguém na sala. A recepção chama quando a sala está livre.</p>"}</div><aside><p class="kicker">Quem espera</p>${wait}</aside></div>`;
}
function person(){
 const people=[...new Map(visits.map(v=>[v.name,v])).values()];
 const v=current();
 const mine=visits.filter(item=>item.name===v.name&&item.status!=="atendido");
 const cards=(mine.length?mine:[v]).map(item=>`<article style="border-top:1px solid rgba(16,38,31,.1);margin-top:16px;padding-top:12px"><p class="kicker">${item.time} · ${roomName[item.room]}</p><h2 class="name" style="font-size:32px">${esc(item.reason)}</h2><p>${esc(item.prep)}</p><p class="mist">A clínica não mostra aqui o que você deve. Isso fica na recepção.</p></article>`).join("");
 const told=labs.filter(l=>l.name===v.name&&l.told).map(l=>`<p>Seu ${esc(l.exam.toLowerCase())} já pode ser visto na clínica.</p>`).join("");
 const hidden=labs.some(l=>l.name===v.name&&!l.told)?"<p class=\"mist\">Tem exame na casa. A clínica avisa quando puder mostrar.</p>":"";
 return `<div class="stage" style="max-width:560px"><label class="mist">Entrar como<select data-act="who" style="display:block;height:48px;width:100%;margin-top:8px;background:var(--chart);border:1px solid rgba(16,38,31,.15);padding:0 12px">${people.map(p=>`<option value="${p.id}" ${p.id===v.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label><img src="${media.hall}" alt="" style="height:160px;margin-top:14px">${cards}${told}${hidden}</div>`;
}
function draw(){
 document.getElementById("nav").innerHTML=[["recepcao","Recepção"],["sala","Sala"],["paciente","Paciente"]].map(i=>`<button class="${lens===i[0]?"on":""}" data-act="lens" data-id="${i[0]}">${i[1]}</button>`).join("");
 document.getElementById("notice").innerHTML=notice?`<p class="notice">${esc(notice)}</p>`:"";
 document.getElementById("app").innerHTML=lens==="sala"?room():lens==="paciente"?person():desk();
}
document.body.addEventListener("click",(e)=>{
 const el=e.target.closest("[data-act]");
 if(!el) return;
 const act=el.dataset.act, id=el.dataset.id, v=visits.find(item=>item.id===id);
 if(act==="lens") lens=id;
 else if(act==="open") openId=id;
 else if(act==="confirm"&&v&&v.status==="falta confirmar"){v.status="confirmado";flash("Consulta confirmada.");return}
 else if(act==="arrive"&&v&&(v.status==="confirmado"||v.status==="falta confirmar")){v.status="na espera";flash("Chegou. Ainda não está na sala.");return}
 else if(act==="call"&&v){if(taken(v.room,id)){flash("A sala "+v.room+" ainda está ocupada.");return} v.status="em sala";openId=id;flash(v.name+" entrou na sala "+v.room+".");return}
 else if(act==="finish"&&v){if(v.status!=="em sala"){flash("Só se encerra quem está na sala.");return} const back=el.dataset.back==="1"; v.status="atendido"; v.returnSet=back; if(back) visits.push({...v,id:id+"-r",status:"falta confirmar",returnSet:null,paid:false,reason:"Retorno · "+v.reason}); flash(back?"Retorno marcado. A sala ficou livre.":"Alta sem retorno. A sala ficou livre.");return}
 else if(act==="pay"&&v) v.paid=!v.paid;
 else if(act==="tell"){const lab=labs.find(item=>item.id===id); if(lab) lab.told=true; flash("A pessoa foi avisada. O resultado sai da fila.");return}
 else if(act==="walk"&&walk){if(visits.some(item=>item.time==="09:00"&&item.room==="1")){flash("As 09:00 da sala 1 já têm alguém.");return} visits.push({id:"lucia",name:walk.name,time:"09:00",room:"1",reason:walk.reason,prep:"Pode beber água.",allergy:"A confirmar na ficha",status:"na espera",returnSet:null,paid:false}); openId="lucia"; walk=null; flash("Lúcia entrou no buraco das 09:00. Não ficou em cima de outra pessoa.");return}
 draw();
});
document.body.addEventListener("change",(e)=>{
 const el=e.target.closest("[data-act=who]");
 if(!el) return;
 openId=el.value; draw();
});
draw();
</script>
</body>
</html>
