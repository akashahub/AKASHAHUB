<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153b30"><title>Clínica | Plataforma de Gestão</title><meta name="description" content="Demonstração genérica de plataforma para clínicas. Dados fictícios, sem identificação de empresa ou profissionais."><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#eef3ef;--paper:#fff;--ink:#172a23;--muted:#728078;--line:#dfe8e1;--green:#153b30;--mint:#dcece2;--gold:#c6a66b;--red:#ad5a51}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0%,#dcebe1 0,transparent 38%),var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1280px;margin:auto;min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--green);color:white;padding:28px 18px}.logo{font:26px 'Playfair Display'}.logo small{display:block;font:10px 'DM Sans';letter-spacing:.18em;color:#c5ddc9;margin-top:5px}.side p{color:#bdd0c4;font-size:12px;line-height:1.6}.nav{display:grid;gap:6px;margin-top:30px}.nav button{padding:12px;border:0;text-align:left;border-radius:10px;background:transparent;color:#dbe8df}.nav button.on{background:#ffffff1c;color:white}.main{padding:30px clamp(16px,4vw,44px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.17em;color:var(--muted)}h1{font:34px 'Playfair Display';margin:7px 0}.muted{color:var(--muted)}.button{background:var(--green);color:white;border:0;border-radius:999px;padding:12px 17px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.metric,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 42px #183b2a0c}.metric span{color:var(--muted)}.metric b{display:block;font:28px 'Playfair Display';margin:8px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 15px}.tabs button{border:1px solid var(--line);background:white;border-radius:99px;padding:9px 13px}.tabs button.on{background:var(--green);color:white}.panel h2{font:22px 'Playfair Display';margin:0 0 14px}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin:6px 0 12px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.pill{border-radius:99px;padding:5px 9px;background:var(--mint);color:var(--green);font-size:11px}.pill.warn{background:#fbf1e4;color:#9b6a32}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{font-size:10px;color:var(--muted);text-transform:uppercase}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:12px 17px;border-radius:99px}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:14px 18px}.side p{display:none}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap}.main{padding:20px 14px}.metrics{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="logo">Clínica <small>GESTÃO E CUIDADO</small></div><p>Ambiente demonstrativo com dados inteiramente fictícios. Nenhum dado real de paciente, profissional ou empresa.</p><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Painel integrado · demonstração</div><h1>Bom dia. A clínica está pronta.</h1><div class="muted">Agenda ilustrativa · dados fictícios</div></div><button class="button" data-action="new">＋ Novo agendamento</button></div><div class="metrics" id="metrics"></div><div class="tabs" id="tabs"></div><div id="view"></div></main></div><div id="toast"></div><script>
const pages=[["inicio","Visão geral"],["agenda","Agenda"],["pacientes","Pacientes"],["equipe","Equipe"],["procedimentos","Procedimentos"],["financeiro","Financeiro"],["estoque","Estoque"],["relatorios","Relatórios"]];
const S={tab:"inicio",patients:[["Paciente 01","Avaliação","09:00","Confirmado"],["Paciente 02","Retorno","09:30","Aguardando"],["Paciente 03","Consulta","10:00","Em atendimento"],["Paciente 04","Retorno","11:00","Confirmado"]],stock:[["Luvas descartáveis","42 caixas"],["Máscaras","18 caixas"],["Material de moldagem","12 unidades"]]};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function toast(t){$("toast").innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$("toast").innerHTML="",2200)}
function card(h,b){return '<section class="panel"><h2>'+h+'</h2>'+b+'</section>'}
function table(h,rows){return '<div style="overflow:auto"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function agenda(){return card("Agenda de hoje",table(["Horário","Paciente","Atendimento","Status","Ação"],S.patients.map((p,i)=>'<tr><td>'+p[2]+'</td><td><b>'+p[0]+'</b></td><td>'+p[1]+'</td><td><span class="pill '+(p[3]==="Aguardando"?"warn":"")+'">'+p[3]+'</span></td><td><button class="button" data-action="status" data-id="'+i+'">Atualizar</button></td></tr>')))}
function render(){ $("nav").innerHTML=pages.map(p=>'<button class="'+(S.tab===p[0]?"on":"")+'" data-action="tab" data-id="'+p[0]+'">'+p[1]+'</button>').join('');$("tabs").innerHTML=pages.map(p=>'<button class="'+(S.tab===p[0]?"on":"")+'" data-action="tab" data-id="'+p[0]+'">'+p[1]+'</button>').join('');$("metrics").innerHTML=[["Atendimentos","18","Agendados hoje"],["Em espera","03","Na recepção"],["Retornos","07","Acompanhar"],["Ocupação","82%","Capacidade do dia"]].map(x=>'<div class="metric"><span>'+x[0]+'</span><b>'+x[1]+'</b><small class="muted">'+x[2]+'</small></div>').join('');let t=S.tab,v="";
if(t==="inicio")v='<div class="panel"><h2>Próximos atendimentos</h2>'+agenda().replace('<section class="panel"><h2>Agenda de hoje</h2>','').replace('</section>','')+'</div>'+card("Atenção da equipe",'<div class="item">Sala 2 · preparar atendimento das 10h</div><div class="item">Recepção · confirmar dois retornos</div><div class="item">Estoque · verificar materiais de consumo</div>');
else if(t==="agenda")v=agenda();
else if(t==="pacientes")v=card("Cadastro de pacientes",'<button class="button" data-action="new">＋ Cadastrar paciente (demo)</button>'+table(["Nome","Tipo","Próximo horário","Situação"],S.patients.map(p=>'<tr>'+p.map(x=>'<td>'+x+'</td>').join('')+'</tr>')));
else if(t==="equipe")v=card("Equipe e salas",table(["Profissional","Especialidade","Sala","Agenda"],[["Profissional A","Clínica geral","01","Disponível"],["Profissional B","Avaliação","02","Em atendimento"],["Profissional C","Higiene","03","Disponível"]].map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>')));
else if(t==="procedimentos")v=card("Catálogo de procedimentos",table(["Procedimento","Duração","Preparação"],[["Avaliação inicial","40 min","Ficha e histórico"],["Consulta de rotina","30 min","Revisar última visita"],["Retorno","20 min","Consultar plano"],["Higienização","50 min","Preparar sala"]].map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>')));
else if(t==="financeiro")v=card("Resumo financeiro demonstrativo",'<div class="metrics"><div class="metric"><span>Recebido</span><b>R$ 8.420</b></div><div class="metric"><span>Previsto</span><b>R$ 11.300</b></div></div>'+table(["Lançamento","Valor","Status"],[["Atendimentos do dia","R$ 2.450","Recebido"],["Planos e retornos","R$ 3.100","Previsto"],["Despesas operacionais","R$ 1.240","Registrado"]].map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>')));
else if(t==="estoque")v=card("Materiais e estoque",table(["Item","Quantidade","Ação"],S.stock.map((r,i)=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td><button class="button" data-action="stock" data-id="'+i+'">Dar baixa</button></td></tr>')));
else v=card("Indicadores da operação",'<p>Compare volume de atendimentos, taxa de retorno, ocupação por sala, faltas e receita por período.</p><div class="metrics"><div class="metric"><span>Comparecimento</span><b>94%</b></div><div class="metric"><span>Retorno</span><b>76%</b></div></div><p class="muted">Os números são ilustrativos e não representam resultados reais.</p>');
$("view").innerHTML=v}
document.body.addEventListener("click",e=>{let b=e.target.closest("[data-action]");if(!b)return;if(b.dataset.action==="tab")S.tab=b.dataset.id;else if(b.dataset.action==="status"){let p=S.patients[+b.dataset.id];p[3]=p[3]==="Confirmado"?"Em atendimento":p[3]==="Em atendimento"?"Concluído":"Confirmado";toast("Status atualizado nesta demonstração.")}else if(b.dataset.action==="new")toast("Cadastro demonstrativo. Conecte um backend para dados reais.");else if(b.dataset.action==="stock")toast("Baixa de estoque simulada.");render()});render();
</script></body></html>
