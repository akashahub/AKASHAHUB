<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIÉ Academy</title>
<meta name="description" content="ZIÉ Academy. A rede que forma a mão da marca: doutrina, técnica e comunidade. A loja continua em minhazie.com.br.">
<link rel="canonical" href="https://akashahub.com.br/zie/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,560&family=Fraunces:opsz,wght@9..144,560;9..144,680&display=swap" rel="stylesheet">
<style>
:root{--areia:#f3ead7;--osso:#fbf6ea;--tinta:#16120e;--sangue:#c90109;--palha:#a57d38}
*{box-sizing:border-box}
html,body{margin:0;background:var(--areia);color:var(--tinta);font-family:"Bricolage Grotesque",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:transparent;border:0}
img{width:100%;object-fit:cover;display:block}
a{color:inherit}
h1,h2,.mark{font-family:Fraunces,Georgia,serif;font-weight:560;margin:0}
h1{font-size:clamp(40px,7vw,64px);line-height:1.02}
.mark{font-size:clamp(56px,12vw,96px);line-height:.9}
.wrap{width:min(980px,calc(100% - 40px));margin:0 auto}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;padding:22px 0;flex-wrap:wrap}
.nav{display:flex;flex-wrap:wrap;gap:14px;font-size:14px}
.hero{display:grid;gap:28px;align-items:end;padding-bottom:40px}
.shells{display:flex;gap:8px}
.shells i{width:12px;height:12px;border:1px solid rgba(22,18,14,.4);border-radius:50%;display:block}
.btn{height:48px;background:var(--tinta);color:var(--osso);padding:0 18px}
.ghost{height:48px;border:1px solid rgba(22,18,14,.2);padding:0 18px;display:inline-flex;align-items:center;text-decoration:none}
.row{display:flex;flex-wrap:wrap;gap:10px}
label{display:grid;gap:6px;font-size:14px}
input,select,textarea{border:1px solid rgba(22,18,14,.15);background:transparent;padding:12px;width:100%;outline:none}
.palha{color:var(--palha)}
.sangue{color:var(--sangue)}
.split{display:grid;gap:24px}
.four{display:grid;gap:18px}
.lesson{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border-top:1px solid rgba(22,18,14,.1);padding:14px 0}
.lesson:disabled{opacity:.4}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--tinta);color:var(--osso);padding:12px 16px;max-width:min(440px,calc(100% - 32px));text-align:center}
.prompt{font-size:clamp(32px,6vw,58px);line-height:1.15}
@media(min-width:900px){
 .hero,.split{grid-template-columns:1.2fr .8fr}
 .four{grid-template-columns:repeat(4,1fr)}
 .hero figure{min-height:420px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const media={palha:"media/palha.jpg",shells:"media/buzios.jpg",hands:"media/mao.jpg"};
const lessons=[
 ["l1",1,"A história na mão","doutrina","De onde a peça vem, e o que não pode se perder quando outra pessoa costura."],
 ["l2",2,"O que a ZIÉ não entrega","doutrina","Peça feita à mão. O prazo de quinze dias não é atraso. É o tempo da mão."],
 ["l3",3,"Palha","mão","O fio ancestral. Como ele entra sem virar enfeite."],
 ["l4",4,"Búzios","mão","Onde a concha senta, e onde ela não deve sentar."],
 ["l5",5,"Macramê","mão","O nó que segura a alça e a história."],
 ["l6",6,"Rechilieu","mão","O vazio que desenha. O que se tira importa tanto quanto o que fica."],
 ["l7",7,"Couro e crochê","mão","Duas matérias. Uma peça. Nenhuma das duas manda sozinha."],
 ["l8",8,"A alça de três","mão","A forma que já sai na loja. Medida, queda, ponto de força."],
 ["l9",9,"Pochetão","mão","A boca, o corpo, o que a peça aguenta carregar."],
 ["l10",10,"Mochila","mão","Carregar a própria história nas costas, sem perder o ombro."],
 ["l11",11,"Acabamento","mão","O que a cliente vê por último. O que a rede não pode entregar pela metade."],
 ["l12",12,"A rede","doutrina","Quem pode produzir com a ZIÉ, e quem só quer aprender."]
];
const beats=["Esta aula não ensina o ponto ainda.","Ensina o que a peça carrega antes do ponto.","Eu não achei uma mochila que me representasse.","Então fiz a minha.","Minha mãe me ensinou a costurar.","Os primeiros pedidos viraram a marca.","A ZIÉ não vende só bolsa.","Vende identidade, pertencimento e estilo.","A liberdade de carregar a própria história.","Quando outra pessoa costura, a história não pode se perder.","Por isso a aula existe.","A loja continua onde está.","Aqui a gente forma a mão que falta."];
const plan=[["Dia 1","Aula 1 e 2","Doutrina. História e o prazo de quinze dias."],["Dia 2","Aula 3 e 4","Palha e búzios."],["Dia 3","Aula 5","Macramê."],["Dia 4","Aula 6 e 7","Rechilieu, couro e crochê."],["Dia 5","Aula 8","A alça de três."],["Dia 6","Aula 9 e 10","Pochetão e mochila."],["Dia 7","Aula 11","Acabamento."],["Dia 8","Aula 12","A rede."]];
const KEY="zie-academy-v1";
function blank(){return {people:[],proposals:[],notes:[],prices:{3:"",6:"",9:"",12:""},meId:""}}
function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||"null");if(!p) return blank();return {...blank(),...p,prices:{...blank().prices,...(p.prices||{})}}}catch(e){return blank()}}
const D=load();
const S={screen:"casa",lesson:"l1",beat:0,notice:""};
function persist(){localStorage.setItem(KEY,JSON.stringify({people:D.people,proposals:D.proposals,notes:D.notes,prices:D.prices,meId:D.meId}))}
function me(){return D.people.find((p)=>p.id===D.meId)}
function flash(t){S.notice=t;draw();clearTimeout(flash.t);flash.t=setTimeout(()=>{S.notice="";draw()},2400)}
function bar(){return `<header class="wrap top"><button data-act="home"><span class="mark" style="font-size:36px">ZIÉ</span><span class="palha" style="display:block;letter-spacing:.16em;font-size:12px">ACADEMY</span></button><nav class="nav">${D.meId&&D.meId!=="admin"?'<button data-act="go" data-id="comunidade">Comunidade</button>':""}<button data-act="go" data-id="admin">Administração</button><button data-act="go" data-id="casa">Casa</button></nav></header>`}
function house(){return `<header class="wrap top"><div><p class="palha" style="letter-spacing:.16em;font-size:12px">BAHIA</p><p class="mark">ZIÉ</p></div><button data-act="go" data-id="entrar" style="border-bottom:1px solid var(--sangue)">Entrar na rede</button></header>
<section class="wrap hero"><div><div class="shells">${"<i></i>".repeat(9)}</div><h1 style="margin-top:20px">A mão que falta não se compra. Se forma.</h1><p>Grandes marcas e eventos querem a peça. Uma pessoa só não costura tudo. A Academy forma quem carrega a essência e a técnica da ZIÉ.</p><div class="row" style="margin-top:20px"><button class="btn" data-act="go" data-id="entrar">Conhecer a trilha</button><a class="ghost" href="https://www.minhazie.com.br">A loja continua lá</a></div></div><figure><img src="${media.shells}" alt="Búzios sobre linho claro"></figure></section>
<section style="border-top:1px solid rgba(22,18,14,.1);border-bottom:1px solid rgba(22,18,14,.1)"><div class="wrap split" style="padding:48px 0"><img src="${media.hands}" alt="Mãos costurando" style="height:280px"><div><p class="sangue" style="letter-spacing:.14em;font-size:12px">A HISTÓRIA</p><h2 style="font-size:32px;margin-top:12px">Não havia uma mochila que representasse. A peça foi feita com a mãe, que ensinou a costurar. Dos primeiros pedidos nasceu a marca.</h2><p>A ZIÉ vende identidade, pertencimento e estilo. A loja já existe. Aqui não se vende bolsa. Aqui se ensina a mão.</p></div></div></section>
<section class="wrap four" style="padding:48px 0">${[["3","O começo da trilha"],["6","A mão já reconhece a matéria"],["9","A peça fecha sozinha"],["12","A rede pode produzir"]].map((x)=>`<div style="border-top:1px solid var(--tinta);padding-top:12px"><p class="mark" style="font-size:48px">${x[0]}</p><p>${x[1]}</p></div>`).join("")}</section>`}
function gate(){
 const opts=[3,6,9,12].map((n)=>`<option value="${n}">${n} aulas${D.prices[n]?" · "+D.prices[n]:" · valor a definir"}</option>`).join("");
 return bar()+`<form data-act="enter" class="wrap" style="max-width:560px;display:grid;gap:12px;padding-bottom:48px"><h1>Entrar na rede</h1><p>O acesso é pago. O valor de cada trilha é o que o dono gravar na administração. Sem valor, a porta não abre.</p><label>Nome<input name="nome"></label><label>Perfil<select name="perfil"><option value="aluno">Aluno</option><option value="parceiro">Artista parceiro</option></select></label><label>Talento, se já pratica outra arte<input name="talento"></label><label>Trilha<select name="trilha">${opts}</select></label><label style="display:flex;gap:10px;align-items:flex-start"><input name="freelancer" type="checkbox" style="width:auto">Quero receber propostas de trabalho da ZIÉ. Quem faz só para a família deixa isto quieto.</label><button class="btn" type="submit">Confirmar acesso</button><button type="button" data-act="admin">Sou o dono da ZIÉ</button></form>`;
}
function trail(){
 const m=me();
 if(!m) return bar()+"<p class='wrap'>Nenhum acesso aberto neste navegador.</p>";
 const invites=D.proposals.filter((p)=>p.personId===m.id).map((p)=>`<p style="border-left:2px solid var(--sangue);padding-left:12px">Convite ${p.size}: ${p.note}</p>`).join("");
 const list=lessons.map((l)=>{const locked=l[1]>m.track;const done=m.done.includes(l[0]);return `<button class="lesson" data-act="aula" data-id="${l[0]}" ${locked?"disabled":""}><span><span class="palha" style="font-size:12px">${String(l[1]).padStart(2,"0")} · ${l[3]}</span><span style="display:block;font-family:Fraunces,serif;font-size:26px">${l[2]}</span></span><span>${locked?"fechada":done?"feita":"aberta"}</span></button>`}).join("");
 return bar()+`<main class="wrap" style="max-width:680px;padding-bottom:48px"><p class="palha">${m.role==="parceiro"?"Parceiro":"Aluno"} · trilha ${m.track}</p><h1>${m.name}</h1><p>${m.done.length} aulas marcadas. ${m.freelancer?"Aberto a propostas.":"Sem interesse em trabalho."}</p>${invites}${list}</main>`;
}
function aula(){
 const l=lessons.find((x)=>x[0]===S.lesson)||lessons[0];
 const m=me();
 const done=m&&m.done.includes(l[0]);
 return bar()+`<article class="wrap" style="max-width:680px;display:grid;gap:14px;padding-bottom:48px"><p class="sangue">AULA ${String(l[1]).padStart(2,"0")}</p><h1>${l[2]}</h1><p style="font-size:18px">${l[4]}</p><img src="${l[1]<5?media.palha:media.hands}" alt="" style="height:220px"><p style="border:1px dashed rgba(22,18,14,.3);padding:14px">O vídeo desta aula ainda não foi gravado. O roteiro da primeira está pronto para o dono ler e falar com as próprias palavras.</p>${l[0]==="l1"?'<button class="btn" data-act="go" data-id="roteiro">Abrir o teleprompter</button>':""}${m?`<button class="ghost" data-act="done" data-id="${l[0]}">${done?"Desmarcar aula":"Marcar como feita"}</button>`:""}</article>`;
}
function community(){
 const list=D.notes.length?D.notes.map((n)=>`<li style="border-top:1px solid rgba(22,18,14,.1);padding:12px 0"><span class="palha">${n.author}</span><p>${n.text}</p></li>`).join(""):'<p style="border:1px dashed rgba(22,18,14,.25);padding:14px">Ainda não há recado.</p>';
 return bar()+`<main class="wrap" style="max-width:560px"><h1>Comunidade</h1><form data-act="post" style="display:grid;gap:10px;margin-top:16px"><textarea name="texto" placeholder="Um recado para a rede"></textarea><button class="btn" type="submit">Publicar</button></form><ul style="list-style:none;padding:0">${list}</ul></main>`;
}
function admin(){
 const prices=[3,6,9,12].map((n)=>`<label>Trilha ${n}<input data-price="${n}" value="${D.prices[n]||""}" placeholder="Valor, quando decidir"></label>`).join("");
 const people=D.people.map((p)=>`<li style="border-top:1px solid rgba(22,18,14,.1);padding:10px 0"><b>${p.name}</b><div class="palha">${p.role} · ${p.talent||"sem talento informado"} · trilha ${p.track} · ${p.freelancer?"quer proposta":"só aprende"}</div></li>`).join("");
 const opts=D.people.filter((p)=>p.freelancer).map((p)=>`<option value="${p.id}">${p.name}</option>`).join("");
 return bar()+`<main class="wrap split" style="padding-bottom:48px"><section><h1>A casa</h1><p>Quem quer trabalho, separado de quem só aprende.</p><div style="display:grid;gap:10px;margin-top:16px">${prices}</div><button class="btn" style="margin-top:16px" data-act="go" data-id="roteiro">Roteiro e plano de gravação</button></section><section><h2>Quem quer proposta</h2>${people||'<p style="border:1px dashed rgba(22,18,14,.25);padding:14px">Ninguém marcou interesse em trabalho.</p>'}<form data-act="invite" style="display:grid;gap:10px;margin-top:16px"><label>Convidar<select name="pessoa"><option value="">Quem marcou interesse</option>${opts}</select></label><label>Tamanho<select name="tamanho"><option value="pequeno">Pequeno</option><option value="medio">Médio</option><option value="grande">Grande</option></select></label><textarea name="nota" placeholder="O trabalho, em uma frase"></textarea><button class="ghost" type="submit">Enviar convite</button></form></section></main>`;
}
function roteiro(){
 return `<div class="wrap" style="padding:24px 0 48px"><button data-act="go" data-id="admin">Voltar à casa</button><p class="palha">${S.beat+1} / ${beats.length}</p><p class="prompt">${beats[S.beat]}</p><p>Roteiro-modelo. O dono fala com as próprias palavras.</p><div class="row" style="margin-top:24px"><button class="ghost" data-act="beat" data-id="-1">Anterior</button><button class="btn" data-act="beat" data-id="1">Próxima</button></div><ol style="margin-top:32px;padding:0;list-style:none">${plan.map((p)=>`<li style="display:grid;grid-template-columns:5rem 1fr;gap:12px;border-top:1px solid rgba(22,18,14,.1);padding:10px 0"><span class="palha">${p[0]}</span><span><b>${p[1]}</b><br>${p[2]}</span></li>`).join("")}</ol></div>`;
}
function draw(){
 const view={casa:house,entrar:gate,trilho:trail,aula,comunidade:community,admin,roteiro}[S.screen]||house;
 document.getElementById("app").innerHTML=view();
 document.getElementById("toast").innerHTML=S.notice?`<div class="toast">${S.notice}</div>`:"";
}
document.body.addEventListener("click",(e)=>{
 const el=e.target.closest("[data-act]");
 if(!el) return;
 if(el.closest("form") && el.type==="submit") return;
 const act=el.dataset.act, id=el.dataset.id;
 if(act==="go") S.screen=id;
 else if(act==="home") S.screen=D.meId&&D.meId!=="admin"?"trilho":"casa";
 else if(act==="admin"){D.meId="admin";S.screen="admin"}
 else if(act==="aula"){S.lesson=id;S.screen="aula"}
 else if(act==="done"){const m=me(); if(m){m.done=m.done.includes(id)?m.done.filter((x)=>x!==id):m.done.concat(id); persist()}}
 else if(act==="beat"){S.beat=(S.beat+Number(id)+beats.length)%beats.length}
 draw();
});
document.body.addEventListener("change",(e)=>{
 const n=e.target.dataset.price;
 if(!n) return;
 D.prices[n]=e.target.value;
 persist();
});
document.body.addEventListener("submit",(e)=>{
 e.preventDefault();
 const form=e.target, act=form.dataset.act, v=(n)=>String(new FormData(form).get(n)||"").trim();
 if(act==="enter"){
  const track=Number(v("trilha"));
  if(v("nome").length<2){flash("A rede precisa de um nome.");return}
  if(v("perfil")==="parceiro"&&v("talento").length<2){flash("Parceiro diz qual arte já pratica.");return}
  if(!D.prices[track]){flash("O dono ainda não definiu o valor desta trilha.");return}
  const id=Math.random().toString(36).slice(2,10);
  D.people.unshift({id,name:v("nome"),role:v("perfil"),talent:v("talento"),freelancer:form.freelancer.checked,track,done:[]});
  D.meId=id; persist(); S.screen="trilho"; flash("Acesso aberto neste navegador."); return;
 }
 if(act==="post"){if(v("texto").length<3) return; const m=me(); D.notes.unshift({id:Math.random().toString(36).slice(2,8),author:m?m.name:"ZIÉ",text:v("texto")}); persist(); flash("Recado na comunidade."); return}
 if(act==="invite"){if(!v("pessoa")||v("nota").length<3){flash("Escolha a pessoa e diga o trabalho.");return} D.proposals.unshift({id:Math.random().toString(36).slice(2,8),personId:v("pessoa"),size:v("tamanho"),note:v("nota")}); persist(); flash("Convite enviado."); return}
});
draw();
</script>
</body>
</html>
