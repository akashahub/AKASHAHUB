<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIÉ Academy</title>
<meta name="description" content="ZIÉ Academy. As aulas da marca, o cadastro e a mesa do dono. Sem Hotmart.">
<link rel="canonical" href="https://akashahub.com.br/zie/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,560&family=Fraunces:opsz,wght@9..144,560;9..144,680&display=swap" rel="stylesheet">
<style>
:root{--areia:#f3ead7;--osso:#fbf6ea;--tinta:#16120e;--sangue:#c90109;--palha:#a57d38}
*{box-sizing:border-box}
html,body{margin:0;background:var(--areia);color:var(--tinta);font-family:"Bricolage Grotesque",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:transparent;border:0}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit}
h1,h2,.mark{font-family:Fraunces,Georgia,serif;font-weight:560;margin:0}
h1{font-size:clamp(40px,7vw,64px);line-height:.95}
.app{min-height:100dvh}
.gate{width:min(980px,calc(100% - 40px));margin:0 auto;display:grid;gap:28px;align-items:center;padding:40px 0 64px}
.box{background:var(--osso);border:1px solid rgba(22,18,14,.1);padding:20px;display:grid;gap:12px}
label{display:grid;gap:6px;font-size:14px}
input,select,textarea{border:1px solid rgba(22,18,14,.15);background:transparent;padding:12px;width:100%;outline:none}
.btn{height:48px;background:var(--tinta);color:var(--osso);padding:0 18px}
.ghost{height:48px;border:1px solid rgba(22,18,14,.2);padding:0 18px}
.palha{color:var(--palha)}.sangue{color:var(--sangue)}
.shell{display:block}
.rail{display:none}
.stage{padding:22px 20px 110px}
.lesson{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border-top:1px solid rgba(22,18,14,.1);padding:14px 0}
.player{position:relative;aspect-ratio:16/9;background:var(--tinta);overflow:hidden;margin-top:14px}
.player p{position:absolute;left:0;right:0;bottom:0;margin:0;background:rgba(22,18,14,.82);color:var(--osso);padding:16px;font-family:Fraunces,Georgia,serif;font-size:clamp(22px,4vw,34px);line-height:1.2}
.bar{height:6px;background:rgba(22,18,14,.1);margin-top:10px}
.bar i{display:block;height:100%;background:var(--sangue)}
.side button{display:block;width:100%;text-align:left;padding:8px 10px;font-size:14px}
.side button.on{background:var(--tinta);color:var(--osso)}
.dock{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--osso);border:1px solid rgba(22,18,14,.1)}
.dock button{height:48px}
.dock button.on{background:var(--tinta);color:var(--osso)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--tinta);color:var(--osso);padding:10px 14px;border-radius:999px;z-index:5}
.row{display:flex;flex-wrap:wrap;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:auto}
@media(min-width:900px){
 .gate{grid-template-columns:1.1fr .9fr;min-height:100dvh}
 .shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100dvh}
 .rail{display:block;border-right:1px solid rgba(22,18,14,.1);padding:22px 14px}
 .rail button.nav{display:block;width:100%;text-align:left;height:44px;padding:0 12px}
 .rail button.nav.on{background:var(--tinta);color:var(--osso)}
 .stage{padding:28px 32px 48px}
 .watch{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px}
 .dock{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const media={palha:"media/palha.jpg",shells:"media/buzios.jpg",hands:"media/mao.jpg"};
const lessons=[
["l1",1,"A história na mão","doutrina","O que a peça carrega antes do ponto.",["Esta aula não ensina o ponto ainda.","Ensina o que a peça carrega.","Não havia uma mochila que me representasse.","Fiz a minha, com a minha mãe.","Ela me ensinou a costurar.","Os primeiros pedidos viraram a marca.","A ZIÉ vende identidade, pertencimento e estilo.","A liberdade de carregar a própria história.","Quando outra pessoa costura, isso não se perde."]],
["l2",2,"O prazo da mão","doutrina","Quinze dias não é atraso. É o tempo da peça.",["A peça é feita à mão.","O pedido entra em produção quando é feito.","O prazo é de quinze dias, produção e frete.","Quem produz na rede respeita esse tempo.","Não se promete o que a mão não alcança."]],
["l3",3,"Palha","mão","O fio ancestral entra na peça, não em volta dela.",["A palha é matéria, não enfeite.","Olhe o fio antes de cortar.","A trama segue o corpo da bolsa.","O acabamento esconde a ponta."]],
["l4",4,"Búzios","mão","A concha senta onde segura, não onde só aparece.",["O búzio tem lugar.","Não cobre o ponto de força.","A fileira segue o ritmo da peça.","Um búzio solto desfaz o conjunto."]],
["l5",5,"Macramê","mão","O nó que segura a alça.",["O nó começa frouxo e fecha firme.","A alça aguenta o peso da peça cheia.","O macramê não compete com o couro.","Ele segura."]],
["l6",6,"Rechilieu","mão","O que se tira desenha tanto quanto o que fica.",["O vazio é o desenho.","Corte só o que a aula marcou.","A borda não esfiapa.","A peça continua inteira."]],
["l7",7,"Couro e crochê","mão","Duas matérias. Nenhuma manda sozinha.",["O couro dá a estrutura.","O crochê dá a pele.","Os dois se encontram na costura.","Nenhum tapa o outro."]],
["l8",8,"A alça de três","mão","A forma que já sai na loja.",["Três alças, uma queda.","Meça antes de cortar.","O ponto de força fica escondido.","A alça não torce no ombro."]],
["l9",9,"Pochetão","mão","A boca, o corpo, o que a peça aguenta.",["A boca abre sem rasgar.","O corpo guarda sem deformar.","O fecho encontra a mão.","A peça fecha como na aula."]],
["l10",10,"Mochila","mão","Carregar a história sem perder o ombro.",["As costas recebem o peso.","A alça não corta.","O fundo não cede.","Quem veste reconhece a ZIÉ."]],
["l11",11,"Acabamento","mão","O que se vê por último.",["Linha solta não sai.","A ponta some.","A peça se apresenta inteira.","Se faltar, volta para a aula, não para a cliente."]],
["l12",12,"A rede","doutrina","Quem produz com a ZIÉ e quem só aprende.",["Nem todo aluno quer trabalho.","Quem quer, marca no cadastro.","A ZIÉ entrega material e a aula.","A pessoa entrega a peça.","Se não conseguir, avisa antes. O lote volta."]]
];
const examples=[
 {id:"ex-nanda",name:"Nanda Souza",email:"nanda@exemplo.zie",talent:"Macramê",freelance:true,done:["l1","l2","l3","l4","l5","l6","l7","l8"],example:true},
 {id:"ex-rita",name:"Rita Pires",email:"rita@exemplo.zie",talent:"Palha",freelance:true,done:lessons.map((l)=>l[0]),example:true},
 {id:"ex-caio",name:"Caio Lima",email:"caio@exemplo.zie",talent:"Crochê",freelance:false,done:["l1","l2","l3"],example:true}
];
const KEY="zie-hotmart-v1";
function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||"null");if(!p||!p.people) return {people:examples,proposals:[],meId:""};return {people:p.people,proposals:p.proposals||[],meId:p.meId||""}}catch(e){return {people:examples,proposals:[],meId:""}}}
const D=load();
const S={screen:D.meId?"aulas":"porta",lesson:"l1",playing:false,frame:0,notice:""};
function persist(){localStorage.setItem(KEY,JSON.stringify({people:D.people,proposals:D.proposals,meId:D.meId}))}
function me(){return D.people.find((p)=>p.id===D.meId)}
function lesson(){return lessons.find((l)=>l[0]===S.lesson)||lessons[0]}
function flash(t){S.notice=t;draw();clearTimeout(flash.t);flash.t=setTimeout(()=>{S.notice="";draw()},2400)}
function esc(s){return String(s).replaceAll("&","&").replaceAll("<","<").replaceAll(">",">")}
function gate(){
 return `<div class="gate"><div><p class="palha" style="letter-spacing:.16em;font-size:12px">ZIÉ ACADEMY</p><h1 style="margin-top:10px">ZIÉ</h1><p>A prateleira da marca. A pessoa entra, assiste a aula e, se quiser, deixa o nome para um processo de freelance.</p><img src="${media.shells}" alt="Búzios sobre linho" style="height:190px;margin-top:18px"></div>
 <form class="box" data-act="reg"><h2>Cadastro</h2><label>Nome<input name="nome"></label><label>E-mail<input name="email" type="email"></label><label>O que você já faz<select name="talento"><option value="">Quero aprender a ZIÉ</option><option>Macramê</option><option>Crochê</option><option>Palha</option><option>Costura</option><option>Couro</option></select></label><label class="check"><input name="freelance" type="checkbox">Quero participar de processos de freelance da ZIÉ, se eu for chamado e selecionado.</label><button class="btn" type="submit">Entrar e assistir</button><div class="row"><button type="button" data-act="dono" class="palha">Sou o dono</button><button type="button" data-act="aluna">Ver como aluna</button></div></form></div>`;
}
function rail(){
 const items=[["aulas","Aulas"],["assistir","Assistir"],["dono","Dono"]];
 return `<aside class="rail"><button data-act="porta"><span class="mark" style="font-size:42px">ZIÉ</span><span class="palha" style="display:block;letter-spacing:.14em;font-size:11px">ACADEMY</span></button><nav style="margin-top:22px">${items.map((i)=>`<button class="nav ${S.screen===i[0]?"on":""}" data-act="go" data-id="${i[0]}">${i[1]}</button>`).join("")}</nav></aside>`;
}
function dock(){
 const items=[["aulas","Aulas"],["assistir","Assistir"],["dono","Dono"]];
 return `<nav class="dock">${items.map((i)=>`<button class="${S.screen===i[0]?"on":""}" data-act="go" data-id="${i[0]}">${i[1]}</button>`).join("")}</nav>`;
}
function catalog(){
 const m=me();
 const invites=D.proposals.filter((p)=>p.personId===D.meId).map((p)=>{const l=lessons.find((x)=>x[0]===p.lessonId);return `<article style="border-left:2px solid var(--sangue);padding-left:12px;margin-top:12px"><p>Proposta ${p.size}. Seguir a aula ${l?l[2]:""}. ${p.status}.</p><p>${esc(p.note)}</p>${p.status==="enviada"?`<button class="btn" data-act="aceitar" data-id="${p.id}">Aceitar a parceria</button>`:""}${p.status==="devolvida"?`<button class="ghost" data-act="aula" data-id="${p.lessonId}">Rever a aula</button>`:""}</article>`}).join("");
 const list=lessons.map((l)=>`<button class="lesson" data-act="aula" data-id="${l[0]}"><span><span class="palha" style="font-size:12px">${String(l[1]).padStart(2,"0")} · ${l[3]}</span><span style="display:block;font-family:Fraunces,serif;font-size:26px">${l[2]}</span><span>${l[4]}</span></span><span>${m&&m.done.includes(l[0])?"concluída":"assistir"}</span></button>`).join("");
 return `<p class="palha">${m?esc(m.name):"Prateleira"}</p><h1 style="margin-top:8px">As doze aulas</h1>${m?`<p>${m.done.length} de 12 concluídas. ${m.freelance?"Disponível para freelance.":"Só quer aprender."}</p>`:""}${invites}${list}`;
}
function player(){
 const l=lesson();
 const img=l[1]<=4?media.palha:l[1]<=8?media.shells:media.hands;
 const width=Math.round((Math.min(S.frame+(S.playing?1:0),l[5].length)/l[5].length)*100);
 const next=lessons[l[1]%lessons.length];
 return `<div class="watch"><div><p class="sangue">AULA ${String(l[1]).padStart(2,"0")}</p><h1 style="font-size:clamp(32px,5vw,48px);margin-top:8px">${l[2]}</h1><div class="player"><img src="${img}" alt=""><p>${esc(l[5][Math.min(S.frame,l[5].length-1)])}</p></div><div class="bar"><i style="width:${width}%"></i></div><div class="row" style="margin-top:14px"><button class="btn" data-act="play">${S.playing?"Pausar":"Assistir"}</button><button class="ghost" data-act="aula" data-id="${next[0]}">Próxima aula</button></div></div><aside class="side">${lessons.map((item)=>`<button class="${item[0]===l[0]?"on":""}" data-act="aula" data-id="${item[0]}">${String(item[1]).padStart(2,"0")} ${item[2]}</button>`).join("")}</aside></div>`;
}
function owner(){
 const rows=D.people.map((p)=>`<li style="border-top:1px solid rgba(22,18,14,.1);padding:10px 0"><b>${esc(p.name)}</b> ${p.example?'<span class="palha">exemplo</span>':""}<div>${esc(p.talent)} · ${p.done.length}/12 aulas · ${p.freelance?"quer freelance":"não quer trabalho"}</div></li>`).join("");
 const lots=D.proposals.map((p)=>{const person=D.people.find((x)=>x.id===p.personId);const l=lessons.find((x)=>x[0]===p.lessonId);return `<li style="border-top:1px solid rgba(22,18,14,.1);padding:10px 0"><b>${person?esc(person.name):""}</b> · ${p.size} · ${p.status}<div>Aula de referência: ${l?l[2]:""}</div><div>${esc(p.note)}</div>${p.status==="aceita"?`<button data-act="devolver" data-id="${p.id}" class="sangue">Não conseguiu entregar</button>`:""}</li>`}).join("");
 const opts=D.people.filter((p)=>p.freelance).map((p)=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.talent)} · ${p.done.length}/12</option>`).join("");
 const aulas=lessons.map((l)=>`<option value="${l[0]}">${l[2]}</option>`).join("");
 return `<div class="watch"><section><h1>Quem entrou</h1><p>O dono vê a aula concluída e quem pediu para participar de um freelance. Quem não marcou, só estuda.</p><ul style="list-style:none;padding:0">${rows}</ul><h2 style="margin-top:28px">Lotes</h2>${lots||"<p>Nenhuma proposta ainda.</p>"}</section>
 <form class="box" data-act="propor"><h2>Proposta de parceria</h2><p>A ZIÉ dá o material e a aula. A pessoa entrega a peça. Se não conseguir, mesmo depois do vídeo, o lote volta e ela revê a aula.</p><label>Pessoa<select name="pessoa"><option value="">Quem marcou freelance</option>${opts}</select></label><label>Tamanho<select name="tamanho"><option value="pequeno">Pequeno</option><option value="médio">Médio</option><option value="grande">Grande</option></select></label><label>Aula que a pessoa segue<select name="aula">${aulas}</select></label><label>Combinado<textarea name="nota">A ZIÉ entrega o material e esta aula. Você entrega a peça. Se depois da aula não conseguir, avise. O lote volta para a casa.</textarea></label><button class="btn" type="submit">Enviar proposta</button></form></div>`;
}
function draw(){
 const inner=S.screen==="porta"?gate():`<div class="shell">${rail()}<main class="stage">${S.screen==="assistir"?player():S.screen==="dono"?owner():catalog()}</main></div>${dock()}`;
 document.getElementById("app").innerHTML=inner;
 document.getElementById("toast").innerHTML=S.notice?`<div class="toast">${S.notice}</div>`:"";
}
let timer=0;
function arm(){clearInterval(timer);if(!S.playing) return;timer=setInterval(()=>{const l=lesson();S.frame+=1;if(S.frame>=l[5].length){S.frame=l[5].length-1;S.playing=false;clearInterval(timer);const m=me();if(m&&!m.done.includes(l[0])) m.done.push(l[0]);persist();flash("Aula concluída.");return}draw()},2200)}
document.body.addEventListener("click",(e)=>{
 const el=e.target.closest("[data-act]");
 if(!el) return;
 if(el.closest("form") && el.type==="submit") return;
 const act=el.dataset.act, id=el.dataset.id;
 if(act==="go"){S.screen=id;S.playing=false}
 else if(act==="porta"){S.screen="porta";S.playing=false}
 else if(act==="dono"){D.meId="dono";S.screen="dono";S.playing=false}
 else if(act==="aluna"){D.meId="ex-nanda";S.screen="aulas";persist()}
 else if(act==="aula"){S.lesson=id;S.frame=0;S.playing=false;S.screen="assistir"}
 else if(act==="play"){S.playing=!S.playing;if(S.screen!=="assistir") S.screen="assistir"}
 else if(act==="aceitar"){const p=D.proposals.find((x)=>x.id===id);if(p) p.status="aceita";persist();flash("Parceria aceita.");return}
 else if(act==="devolver"){const p=D.proposals.find((x)=>x.id===id);if(p) p.status="devolvida";persist();flash("O lote voltou. A pessoa revê a aula.");return}
 arm(); draw();
});
document.body.addEventListener("submit",(e)=>{
 e.preventDefault();
 const form=e.target, act=form.dataset.act, v=(n)=>String(new FormData(form).get(n)||"").trim();
 if(act==="reg"){
  if(v("nome").length<2||!v("email").includes("@")){flash("Nome e um e-mail válido.");return}
  const id=Math.random().toString(36).slice(2,10);
  D.people.unshift({id,name:v("nome"),email:v("email"),talent:v("talento")||"Quero aprender",freelance:!!form.freelance.checked,done:[]});
  D.meId=id; S.lesson="l1"; S.frame=0; S.screen="assistir"; persist(); flash("Cadastro feito. A primeira aula está aberta."); return;
 }
 if(act==="propor"){
  if(!v("pessoa")||v("nota").length<8){flash("Escolha a pessoa e escreva o combinado.");return}
  D.proposals.unshift({id:Math.random().toString(36).slice(2,8),personId:v("pessoa"),size:v("tamanho"),lessonId:v("aula"),note:v("nota"),status:"enviada"});
  persist(); flash("Proposta enviada."); return;
 }
});
draw();
</script>
</body>
</html>
