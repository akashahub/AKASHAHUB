function ownsAudio(nivel, nome) { return ownsArea(nivel) || rights.audios.includes(AREA[nivel] + ":" + nome); }
function ytId(url) {
  const text = String(url || "").trim();
  const m = text.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : ( /^[A-Za-z0-9_-]{6,20}$/.test(text) ? text : "" );
}
function videoKey() { return AREA[route.nivel] + ":" + route.curso + ":" + route.mod + ":" + route.aula; }
function faixa() { return FAIXAS[route.nivel]; }
function cursoAtual() {
  const f = faixa();
  if (route.curso === "fundamentos") {
    return { id: "fundamentos", titulo: "Fundamentos do Despertar", modules: f.fundamentos.map(m => ({ nome: m.nome, aulas: m.aulas.map(a => ({ titulo: a.titulo, descricao: "", status: "publicado", access: "exclusivo", video: { provider: "youtube", videoId: a.ytId === "COLOQUE_AQUI" ? "" : a.ytId, libraryId: "" } })) })) };
  }
  const hit = listaCursos().find(item => item.id === route.curso);
  return hit || moldarCurso(f.cursos[0]);
}
function moldarCurso(raw) {
  if (!raw) return { id: "", titulo: "", modules: [] };
  const curto = String(raw.id || "").includes(":") ? String(raw.id).split(":").slice(1).join(":") : raw.id;
  return {
    id: curto,
    capa: raw.capa || "",
    titulo: raw.titulo,
    status: raw.status || "publicado",
    modules: (raw.modules || []).map(m => ({
      nome: m.titulo || m.nome || "Módulo",
      aulas: (m.aulas || []).map(a => ({
        titulo: a.titulo,
        descricao: a.descricao || "",
        status: a.status || "publicado",
        access: a.access || "exclusivo",
        video: a.video || { provider: "youtube", videoId: a.ytId && a.ytId !== "COLOQUE_AQUI" ? a.ytId : "", libraryId: "" }
      }))
    }))
  };
}
function listaCursos() {
  const f = faixa();
  const area = AREA[route.nivel];
  const extras = (cms.cursos || []).filter(c => c.faixa === area);
  const vistos = [];
  f.cursos.forEach(item => {
    const custom = extras.find(c => c.id === area + ":" + item.id);
    if (custom && custom.status === "oculto" && !adminOn) return;
    const semVideo = custom && (custom.modules || []).every(m => (m.aulas || []).every(a => !(a.video && a.video.videoId)));
    const pronto = (item.modules || []).some(m => (m.aulas || []).some(a => a.video && a.video.videoId));
    vistos.push(semVideo && pronto ? moldarCurso(item) : moldarCurso(custom || item));
  });
  extras.forEach(c => {
    const curto = c.id.split(":").slice(1).join(":");
    if (f.cursos.some(item => item.id === curto)) return;
    if (!adminOn && (c.status === "oculto" || c.status === "rascunho")) return;
    vistos.push(moldarCurso(c));
  });
  return vistos;
}
function go(next) { route = { ...route, ...next }; draw(); window.scrollTo(0, 0); }
function comprar(kind, item) {
  const area = AREA[route.nivel];
  const ref = kind === "area" ? "area:" + area : kind + ":" + area + ":" + item;
  location.href = "/membros/checkout.html?ref=" + encodeURIComponent(ref);
}

function passo(dir) {
  const item = cursoAtual();
  let mod = route.mod;
  let aula = route.aula + dir;
  if (aula < 0) { mod -= 1; if (mod < 0) return; aula = item.modules[mod].aulas.length - 1; }
  if (aula >= item.modules[mod].aulas.length) { mod += 1; if (mod >= item.modules.length) return; aula = 0; }
  go({ mod, aula });
}

function limpo(s) { return String(s || "").replace(/[^A-Za-z0-9_-]/g, ""); }
function lerMidia(text) {
  const raw = String(text || "").trim();
  const bunny = raw.match(/mediadelivery\.net\/(?:play|embed|video)\/([0-9]+)\/([A-Za-z0-9-]+)/i);
  if (bunny) return { provider: "bunny", libraryId: bunny[1], videoId: bunny[2] };
  const yt = ytId(raw);
  if (yt && /youtu/.test(raw)) return { provider: "youtube", libraryId: "", videoId: yt };
  return { provider: "", libraryId: "", videoId: limpo(raw) };
}

function capaDeArquivo(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 480;
      let w = img.width;
      let h = img.height;
      if (w > max) { h = Math.round(h * max / w); w = max; }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const data = canvas.toDataURL("image/jpeg", 0.62);
      if (data.length > 90000) reject(new Error("grande"));
      else resolve(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("imagem")); };
    img.src = url;
  });
}

function quadro(aula) {
  const v = Object.assign({ provider: "", videoId: "", libraryId: "" }, (aula && aula.video) || {});
  const salvo = String(catalogVideos[videoKey()] || "");
  if (!v.videoId && salvo.startsWith("bunny|")) {
    const parts = salvo.split("|");
    v.provider = "bunny";
    v.libraryId = parts[1] || "";
    v.videoId = parts.slice(2).join("|");
  }
  if (v.provider === "bunny" && limpo(v.libraryId) && limpo(v.videoId)) {
    return `<iframe src="https://player.mediadelivery.net/embed/${limpo(v.libraryId)}/${limpo(v.videoId)}" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;
  }
  const id = limpo(v.videoId) || limpo(salvo.startsWith("bunny|") ? "" : salvo);
  if (!id || id === "COLOQUEAQUI") return "";
  return `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" allowfullscreen></iframe>`;
}

function nomeFaixa(id) {
  const num = Object.keys(AREA).find(n => AREA[n] === id);
  return num ? FAIXAS[num].nome : id;
}
function resumoDireito(data) {
  if (!data) return "sem liberação";
  const partes = [];
  (data.areas || []).forEach(id => partes.push(nomeFaixa(id) + " inteira"));
  if ((data.cursos || []).length) partes.push((data.cursos || []).length + " curso(s)");
  if ((data.livros || []).length) partes.push((data.livros || []).length + " livro(s)");
  if ((data.audios || []).length) partes.push((data.audios || []).length + " áudio(s)");
  return partes.length ? partes.join(" · ") : "sem liberação";
}
function quando(ms) {
  const n = Number(ms || 0);
  if (!n) return "";
  try { return new Date(n).toLocaleString("pt-BR"); } catch (e) { return ""; }
}
async function listarPessoas() {
  const box = document.getElementById("peopleList");
  if (!box) return;
  const mapa = {};
  function pessoa(email) {
    const key = String(email || "").toLowerCase();
    if (!key.includes("@")) return null;
    if (!mapa[key]) mapa[key] = { email: key, seen: 0, entrou: false, grant: null };
    return mapa[key];
  }
  const emailByUid = {};
  try {
    const users = await getDocs(collection(db, "users"));
    users.docs.forEach(item => {
      const d = item.data();
      const email = String(d.email || "").toLowerCase();
      if (email) emailByUid[item.id] = email;
      if (!d.membersSeen && !d.membersAqui) return;
      const p = pessoa(email);
      if (!p) return;
      p.entrou = true;
      const seen = Number(d.membersSeen || 0);
      if (seen > p.seen) p.seen = seen;
    });
  } catch (e) {}
  try {
    const painel = await getDoc(doc(db, "afMentorNotes", "membersPainel"));
    if (painel.exists()) {
      Object.keys(painel.data().grants || {}).forEach(email => {
        const p = pessoa(email);
        if (p) p.grant = painel.data().grants[email];
      });
    }
  } catch (e) {}
  try {
    const acc = await getDocs(collection(db, "afAccess"));
    acc.docs.forEach(item => {
      const g = item.data().membersGrant;
      if (!g) return;
      const p = pessoa(emailByUid[item.id] || "");
      if (p && !p.grant) p.grant = g;
    });
  } catch (e) {}
  try {
    const acessos = await getDocs(collection(db, "membrosAcessos"));
    acessos.docs.forEach(item => {
      if (!String(item.id).includes("@")) return;
      const p = pessoa(item.id);
      if (p) p.grant = item.data();
    });
  } catch (e) {}
  const linhas = Object.values(mapa).sort((a, b) => (b.seen || 0) - (a.seen || 0) || a.email.localeCompare(b.email));
  if (!linhas.length) {
    box.innerHTML = "<p class='sub'>Ninguém apareceu ainda. A lista enche quando alguém entra em /members, ou quando você libera um e-mail.</p>";
    return;
  }
  box.innerHTML = linhas.map(p => {
    const visita = p.entrou ? (p.seen ? "Entrou · " + quando(p.seen) : "Já entrou") : "Ainda não entrou";
    return `<div class="audio"><div><strong>${esc(p.email)}</strong><p class="sub">${esc(visita)} · ${esc(resumoDireito(p.grant))}</p></div></div>`;
  }).join("");
}

function marked() {
  const out = { areas: [], cursos: [], livros: [], audios: [] };
  document.querySelectorAll("#grantBoxes input:checked").forEach(input => {
    if (input.dataset.kind === "area") out.areas.push(input.value);
    if (input.dataset.kind === "curso") out.cursos.push(input.value);
    if (input.dataset.kind === "livro") out.livros.push(input.value);
    if (input.dataset.kind === "audio") out.audios.push(input.value);
  });
  return out;
}

async function loadGrant() {
  const email = document.getElementById("grantMail").value.trim().toLowerCase();
  const note = document.getElementById("grantNote");
  if (!email.includes("@")) { note.textContent = "Coloca o e-mail."; return; }
  let data = { areas: [], cursos: [], livros: [], audios: [] };
  try {
    const snap = await getDoc(doc(db, "membrosAcessos", email));
    if (snap.exists()) data = Object.assign(data, snap.data());
  } catch (e) {}
  try {
    const snap = await getDoc(doc(db, "entitlements", email));
    if (snap.exists()) data = Object.assign(data, snap.data());
  } catch (e) {}
  document.querySelectorAll("#grantBoxes input").forEach(input => {
    const list = input.dataset.kind === "area" ? data.areas : input.dataset.kind === "curso" ? data.cursos : input.dataset.kind === "livro" ? data.livros : data.audios;
    input.checked = (list || []).includes(input.value);
  });
  note.textContent = "Direitos deste e-mail carregados.";
}

async function writeRights(email, data) {
  const payload = {
    email,
    areas: data.areas || [],
    cursos: data.cursos || [],
    livros: data.livros || [],
    audios: data.audios || [],
    videos: data.videos || {},
    source: "manual_pix",
    grantedBy: mail(),
    status: "active"
  };
  await setDoc(doc(db, "membrosAcessos", email), payload, { merge: true });
  try { await setDoc(doc(db, "entitlements", email), payload, { merge: true }); } catch (e) {}
}

async function saveGrant(revoke) {
  const email = document.getElementById("grantMail").value.trim().toLowerCase();
  const note = document.getElementById("grantNote");
  if (!email.includes("@")) { note.textContent = "Coloca o e-mail."; return; }
  const pick = marked();
  let current = { areas: [], cursos: [], livros: [], audios: [], videos: {} };
  try {
    const snap = await getDoc(doc(db, "membrosAcessos", email));
    if (snap.exists()) current = Object.assign(current, snap.data());
  } catch (e) {}
  ["areas", "cursos", "livros", "audios"].forEach(kind => {
    const have = new Set(current[kind] || []);
    pick[kind].forEach(id => { if (revoke) have.delete(id); else have.add(id); });
    current[kind] = Array.from(have);
  });
  try {
    await writeRights(email, current);
  } catch (e) {}
  const resultado = await gravarPessoa(email, { grant: current });
  if (resultado.feitos.includes("acesso") || resultado.feitos.includes("lista")) {
    note.textContent = revoke ? "Direito removido." : "Direito liberado. A pessoa atualiza a página com esse e-mail.";
  } else if (resultado.falhas.includes("ainda-nao-entrou")) {
    note.textContent = "Esse Gmail ainda não abriu a área. Pede para entrar uma vez em /members e libera de novo.";
  } else {
    note.textContent = "Não gravou. O Firebase recusou: " + resultado.falhas.join(", ");
  }
  listarPessoas();
}

  return hit ? hit.id : "";

async function gravarPessoa(email, extra) {
  const feitos = [];
  const falhas = [];
  const painel = doc(db, "afMentorNotes", "membersPainel");
  try {
    let atual = { admins: [], grants: {} };
    const snap = await getDoc(painel);
    if (snap.exists()) atual = Object.assign(atual, snap.data());
    if (extra.admin && !(atual.admins || []).includes(email)) atual.admins = (atual.admins || []).concat([email]);
    if (extra.grant) atual.grants = Object.assign({}, atual.grants || {}, { [email]: extra.grant });
    await setDoc(painel, { admins: atual.admins || [], grants: atual.grants || {}, by: mail() }, { merge: true });
    feitos.push("lista");
  } catch (e) {
    falhas.push(e.code || "lista");
  }
  if (extra.admin) {
    try {
      await setDoc(doc(db, "membersAdmins", email), { active: true, by: mail() });
      feitos.push("admins");
    } catch (e) {
      falhas.push(e.code || "admins");
    }
  }
  let uid = "";
  try { uid = await acharUid(email); } catch (e) { falhas.push(e.code || "busca"); }
  if (!uid) falhas.push("ainda-nao-entrou");
  if (uid) {
    try {
      let prev = { areas: [], cursos: [], livros: [], audios: [], admin: false };
      const acc = await getDoc(doc(db, "afAccess", uid));
      if (acc.exists() && acc.data().membersGrant) prev = Object.assign(prev, acc.data().membersGrant);
      const membersGrant = Object.assign(prev, extra.grant || {}, extra.admin ? { admin: true } : {});
      await setDoc(doc(db, "afAccess", uid), { membersGrant }, { merge: true });
      feitos.push("acesso");
    } catch (e) {
      falhas.push(e.code || "acesso");
    }
  }
  return { feitos, falhas };
}

function campo(id, label, value, placeholder) {
  const q = String.fromCharCode(38) + "quot;";
  const v = esc(value).split(String.fromCharCode(34)).join(q);
  const p = esc(placeholder).split(String.fromCharCode(34)).join(q);

      ordem: 0,
      aulas: [{
        id: "a" + stamp,
        titulo: "Aula 01",
        descricao: "",
        ordem: 0,
        status: "publicado",
        access: "exclusivo",
        video: { provider: "bunny", videoId: "", libraryId: BUNNY_LIB }
      }]
    }]
  });
  cmsAt = { mode: "curso", index: cms.cursos.length - 1, mod: 0, aula: 0 };
  go({ view: "conteudo" });
  gravarCms("Curso criado nesta faixa. Ainda é rascunho: só você vê. Publica quando os links estiverem na ordem.");
}
function novoLivroNaFaixa(faixa) {
  const area = faixa || AREA[route.nivel] || "anubis";
  cms.livros = cms.livros || [];
  cms.livros.push({ titulo: "Novo ebook", faixa: area, url: "", status: "rascunho" });
  cmsAt = { mode: "livro", index: cms.livros.length - 1, mod: 0, aula: 0 };
  go({ view: "conteudo" });
}
function aplicarLoteNoCurso(c, text) {
  const links = String(text || "").split(/\n+/).map(s => s.trim()).filter(Boolean);
  if (!links.length) return 0;
  c.modules = c.modules || [];
  if (!c.modules.length) c.modules.push({ id: "m" + Date.now(), titulo: "Aulas", ordem: 0, aulas: [] });
  const slots = [];
  c.modules.forEach(m => (m.aulas || []).forEach(a => slots.push(a)));
  links.forEach((link, i) => {
    const lido = lerMidia(link);
    const video = {
      provider: lido.provider || "bunny",
      videoId: lido.videoId || limpo(link),
      libraryId: lido.libraryId || BUNNY_LIB
    };
    if (!video.videoId) return;
    if (i < slots.length) {
      slots[i].video = video;
      if (!slots[i].status || slots[i].status === "rascunho") slots[i].status = "publicado";
    } else {
      const m = c.modules[c.modules.length - 1];
      m.aulas = m.aulas || [];
      m.aulas.push({
        id: "a" + Date.now() + i,
        titulo: "Aula " + String(m.aulas.length + 1).padStart(2, "0"),
        descricao: "",
        ordem: m.aulas.length,
        status: "publicado",
        access: "exclusivo",
        video
      });
    }
  });
  return links.length;
}
function garantirTechub() {
  const base = (FAIXAS[2].cursos || []).find(item => item.id === "techub");
  if (!base) return;
  cms.cursos = cms.cursos || [];
  let c = cms.cursos.find(item => item.id === "horus:techub");
  if (!c) {
    c = { id: "horus:techub", faixa: "horus", titulo: "Tech Hub", descricao: "63 aulas, na ordem da gravação. O vídeo entra quando o link do Bunny é colado.", capa: "", status: "publicado", ordem: 0, modules: [] };
    cms.cursos.unshift(c);
  }
  const temAula = (c.modules || []).some(m => (m.aulas || []).length);
  if (temAula) return;
  c.titulo = c.titulo && c.titulo !== "Novo curso" ? c.titulo : "Tech Hub";
  c.faixa = "horus";
  c.status = c.status || "publicado";
  c.modules = base.modules.map((m, mi) => ({
    id: "m" + mi,
    titulo: m.nome,
    ordem: mi,
    aulas: (m.aulas || []).map((a, ai) => ({
      id: "a" + mi + "_" + ai,
      titulo: a.titulo,
      descricao: "",
      ordem: ai,
      status: "publicado",
      access: "exclusivo",
      video: a.video && a.video.videoId ? a.video : { provider: "bunny", videoId: "", libraryId: BUNNY_LIB }
    }))
  }));
}

async function gravarCms(texto) {
  const note = document.getElementById("cmsNote");
  try {
    const publico = await saveCms();
    if (note) note.textContent = publico ? (texto || "Salvo.") : (texto || "Salvo.") + " Por enquanto só a sua conta vê esta edição.";
  } catch (e) {
    if (note) note.textContent = "Não gravou. Entre com o Gmail administrador.";
  }
}
async function gravarVideoAula(course, aula) {
  const key = course.id + ":" + cmsAt.mod + ":" + cmsAt.aula;
  const video = aula.video || {};
  catalogVideos[key] = video.provider === "bunny" ? "bunny|" + video.libraryId + "|" + video.videoId : video.videoId;
  try {
    await setDoc(doc(db, "aulas", key.split(":").join("_")), {
      provider: video.provider || "youtube",
      videoId: video.videoId || "",
      libraryId: video.libraryId || "",
      area: course.faixa,
      cursoKey: course.id,
      by: mail()
    });
  } catch (e) {}
  try {
    await setDoc(doc(db, "membrosGestao", "videos"), { [key]: catalogVideos[key] }, { merge: true });
  } catch (e) {}
}
function moverCurso(dir) {
  const i = cmsAt.index;
  const j = i + dir;
  if (j < 0 || j >= cms.cursos.length) return;
  const item = cms.cursos.splice(i, 1)[0];
  cms.cursos.splice(j, 0, item);
  cmsAt.index = j;
  gravarCms("Ordem salva.");
}
function moverMod(i, dir) {
  const c = cms.cursos[cmsAt.index];
  const j = i + dir;
  if (!c || j < 0 || j >= c.modules.length) return;
  const item = c.modules.splice(i, 1)[0];
  c.modules.splice(j, 0, item);
  gravarCms("Ordem salva.");
}
function moverAula(dir) {
  const m = cms.cursos[cmsAt.index].modules[cmsAt.mod];
  const i = cmsAt.aula;
  const j = i + dir;
  if (!m || j < 0 || j >= m.aulas.length) return;
  const item = m.aulas.splice(i, 1)[0];
  m.aulas.splice(j, 0, item);
  cmsAt.aula = j;
  gravarCms("Ordem salva.");
}

async function saveLessonVideo() {
  const note = document.getElementById("videoNote");
  const raw = (document.getElementById("videoUrl") || {}).value || "";
  const lido = lerMidia(raw);
  const provider = lido.provider || (document.getElementById("videoProvider") || {}).value || "youtube";
  const libraryId = lido.libraryId || limpo((document.getElementById("libraryId") || {}).value || "");
  const videoId = lido.videoId || (provider === "youtube" ? (ytId(raw) || limpo(raw)) : limpo(raw));
  if (provider === "bunny" && (!libraryId || !videoId)) { note.textContent = "No Bunny, falta Library ID ou Video ID."; return; }
  if (!videoId) { note.textContent = "Cola o link do YouTube ou o Video ID."; return; }
  const ref = acharCms();
  if (ref && ref.aula) ref.aula.video = { provider, videoId, libraryId };
  const token = provider === "bunny" ? "bunny|" + libraryId + "|" + videoId : videoId;
  const key = videoKey();
  const cursoKey = AREA[route.nivel] + ":" + route.curso;
  catalogVideos[key] = token;
  try { if ((cms.cursos || []).length) await saveCms(); } catch (e) {}
  try {
    await setDoc(doc(db, "aulas", key.split(":").join("_")), {
      provider, videoId, libraryId, area: AREA[route.nivel], cursoKey, by: mail()
    });
  } catch (e) {}
  try {
    await setDoc(doc(db, "membrosGestao", "videos"), { [key]: token }, { merge: true });
  } catch (e) {}
  try {
    const all = await getDocs(collection(db, "membrosAcessos"));
    for (const item of all.docs) {
      const data = item.data();
      const ok = (data.areas || []).includes(AREA[route.nivel]) || (data.cursos || []).includes(cursoKey);
      if (!ok) continue;
      const videos = Object.assign({}, data.videos || {});
      videos[key] = token;
      await setDoc(item.ref, { videos }, { merge: true });
    }
  } catch (e) {}
  note.textContent = "Vídeo salvo para quem já tem esse direito.";
  draw();
}

function pullRights(data) {
  (data.areas || []).forEach(id => { if (id && !rights.areas.includes(id)) rights.areas.push(id); });
  (data.cursos || []).forEach(id => { if (id && !rights.cursos.includes(id)) rights.cursos.push(id); });
  (data.livros || []).forEach(id => { if (id && !rights.livros.includes(id)) rights.livros.push(id); });
  (data.audios || []).forEach(id => { if (id && !rights.audios.includes(id)) rights.audios.push(id); });
  Object.assign(catalogVideos, data.videos || {});
}

onAuthStateChanged(auth, async next => {
  user = next;
  rights = { areas: [], cursos: [], livros: [], audios: [] };
  catalogVideos = {};
  adminOn = isYan();
  if (user && mail()) {
    try { await setDoc(doc(db, "users", user.uid), { email: mail(), membersAqui: true, membersSeen: Date.now() }, { merge: true }); } catch (e) {}
    try {
      const admin = await getDoc(doc(db, "membersAdmins", mail()));
      if (admin.exists() && admin.data().active) adminOn = true;
    } catch (e) {}
    try {
      const acc = await getDoc(doc(db, "afAccess", user.uid));
      if (acc.exists() && acc.data().membersGrant) {
        pullRights(acc.data().membersGrant);
        if (acc.data().membersGrant.admin) adminOn = true;
      }
    } catch (e) {}
    try {
      const painel = await getDoc(doc(db, "afMentorNotes", "membersPainel"));
      if (painel.exists()) {
        const grant = (painel.data().grants || {})[mail()];
        if (grant) pullRights(grant);
        if ((painel.data().admins || []).includes(mail())) adminOn = true;
      }
    } catch (e) {}
    try {
      const grant = await getDoc(doc(db, "membrosAcessos", mail()));
      if (grant.exists()) pullRights(grant.data());
    } catch (e) {}
    try {
      const grant = await getDoc(doc(db, "entitlements", mail()));
      if (grant.exists()) pullRights(grant.data());
    } catch (e) {}
    if (adminOn) {
      try {
        const videos = await getDoc(doc(db, "membrosGestao", "videos"));
        if (videos.exists()) Object.assign(catalogVideos, videos.data());
      } catch (e) {}
    }
    try {
      const tree = await getDoc(doc(db, "membrosGestao", "conteudo"));
      if (tree.exists()) aplicarCms(tree.data());
    } catch (e) {}
    if (adminOn) {
      try {
        const copia = await getDoc(doc(db, "afMentorNotes", "membersConteudo"));
        if (copia.exists()) {
          const data = copia.data();
          if (!(cms.cursos || []).length) aplicarCms(data);
          if (!(cms.livros || []).length && Array.isArray(data.livros)) cms.livros = data.livros;
          if (!(cms.audios || []).length && Array.isArray(data.audios)) cms.audios = data.audios;
        }
      } catch (e) {}
    }
    await loadStripeGrants();
  }
  garantirTechub();
  draw();
});
