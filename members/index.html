<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barra Members</title>
<link rel="icon" href="https://res.cloudinary.com/dcbarseus/image/upload/v1773707211/IMG_20260104_135834_828_nsimow.webp">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f3;--panel:#fff;--line:rgba(139,105,20,.28);--gold:#8b6914;--gold2:#a6842f;--text:#1c140c;--muted:#6d6256;--ok:#e7f6ee}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Josefin Sans",sans-serif;font-weight:300;min-height:100%}
button,a{font-family:inherit}a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond",serif;letter-spacing:.14em;min-width:0;font-size:20px}
.brand small{display:block;letter-spacing:.22em;font-size:10px;color:var(--gold);margin-top:3px;font-family:"Josefin Sans",sans-serif}
#authBtn{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.mid{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-align:center}
.right{font-family:"Cormorant Garamond",serif;font-size:14px;letter-spacing:.12em;text-align:right;color:var(--gold)}
.moon{height:280px;overflow:hidden;background:#111}
.moon img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 360px)}
.side{border-right:1px solid var(--line);padding:18px 12px;background:#fff}
.side button,.side a.nav{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:transparent;color:var(--muted);border:0;border-radius:12px;padding:11px 12px;cursor:pointer;margin-bottom:4px}
.side button.on,.side a.nav.on{background:rgba(139,105,20,.1);color:var(--gold)}
.main{padding:22px;max-width:1100px}
.kicker{font-family:"Cormorant Garamond",serif;letter-spacing:.2em;font-size:16px;color:var(--gold);text-transform:uppercase}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:42px;margin:8px 0}
.sub{color:var(--muted);max-width:38rem;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0}
.card img{width:100%;height:120px;object-fit:cover;display:block}
.card div{padding:12px}
.card strong{display:block;font-family:"Cormorant Garamond",serif;letter-spacing:.04em;font-size:22px}
.badge{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.12em;border-radius:99px;padding:4px 8px}
.badge.on{color:#145c32;background:var(--ok)} .badge.off{color:var(--gold);border:1px solid var(--line);background:#fff}
.hero{display:grid;grid-template-columns:160px 1fr;gap:16px;border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;margin:16px 0}
.hero img{width:160px;height:160px;object-fit:cover;border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;cursor:pointer;color:inherit;text-align:left}
.tile b{display:block;font-family:"Cormorant Garamond",serif;letter-spacing:.08em;margin-bottom:6px;font-size:22px}
.courses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.course{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;cursor:pointer;color:inherit;text-align:left}
.play{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);margin-bottom:10px}
.player{display:grid;grid-template-columns:220px 1fr;gap:16px}
.mods button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:10px;cursor:pointer}
.mods button.on{background:rgba(139,105,20,.12);color:var(--gold)}
.stage{min-height:240px;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;padding:24px;background:#fff;color:var(--muted)}
.stage iframe{width:100%;height:320px;border:0;border-radius:12px}
.lesson{display:flex;justify-content:space-between;gap:12px;width:100%;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row button,.buy{border:0;border-radius:999px;padding:12px 16px;cursor:pointer;background:var(--gold);color:#fff;font-weight:600}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.book{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.book .cover{height:140px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-family:"Cormorant Garamond",serif;letter-spacing:.12em;margin-bottom:10px;background:#f7f1e4}
.audio{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.crumb{color:var(--muted);font-size:13px;margin-bottom:8px}
.crumb button{background:none;border:0;color:var(--gold);cursor:pointer;padding:0}
.user{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
input,label{color:var(--text)}
#grantBoxes label{display:block;margin:6px 0;color:var(--text)}
@media(max-width:800px){
  .mid,.right,.brand small{display:none}
  .brand{font-size:16px}
  .moon{height:180px}
  .shell{grid-template-columns:1fr}
  .side{display:flex;gap:6px;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side button,.side a.nav{width:auto;white-space:nowrap}
  .grid,.tiles,.courses,.books,.player,.hero{grid-template-columns:1fr}
  .hero img{width:100%;height:180px}
  h1{font-size:32px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">☥<div>BARRA MEMBERS<small>SUA JORNADA DE CONHECIMENTO</small></div></div>
  <div class="mid">Todos os cursos + livros + áudios em um só lugar</div>
  <div class="right">DO CONHECIMENTO<br>À TRANSFORMAÇÃO</div>
</header>
<div class="moon"><img alt="Lua" src="https://akashahub.com.br/afplataforma/assets/img/lua/hero/lua-hero-01.webp"></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="app"></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const auth = getAuth(initializeApp({
  apiKey: "AIzaSyAQXJDGfsd7RgcYKm9wfuh6nOth7dWo-v4",
  authDomain: "hub-akasha.firebaseapp.com",
  projectId: "hub-akasha",
  storageBucket: "hub-akasha.firebasestorage.app",
  messagingSenderId: "370851875474",
  appId: "1:370851875474:web:29b1ba3a76b0fed7d9344b"
}));
const db = getFirestore(auth.app);
const YAN = "yanfili.simon@gmail.com";
const AREA = { 1: "anubis", 2: "horus", 3: "isis", 4: "amon" };
const PRECO_FAIXA = { anubis: 4700, horus: 9700, isis: 14700, amon: 19700 };
const PRECO_ITEM = { curso: 2700, livro: 1700, audio: 700 };
function reais(cents) { return (cents / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function precoDe(kind) {
  if (kind === "area") return PRECO_FAIXA[AREA[route.nivel]];
  return PRECO_ITEM[kind];
}

function pack(mods, total) {
  const base = Math.floor(total / mods);
  let extra = total % mods;
  return Array.from({ length: mods }, (_, i) => {
    const n = base + (extra > 0 ? 1 : 0);
    if (extra > 0) extra -= 1;
    return {
      nome: "Módulo " + (i + 1),
      aulas: Array.from({ length: n }, (_, j) => ({ titulo: "Aula " + String(j + 1).padStart(2, "0"), ytId: "COLOQUE_AQUI" }))
    };
  });
}
function curso(id, titulo, mods, aulas) {
  return { id, titulo, modules: pack(mods, aulas) };
}
function aulas(list) {
  return list.map(titulo => ({ titulo, ytId: "COLOQUE_AQUI" }));
}
const FAIXAS = {
  1: {
    nome: "Anúbis", tag: "Nível 1 · Faixa azul",
    frase: "O início da jornada. Desperte a consciência e alinhe a energia com o universo.",
    img: "https://res.cloudinary.com/dcbarseus/image/upload/v1780452806/IMG-20260415-WA0001_dkra3y.jpg",
    fundamentos: [
      { nome: "O Campo Quântico", aulas: aulas(["O que é o Campo Akáshico", "A Física por Trás da Consciência", "Sincronicidade e Padrões", "Ativação do Campo Pessoal"]) },
      { nome: "Reprogramação Profunda", aulas: aulas(["Como a Mente Cria a Realidade", "O Método das 3 Fases", "Quebrando Padrões Limitantes", "Prática: Protocolo dos 18 Minutos"]) },
      { nome: "Energia e Frequência", aulas: aulas(["Mapa da Consciência", "Como Elevar Sua Frequência", "Ancoragem e Proteção Energética", "Respiração Quântica"]) },
      { nome: "Manifestação Aplicada", aulas: aulas(["Os 4 Princípios da Realidade", "Colapso de Onda na Prática", "Alinhamento Mente-Emoção-Intenção", "Exercício Final"]) }
    ],
    cursos: [
      curso("alinhamento", "Código de Alinhamento", 4, 12),
      curso("7-dias", "Desafio 7 Dias de Magnetismo", 7, 14),
      curso("casais", "Ritual para Casais", 3, 8),
      curso("tantra", "Tantra Diferente de Sexo", 5, 10),
      curso("fascinacao", "O Poder da Fascinação", 2, 6)
    ],
    livros: ["O Código Secreto do Universo", "Código Quântico", "Revelações Quânticas"],
    audios: ["Mente Crística", "Pai Nosso", "Avê Maria", "Cura das Feridas Invisíveis", "O Código Secreto do Universo"]
  },
  2: {
    nome: "Hórus", tag: "Nível 2 · Faixa roxa",
    frase: "Expansão da consciência. O que foi ativado no Anúbis ganha alcance.",
    img: "https://res.cloudinary.com/dcbarseus/image/upload/v1780452806/IMG-20260415-WA0002_udbfpg.jpg",
    fundamentos: [
      { nome: "Intuição Avançada", aulas: aulas(["Tipos de Intuição", "Calibrando o Receptor", "Sonhos como Mensagens", "Escuta Akáshica"]) },
      { nome: "Geometria Sagrada", aulas: aulas(["Os Padrões da Criação", "Merkabah e Campo Toroidal", "Ativação Geométrica", "Integração nas 24 Horas"]) },
      { nome: "Alquimia Emocional", aulas: aulas(["Emoções como Combustível", "Transmutação de Sombras", "O Coração como Centro", "Coerência Cardíaca"]) },
      { nome: "Campos Morfogenéticos", aulas: aulas(["Campos da Memória", "Linhagens e Padrões", "Desvinculação", "Criando Seu Novo Campo"]) }
    ],
    cursos: [
      curso("senda", "A Senda Tântrica", 3, 9),
      curso("prosperidade", "Tantra Quântico e Prosperidade", 3, 9),
      curso("despertar", "Despertar do Magnetismo", 3, 9)
    ],
    livros: ["Código de Conduta", "O Que é Tantra?", "Shiva, Shakti e Shava", "Honrar a Deusa", "Tantra Descomplicado"],
    audios: []
  },
  3: {
    nome: "Ísis", tag: "Nível 3 · Faixa marrom",
    frase: "Maestria. Autoridade sobre o campo e sobre a própria expressão.",
    img: "https://res.cloudinary.com/dcbarseus/image/upload/v1780452806/IMG-20260415-WA0003_ueh0c4.jpg",
    fundamentos: [
      { nome: "Leitura de Campos", aulas: aulas(["Como Ler Campos", "Diagnóstico Energético", "Mapeamento de Bloqueios", "Prática"]) },
      { nome: "Rituais de Maestria", aulas: aulas(["Rituais Pessoais", "Lua e Ciclos", "Ritual de Intenção", "Consolidação"]) },
      { nome: "Identidade Quântica", aulas: aulas(["Além do Ego", "Arquétipos e Missão", "Expressão Autêntica", "Carta ao Eu Superior"]) },
      { nome: "Liderança e Impacto", aulas: aulas(["Liderança pelo Campo", "Comunicação que Ressoa", "Comunidade", "Legado"]) }
    ],
    cursos: [
      curso("paladins", "Paladins: A Liderança dos Bons", 4, 12),
      curso("jornada", "Jornada de Transformação", 3, 9)
    ],
    livros: ["Autoestima Blindada", "Como Blindar Sua Mente?", "Triplex na Mente"],
    audios: []
  },
  4: {
    nome: "Rá", tag: "Nível 4 · Faixa preta",
    frase: "A faixa preta. O conhecimento vira obra, negócio e legado.",
    img: "https://res.cloudinary.com/dcbarseus/image/upload/v1780452806/IMG-20260415-WA0004_xn5dod.jpg",
    fundamentos: [
      { nome: "Masterclass", aulas: aulas(["Os 7 Segredos do Magnetismo", "A Lei da Ressonância", "Abundância como Estado", "Integração Total"]) },
      { nome: "Sessões Gravadas", aulas: aulas(["Ativação em Grupo", "Perguntas e Respostas", "Transmissão de Campo", "Integração Coletiva"]) },
      { nome: "Acervo", aulas: aulas(["Hermetismo Aplicado", "Textos e Decodificação", "Cabala e Árvore da Vida", "Enoque e Toth"]) },
      { nome: "Mentoria em Grupo", aulas: aulas(["Estratégia e Essência", "Vendas com Consciência", "Marca Pessoal", "Expansão"]) }
    ],
    cursos: [curso("zero", "Do Zero ao Zen e Negócios", 4, 12)],
    livros: ["Coletânea Alinhamento Financeiro", "Códigos de Origem"],
    audios: []
  }
};

let user = null;
let rights = { areas: [], cursos: [], livros: [], audios: [] };
let catalogVideos = {};
let adminOn = false;
let route = { view: "portal", nivel: 1, curso: "", mod: 0, aula: 0 };

function esc(s) { return String(s || "").replace(/[&<>]/g, c => ({ "&": "&", "<": "<", ">": ">" }[c])); }
function mail() { return ((user && user.email) || "").toLowerCase(); }
function isYan() { return mail() === YAN; }
function ownsArea(nivel) { return adminOn || rights.areas.includes(AREA[nivel]); }
function keyCurso(nivel, id) { return AREA[nivel] + ":" + id; }
function ownsCurso(nivel, id) { return ownsArea(nivel) || rights.cursos.includes(keyCurso(nivel, id)); }
function ownsLivro(nivel, nome) { return ownsArea(nivel) || rights.livros.includes(AREA[nivel] + ":" + nome); }
function ownsAudio(nivel, nome) { return ownsArea(nivel) || rights.audios.includes(AREA[nivel] + ":" + nome); }
function ytId(url) {
  const text = String(url || "").trim();
  const m = text.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : ( /^[A-Za-z0-9_-]{6,20}$/.test(text) ? text : "" );
}
function videoKey() { return AREA[route.nivel] + ":" + route.curso + ":" + route.mod + ":" + route.aula; }
function faixa() { return FAIXAS[route.nivel]; }
function cursoAtual() {
  const f = faixa();
  if (route.curso === "fundamentos") return { id: "fundamentos", titulo: "Fundamentos do Despertar", modules: f.fundamentos };
  return f.cursos.find(item => item.id === route.curso) || f.cursos[0];
}
function go(next) { route = { ...route, ...next }; draw(); window.scrollTo(0, 0); }
function comprar(kind, item) {
  const area = AREA[route.nivel];
  const ref = kind === "area" ? "area:" + area : kind + ":" + area + ":" + item;
  location.href = "/membros/checkout.html?ref=" + encodeURIComponent(ref);
}

function side() {
  const f = route.view === "portal" ? null : faixa();
  const items = [
    ["portal", "Início"],
    ["jornada", "Minha jornada"]
  ];
  document.getElementById("side").innerHTML = `
    <button class="${route.view === "portal" ? "on" : ""}" data-go="portal">Início</button>
    ${f ? `
      <button class="${route.view === "area" ? "on" : ""}" data-go="area">Área ${esc(f.nome)}</button>
      <button class="${route.view === "cursos" ? "on" : ""}" data-go="cursos">Cursos</button>
      <button class="${route.view === "livros" ? "on" : ""}" data-go="livros">Livros</button>
      <button class="${route.view === "audios" ? "on" : ""}" data-go="audios">Áudios</button>
      <button class="${route.curso === "fundamentos" ? "on" : ""}" data-go="fundamentos">Fundamentos</button>
    ` : `
      <button data-go="cursos" ${route.view === "portal" ? "" : ""}>Cursos</button>
      <button data-go="livros">Livros</button>
      <button data-go="audios">Áudios</button>
    `}
    <div class="user">${esc(mail() || "Visitante")}<br>${adminOn ? "Administrador" : "Membro"}<br><button id="authBtn" style="margin-top:8px">${user ? "Sair" : "Entrar"}</button></div>
    ${adminOn ? `<button class="${route.view === "gestao" ? "on" : ""}" data-go="gestao">Gestão de acesso</button>` : ""}`;
  document.getElementById("side").querySelectorAll("[data-go]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.go;
      if (id === "portal") go({ view: "portal" });
      else if (id === "gestao") go({ view: "gestao" });
      else if (id === "area") go({ view: "area" });
      else if (id === "fundamentos") go({ view: "player", curso: "fundamentos", mod: 0, aula: 0 });
      else {
        if (route.view === "portal") route.nivel = 1;
        go({ view: id });
      }
    };
  });
  document.getElementById("authBtn").onclick = async () => {
    if (!user) { location.href = "/login/?next=/members/index.html"; return; }
    await signOut(auth);
  };
}

function portal() {
  const cards = Object.keys(FAIXAS).map(num => {
    const f = FAIXAS[num];
    const open = ownsArea(Number(num));
    return `<button class="card" data-nivel="${num}"><img alt="" src="${f.img}"><div><strong>${esc(f.nome)}</strong><span>${esc(f.tag)}</span><span class="badge ${open ? "on" : "off"}">${open ? "LIBERADO" : "BLOQUEADO · " + reais(PRECO_FAIXA[AREA[num]])}</span></div></button>`;
  }).join("");
  document.getElementById("app").innerHTML = `
    <p class="kicker">Portal</p>
    <h1>Bem-vindo ao Barra Members</h1>
    <p class="sub">Sua jornada começa aqui. Cada faixa abre os fundamentos, os cursos da Doutrina, os livros e os áudios. O arquivo entra depois.</p>
    <div class="grid">${cards}</div>
    <p class="note">${adminOn ? "Sua conta administra e entra em todas as faixas." : "O cadeado é o que esse login ainda não tem. Comprar a faixa, ou receber o direito no Pix, abre só aquilo."}</p>`;
  document.getElementById("app").querySelectorAll("[data-nivel]").forEach(btn => {
    btn.onclick = () => go({ view: "area", nivel: Number(btn.dataset.nivel) });
  });
}

function area() {
  const f = faixa();
  const open = ownsArea(route.nivel);
  const aulasFund = f.fundamentos.reduce((n, m) => n + m.aulas.length, 0);
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="portal">Início</button> · ${esc(f.nome)}</p>
    <div class="hero"><img alt="" src="${f.img}"><div><p class="kicker">${esc(f.tag)}</p><h1>${esc(f.nome)}</h1><p class="sub">${esc(f.frase)}</p><p class="note">${open ? "Faixa liberada." : "Esta faixa custa " + reais(precoDe("area")) + ". Dá para ver a estrutura. O conteúdo abre depois do pagamento."}</p>${open ? "" : '<button class="buy" id="buy">Pagar a faixa</button>'}</div></div>
    <button class="tile" id="openFund" style="width:100%;margin-bottom:12px"><b>Fundamentos do Despertar</b>${f.fundamentos.length} módulos · ${aulasFund} aulas</button>
    <div class="tiles">
      <button class="tile" data-view="cursos"><b>Cursos</b>${f.cursos.length} cursos desta faixa</button>
      <button class="tile" data-view="livros"><b>Livros</b>${f.livros.length} e-books</button>
      <button class="tile" data-view="audios"><b>Áudios</b>${f.audios.length} áudios</button>
    </div>`;
  document.querySelector("[data-back]").onclick = () => go({ view: "portal" });
  document.getElementById("openFund").onclick = () => go({ view: "player", curso: "fundamentos", mod: 0, aula: 0 });
  document.querySelectorAll("[data-view]").forEach(btn => { btn.onclick = () => go({ view: btn.dataset.view }); });
  const buy = document.getElementById("buy");
  if (buy) buy.onclick = () => comprar("area");
}

function cursos() {
  const f = faixa();
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="area">${esc(f.nome)}</button> · Cursos</p>
    <h1>Cursos</h1>
    <p class="sub">Os cursos da Doutrina deste nível. Toque para abrir módulos e aulas. O vídeo entra no quadro.</p>
    <div class="courses">${f.cursos.map(item => {
      const aulasN = item.modules.reduce((n, m) => n + m.aulas.length, 0);
      const open = ownsCurso(route.nivel, item.id);
      return `<button class="course" data-curso="${item.id}"><div class="play">${open ? "▶" : "🔒"}</div><strong>${esc(item.titulo)}</strong><p class="sub">Módulos: ${item.modules.length} · Aulas: ${aulasN}</p><span class="badge ${open ? "on" : "off"}">${open ? "ABERTO" : reais(PRECO_ITEM.curso)}</span></button>`;
    }).join("")}</div>`;
  document.querySelector("[data-back]").onclick = () => go({ view: "area" });
  document.querySelectorAll("[data-curso]").forEach(btn => {
    btn.onclick = () => go({ view: "player", curso: btn.dataset.curso, mod: 0, aula: 0 });
  });
}

function player() {
  const f = faixa();
  const item = cursoAtual();
  const mod = item.modules[route.mod] || item.modules[0];
  const aula = mod.aulas[route.aula] || mod.aulas[0];
  const total = item.modules.reduce((n, m) => n + m.aulas.length, 0);
  const open = route.curso === "fundamentos" ? ownsArea(route.nivel) : ownsCurso(route.nivel, route.curso);
  const saved = catalogVideos[videoKey()] || "";
  const ready = !!saved;
  const stage = !open
    ? `<div class="stage"><div><div class="play" style="margin:0 auto 10px">🔒</div><p>Esta parte abre depois do pagamento.</p><button class="buy" id="buy">Pagar ${route.curso === "fundamentos" ? "a faixa " + reais(precoDe("area")) : "este curso " + reais(PRECO_ITEM.curso)}</button></div></div>`
    : ready
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${saved}?rel=0" allowfullscreen></iframe>`
      : `<div class="stage"><div><div class="play" style="margin:0 auto 10px">▶</div><p>Vídeo em breve</p><p>O arquivo desta aula entra aqui.</p></div></div>`;
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="cursos">${esc(f.nome)}</button> · ${esc(item.titulo)}</p>
    <div class="player">
      <div class="mods">
        <p class="kicker">${esc(item.titulo)}</p>
        ${item.modules.map((m, i) => `<button class="${i === route.mod ? "on" : ""}" data-mod="${i}">${esc(m.nome)}</button>`).join("")}
        <p class="note">0 de ${total} aulas</p>
      </div>
      <div>
        <h1 style="font-size:26px">${esc(mod.nome)}</h1>
        ${stage}
        <div style="margin-top:12px">${mod.aulas.map((a, i) => `<button class="lesson" data-aula="${i}"><span>${esc(a.titulo)}</span><span>${ready && i === route.aula ? "No ar" : "Vídeo em breve"}</span></button>`).join("")}</div>
        <div class="row">
          <button class="ghost" id="prev">← Anterior</button>
          <button id="next">Próxima aula →</button>
        </div>
        ${adminOn ? `<label style="display:block;margin-top:16px">URL do vídeo desta aula</label><input id="videoUrl" placeholder="https://youtube.com/watch?v=..." style="width:100%;margin-top:8px;background:#fff;border:1px solid rgba(139,105,20,.35);color:#1c140c;border-radius:12px;padding:12px"><button class="buy" id="saveVideo" style="margin-top:8px">Salvar vídeo</button><p class="note" id="videoNote"></p>` : ""}
      </div>
    </div>`;
  const back = document.querySelector("[data-back]");
  back.onclick = () => go({ view: route.curso === "fundamentos" ? "area" : "cursos" });
  document.querySelectorAll("[data-mod]").forEach(btn => { btn.onclick = () => go({ mod: Number(btn.dataset.mod), aula: 0 }); });
  document.querySelectorAll("[data-aula]").forEach(btn => { btn.onclick = () => go({ aula: Number(btn.dataset.aula) }); });
  document.getElementById("prev").onclick = () => passo(-1);
  document.getElementById("next").onclick = () => passo(1);
  const buy = document.getElementById("buy");
  if (buy) buy.onclick = () => comprar(route.curso === "fundamentos" ? "area" : "curso", route.curso);
  const saveVideo = document.getElementById("saveVideo");
  if (saveVideo) saveVideo.onclick = saveLessonVideo;
}
function passo(dir) {
  const item = cursoAtual();
  let mod = route.mod;
  let aula = route.aula + dir;
  if (aula < 0) { mod -= 1; if (mod < 0) return; aula = item.modules[mod].aulas.length - 1; }
  if (aula >= item.modules[mod].aulas.length) { mod += 1; if (mod >= item.modules.length) return; aula = 0; }
  go({ mod, aula });
}

function livros() {
  const f = faixa();
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="area">${esc(f.nome)}</button> · Livros</p>
    <h1>Livros</h1>
    <p class="sub">E-books desta faixa. O arquivo entra em cada um.</p>
    <div class="books">${f.livros.map(nome => `<article class="book"><div class="cover">E-BOOK</div><strong>${esc(nome)}</strong><div class="row"><button data-livro="${esc(nome)}">Abrir livro</button></div></article>`).join("") || "<p class='sub'>Nenhum livro neste nível ainda.</p>"}</div>
    <p class="note" id="livroNote"></p>`;
  document.querySelector("[data-back]").onclick = () => go({ view: "area" });
  document.querySelectorAll("[data-livro]").forEach(btn => {
    btn.onclick = () => {
      if (!ownsLivro(route.nivel, btn.dataset.livro)) { comprar("livro", btn.dataset.livro); return; }
      document.getElementById("livroNote").textContent = btn.dataset.livro + " · o arquivo ainda não entrou.";
    };
  });
}

function audios() {
  const f = faixa();
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="area">${esc(f.nome)}</button> · Áudios</p>
    <h1>Áudios</h1>
    <p class="sub">Meditações e áudios desta faixa. O arquivo entra em cada linha.</p>
    ${f.audios.map(nome => `<div class="audio"><strong>${esc(nome)}</strong><button class="buy" data-audio="${esc(nome)}">▶</button></div>`).join("") || "<p class='sub'>Nenhum áudio neste nível ainda.</p>"}
    <p class="note" id="audioNote"></p>`;
  const back = document.querySelector("[data-back]");
  if (back) back.onclick = () => go({ view: "area" });
  document.querySelectorAll("[data-audio]").forEach(btn => {
    btn.onclick = () => {
      if (!ownsAudio(route.nivel, btn.dataset.audio)) { comprar("audio", btn.dataset.audio); return; }
      document.getElementById("audioNote").textContent = btn.dataset.audio + " · o áudio ainda não entrou.";
    };
  });
}

function draw() {
  side();
  if (route.view === "portal") portal();
  else if (route.view === "area") area();
  else if (route.view === "cursos") cursos();
  else if (route.view === "livros") livros();
  else if (route.view === "audios") audios();
  else if (route.view === "gestao") gestao();
  else player();
}

function checks() {
  return Object.keys(FAIXAS).map(num => {
    const f = FAIXAS[num];
    const area = AREA[num];
    const cursos = f.cursos.map(c => `<label><input type="checkbox" data-kind="curso" value="${area}:${c.id}"> ${esc(c.titulo)}</label>`).join("");
    const livros = f.livros.map(nome => `<label><input type="checkbox" data-kind="livro" value="${area}:${esc(nome)}"> ${esc(nome)}</label>`).join("");
    const audios = f.audios.map(nome => `<label><input type="checkbox" data-kind="audio" value="${area}:${esc(nome)}"> ${esc(nome)}</label>`).join("");
    return `<div class="book" style="margin-top:12px"><strong>${esc(f.nome)}</strong><label><input type="checkbox" data-kind="area" value="${area}"> Faixa inteira</label>${cursos}${livros}${audios}</div>`;
  }).join("");
}

function gestao() {
  if (!adminOn) { portal(); return; }
  document.getElementById("app").innerHTML = `
    <p class="kicker">Pix e acesso manual</p>
    <h1>Gestão de acesso</h1>
    <p class="sub">Quem pagou fora do Stripe entra aqui. O e-mail liberado precisa ser o mesmo do login. A faixa inteira abre tudo dela. Um curso abre só aquele curso.</p>
    <label>E-mail</label>
    <input id="grantMail" type="email" placeholder="pessoa@email.com" style="width:100%;margin-top:8px;background:#fff;border:1px solid rgba(139,105,20,.35);color:#1c140c;border-radius:12px;padding:12px">
    <div class="row"><button id="findMail" class="ghost">Buscar</button></div>
    <div id="grantBoxes">${checks()}</div>
    <div class="row"><button id="grantBtn">Liberar</button><button id="revokeBtn" class="ghost">Revogar o marcado</button></div>
    <p class="note" id="grantNote"></p>
    <h1 style="font-size:26px;margin-top:28px">Administradores</h1>
    <p class="sub">O seu Gmail já administra. Outro e-mail só administra depois que a regra do Firebase estiver publicada.</p>
    <input id="adminMail" type="email" placeholder="outro@email.com" style="width:100%;margin-top:8px;background:#fff;border:1px solid rgba(139,105,20,.35);color:#1c140c;border-radius:12px;padding:12px">
    <div class="row"><button id="adminBtn">Adicionar administrador</button></div>`;
  document.getElementById("findMail").onclick = loadGrant;
  document.getElementById("grantBtn").onclick = () => saveGrant(false);
  document.getElementById("revokeBtn").onclick = () => saveGrant(true);
  document.getElementById("adminBtn").onclick = addAdmin;
}

function marked() {
  const out = { areas: [], cursos: [], livros: [], audios: [] };
  document.querySelectorAll("#grantBoxes input:checked").forEach(input => {
    if (input.dataset.kind === "area") out.areas.push(input.value);
    if (input.dataset.kind === "curso") out.cursos.push(input.value);
    if (input.dataset.kind === "livro") out.livros.push(input.value);
    if (input.dataset.kind === "audio") out.audios.push(input.value);
  });
  return out;
}

async function loadGrant() {
  const email = document.getElementById("grantMail").value.trim().toLowerCase();
  const note = document.getElementById("grantNote");
  if (!email.includes("@")) { note.textContent = "Coloca o e-mail."; return; }
  let data = { areas: [], cursos: [], livros: [], audios: [] };
  try {
    const snap = await getDoc(doc(db, "membrosAcessos", email));
    if (snap.exists()) data = Object.assign(data, snap.data());
  } catch (e) {}
  try {
    const snap = await getDoc(doc(db, "entitlements", email));
    if (snap.exists()) data = Object.assign(data, snap.data());
  } catch (e) {}
  document.querySelectorAll("#grantBoxes input").forEach(input => {
    const list = input.dataset.kind === "area" ? data.areas : input.dataset.kind === "curso" ? data.cursos : input.dataset.kind === "livro" ? data.livros : data.audios;
    input.checked = (list || []).includes(input.value);
  });
  note.textContent = "Direitos deste e-mail carregados.";
}

async function writeRights(email, data) {
  const payload = {
    email,
    areas: data.areas || [],
    cursos: data.cursos || [],
    livros: data.livros || [],
    audios: data.audios || [],
    videos: data.videos || {},
    source: "manual_pix",
    grantedBy: mail(),
    status: "active"
  };
  await setDoc(doc(db, "membrosAcessos", email), payload, { merge: true });
  try { await setDoc(doc(db, "entitlements", email), payload, { merge: true }); } catch (e) {}
}

async function saveGrant(revoke) {
  const email = document.getElementById("grantMail").value.trim().toLowerCase();
  const note = document.getElementById("grantNote");
  if (!email.includes("@")) { note.textContent = "Coloca o e-mail."; return; }
  const pick = marked();
  let current = { areas: [], cursos: [], livros: [], audios: [], videos: {} };
  try {
    const snap = await getDoc(doc(db, "membrosAcessos", email));
    if (snap.exists()) current = Object.assign(current, snap.data());
  } catch (e) {}
  ["areas", "cursos", "livros", "audios"].forEach(kind => {
    const have = new Set(current[kind] || []);
    pick[kind].forEach(id => { if (revoke) have.delete(id); else have.add(id); });
    current[kind] = Array.from(have);
  });
  try {
    await writeRights(email, current);
    note.textContent = revoke ? "Direito removido." : "Direito liberado. A pessoa entra com esse e-mail.";
  } catch (e) {
    note.textContent = "Não foi possível gravar. Só o administrador consegue liberar.";
  }
}

async function addAdmin() {
  const email = document.getElementById("adminMail").value.trim().toLowerCase();
  const note = document.getElementById("grantNote");
  if (!email.includes("@")) { note.textContent = "Coloca o e-mail do administrador."; return; }
  try {
    await setDoc(doc(db, "membersAdmins", email), { active: true, by: mail() });
    note.textContent = email + " foi adicionado. A regra do Firebase precisa estar publicada para ele gravar.";
  } catch (e) {
    note.textContent = "A lista de administradores ainda não aceita gravação. O seu Gmail continua sendo o administrador.";
  }
}

async function saveLessonVideo() {
  const input = document.getElementById("videoUrl");
  const note = document.getElementById("videoNote");
  const id = ytId(input.value);
  if (!id) { note.textContent = "Cola o link do YouTube dessa aula."; return; }
  const key = videoKey();
  const cursoKey = AREA[route.nivel] + ":" + route.curso;
  catalogVideos[key] = id;
  try {
    await setDoc(doc(db, "aulas", key.split(":").join("_")), {
      videoId: id,
      area: AREA[route.nivel],
      cursoKey,
      by: mail()
    });
  } catch (e) {}
  try {
    await setDoc(doc(db, "membrosGestao", "videos"), { [key]: id }, { merge: true });
  } catch (e) {}
  try {
    const all = await getDocs(collection(db, "membrosAcessos"));
    const area = AREA[route.nivel];
    const cursoKey = area + ":" + route.curso;
    for (const item of all.docs) {
      const data = item.data();
      const ok = (data.areas || []).includes(area) || (data.cursos || []).includes(cursoKey);
      if (!ok) continue;
      const videos = Object.assign({}, data.videos || {});
      videos[key] = id;
      await setDoc(item.ref, { videos }, { merge: true });
    }
  } catch (e) {}
  note.textContent = "Vídeo desta aula salvo para quem já tem esse direito.";
  draw();
}

function pullRights(data) {
  (data.areas || []).forEach(id => { if (id && !rights.areas.includes(id)) rights.areas.push(id); });
  (data.cursos || []).forEach(id => { if (id && !rights.cursos.includes(id)) rights.cursos.push(id); });
  (data.livros || []).forEach(id => { if (id && !rights.livros.includes(id)) rights.livros.push(id); });
  (data.audios || []).forEach(id => { if (id && !rights.audios.includes(id)) rights.audios.push(id); });
  Object.assign(catalogVideos, data.videos || {});
}

async function loadStripeGrants() {
  if (!user) return;
  let sessions = [];
  try { sessions = JSON.parse(localStorage.getItem("akashaStripeSessions") || "[]"); } catch (e) {}
  const incoming = new URLSearchParams(location.search).get("session_id");
  if (incoming && incoming.indexOf("cs_") === 0 && sessions.indexOf(incoming) < 0) sessions.push(incoming);
  if (incoming) history.replaceState({}, "", location.pathname);
  localStorage.setItem("akashaStripeSessions", JSON.stringify(sessions.slice(-20)));
  try {
    const idToken = await user.getIdToken();
    const res = await fetch("https://jsonmxbuzagmwuucruem.supabase.co/functions/v1/createStoreCheckout", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb25teGJ1emFnbXd1dWNydWVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODAzMTMsImV4cCI6MjA5NjA1NjMxM30.qqBI_AUm_AnP4D830QNUd3JIbPE6o54yzwej0utJ6rQ", "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb25teGJ1emFnbXd1dWNydWVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODAzMTMsImV4cCI6MjA5NjA1NjMxM30.qqBI_AUm_AnP4D830QNUd3JIbPE6o54yzwej0utJ6rQ" },
      body: JSON.stringify({ action: "grants", idToken, sessions })
    });
    const data = await res.json();
    if (data && Array.isArray(data.areas)) pullRights(data);
  } catch (e) {}
}

onAuthStateChanged(auth, async next => {
  user = next;
  rights = { areas: [], cursos: [], livros: [], audios: [] };
  catalogVideos = {};
  adminOn = isYan();
  if (user && mail()) {
    try {
      const admin = await getDoc(doc(db, "membersAdmins", mail()));
      if (admin.exists() && admin.data().active) adminOn = true;
    } catch (e) {}
    try {
      const grant = await getDoc(doc(db, "membrosAcessos", mail()));
      if (grant.exists()) pullRights(grant.data());
    } catch (e) {}
    try {
      const grant = await getDoc(doc(db, "entitlements", mail()));
      if (grant.exists()) pullRights(grant.data());
    } catch (e) {}
    if (adminOn) {
      try {
        const videos = await getDoc(doc(db, "membrosGestao", "videos"));
        if (videos.exists()) Object.assign(catalogVideos, videos.data());
      } catch (e) {}
    }
    await loadStripeGrants();
  }
  draw();
});
</script>
