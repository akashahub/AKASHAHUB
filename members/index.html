<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barra Members</title>
<link rel="icon" href="https://res.cloudinary.com/dcbarseus/image/upload/v1773707211/IMG_20260104_135834_828_nsimow.webp">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060c;--panel:#101018;--line:rgba(198,161,90,.28);--gold:#c6a15a;--gold2:#e8d5a3;--text:#f3ecdf;--muted:rgba(243,236,223,.55);--ok:#7dcea0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Raleway,sans-serif;min-height:100%}
button,a{font-family:inherit}a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;border-bottom:1px solid rgba(198,161,90,.16)}
.brand{display:flex;align-items:center;gap:10px;font-family:Cinzel,serif;letter-spacing:.14em;min-width:0}
.brand small{display:block;letter-spacing:.22em;font-size:9px;color:var(--gold);margin-top:3px}
#authBtn{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.mid{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-align:center}
.right{font-family:Cinzel,serif;font-size:10px;letter-spacing:.18em;text-align:right;color:var(--gold2)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 74px)}
.side{border-right:1px solid rgba(198,161,90,.16);padding:18px 12px}
.side button,.side a.nav{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:transparent;color:var(--muted);border:0;border-radius:12px;padding:11px 12px;cursor:pointer;margin-bottom:4px}
.side button.on,.side a.nav.on{background:rgba(198,161,90,.12);color:var(--gold2)}
.main{padding:22px;max-width:1100px}
.kicker{font-family:Cinzel,serif;letter-spacing:.2em;font-size:11px;color:var(--gold);text-transform:uppercase}
h1{font-family:Cinzel,serif;font-weight:500;font-size:34px;margin:8px 0}
.sub{color:var(--muted);max-width:38rem;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.card{background:linear-gradient(180deg,#14141e,#0c0c12);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0}
.card img{width:100%;height:120px;object-fit:cover;display:block}
.card div{padding:12px}
.card strong{display:block;font-family:Cinzel,serif;letter-spacing:.08em}
.badge{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.16em;border-radius:99px;padding:4px 8px}
.badge.on{color:#062;background:var(--ok)} .badge.off{color:var(--muted);border:1px solid rgba(255,255,255,.12)}
.hero{display:grid;grid-template-columns:160px 1fr;gap:16px;border:1px solid var(--line);border-radius:18px;padding:16px;background:#101018;margin:16px 0}
.hero img{width:160px;height:160px;object-fit:cover;border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:16px;padding:18px;background:#101018;cursor:pointer;color:inherit;text-align:left}
.tile b{display:block;font-family:Cinzel,serif;letter-spacing:.14em;margin-bottom:6px}
.courses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.course{border:1px solid var(--line);border-radius:16px;padding:16px;background:#101018;cursor:pointer;color:inherit;text-align:left}
.play{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);margin-bottom:10px}
.player{display:grid;grid-template-columns:220px 1fr;gap:16px}
.mods button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:10px;cursor:pointer}
.mods button.on{background:rgba(198,161,90,.14);color:var(--gold2)}
.stage{min-height:240px;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;padding:24px;background:#0c0c12;color:var(--muted)}
.stage iframe{width:100%;height:320px;border:0;border-radius:12px}
.lesson{display:flex;justify-content:space-between;gap:12px;width:100%;background:transparent;color:var(--text);border:0;border-bottom:1px solid rgba(255,255,255,.06);padding:12px 0;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px}
.row button,.buy{border:0;border-radius:999px;padding:12px 16px;cursor:pointer;background:var(--gold);color:#2a2108;font-weight:600}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.book{border:1px solid var(--line);border-radius:16px;padding:16px;background:#101018}
.book .cover{height:140px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-family:Cinzel,serif;letter-spacing:.12em;margin-bottom:10px}
.audio{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#101018}
.crumb{color:var(--muted);font-size:13px;margin-bottom:8px}
.crumb button{background:none;border:0;color:var(--gold);cursor:pointer;padding:0}
.user{margin-top:24px;padding-top:14px;border-top:1px solid rgba(198,161,90,.16);font-size:12px;color:var(--muted)}
.note{margin-top:14px;color:var(--muted)}
@media(max-width:800px){
  .mid,.right,.brand small{display:none}
  .brand{font-size:14px}
  .shell{grid-template-columns:1fr}
  .side{display:flex;gap:6px;overflow:auto;border-right:0;border-bottom:1px solid rgba(198,161,90,.16)}
  .side button,.side a.nav{width:auto;white-space:nowrap}
  .grid,.tiles,.courses,.books,.player,.hero{grid-template-columns:1fr}
  .hero img{width:100%;height:180px}
  h1{font-size:28px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">☥<div>BARRA MEMBERS<small>SUA JORNADA DE CONHECIMENTO</small></div></div>
  <div class="mid">Todos os cursos + livros + áudios em um só lugar</div>
  <div class="right">DO CONHECIMENTO<br>À TRANSFORMAÇÃO</div>
</header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="app"></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const auth = getAuth(initializeApp({
  apiKey: "AIzaSyAQXJDGfsd7RgcYKm9wfuh6nOth7dWo-v4",
  authDomain: "hub-akasha.firebaseapp.com",
  projectId: "hub-akasha",
  storageBucket: "hub-akasha.firebasestorage.app",
  messagingSenderId: "370851875474",
  appId: "1:370851875474:web:29b1ba3a76b0fed7d9344b"
}));
const db = getFirestore(auth.app);
const YAN = "yanfili.simon@gmail.com";
const AREA = { 1: "anubis", 2: "horus", 3: "isis", 4: "amon" };

function pack(mods, total) {
  const base = Math.floor(total / mods);
  let extra = total % mods;
  return Array.from({ length: mods }, (_, i) => {
    const n = base + (extra > 0 ? 1 : 0);
    if (extra > 0) extra -= 1;
    return {
      nome: "Módulo " + (i + 1),
      aulas: Array.from({ length: n }, (_, j) => ({ titulo: "Aula " + String(j + 1).padStart(2, "0"), ytId: "COLOQUE_AQUI" }))
    };
  });
}
function curso(id, titulo, mods, aulas) {
  return { id, titulo, modules: pack(mods, aulas) };
}
function aulas(list) {
  return list.map(titulo => ({ titulo, ytId: "COLOQUE_AQUI" }));
}
const FAIXAS = {
  1: {
    nome: "Anúbis", tag: "Nível 1 · Faixa azul",
    frase: "O início da jornada. Desperte a consciência e alinhe a energia com o universo.",
    img: "https://res.cloudinary.com/dcbarseus/image/upload/v1780452806/IMG-20260415-WA0001_dkra3y.jpg",
    fundamentos: [
      { nome: "O Campo Quântico", aulas: aulas(["O que é o Campo Akáshico", "A Física por Trás da Consciência", "Sincronicidade e Padrões", "Ativação do Campo Pessoal"]) },
      { nome: "Reprogramação Profunda", aulas: aulas(["Como a Mente Cria a Realidade", "O Método das 3 Fases", "Quebrando Padrões Limitantes", "Prática: Protocolo dos 18 Minutos"]) },
      { nome: "Energia e Frequência", aulas: aulas(["Mapa da Consciência", "Como Elevar Sua Frequência", "Ancoragem e Proteção Energética", "Respiração Quântica"]) },
      { nome: "Manifestação Aplicada", aulas: aulas(["Os 4 Princípios da Realidade", "Colapso de Onda na Prática", "Alinhamento Mente-Emoção-Intenção", "Exercício Final"]) }
    ],
    cursos: [
      curso("alinhamento", "Código de Alinhamento", 4, 12),
      curso("7-dias", "Desafio 7 Dias de Magnetismo", 7, 14),
      curso("casais", "Ritual para Casais", 3, 8),
      curso("tantra", "Tantra Diferente de Sexo", 5, 10),
      curso("fascinacao", "O Poder da Fascinação", 2, 6)
    ],
    livros: ["O Código Secreto do Universo", "Código Quântico", "Revelações Quânticas"],
    audios: ["Mente Crística", "Pai Nosso", "Avê Maria", "Cura das Feridas Invisíveis", "O Código Secreto do Universo"]
  },
  2: {
    nome: "Hórus", tag: "Nível 2 · Faixa roxa",
    frase: "Expansão da consciência. O que foi ativado no Anúbis ganha alcance.",
    img: "https://res.cloudinary.com/dcbarseus/image/upload/v1780452806/IMG-20260415-WA0002_udbfpg.jpg",
    fundamentos: [
      { nome: "Intuição Avançada", aulas: aulas(["Tipos de Intuição", "Calibrando o Receptor", "Sonhos como Mensagens", "Escuta Akáshica"]) },
      { nome: "Geometria Sagrada", aulas: aulas(["Os Padrões da Criação", "Merkabah e Campo Toroidal", "Ativação Geométrica", "Integração nas 24 Horas"]) },
      { nome: "Alquimia Emocional", aulas: aulas(["Emoções como Combustível", "Transmutação de Sombras", "O Coração como Centro", "Coerência Cardíaca"]) },
      { nome: "Campos Morfogenéticos", aulas: aulas(["Campos da Memória", "Linhagens e Padrões", "Desvinculação", "Criando Seu Novo Campo"]) }
    ],
    cursos: [
      curso("senda", "A Senda Tântrica", 3, 9),
      curso("prosperidade", "Tantra Quântico e Prosperidade", 3, 9),
      curso("despertar", "Despertar do Magnetismo", 3, 9)
    ],
    livros: ["Código de Conduta", "O Que é Tantra?", "Shiva, Shakti e Shava", "Honrar a Deusa", "Tantra Descomplicado"],
    audios: []
  },
  3: {
    nome: "Ísis", tag: "Nível 3 · Faixa marrom",
    frase: "Maestria. Autoridade sobre o campo e sobre a própria expressão.",
    img: "https://res.cloudinary.com/dcbarseus/image/upload/v1780452806/IMG-20260415-WA0003_ueh0c4.jpg",
    fundamentos: [
      { nome: "Leitura de Campos", aulas: aulas(["Como Ler Campos", "Diagnóstico Energético", "Mapeamento de Bloqueios", "Prática"]) },
      { nome: "Rituais de Maestria", aulas: aulas(["Rituais Pessoais", "Lua e Ciclos", "Ritual de Intenção", "Consolidação"]) },
      { nome: "Identidade Quântica", aulas: aulas(["Além do Ego", "Arquétipos e Missão", "Expressão Autêntica", "Carta ao Eu Superior"]) },
      { nome: "Liderança e Impacto", aulas: aulas(["Liderança pelo Campo", "Comunicação que Ressoa", "Comunidade", "Legado"]) }
    ],
    cursos: [
      curso("paladins", "Paladins: A Liderança dos Bons", 4, 12),
      curso("jornada", "Jornada de Transformação", 3, 9)
    ],
    livros: ["Autoestima Blindada", "Como Blindar Sua Mente?", "Triplex na Mente"],
    audios: []
  },
  4: {
    nome: "Rá", tag: "Nível 4 · Faixa preta",
    frase: "A faixa preta. O conhecimento vira obra, negócio e legado.",
    img: "https://res.cloudinary.com/dcbarseus/image/upload/v1780452806/IMG-20260415-WA0004_xn5dod.jpg",
    fundamentos: [
      { nome: "Masterclass", aulas: aulas(["Os 7 Segredos do Magnetismo", "A Lei da Ressonância", "Abundância como Estado", "Integração Total"]) },
      { nome: "Sessões Gravadas", aulas: aulas(["Ativação em Grupo", "Perguntas e Respostas", "Transmissão de Campo", "Integração Coletiva"]) },
      { nome: "Acervo", aulas: aulas(["Hermetismo Aplicado", "Textos e Decodificação", "Cabala e Árvore da Vida", "Enoque e Toth"]) },
      { nome: "Mentoria em Grupo", aulas: aulas(["Estratégia e Essência", "Vendas com Consciência", "Marca Pessoal", "Expansão"]) }
    ],
    cursos: [curso("zero", "Do Zero ao Zen e Negócios", 4, 12)],
    livros: ["Coletânea Alinhamento Financeiro", "Códigos de Origem"],
    audios: []
  }
};

let user = null;
let access = { areas: [] };
let route = { view: "portal", nivel: 1, curso: "", mod: 0, aula: 0 };

function esc(s) { return String(s || "").replace(/[&<>]/g, c => ({ "&": "&", "<": "<", ">": ">" }[c])); }
function mail() { return ((user && user.email) || "").toLowerCase(); }
function isYan() { return mail() === YAN; }
function owns(nivel) { return isYan() || access.areas.includes(AREA[nivel]); }
function faixa() { return FAIXAS[route.nivel]; }
function cursoAtual() {
  const f = faixa();
  if (route.curso === "fundamentos") return { id: "fundamentos", titulo: "Fundamentos do Despertar", modules: f.fundamentos };
  return f.cursos.find(item => item.id === route.curso) || f.cursos[0];
}
function go(next) { route = { ...route, ...next }; draw(); window.scrollTo(0, 0); }
function comprar() { location.href = "/membros/checkout.html?area=" + AREA[route.nivel]; }

function side() {
  const f = route.view === "portal" ? null : faixa();
  const items = [
    ["portal", "Início"],
    ["jornada", "Minha jornada"]
  ];
  document.getElementById("side").innerHTML = `
    <button class="${route.view === "portal" ? "on" : ""}" data-go="portal">Início</button>
    ${f ? `
      <button class="${route.view === "area" ? "on" : ""}" data-go="area">Área ${esc(f.nome)}</button>
      <button class="${route.view === "cursos" ? "on" : ""}" data-go="cursos">Cursos</button>
      <button class="${route.view === "livros" ? "on" : ""}" data-go="livros">Livros</button>
      <button class="${route.view === "audios" ? "on" : ""}" data-go="audios">Áudios</button>
      <button class="${route.curso === "fundamentos" ? "on" : ""}" data-go="fundamentos">Fundamentos</button>
    ` : `
      <button data-go="cursos" ${route.view === "portal" ? "" : ""}>Cursos</button>
      <button data-go="livros">Livros</button>
      <button data-go="audios">Áudios</button>
    `}
    <div class="user">${esc(mail() || "Visitante")}<br>${isYan() ? "Acesso a todas as faixas" : "Membro"}<br><button id="authBtn" style="margin-top:8px">${user ? "Sair" : "Entrar"}</button></div>`;
  document.getElementById("side").querySelectorAll("[data-go]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.go;
      if (id === "portal") go({ view: "portal" });
      else if (id === "area") go({ view: "area" });
      else if (id === "fundamentos") go({ view: "player", curso: "fundamentos", mod: 0, aula: 0 });
      else {
        if (route.view === "portal") route.nivel = 1;
        go({ view: id });
      }
    };
  });
  document.getElementById("authBtn").onclick = async () => {
    if (!user) { location.href = "/login/?next=/members/index.html"; return; }
    await signOut(auth);
  };
}

function portal() {
  const cards = Object.keys(FAIXAS).map(num => {
    const f = FAIXAS[num];
    const open = owns(Number(num));
    return `<button class="card" data-nivel="${num}"><img alt="" src="${f.img}"><div><strong>${esc(f.nome)}</strong><span>${esc(f.tag)}</span><span class="badge ${open ? "on" : "off"}">${open ? "LIBERADO" : "BLOQUEADO"}</span></div></button>`;
  }).join("");
  document.getElementById("app").innerHTML = `
    <p class="kicker">Portal</p>
    <h1>Bem-vindo ao Barra Members</h1>
    <p class="sub">Sua jornada começa aqui. Cada faixa abre os fundamentos, os cursos da Doutrina, os livros e os áudios. O arquivo entra depois.</p>
    <div class="grid">${cards}</div>
    <p class="note">${isYan() ? "Sua conta já entra em todas as faixas." : "A faixa bloqueada abre no checkout. Quem já pagou entra com o mesmo login."}</p>`;
  document.getElementById("app").querySelectorAll("[data-nivel]").forEach(btn => {
    btn.onclick = () => go({ view: "area", nivel: Number(btn.dataset.nivel) });
  });
}

function area() {
  const f = faixa();
  const open = owns(route.nivel);
  const aulasFund = f.fundamentos.reduce((n, m) => n + m.aulas.length, 0);
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="portal">Início</button> · ${esc(f.nome)}</p>
    <div class="hero"><img alt="" src="${f.img}"><div><p class="kicker">${esc(f.tag)}</p><h1>${esc(f.nome)}</h1><p class="sub">${esc(f.frase)}</p><p class="note">${open ? "Faixa liberada." : "Esta faixa ainda está bloqueada. Dá para ver a estrutura. O conteúdo abre depois do pagamento."}</p>${open ? "" : '<button class="buy" id="buy">Comprar esta faixa</button>'}</div></div>
    <button class="tile" id="openFund" style="width:100%;margin-bottom:12px"><b>Fundamentos do Despertar</b>${f.fundamentos.length} módulos · ${aulasFund} aulas</button>
    <div class="tiles">
      <button class="tile" data-view="cursos"><b>Cursos</b>${f.cursos.length} cursos desta faixa</button>
      <button class="tile" data-view="livros"><b>Livros</b>${f.livros.length} e-books</button>
      <button class="tile" data-view="audios"><b>Áudios</b>${f.audios.length} áudios</button>
    </div>`;
  document.querySelector("[data-back]").onclick = () => go({ view: "portal" });
  document.getElementById("openFund").onclick = () => go({ view: "player", curso: "fundamentos", mod: 0, aula: 0 });
  document.querySelectorAll("[data-view]").forEach(btn => { btn.onclick = () => go({ view: btn.dataset.view }); });
  const buy = document.getElementById("buy");
  if (buy) buy.onclick = comprar;
}

function cursos() {
  const f = faixa();
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="area">${esc(f.nome)}</button> · Cursos</p>
    <h1>Cursos</h1>
    <p class="sub">Os cursos da Doutrina deste nível. Toque para abrir módulos e aulas. O vídeo entra no quadro.</p>
    <div class="courses">${f.cursos.map(item => {
      const aulasN = item.modules.reduce((n, m) => n + m.aulas.length, 0);
      return `<button class="course" data-curso="${item.id}"><div class="play">▶</div><strong>${esc(item.titulo)}</strong><p class="sub">Módulos: ${item.modules.length} · Aulas: ${aulasN}</p></button>`;
    }).join("")}</div>`;
  document.querySelector("[data-back]").onclick = () => go({ view: "area" });
  document.querySelectorAll("[data-curso]").forEach(btn => {
    btn.onclick = () => go({ view: "player", curso: btn.dataset.curso, mod: 0, aula: 0 });
  });
}

function player() {
  const f = faixa();
  const item = cursoAtual();
  const mod = item.modules[route.mod] || item.modules[0];
  const aula = mod.aulas[route.aula] || mod.aulas[0];
  const total = item.modules.reduce((n, m) => n + m.aulas.length, 0);
  const open = owns(route.nivel);
  const ready = aula.ytId && aula.ytId !== "COLOQUE_AQUI";
  const stage = !open
    ? `<div class="stage"><div><div class="play" style="margin:0 auto 10px">🔒</div><p>Esta aula abre quando a faixa estiver paga.</p><button class="buy" id="buy">Comprar esta faixa</button></div></div>`
    : ready
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${aula.ytId}?rel=0" allowfullscreen></iframe>`
      : `<div class="stage"><div><div class="play" style="margin:0 auto 10px">▶</div><p>Vídeo em breve</p><p>O arquivo desta aula entra aqui.</p></div></div>`;
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="cursos">${esc(f.nome)}</button> · ${esc(item.titulo)}</p>
    <div class="player">
      <div class="mods">
        <p class="kicker">${esc(item.titulo)}</p>
        ${item.modules.map((m, i) => `<button class="${i === route.mod ? "on" : ""}" data-mod="${i}">${esc(m.nome)}</button>`).join("")}
        <p class="note">0 de ${total} aulas</p>
      </div>
      <div>
        <h1 style="font-size:26px">${esc(mod.nome)}</h1>
        ${stage}
        <div style="margin-top:12px">${mod.aulas.map((a, i) => `<button class="lesson" data-aula="${i}"><span>${esc(a.titulo)}</span><span>${ready && i === route.aula ? "No ar" : "Vídeo em breve"}</span></button>`).join("")}</div>
        <div class="row">
          <button class="ghost" id="prev">← Anterior</button>
          <button id="next">Próxima aula →</button>
        </div>
      </div>
    </div>`;
  const back = document.querySelector("[data-back]");
  back.onclick = () => go({ view: route.curso === "fundamentos" ? "area" : "cursos" });
  document.querySelectorAll("[data-mod]").forEach(btn => { btn.onclick = () => go({ mod: Number(btn.dataset.mod), aula: 0 }); });
  document.querySelectorAll("[data-aula]").forEach(btn => { btn.onclick = () => go({ aula: Number(btn.dataset.aula) }); });
  document.getElementById("prev").onclick = () => passo(-1);
  document.getElementById("next").onclick = () => passo(1);
  const buy = document.getElementById("buy");
  if (buy) buy.onclick = comprar;
}
function passo(dir) {
  const item = cursoAtual();
  let mod = route.mod;
  let aula = route.aula + dir;
  if (aula < 0) { mod -= 1; if (mod < 0) return; aula = item.modules[mod].aulas.length - 1; }
  if (aula >= item.modules[mod].aulas.length) { mod += 1; if (mod >= item.modules.length) return; aula = 0; }
  go({ mod, aula });
}

function livros() {
  const f = faixa();
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="area">${esc(f.nome)}</button> · Livros</p>
    <h1>Livros</h1>
    <p class="sub">E-books desta faixa. O arquivo entra em cada um.</p>
    <div class="books">${f.livros.map(nome => `<article class="book"><div class="cover">E-BOOK</div><strong>${esc(nome)}</strong><div class="row"><button data-livro="${esc(nome)}">Abrir livro</button></div></article>`).join("") || "<p class='sub'>Nenhum livro neste nível ainda.</p>"}</div>
    <p class="note" id="livroNote"></p>`;
  document.querySelector("[data-back]").onclick = () => go({ view: "area" });
  document.querySelectorAll("[data-livro]").forEach(btn => {
    btn.onclick = () => {
      if (!owns(route.nivel)) { comprar(); return; }
      document.getElementById("livroNote").textContent = btn.dataset.livro + " · o arquivo ainda não entrou.";
    };
  });
}

function audios() {
  const f = faixa();
  document.getElementById("app").innerHTML = `
    <p class="crumb"><button data-back="area">${esc(f.nome)}</button> · Áudios</p>
    <h1>Áudios</h1>
    <p class="sub">Meditações e áudios desta faixa. O arquivo entra em cada linha.</p>
    ${f.audios.map(nome => `<div class="audio"><strong>${esc(nome)}</strong><button class="buy" data-audio="${esc(nome)}">▶</button></div>`).join("") || "<p class='sub'>Nenhum áudio neste nível ainda.</p>"}
    <p class="note" id="audioNote"></p>`;
  const back = document.querySelector("[data-back]");
  if (back) back.onclick = () => go({ view: "area" });
  document.querySelectorAll("[data-audio]").forEach(btn => {
    btn.onclick = () => {
      if (!owns(route.nivel)) { comprar(); return; }
      document.getElementById("audioNote").textContent = btn.dataset.audio + " · o áudio ainda não entrou.";
    };
  });
}

function draw() {
  side();
  if (route.view === "portal") portal();
  else if (route.view === "area") area();
  else if (route.view === "cursos") cursos();
  else if (route.view === "livros") livros();
  else if (route.view === "audios") audios();
  else player();
}

onAuthStateChanged(auth, async next => {
  user = next;
  access = { areas: [] };
  try {
    const raw = JSON.parse(localStorage.getItem("akashaMembros") || "{}");
    (raw.areas || []).forEach(id => { if (!access.areas.includes(id)) access.areas.push(id); });
  } catch (e) {}
  if (user && mail()) {
    try {
      const grant = await getDoc(doc(db, "membrosAcessos", mail()));
      if (grant.exists()) (grant.data().areas || []).forEach(id => { if (!access.areas.includes(id)) access.areas.push(id); });
    } catch (e) {}
  }
  draw();
});
</script>
