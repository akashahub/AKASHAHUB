<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f3;--panel:#fff;--line:rgba(139,105,20,.28);--gold:#8b6914;--gold2:#a6842f;--text:#1c140c;--muted:#6d6256;--ok:#e7f6ee}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Josefin Sans",sans-serif;font-weight:300;min-height:100%}
button,a{font-family:inherit}a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond",serif;letter-spacing:.14em;min-width:0;font-size:20px}
.brand small{display:block;letter-spacing:.22em;font-size:10px;color:var(--gold);margin-top:3px;font-family:"Josefin Sans",sans-serif}
#authBtn{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.mid{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-align:center}
.right{font-family:"Cormorant Garamond",serif;font-size:14px;letter-spacing:.12em;text-align:right;color:var(--gold)}
.moon{position:relative;height:280px;overflow:hidden;background:#111}
.moon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block;opacity:0;transition:opacity .7s ease}
.moon img.on{opacity:1}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 360px)}
.side{border-right:1px solid var(--line);padding:18px 12px;background:#fff}
.side button,.side a.nav{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:transparent;color:var(--muted);border:0;border-radius:12px;padding:11px 12px;cursor:pointer;margin-bottom:4px}
.side button.on,.side a.nav.on{background:rgba(139,105,20,.1);color:var(--gold)}
.main{padding:22px;max-width:1100px}
.kicker{font-family:"Cormorant Garamond",serif;letter-spacing:.2em;font-size:16px;color:var(--gold);text-transform:uppercase}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:42px;margin:8px 0}
.sub{color:var(--muted);max-width:38rem;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0}
.card img{width:100%;height:120px;object-fit:cover;display:block}
.card div{padding:12px}
.card strong{display:block;font-family:"Cormorant Garamond",serif;letter-spacing:.04em;font-size:22px}
.badge{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.12em;border-radius:99px;padding:4px 8px}
.badge.on{color:#145c32;background:var(--ok)} .badge.off{color:var(--gold);border:1px solid var(--line);background:#fff}
.hero{display:grid;grid-template-columns:160px 1fr;gap:16px;border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;margin:16px 0}
.hero img{width:160px;height:160px;object-fit:cover;border-radius:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;cursor:pointer;color:inherit;text-align:left}
.tile b{display:block;font-family:"Cormorant Garamond",serif;letter-spacing:.08em;margin-bottom:6px;font-size:22px}
.courses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.course{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;cursor:pointer;color:inherit;text-align:left}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts button{font:inherit;cursor:pointer;border-radius:999px;padding:6px 10px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:12px;font-weight:600}
.play{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);margin-bottom:10px}
.player{display:grid;grid-template-columns:220px 1fr;gap:16px}
.mods button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:10px;cursor:pointer}
.mods button.on{background:rgba(139,105,20,.12);color:var(--gold)}
.stage{min-height:240px;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;padding:24px;background:#fff;color:var(--muted)}
.stage iframe{width:100%;height:min(56vw,420px);min-height:220px;border:0;border-radius:12px}
.lote{width:100%;min-height:148px;margin-top:8px;background:#fff;border:1px solid rgba(139,105,20,.35);border-radius:12px;padding:12px;color:#1c140c;font-family:inherit;font-size:14px;line-height:1.45}
.lesson{display:flex;justify-content:space-between;gap:12px;width:100%;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row button,.buy{border:0;border-radius:999px;padding:12px 16px;cursor:pointer;background:var(--gold);color:#fff;font-weight:600}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.book{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.book .cover{height:140px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-family:"Cormorant Garamond",serif;letter-spacing:.12em;margin-bottom:10px;background:#f7f1e4}
.book img.capa{width:100%;height:240px;object-fit:cover;object-position:center 20%;border-radius:12px;margin-bottom:10px;display:block;background:#120f0c}
.course img.capa{width:100%;height:auto;object-fit:contain;border-radius:12px;margin-bottom:8px;display:block;background:#120f0c}
@media(min-width:801px){
  .books{gap:22px}
  .book img.capa,.book .cover{height:auto;aspect-ratio:2/3;min-height:520px;object-fit:contain;object-position:center}
}
.audio{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.crumb{color:var(--muted);font-size:13px;margin-bottom:8px}
.crumb button{background:none;border:0;color:var(--gold);cursor:pointer;padding:0}
.user{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
input,label{color:var(--text)}
#grantBoxes label{display:block;margin:6px 0;color:var(--text)}
@media(max-width:800px){
  .mid,.right,.brand small{display:none}
  .brand{font-size:16px}
  .moon{height:180px}
  .shell{grid-template-columns:1fr}
  .side{display:flex;gap:6px;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side button,.side a.nav{width:auto;white-space:nowrap}
  .grid,.tiles,.courses,.books,.player,.hero{grid-template-columns:1fr}
  .hero img{width:100%;height:180px}
  h1{font-size:32px}
}
</style>
