<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes · Akasha Hub</title>
<style>:root{--bg:#0f0e0c;--card:#1a1815;--line:#2c2924;--tx:#f1ece2;--mu:#9d9688;--gold:#c9a45c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}main{max-width:980px;margin:0 auto;padding:20px 16px 80px}h1{font-size:22px;margin:0 0 4px}.mu{color:var(--mu);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.g{grid-template-columns:1fr}}.f{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}label{font-size:12px;color:var(--mu)}input,select,textarea{background:#0f0e0c;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;width:100%}textarea{min-height:64px}.b{background:var(--gold);color:#16130d;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}.b.l{background:transparent;color:var(--tx);border:1px solid var(--line)}.b.r{color:#e58;border-color:#5a2a3a;background:transparent}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{display:inline-flex;gap:6px;background:#26231d;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;margin:2px}.chip i{cursor:pointer;font-style:normal;color:var(--gold)}.st{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:1px 8px;margin-left:6px}small{display:block;color:var(--mu);margin-top:3px}</style></head><body><main>
<h1>Painel de clientes</h1><p class="mu">Fica salvo neste navegador (chave akasha-clientes-v1). Use Exportar para backup. Acessos e tempo na plataforma são anotados à mão por enquanto.</p>
<div class="card"><div class="g">
<div class="f"><label>Nome</label><input id="cName"></div><div class="f"><label>Negócio</label><input id="cBiz"></div>
<div class="f"><label>Situação</label><select id="cStatus"><option>Lead qualificado</option><option>Call de alinhamento feita</option><option>Leitura de essência feita</option><option>Em fechamento</option><option>Cliente ativo</option><option>Cliente concluído</option><option>Elegível para Legado</option><option>Legado em andamento</option></select></div>
<div class="f"><label>Fase do Arquitetura de Legado</label><select id="cPhase"><option>Não está</option><option>1 Essência</option><option>2 Império Digital</option><option>3 Alinhamento Financeiro</option><option>4 Expansão</option><option>5 Legado</option></select></div>
<div class="f full"><label>Call de alinhamento (resumo)</label><textarea id="cAlign"></textarea></div>
<div class="f full"><label>Leitura de essência (resumo)</label><textarea id="cEssence"></textarea></div>
<div class="f full"><label>Projeto dela e o que ela me passou</label><textarea id="cProject"></textarea></div>
<div class="f"><label>Pronto</label><textarea id="cDone"></textarea></div><div class="f"><label>Em processo</label><textarea id="cDoing"></textarea></div><div class="f full"><label>Vamos fazer</label><textarea id="cNext"></textarea></div>
<div class="f full"><label>Acessos na plataforma (o que viu, quanto tempo)</label><input id="cAccess"></div>
<div class="f full"><label>Serviços contratados (catálogo mestre: digite e Enter)</label><input id="svc" list="svcList" placeholder="ex.: Sites institucionais, empresariais e pessoais"><datalist id="svcList"></datalist><div id="chips"></div></div>
</div><div class="row"><button class="b" onclick="save()">Salvar cliente</button><button class="b l" onclick="clr()">Limpar</button><button class="b l" onclick="exp()">Exportar</button><label class="b l" style="color:var(--tx)">Importar<input type="file" accept=".json" hidden onchange="imp(event)"></label></div></div>
<div class="f" style="max-width:320px"><label>Buscar cliente</label><input id="q" oninput="render()"></div><div id="list"></div></main>
<script>
const CAT=[{"id":"essencia","name":"01 · Arquitetura de Essência","summary":"Identidade, trajetória, autoconhecimento, capacidades e direção.","groups":[["Investigação e diagnóstico pessoal",["Leitura de trajetória pessoal e profissional","Mapeamento de história de vida, talentos, competências e experiências","Mapeamento de valores, princípios, interesses e aptidões","Investigação de objetivos, aspirações e oportunidades","Mapeamento de habilidades comercializáveis","Construção de visão de futuro e dossiê de essência"]],["Identidade e posicionamento pessoal",["Identidade profissional e perfil executivo","Posicionamento de empresários, especialistas e profissionais liberais","Construção de autoridade e narrativa pessoal","Biografia estratégica, currículo e portfólio","Apresentações pessoais e comunicação de competências"]],["Comportamento e desenvolvimento humano",["Mapeamento de crenças, hábitos e padrões de decisão","Investigação de padrões familiares e relação com dinheiro","Autoconhecimento, meditação e visualização orientada","Presença, disciplina, consistência e liderança pessoal","Integração entre vida pessoal e profissional"]]]},{"id":"branding","name":"02 · Branding, Imagem e Comunicação","summary":"Transformar identidade em representação visual e comunicação reconhecível.","groups":[["Identidade visual",["Criação e redesign de logotipos e símbolos","Manual de identidade, paleta, tipografia e direção de arte","Identidade de produtos, campanhas, eventos e projetos","Aplicações institucionais e sistemas gráficos"]],["Imagem e fotografia",["Retratos profissionais e fotografia corporativa","Fotografia de produtos e imagens institucionais","Imagens para perfis, redes sociais, sites e campanhas","Tratamento, edição, restauração e composição visual","Criação de imagens com IA, avatares e bancos personalizados","Direção de ensaios e padronização de imagens de equipe"]],["Comunicação e audiovisual",["Proposta de valor, narrativa, storytelling e tom de voz","Manifestos, pitch, textos comerciais e páginas de venda","Roteiros, vídeos institucionais, publicitários e educativos","Reels, Shorts, mini documentários, animação e motion graphics","Edição, legendagem, tradução, locução e direção audiovisual","Apresentações, e-books, catálogos, relatórios e infográficos"]]]},{"id":"tecnologia","name":"03 · Império Digital e Tecnologia","summary":"Construir infraestrutura digital, produtos, sistemas e plataformas.","groups":[["Desenvolvimento web",["Sites institucionais, empresariais e pessoais","Portfólios, landing pages, páginas de venda e captura","Sites multilíngues, blogs, portais, diretórios e catálogos","Lojas virtuais, sites de agendamento e sites profissionais"]],["Aplicativos e plataformas",["Aplicativos web e sistemas de gestão","Plataformas educacionais, áreas de membros e assinaturas","Bibliotecas digitais, portais de clientes e comunidades","Sistemas de atendimento, reservas, projetos e acompanhamento","Marketplaces, afiliados, comércio e produtos SaaS"]],["Engenharia e infraestrutura",["Arquitetura de sistemas, front-end e back-end","APIs, bancos de dados, autenticação e controle de acesso","Painéis administrativos, pagamentos e integrações","Firebase, Supabase, hospedagem, DNS, SSL e e-mail profissional","GitHub, deploy, backups, segurança, monitoramento e documentação","Otimização, responsividade, manutenção, migração e auditoria técnica"]],["Comércio digital",["Catálogos, pedidos, checkout e pagamentos","Gestão de produtos, assinaturas e fidelidade","Integração com WhatsApp, fornecedores e distribuição"]]]},{"id":"financeiro","name":"04 · Alinhamento Financeiro","summary":"Educação financeira, comportamento, gestão, mercados e construção patrimonial.","groups":[["Comportamento e fundamentos",["Crenças financeiras, história familiar e relação com riqueza","Comportamento de consumo, disciplina e tomada de decisão","Medo de cobrar, vender e negociar; valor percebido","Fundamentos do dinheiro, inflação, juros simples e compostos"]],["Organização financeira pessoal e familiar",["Diagnóstico, receitas, despesas e orçamento","Controle de gastos, contas e planejamento mensal/anual","Gestão de dívidas, reserva, metas e grandes aquisições","Educação financeira para crianças, adolescentes e famílias"]],["Gestão financeira empresarial",["Fluxo de caixa, contas a pagar e receber","Capital de giro, projeção de caixa e inadimplência","Orçamento, custos fixos e variáveis e indicadores","Planejamento de receitas, despesas, expansão e sustentabilidade"]],["Precificação, receita e rentabilidade",["Formação de preços, custos e margem de contribuição","Margem de lucro, ponto de equilíbrio e rentabilidade","Precificação de produtos, serviços, pacotes e recorrência","Negociação, cobrança e desenvolvimento de fontes de receita"]],["Economia, mercados e investimentos",["Economia brasileira e internacional, política monetária e fiscal","Câmbio, geopolítica econômica e ciclos de mercado","Renda fixa, Tesouro Direto, CDB, fundos e fundos imobiliários","Ações, ETFs, dividendos e fundamentos de bolsa","Criptoativos, volatilidade, liquidez, diversificação e risco","Perfil de risco, horizonte e educação sobre investimentos"]],["Inteligência empresarial e patrimônio",["Leitura de balanços, EBITDA, endividamento e geração de caixa","Valuation introdutório, modelos de negócio e viabilidade","Análise de oportunidades, aquisições e cenários","Mapeamento de ativos e passivos e planejamento de longo prazo","Educação sobre holdings, governança e sucessão"]],["Ferramentas e laboratórios",["Cashflow e controle de despesas","Simuladores de juros compostos, metas e investimentos","Calculadora de precificação e planejador financeiro","Diário financeiro, mapa patrimonial e painéis de indicadores"]]]},{"id":"marketing","name":"05 · Marketing, Publicidade e Aquisição","summary":"Posicionamento, conteúdo, campanhas, distribuição e captação.","groups":[["Estratégia de marketing",["Diagnóstico, pesquisa de público e segmentação","Análise de mercado, concorrentes e jornada do cliente","Proposta de valor, calendário editorial e estratégia de lançamento"]],["Redes sociais e conteúdo",["Criação e estruturação de perfis e biografias","Instagram, TikTok, YouTube e LinkedIn","Calendários, Reels, carrosséis, Stories e Shorts","Conteúdo institucional, educativo, comercial e comunidades"]],["Publicidade e anúncios",["Criação de peças, imagens, vídeos e copy de anúncios","Meta Ads, Google Ads, YouTube Ads e TikTok Ads","Estrutura de campanhas, públicos, testes A/B e remarketing","Análise de desempenho, otimização e relatórios"]],["Aquisição e presença digital",["Landing pages, formulários, iscas digitais e funis","Captação, nutrição, automação e reativação de leads","SEO técnico, local, palavras-chave e otimização de páginas","Google Business Profile, autoridade e monitoramento de tráfego"]]]},{"id":"comercial","name":"06 · Comercial, Vendas e Negócios","summary":"Organizar ofertas, relacionamento, prospecção, negociação e receita.","groups":[["Estrutura comercial",["Diagnóstico comercial e organização de ofertas","Proposta de valor, pacotes, recorrência e políticas comerciais","Jornada de compra e estruturação de atendimento"]],["SDR e prospecção",["Definição de cliente ideal e mapeamento de oportunidades","Prospecção ativa e passiva e pesquisa de empresas","Scripts, mensagens, qualificação, follow-up e agendamento","Pipeline, CRM e registro de oportunidades"]],["Negociação e fechamento",["Roteiros de reunião, apresentações e propostas","Negociação, tratamento de objeções e fechamento","Pós-venda, retenção, indicação e expansão de contas"]],["Equipes e documentação",["Formação de SDRs, closers e atendimento","Roleplay, simulações, avaliação e indicadores","Escopos, briefings, propostas, onboarding e pós-venda","Modelos contratuais sujeitos à revisão jurídica"]]]},{"id":"internacional","name":"07 · Estruturação Empresarial e Internacional","summary":"Organizar negócios, organizações e operações em diferentes mercados.","groups":[["Estruturação de negócios e organizações",["Modelos de negócio, planejamento e estudos de viabilidade","Departamentos, funções, responsabilidades e processos","Planejamento de implantação, operação e expansão","Governança, documentação e gestão organizacional"]],["Internacionalização",["Pesquisa de mercados estrangeiros e oportunidades","Posicionamento, sites multilíngues e comunicação internacional","Localização de conteúdo e adaptação cultural","Pesquisa de fornecedores, parceiros e canais de distribuição","Plano de entrada em novos países e atendimento internacional"]],["Parcerias e desenvolvimento",["Mapeamento de parceiros, investidores e oportunidades","Apresentações institucionais e propostas de colaboração","Alianças estratégicas, programas de parceiros e reuniões"]]]},{"id":"automacao","name":"08 · Gestão, Automação e Inteligência Artificial","summary":"Conectar sistemas, automatizar rotinas e ampliar inteligência operacional.","groups":[["Gestão operacional",["Mapeamento de processos e fluxogramas","Rotinas, procedimentos, tarefas e projetos","Prazos, indicadores, relatórios e gestão de equipes"]],["Automação e integração",["Formulários, e-mails, atendimento e agendamentos","Vendas, pagamentos, relatórios e notificações","Integração de plataformas, sincronização e onboarding"]],["Inteligência artificial",["Assistentes personalizados e agentes de IA","Agentes comerciais, atendimento, pesquisa e conteúdo","Assistentes administrativos e financeiros educacionais","Bases de conhecimento, RAG e análise documental"]],["Produtividade",["Sistemas de gestão pessoal e painéis de produtividade","Gestão de ideias, prioridades, reuniões e conhecimento","Mapas de rede, teleprompters e acompanhamento"]]]},{"id":"educacao","name":"09 · Educação, Conhecimento e Propriedade Intelectual","summary":"Transformar conhecimento em métodos, materiais e ativos intelectuais.","groups":[["Estruturação educacional",["Cursos, módulos, trilhas e planejamento pedagógico","Aulas, apostilas, exercícios, questionários e avaliações","Certificados, treinamentos empresariais e capacitação"]],["Publicações e métodos",["Livros, e-books, manuais, guias e relatórios","Extração e documentação de conhecimento tácito","Frameworks, metodologias, processos autorais e nomenclaturas","Preparação documental para proteção de direitos e marcas"]],["Produtos de conhecimento",["Cursos online, bibliotecas e assinaturas","Comunidades, mentorias, programas e plataformas Academy","Laboratórios, simuladores e jogos educacionais","Palestras, workshops, seminários, podcasts e eventos"]]]},{"id":"legado","name":"10 · Expansão Patrimonial e Legado","summary":"Preparar estruturas para crescer, preservar valor e continuar.","groups":[["Estratégia patrimonial",["Mapeamento de ativos e passivos","Planejamento de aquisição e diversificação","Educação sobre preservação de capital e cenários","Organização documental e planejamento de longo prazo"]],["Expansão empresarial",["Novos mercados, produtos, unidades e marcas","Parcerias, canais de distribuição e crescimento","Estudos de aquisição e preparação para venda de empresas"]],["Governança e continuidade",["Governança, responsabilidades e formação de lideranças","Planejamento sucessório e preparação para delegação","Documentação de processos, cultura e conhecimento institucional","Proteção de propriedade intelectual e indicadores de continuidade"]],["Movimento e comunidade",["Manifestos, princípios, causas e movimentos","Comunidades, redes de colaboração e participação","Eventos, encontros e formação de lideranças"]]]}];const $=i=>document.getElementById(i);const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dep={};CAT.forEach(d=>d.groups.forEach(g=>g[1].forEach(x=>dep[x]=d.name)));
$('svcList').innerHTML=Object.keys(dep).map(x=>'<option value="'+esc(x)+'">').join('');
const F=['cName','cBiz','cStatus','cPhase','cAlign','cEssence','cProject','cDone','cDoing','cNext','cAccess'],K='akasha-clientes-v1';
let CL=[],ed=-1,bought=[];try{CL=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
const store=()=>{try{localStorage.setItem(K,JSON.stringify(CL))}catch(e){}};
function chips(){$('chips').innerHTML=bought.map((x,i)=>'<span class="chip">'+esc(x)+' <i onclick="rm('+i+')">×</i></span>').join('')}
function rm(i){bought.splice(i,1);chips()}
$('svc').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){bought.push(e.target.value.trim());e.target.value='';chips()}});
$('svc').addEventListener('change',e=>{const v=e.target.value.trim();if(v&&dep[v]&&!bought.includes(v)){bought.push(v);e.target.value='';chips()}});
function clr(){F.forEach(f=>{const e=$(f);e.value=e.tagName==='SELECT'?e.options[0].value:''});bought=[];chips();ed=-1}
function save(){const o={};F.forEach(f=>o[f]=$(f).value.trim());o.bought=bought.slice();if(!o.cName){alert('Informe o nome');return}if(ed>=0)CL[ed]=o;else CL.push(o);store();clr();render()}
function edit(i){const o=CL[i];F.forEach(f=>$(f).value=o[f]||'');bought=(o.bought||[]).slice();chips();ed=i;scrollTo({top:0,behavior:'smooth'})}
function del(i){if(confirm('Excluir este cliente?')){CL.splice(i,1);store();render()}}
function render(){const q=$('q').value.toLowerCase();const L=(t,v)=>v?'<small><b>'+t+':</b> '+esc(v)+'</small>':'';const h=CL.map((o,i)=>{if(q&&!(o.cName+o.cBiz).toLowerCase().includes(q))return'';const used=new Set((o.bought||[]).map(x=>dep[x]).filter(Boolean));const open=CAT.filter(d=>!used.has(d.name)).map(d=>d.name.replace(/^\d+ · /,''));const falta=[!o.cAlign&&'call de alinhamento',!o.cEssence&&'leitura de essência'].filter(Boolean);return'<div class="card"><b>'+esc(o.cName)+'</b> · '+esc(o.cBiz)+'<span class="st">'+esc(o.cStatus)+'</span><span class="st">'+esc(o.cPhase)+'</span>'+L('Contratou',(o.bought||[]).join('; '))+L('Pronto',o.cDone)+L('Em processo',o.cDoing)+L('Vamos fazer',o.cNext)+L('Projeto',o.cProject)+L('Acessos',o.cAccess)+'<small><b>Call de fechamento:</b> '+(falta.length?'falta '+falta.join(' e '):'pronta')+'</small>'+L('Departamentos ainda não trabalhados',open.join(' · '))+'<div class="row"><button class="b l" onclick="edit('+i+')">Editar</button><button class="b r" onclick="del('+i+')">Excluir</button></div></div>'}).join('');$('list').innerHTML=h||'<p class="mu">Nenhum cliente.</p>'}
function exp(){const b=new Blob([JSON.stringify(CL,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='akasha-clientes.json';a.click()}
function imp(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);CL=Array.isArray(d)?d:d.clientes||[];store();render()}catch(e){alert('Arquivo inválido')}};r.readAsText(f)}
render();
</script></body></html>
