<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FESTI</title>
<meta name="theme-color" content="#07060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#07060c; --surface:#14121c; --raised:#1e1a2a; --fg:#f6f3fb; --muted:#a79fb8; --faint:#726b84; --line:#2c2738; --magenta:#ff2f9b; --cyan:#3ee0ff; --ok:#3dd68c; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:Manrope,system-ui,sans-serif; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
img { display:block; max-width:100%; }
#app { min-height:100dvh; }
.mark { font-family:Syne,sans-serif; font-weight:800; letter-spacing:-.03em; font-size:22px; }
.mark i { color:var(--magenta); font-style:normal; }
.h { font-family:Syne,sans-serif; font-weight:800; letter-spacing:-.03em; margin:0; line-height:1; }
.wrap { max-width:960px; margin:0 auto; padding:24px 20px 40px; }
.muted { color:var(--muted); }
.mag { color:var(--magenta); }
.grid3 { display:grid; gap:16px; }
@media (min-width:800px) { .grid3 { grid-template-columns:1fr 1fr 1fr; } .mgr { display:grid; grid-template-columns:220px 1fr; min-height:100dvh; } .side { display:flex !important; } .mnav { display:none !important; } }
.card { background:var(--surface); border:1px solid var(--line); border-radius:24px; overflow:hidden; text-align:left; width:100%; }
.pad { padding:16px; }
.chip { height:40px; border-radius:999px; padding:0 14px; background:var(--raised); color:var(--muted); font-weight:700; }
.chip.on { background:var(--fg); color:var(--bg); }
.btn { height:48px; border-radius:999px; background:var(--magenta); color:#1a0610; font-weight:800; padding:0 16px; }
.btn.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
.btn.line { background:transparent; }
.photo { width:100%; object-fit:cover; }
.row { display:flex; align-items:center; gap:10px; }
.between { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.stack { display:flex; flex-direction:column; gap:12px; }
.nav5 { display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); background:var(--surface); }
.nav5 button { padding:10px 0 12px; color:var(--faint); font-size:11px; font-weight:700; }
.nav5 button.on { color:var(--magenta); }
.phone { max-width:430px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
.side { display:none; flex-direction:column; border-right:1px solid var(--line); padding:16px; }
.side button { text-align:left; height:44px; border-radius:16px; padding:0 12px; color:var(--muted); font-weight:700; }
.side button.on { background:var(--fg); color:var(--bg); }
.pill { height:36px; border-radius:999px; padding:0 12px; background:var(--raised); color:var(--muted); font-weight:700; font-size:14px; }
.pill.on { background:var(--cyan); color:#1a0610; }
.toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--fg); color:var(--bg); border-radius:999px; padding:12px 16px; font-weight:700; z-index:5; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
const pts = (n) => n.toLocaleString("pt-BR");
let S = {
  world: "gate", tab: "home", mgr: "painel", story: 0, mode: "historia", open: "supabase", pin: "cabine", toast: "",
  points: 6200, cashback: 115, approved: 18, rejected: 4,
  checks: [
    { id:"portao", name:"Portão Norte", done:true },
    { id:"praca", name:"Praça das luzes", done:true },
    { id:"dj", name:"Cabine do DJ", done:false },
    { id:"sunset", name:"Palco Sunset", done:false },
    { id:"after", name:"After lounge", done:false }
  ],
  passes: [
    { id:"marina", name:"Marina Costa", handle:"marina.noite", role:"membro", avatar:"media/avatar-f.jpg", rooms:{ main:true, back:false, vip:true }, blocked:false },
    { id:"julia", name:"Julia Ribeiro", handle:"julia.beats", role:"equipe", avatar:"media/avatar-f.jpg", rooms:{ main:true, back:true, vip:true }, blocked:false },
    { id:"marcelo", name:"Marcelo Viana", handle:"marcelo.vibes", role:"artista", avatar:"media/avatar-m.jpg", rooms:{ main:true, back:true, vip:false }, blocked:false },
    { id:"leo", name:"Leo Martins", handle:"leo.night", role:"membro", avatar:"media/avatar-m.jpg", rooms:{ main:true, back:false, vip:false }, blocked:false }
  ],
  queue: [
    { id:"q1", handle:"ana.pico", text:"Cabine liberada. Quem chega no QR agora?", image:"media/dj.jpg" },
    { id:"q2", handle:"leo.night", text:"Sunset começando. A luz mudou de lado.", image:"media/crowd.jpg" }
  ],
  posts: [
    { id:"p1", handle:"julia.beats", text:"A FESTI é outro nível. A pista inteira no mesmo pulso.", image:"media/selfie.jpg", likes:842 }
  ]
};
const me = () => S.passes.find((p) => p.id === "marina");
const flash = (t) => { S.toast = t; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.toast = ""; render(); }, 2200); };
const chapters = [
  ["media/crowd.jpg","1 · A festa","Uma casa. Muita gente.","A FESTI é a festa inteira num só lugar: palco, praça, lounge e a fila da porta."],
  ["media/selfie.jpg","2 · A pulseira","Cada pessoa tem um nome.","A pulseira é o perfil. Com ela a pessoa entra, marca ponto e abre só o que é dela."],
  ["media/aerial.jpg","3 · O caminho","Andar vira carimbo.","O mapa tem pontos. Chegou no ponto, leu o QR. O carimbo fica na pulseira."],
  ["media/drinks.jpg","4 · O prêmio","Carimbo vira presente.","Ponto troca por drink, mesa ou cashback. A pessoa vê o saldo. A casa vê o resgate."],
  ["media/dj.jpg","5 · Duas portas","Quem dança não vê a mesa.","O membro vê a noite. A gestão vê acessos, fila e números. Uma não entra na tela da outra."]
];
const plugins = [
  ["supabase","Supabase","O caderno","Escreve quem entrou, quantos pontos e qual sala está aberta.","Cria uma lista de pulseiras. O app só lê e escreve nessa lista."],
  ["firebase","Firebase","O sino","Quando alguém valida o QR, o sino toca na mesa da gestão na mesma hora.","Liga um aviso. A fila e o mapa mudam sem a pessoa atualizar a página."],
  ["github","GitHub","A gaveta","Guarda o desenho do app. Se errar, volta para a versão de antes.","Cada mudança fica anotada. A equipe vê o que mudou e quem mudou."],
  ["vercel","Vercel","A porta da rua","É o endereço que a pessoa abre no celular.","A gaveta publica sozinha. O app fica no ar sem montar um servidor na mão."],
  ["cloudflare","Cloudflare","O segurança","Deixa a fila andar rápido e segura quem tenta atrapalhar.","Fica na frente do endereço. A página chega perto de quem está olhando."],
  ["bunny","Bunny","O correio das fotos","A foto do palco sai da festa e chega rápido no celular.","Fotos e vídeos ficam numa rede de entrega. A página em si continua na porta da rua."]
];
const steps = ["Abre o caderno e cria a lista de pulseiras.","Liga o sino para a validação aparecer na hora.","Guarda o app na gaveta e abre a porta da rua.","Manda as fotos pelo correio e põe o segurança na calçada."];
const loop = ["Abre o mapa e escolhe o ponto.","Lê o QR daquele ponto.","Grava um vídeo curto, ou encosta o QR de outra pessoa.","A gestão aprova. Se for regra automática, já entra.","Caem os pontos, o cashback e a prova no perfil."];
const film = ["Celular em pé.","De 5 a 8 segundos.","O ponto do mapa aparece no fundo.","Uma ideia por vídeo. Sem tapar o rosto nem o som."];
const mapPins = [
  ["porta","Porta","Entrada","media/crowd.jpg","QR do perfil","Cada pessoa tem o próprio QR. Na porta ela mostra. A equipe lê. O nome entra na casa.","Um QR por pulseira, guardado no caderno. A leitura marca: entrou.","Check-in e os primeiros pontos da noite."],
  ["praca","Praça","Centro","media/aerial.jpg","Conexão presencial","Duas pessoas leem o QR uma da outra. Os perfis ficam ligados: se encontraram aqui. Quem conecta mais sobe no ranking.","A leitura dos dois cria uma linha entre os perfis. A linha só nasce se os dois estiverem no mesmo ponto.","Pontos por conexão. No fim, prêmio e cashback para usar na festa ou na plataforma."],
  ["cabine","Cabine","Palco principal","media/dj.jpg","Vídeo da energia","A pessoa abre o ponto, vê o QR e grava a pista. Se a gestão aprovar, o vídeo vai para o feed e os pontos caem.","O vídeo entra na fila da mesa. Aprovar publica. Recusar fica só com a equipe.","+1.000 pontos quando aprovado."],
  ["bar","Bar","Balcão","media/drinks.jpg","Divulgar uma bebida","O QR fica no balcão, ao lado da dose. A pessoa mostra o copo e grava poucos segundos.","O ponto do mapa é o produto. Troca o texto e a foto. O resto do caminho é o mesmo.","A dose, ou cashback para gastar naquele bar."],
  ["atracao","Atração","Pelo mapa","media/selfie.jpg","Produto, brinde ou entrevista","Qualquer atração ganha um pino: foto, brinde, marca ou uma pergunta de 10 segundos.","Não cria um app novo. Cria outro pino no mesmo mapa, com a regra daquele prêmio.","Pontos, brinde ou o nome no crédito da casa."],
  ["palco","Palco","Lives","media/crowd.jpg","Sala oficial da equipe","A equipe de audiovisual grava a sala de verdade. O membro assiste e pode mandar um clipe para entrar na transmissão.","A sala oficial é da equipe. O clipe do membro usa a mesma fila. Aprovado, entra na live.","Pontos e aparição na sala da casa."],
  ["after","After","Fidelidade","media/vip.jpg","Promoção e volta","Quem fechou o mapa vê a oferta da noite. O cashback fica no perfil para usar agora ou depois.","A regra é simples: fez os carimbos, o prêmio abre. O saldo não some no fim da pista.","Cashback na plataforma e benefício da casa."],
  ["sala","Sua sala","Depois dos pontos","media/aerial.jpg","Abrir a própria sala","O perfil junta o mínimo de pontos no mapa e o botão de criar sala acende sozinho. A equipe de audiovisual pode gravar essa sala também.","Uma trava de pontos. Passou, a sala nasce já aprovada. Antes disso, o botão fica fechado.","A sala no ar e pontos de quem recebe gente."]
];

function gate() {
  const doors = [
    ["story","media/crowd.jpg","Para entender","Apresentação","A história da festa em poucas telas. E o manual de como ligar as peças."],
    ["member","media/selfie.jpg","Quem está na pista","Membro","Mapa, pontos, salas e prêmios. A mesa da casa não aparece aqui."],
    ["manager","media/aerial.jpg","Quem manda na casa","Gestão","Painel interno, acessos, fila e números. Só a equipe entra."]
  ];
  return `<div class="wrap"><div class="mark">FEST<i>I</i></div>
    <h1 class="h" style="font-size:44px;max-width:16ch;margin-top:28px">Três portas. Cada pessoa entra na sua.</h1>
    <p class="muted" style="max-width:42ch;line-height:1.5">O membro vive a noite. A gestão controla quem entra. A apresentação explica as duas, sem misturar.</p>
    <div class="grid3" style="margin-top:24px">${doors.map((d) => `<button class="card" data-act="world" data-id="${d[0]}"><img class="photo" style="height:160px" src="${d[1]}" alt=""><div class="pad"><div class="mag" style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">${d[2]}</div><h2 class="h" style="font-size:28px;margin-top:6px">${d[3]}</h2><p class="muted">${d[4]}</p></div></button>`).join("")}</div></div>`;
}

function ideias() {
  const pin = mapPins.find((p) => p[0] === S.pin) || mapPins[2];
  const top = `<div class="between"><button class="chip" data-act="world" data-id="gate">Portas</button><div class="row">${["historia","História","ideias","Ideias","manual","Manual"].reduce((html, item, i, arr) => i % 2 ? html : html + `<button class="chip ${S.mode===item?"on":""}" data-act="mode" data-id="${item}">${arr[i+1]}</button>`, "")}</div></div>`;
  return `<div class="wrap stack">${top}
    <p class="mag" style="font-size:12px;font-weight:800;letter-spacing:.08em">BIBLIOTECA DO MAPA</p>
    <h1 class="h" style="font-size:40px">Um ponto. Uma brincadeira.</h1>
    <p class="muted">O mapa manda. Cada pino é uma ideia pronta. A pessoa abre, lê o QR e faz o que a tela pede.</p>
    ${loop.map((s,i) => `<div class="card pad row" style="align-items:flex-start"><b class="mag">${i+1}</b><span>${s}</span></div>`).join("")}
    <div class="row" style="overflow:auto">${mapPins.map((p) => `<button class="chip ${S.pin===p[0]?"on":""}" data-act="pin" data-id="${p[0]}">${p[1]}</button>`).join("")}</div>
    <img class="photo" style="height:160px;border-radius:24px" src="${pin[3]}" alt="">
    <p class="mag" style="font-size:12px;font-weight:800;letter-spacing:.08em">${pin[2].toUpperCase()}</p>
    <article class="card pad"><h2 class="h" style="font-size:26px">${pin[4]}</h2>
      <p><b class="mag">Na prática. </b>${pin[5]}</p>
      <p class="muted"><b style="color:var(--fg)">Como liga. </b>${pin[6]}</p>
      <p><b style="color:var(--cyan)">Ganha. </b>${pin[7]}</p>
    </article>
    <section class="card pad"><h2 class="h" style="font-size:22px">Como gravar</h2><div class="grid3" style="grid-template-columns:1fr 1fr;margin-top:10px">${film.map((r) => `<div class="pad" style="background:var(--raised);border-radius:16px">${r}</div>`).join("")}</div><p class="muted">Entrevista, propaganda e live usam a mesma regra. Muda o ponto. Não muda o caminho.</p></section>
  </div>`;
}

function story() {
  const c = chapters[S.story];
  const top = `<div class="between"><button class="chip" data-act="world" data-id="gate">Portas</button><div class="row"><button class="chip ${S.mode==="historia"?"on":""}" data-act="mode" data-id="historia">História</button><button class="chip ${S.mode==="ideias"?"on":""}" data-act="mode" data-id="ideias">Ideias</button><button class="chip ${S.mode==="manual"?"on":""}" data-act="mode" data-id="manual">Manual</button></div></div>`;
  if (S.mode === "ideias") return ideias();
  if (S.mode === "manual") {
    return `<div class="wrap stack">${top}
      <p class="mag" style="font-size:12px;font-weight:800;letter-spacing:.08em">MANUAL CENTRAL</p>
      <h1 class="h" style="font-size:40px">Poucas peças. Cada uma faz uma coisa.</h1>
      <p class="muted">Não inventa um sistema novo. Junta o que já existe: caderno, sino, gaveta, porta, segurança e correio.</p>
      <div class="grid3" style="grid-template-columns:1fr 1fr">${steps.map((s,i) => `<div class="card pad row" style="align-items:flex-start"><b class="mag">${i+1}</b><span>${s}</span></div>`).join("")}</div>
      ${plugins.map((p) => `<button class="card pad" data-act="plug" data-id="${p[0]}" style="text-align:left"><div class="between"><b class="h" style="font-size:22px">${p[1]}</b><span class="mag">${p[2]}</span></div><p class="muted">${p[3]}</p>${S.open===p[0]?`<p>${p[4]}</p>`:""}</button>`).join("")}
      <div class="row"><button class="btn" data-act="world" data-id="member">Ver como o membro vê</button><button class="btn ghost" data-act="world" data-id="manager">Ver a mesa da gestão</button></div>
    </div>`;
  }
  return `<div class="wrap" style="display:flex;flex-direction:column;min-height:100dvh">${top}
    <img class="photo" style="height:280px;border-radius:24px;margin-top:16px" src="${c[0]}" alt="">
    <p class="mag" style="font-weight:800;letter-spacing:.08em;font-size:12px">${c[1].toUpperCase()}</p>
    <h1 class="h" style="font-size:42px">${c[2]}</h1>
    <p class="muted" style="font-size:18px;line-height:1.5">${c[3]}</p>
    <div class="between" style="margin-top:auto;padding-top:24px">
      <button class="chip" data-act="story" data-id="prev" ${S.story===0?"disabled":""}>Anterior</button>
      <span class="muted">${S.story+1} / ${chapters.length}</span>
      ${S.story<chapters.length-1?`<button class="btn" data-act="story" data-id="next">Próxima</button>`:`<button class="btn" data-act="mode" data-id="ideias">Ver as ideias</button>`}
    </div></div>`;
}

function member() {
  const marina = me();
  const done = S.checks.filter((c) => c.done).length;
  let body = "";
  if (S.tab === "home") body = `<div class="stack"><img class="photo" style="height:180px;border-radius:24px" src="media/aerial.jpg" alt="Mapa da festa"><div class="card pad"><div class="mag" style="font-size:12px;font-weight:800">MISSÃO ATUAL</div><h2 class="h" style="font-size:22px;margin-top:8px">${done===5?"Noite completa":"Próximo carimbo no mapa"}</h2><p class="muted">${done} de 5 pontos. Saldo ${pts(S.points)}.</p><button class="btn" data-act="qr" style="width:100%;margin-top:8px">Validar com QR</button></div><div class="card pad"><b>Feed</b>${S.posts.map((p) => `<p>@${esc(p.handle)} · ${esc(p.text)}</p>`).join("")}</div></div>`;
  else if (S.tab === "rooms") {
    const rooms = [["main","Palco principal","media/dj.jpg"],["back","Bastidores","media/aerial.jpg"],["vip","Lounge VIP","media/vip.jpg"]];
    body = `<div class="stack">${rooms.map((r) => {
      const closed = marina.blocked || !marina.rooms[r[0]] || (r[0]==="back" && !S.checks.find((c)=>c.id==="dj").done);
      return `<button class="card" data-act="room" data-id="${r[0]}"><img class="photo" style="height:120px" src="${r[1]===rooms[0][1]?r[2]:r[2]}" alt=""><div class="pad"><b>${r[1]}</b><div class="muted">${closed?"Fechada para o seu perfil":"Aberta"}</div></div></button>`;
    }).join("")}</div>`;
  }
  else if (S.tab === "rewards") body = `<div class="card pad"><div class="muted">Pontos</div><div class="h mag" style="font-size:32px">${pts(S.points)}</div><p class="muted">Cashback ${S.cashback.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</p><button class="btn" data-act="redeem">Resgatar dose da casa · 800</button></div>`;
  else body = `<div class="card pad"><h2 class="h" style="font-size:28px">Marina Costa</h2><p class="muted">@marina.noite · membro</p><p>Esta porta não mostra a mesa da gestão.</p></div>`;
  const tabs = [["home","Início"],["rooms","Salas"],["rewards","Prêmios"],["profile","Perfil"]];
  return `<div class="phone"><header class="between" style="padding:16px"><button class="chip" data-act="world" data-id="gate">Portas</button><div class="mark">FEST<i>I</i></div><span></span></header>
    ${marina.blocked?`<p class="mag" style="margin:0 16px 8px">A gestão pausou o seu acesso.</p>`:""}
    <div style="padding:0 16px 16px;flex:1">${body}</div>
    <nav class="nav5">${tabs.map((t)=>`<button class="${S.tab===t[0]?"on":""}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join("")}<button data-act="tab" data-id="home">Mapa</button></nav></div>`;
}

function manager() {
  const views = [["painel","Painel"],["acessos","Acessos"],["fila","Fila"],["numeros","Números"]];
  let body = "";
  if (S.mgr === "painel") {
    const inside = S.passes.filter((p)=>!p.blocked).length;
    body = `<div class="stack"><div class="grid3"><div class="card pad"><b>${inside}</b><div class="muted">Dentro</div></div><div class="card pad"><b>${S.queue.length}</b><div class="muted">Na fila</div></div><div class="card pad"><b>${pts(S.points)}</b><div class="muted">Pontos</div></div></div>
      <div class="card pad"><h2 class="h" style="font-size:22px">Quem pode entrar</h2>${S.passes.map((p)=>`<div class="between" style="margin-top:8px"><span>${esc(p.name)}</span><span class="muted">${p.blocked?"pausado":p.role}</span></div>`).join("")}</div></div>`;
  } else if (S.mgr === "acessos") {
    body = `<div class="stack"><p class="muted">A Marina é o perfil da porta Membro. O que você mudar nela aparece só na noite dela.</p>${S.passes.map((p)=>`<article class="card pad"><div class="between"><div><b>${esc(p.name)}</b><div class="muted">${p.role}${p.id==="marina"?" · perfil da demo":""}</div></div><button class="chip ${p.blocked?"on":""}" data-act="block" data-id="${p.id}">${p.blocked?"Liberar":"Pausar"}</button></div><div class="row" style="margin-top:10px">${["main","back","vip"].map((r)=>`<button class="pill ${p.rooms[r]?"on":""}" data-act="roompass" data-id="${p.id}" data-room="${r}">${r==="main"?"Palco":r==="back"?"Cabine":"VIP"}</button>`).join("")}</div></article>`).join("")}</div>`;
  } else if (S.mgr === "fila") {
    body = S.queue.length?`<div class="stack">${S.queue.map((q)=>`<article class="card"><img class="photo" style="height:140px" src="${q.image}" alt=""><div class="pad"><b>@${esc(q.handle)}</b><p class="muted">${esc(q.text)}</p><div class="row"><button class="btn line" style="border:1px solid var(--cyan);color:var(--cyan)" data-act="approve" data-id="${q.id}">Aprovar</button><button class="btn line" style="border:1px solid var(--magenta);color:var(--magenta)" data-act="reject" data-id="${q.id}">Recusar</button></div></div></article>`).join("")}</div>`:`<div class="card pad"><h2 class="h" style="font-size:24px">Fila limpa</h2></div>`;
  } else body = `<div class="card pad"><h2 class="h" style="font-size:24px">Números</h2><p>Aprovados ${S.approved}</p><p>Recusados ${S.rejected}</p><p>Checkpoints ${S.checks.filter(c=>c.done).length} / 5</p></div>`;
  return `<div class="mgr"><aside class="side"><div class="mark">FEST<i>I</i></div><p class="muted">Mesa interna. O membro não vê esta porta.</p><nav class="stack" style="margin-top:16px">${views.map((v)=>`<button class="${S.mgr===v[0]?"on":""}" data-act="mgr" data-id="${v[0]}">${v[1]}</button>`).join("")}</nav><button data-act="world" data-id="gate" style="margin-top:auto">Trocar de porta</button></aside>
    <section><header class="between" style="padding:16px 16px 0"><div><div class="mag" style="font-size:12px;font-weight:800">GESTÃO</div><h1 class="h" style="font-size:28px">A casa por dentro</h1></div><button class="chip mnav" data-act="world" data-id="gate">Portas</button></header>
    <div class="mnav row" style="padding:12px 16px;overflow:auto">${views.map((v)=>`<button class="chip ${S.mgr===v[0]?"on":""}" data-act="mgr" data-id="${v[0]}">${v[1]}</button>`).join("")}</div>
    <div style="padding:8px 16px 24px">${body}</div></section></div>`;
}

function render() {
  const html = S.world==="gate"?gate():S.world==="story"?story():S.world==="manager"?manager():member();
  document.getElementById("app").innerHTML = html;
  document.getElementById("toast").innerHTML = S.toast?`<div class="toast">${esc(S.toast)}</div>`:"";
}
document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act==="world") S.world = id;
  else if (act==="mode") S.mode = id;
  else if (act==="pin") S.pin = id;
  else if (act==="plug") S.open = S.open===id?null:id;
  else if (act==="story") S.story = Math.max(0, Math.min(chapters.length-1, S.story + (id==="next"?1:-1)));
  else if (act==="tab") S.tab = id;
  else if (act==="mgr") S.mgr = id;
  else if (act==="block") { const p = S.passes.find((x)=>x.id===id); p.blocked = !p.blocked; flash(p.blocked?p.name+" não entra mais.":p.name+" pode entrar de novo."); return; }
  else if (act==="roompass") { const p = S.passes.find((x)=>x.id===id); p.rooms[el.dataset.room] = !p.rooms[el.dataset.room]; flash("Acesso de sala atualizado."); return; }
  else if (act==="approve" || act==="reject") {
    const q = S.queue.find((x)=>x.id===id); S.queue = S.queue.filter((x)=>x.id!==id);
    if (act==="approve") { S.approved++; S.posts.unshift({ id:"l"+id, handle:q.handle, text:q.text, image:q.image, likes:12 }); flash("@"+q.handle+" entrou no feed."); }
    else { S.rejected++; flash("@"+q.handle+" ficou fora do feed."); }
    return;
  }
  else if (act==="qr") {
    const n = S.checks.find((c)=>!c.done);
    if (!n) { flash("Noite completa."); return; }
    if (me().blocked) { flash("A casa pausou o seu acesso."); return; }
    n.done = true; S.points += 1000; S.cashback += 12; flash(n.name+" validado. +1.000 pontos."); return;
  }
  else if (act==="room") {
    const marina = me();
    if (marina.blocked || !marina.rooms[id]) { flash("A gestão não liberou esta sala para o seu perfil."); return; }
    flash("Sala aberta na sua pulseira."); return;
  }
  else if (act==="redeem") {
    if (S.points<800) { flash("Pontos ainda não cobrem."); return; }
    S.points -= 800; flash("Dose da casa reservada."); return;
  }
  render();
});
render();
</script>
</body>
</html>
