<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FESTI</title>
<meta name="theme-color" content="#07060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#07060c; --surface:#14121c; --raised:#1e1a2a; --fg:#f6f3fb; --muted:#a79fb8; --faint:#726b84; --line:#2c2738; --magenta:#ff2f9b; --cyan:#3ee0ff; --ok:#3dd68c; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:Manrope,system-ui,sans-serif; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
img { display:block; max-width:100%; }
#app { min-height:100dvh; }
.mark { font-family:Syne,sans-serif; font-weight:800; letter-spacing:-.03em; font-size:22px; }
.mark i { color:var(--magenta); font-style:normal; }
.h { font-family:Syne,sans-serif; font-weight:800; letter-spacing:-.03em; margin:0; line-height:1; }
.wrap { max-width:960px; margin:0 auto; padding:24px 20px 40px; }
.muted { color:var(--muted); }
.mag { color:var(--magenta); }
.grid3 { display:grid; gap:16px; }
@media (min-width:800px) { .grid3 { grid-template-columns:1fr 1fr 1fr; } .mgr { display:grid; grid-template-columns:220px 1fr; min-height:100dvh; } .side { display:flex !important; } .mnav { display:none !important; } }
.card { background:var(--surface); border:1px solid var(--line); border-radius:24px; overflow:hidden; text-align:left; width:100%; }
.pad { padding:16px; }
.chip { height:40px; border-radius:999px; padding:0 14px; background:var(--raised); color:var(--muted); font-weight:700; }
.chip.on { background:var(--fg); color:var(--bg); }
.btn { height:48px; border-radius:999px; background:var(--magenta); color:#1a0610; font-weight:800; padding:0 16px; }
.btn.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
.btn.line { background:transparent; }
.photo { width:100%; object-fit:cover; }
.row { display:flex; align-items:center; gap:10px; }
.between { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.stack { display:flex; flex-direction:column; gap:12px; }
.nav5 { display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); background:var(--surface); }
.nav5 button { padding:10px 0 12px; color:var(--faint); font-size:11px; font-weight:700; }
.nav5 button.on { color:var(--magenta); }
.phone { max-width:430px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
.side { display:none; flex-direction:column; border-right:1px solid var(--line); padding:16px; }
.side button { text-align:left; height:44px; border-radius:16px; padding:0 12px; color:var(--muted); font-weight:700; }
.side button.on { background:var(--fg); color:var(--bg); }
.pill { height:36px; border-radius:999px; padding:0 12px; background:var(--raised); color:var(--muted); font-weight:700; font-size:14px; }
.pill.on { background:var(--cyan); color:#1a0610; }
.toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--fg); color:var(--bg); border-radius:999px; padding:12px 16px; font-weight:700; z-index:40; }
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:grid;align-items:end;justify-content:center;padding:12px}
@media(min-width:700px){.sheet{align-items:center}}
</style>
</head>

const beats = [{"id":"hub-abre","kicker":"Akasha Hub","text":"Antes da FESTI, rapidinho: eu sou do Akasha Hub. A FESTI mora aqui. Agora eu vou contar por que eu pensei nisso, com as minhas palavras."},{"id":"domum","kicker":"A casa","text":"Eu já trabalhei em casa de show, casa de eventos, há muito tempo, como promoter. Eu colocava gente na casa. A casa se chamava Domum, em São José, Santa Catarina."},{"id":"dentro","kicker":"Por dentro","text":"Lá eu conseguia ver como funciona uma casa de show por dentro, por fora, e até na parte mais obscura, a parte da diretoria. Eu tinha acesso a camarim, acesso à produtora, acesso à área VIP. E colocava sempre gente lá. Me divertia. Estava sempre lá."},{"id":"lado","kicker":"Do lado","text":"Toda semana. Eu morava do lado. Uma casa do lado, que eu tinha alugado. Justamente porque eu tinha dois empregos nessa época. Um era essa casa de show. O outro era de garçom, numa lanchonete do lado, em outra empresa."},{"id":"pulo","kicker":"O pulo","text":"Aí eu percebi, depois de um tempo trabalhando com soluções digitais, que os eventos podem ser muito mais otimizados. No sentido da pessoa que está no evento participar. E conseguir uma certa gamificação."},{"id":"registro","kicker":"O registro","text":"Através de uma plataforma que registra tudo o que está acontecendo no evento. De forma que o registro é oficial do evento."},{"id":"salas","kicker":"Três salas","text":"Tem audiovisual fazendo live em três salas diferentes. Vamos dizer que tem três salas. Se estiver acontecendo tudo de uma vez, uma câmera profissional pode estar registrando tanto uma sala só quanto as três. Cada uma pode ter o seu audiovisual, ou pode ser um só que participa de uma, ou de outra, ou de outra."},{"id":"celular","kicker":"O celular","text":"E pode ser gravado também pelo celular. Qualquer pessoa pode chegar, abrir o celular e gravar."},{"id":"hibrido","kicker":"Quem está fora","text":"Sistemas de live dentro do evento. A pessoa que está participando assiste. A pessoa que não está no evento, presencialmente, também assiste. E essa pessoa que está lá de fora pode comprar esse acesso. Comprar como um ingresso virtual."},{"id":"padrao","kicker":"O padrão","text":"E a pessoa, sempre que for participar de um evento presencial, vai estar com acesso híbrido. Tanto no presencial quanto no virtual. Como padronizar? A minha dica: deixar todos os ingressos presenciais no híbrido. A pessoa comprou um presencial, ela já tem acesso à parte online, na plataforma."},{"id":"influencia","kicker":"A influência","text":"Aí algumas influências vão se encarregar de viralizar essa parte de ensinar. De ver o aplicativo funcionando, com engenharia da atenção, engenharia do consentimento. Pra que as pessoas comecem a usar isso."},{"id":"futuro","kicker":"O futuro que já começou","text":"De uma maneira que a gente consegue imaginar um Black Mirror. Uma parte sci-fi, adiantando já o futuro que já começou. Que é a inteligência artificial, o digital, presente na vida de todas as pessoas."},{"id":"so-app","kicker":"Só pela plataforma","text":"Muitas pessoas, acredito eu, vão querer participar do evento somente pela dinâmica do aplicativo, da plataforma. Muitas pessoas que não se compactuam muito com a essência, com o pertencimento que existe dentro da casa de show, vão querer participar só pela plataforma."},{"id":"missao","kicker":"A mini missão","text":"E como isso pode acontecer? Através da grande atração dentro do digital, que seria a gamificação. Fazer a pessoa fazer um jogo. Uma missão. Mini missão. Dentro do aplicativo. Pra que essa missão, essa vibe que vai ficar lá no mapa, seja bem atraente, seja divertida, e seja uma coisa totalmente nova. Porque é uma coisa nova."},{"id":"todas","kicker":"Todas as casas","text":"Vai ser implementado em casas de show. Cada uma vai ter a sua forma de gamificação. Vai ter padrões. E vai ter também personalização. Eu acredito fielmente, tenho certeza absoluta, que isso vai ser implementado em breve em todas as casas de show, em todas as casas de entretenimento, seja lá qual for."},{"id":"youtube","kicker":"Por que não no YouTube","text":"A ideia é ter salas onde se grave o conteúdo. Aí: por que eu não faço isso no YouTube? É a mesma coisa que eu pegar o YouTube e fazer uma live lá. A questão é que fica integrado. Você não vai chegar e abrir uma gaveta lá fora da sua plataforma. Você vai ter uma plataforma dentro do seu ecossistema. Do seu produtor de eventos, produtor de entretenimento, casa de show. Vai ter a sua própria."},{"id":"patrimonio","kicker":"Patrimônio","text":"E não só ter a sua própria. Você também vai ter a sua própria rede social. Porque isso, em um evento, em dois eventos, é um grande sistema funcionando de uma forma bem divertida e dinâmica. Uma grande ideia sendo aplicada. Só que, se isso for padronizado, transformado e visto como um patrimônio da tua empresa, você vai conseguir ver isso como uma rede social sua própria."},{"id":"dentro-plataforma","kicker":"Tudo dentro","text":"Então você vai ter o seu próprio Instagram. O seu próprio sistema do YouTube. O seu próprio Hotmart. Porque você pode vender produtos, pode fazer propaganda. Você vai ter tudo isso dentro da sua plataforma. Essa dinâmica eu quero que vocês entendam muito bem."},{"id":"apps","kicker":"Vários aplicativos","text":"Vocês vão ter vários aplicativos. Como rede social. Como sistema de academy, onde você pode passar dicas, pode passar aulas, pode passar vídeos, teasers do evento, do que vai acontecer, flyers, divulgação. Você pode passar entrevistas, tipo dentro da cabine, com o artista. Lives que podem aparecer tanto no telão quanto só no celular da pessoa."},{"id":"rede","kicker":"Networking","text":"Sistema de networking. Onde as pessoas que fazem o cadastro vão dizer: eu trabalho com tal, faço tal coisa. A pessoa que quiser se conectar, dentro da rede social da plataforma, no perfil, vai poder saber que essa pessoa tem esse perfil, que você pode se conectar. Pô, essa pessoa maneira já participou de outros eventos. E vai ter um sistema de cadastro bem personalizado, estratégico, pra esse networking funcionar melhor."},{"id":"guardar","kicker":"Guardar o vídeo","text":"Entrevistas podem ser salvas, podem estar gravadas. Podemos registrar e armazenar vídeos e conteúdos lá. E, se você quiser gastar menos, você pode ainda armazenar em outro lugar. Uma plataforma que armazena vídeo de graça, por exemplo o YouTube, e depois integrar o YouTube num plugin que vai estar dentro da plataforma. E até o vice-versa. E até os dois ao mesmo tempo."},{"id":"autonomia","kicker":"Autonomia","text":"Você ter o seu próprio sistema de armazenamento, dentro do app, do site, vai ter um valorzinho a mais. Porque você vai ter a autonomia. E não da minha parte, mas do sistema de armazenamento. Do Bunny, do que você preferir. Tem Panda, tem vários. Ou o grátis do YouTube. E até os dois juntos. O seu autônomo junto com o do YouTube, através de links que a gente vai estar criptografando."},{"id":"quem-ve","kicker":"Quem vê","text":"Pra as pessoas verem. Aí vai ter os vídeos livres. Os vídeos que vão estar só dentro da plataforma. Com sistema de segurança. O padrão não é uma caixa só. O padrão é visto como a sua necessidade."},{"id":"live-barata","kicker":"A live","text":"Por exemplo: eu quero gastar menos. Eu não quero depender de billing. Como é que eu faço a live? Quanto custa pra fazer o delivery de live? Quanto custa tudo isso? E como é que eu posso fazer também de graça? Por exemplo, você integrar a Twitch. Aí links. Acessa links que vão liberar a live numa plataforma que já tem a sua própria base. Que você não precisa fazer a sua própria base. Você pode integrar através de outras plataformas que já fornecem streams. Você não tem que lidar com valores de delivery de live."},{"id":"pagamento","kicker":"O ingresso","text":"E assim como a parte de pagamentos. Por exemplo, por Stripe ou Mercado Pago. É automatizada para os ingressos, onde você não precisa de Sympla. Ou você pode também integrar o Sympla. O Stripe cobre na taxa mínima pra você operar, a partir da venda que for feita."},{"id":"fecho-ideia","kicker":"A dinâmica","text":"Dá pra ter o seu próprio Sympla. Dá pra ter o seu próprio Instagram dentro da plataforma. Seu próprio YouTube. E ao mesmo tempo integrar tudo isso de uma forma que só quem tem acesso é quem está liberado dentro da plataforma."},{"id":"hub-fecha","kicker":"Akasha Hub","text":"Isso é o Akasha Hub. A FESTI é a casa. O hub é o lugar onde essa fala vira sistema, teleprompt e os reels pra levar a mesma ideia pra outra empresa."}];
const reels = [{"id":"lado","title":"A casa do lado","image":"/festi/crowd.jpg","lines":["Eu morava do lado da casa de show.","Domum. São José, Santa Catarina.","Promoter. Camarim, produtora, área VIP.","Eu via a casa por dentro, por fora, e na diretoria."],"strategy":"Abre com a Domum. Atrai dono de casa que desconfia de quem nunca pisou na operação."},{"id":"salas","title":"Três salas","image":"/festi/dj.jpg","lines":["Três salas ao mesmo tempo.","Pode ser três equipes de audiovisual.","Ou uma câmera que passa de uma pra outra.","E qualquer pessoa abre o celular e grava."],"strategy":"Mostra pra produtora que o primeiro dia não exige três equipes. O registro oficial já nasce."},{"id":"hibrido","title":"O ingresso já é híbrido","image":"/festi/aerial.jpg","lines":["Quem está na pista assiste.","Quem está fora também assiste.","E compra isso como ingresso virtual.","Comprou presencial, já entrou no online."],"strategy":"Vende o ingresso novo sem tirar o presencial que a casa já sabe vender."},{"id":"so-app","title":"Quem não entra na pista","image":"/festi/selfie.jpg","lines":["Tem gente que não se compactua com a essência da casa.","Essa gente entra pela dinâmica do aplicativo.","Engenharia da atenção. Engenharia do consentimento.","O futuro que já começou."],"strategy":"Abre um público que a casa hoje não cobra. A influência ensina o gesto."},{"id":"missao","title":"Mini missão no mapa","image":"/festi/drinks.jpg","lines":["A grande atração digital é a gamificação.","Um jogo. Uma missão. Uma mini missão.","A vibe fica no mapa.","Atraente, divertida, e nova. Porque é nova."],"strategy":"É o motivo de abrir o app de novo. Cada casa personaliza em cima do mesmo padrão."},{"id":"gaveta","title":"Não abre gaveta fora","image":"/festi/vip.jpg","lines":["Por que eu não faço isso no YouTube?","Porque você não abre uma gaveta lá fora.","Fica dentro do ecossistema da casa.","Visto como patrimônio da tua empresa."],"strategy":"Responde o “a gente já posta no YouTube”. O ativo fica com a casa, não com a gaveta."},{"id":"rede","title":"Seu Instagram. Seu Hotmart.","image":"/festi/crowd.jpg","lines":["Sua própria rede social.","Seu YouTube. Seu Hotmart.","Aula, teaser, flyer, entrevista na cabine.","No telão e no celular. E a pessoa diz com o que trabalha."],"strategy":"Faz o dono ver plataforma, não custo de uma noite. O networking é o cadastro estratégico."},{"id":"custo","title":"Gasta menos ou fica dono","image":"/festi/aerial.jpg","lines":["Quer gastar menos? YouTube e Twitch, por link.","Quer autonomia? Bunny, Panda, os dois juntos.","Ingresso no Stripe ou no Mercado Pago.","Sympla se quiser. Só entra quem a casa liberou."],"strategy":"Tira o medo do custo de live, vídeo e ingresso. A casa escolhe a peça. O padrão é a necessidade dela."}];
function prep() {
  const top = '<div class="between"><p class="mag" style="font-size:12px;font-weight:800">PRÉ-PITCH</p><button class="btn" data-act="world" data-id="pitch">Ir para o pitch</button></div><div class="row">' +
    [["fala","A fala"],["tele","Teleprompt"],["reels","Reels"]].map((m) => '<button class="chip ' + (S.prepMode===m[0]?"on":"") + '" data-act="prepmode" data-id="' + m[0] + '">' + m[1] + '</button>').join("") +
    '</div>';
  if (S.prepMode === "tele") {
    const b = beats[S.beat] || beats[0];
    return '<div class="wrap" style="display:flex;flex-direction:column;min-height:100dvh">' + top +
      '<p class="mag" style="font-size:12px;font-weight:800;margin-top:24px">' + (S.beat+1) + ' / ' + beats.length + ' · ' + esc(b.kicker).toUpperCase() + '</p>' +
      '<h1 class="h" style="font-size:34px;line-height:1.2;margin-top:16px">' + esc(b.text) + '</h1>' +
      '<div class="between" style="margin-top:auto;padding-top:28px"><button class="chip" data-act="beat" data-id="prev">Anterior</button><button class="btn" data-act="beat" data-id="next">' + (S.beat < beats.length-1 ? "Próxima" : "Agora o pitch") + '</button></div></div>';
  }
  if (S.prepMode === "reels") {
    const film = reels[S.reel] || reels[0];
    return '<div class="wrap stack">' + top +
      '<p class="muted">A mesma fala, cortada em reels, pra atrair outra casa. A frase grande é o vídeo. A linha de baixo é a estratégia.</p>' +
      '<div class="row">' + reels.map((item, i) => '<button class="chip ' + (i===S.reel?"on":"") + '" data-act="reel" data-id="' + i + '">' + (i+1) + '</button>').join("") + '</div>' +
      '<button class="card" data-act="preppause" style="padding:0;text-align:left"><img class="photo" style="height:220px" src="' + film.image.replace("/festi/","media/") + '" alt=""><div class="pad"><p class="mag" style="font-size:12px;font-weight:800">' + esc(film.title).toUpperCase() + '</p><h2 class="h" style="font-size:30px;margin-top:8px">' + esc(film.lines[S.line] || film.lines[0]) + '</h2><p class="muted">' + esc(film.strategy) + '</p></div></button></div>';
  }
  return '<div class="wrap stack">' + top +
    '<h1 class="h" style="font-size:40px">Por que eu pensei nisso.</h1><p class="muted">A fala inteira, na ordem. Akasha Hub na abertura e no fechamento. O pitch de preço vem depois.</p>' +
    beats.map((b) => '<article class="card pad"><p class="mag" style="font-size:12px;font-weight:800">' + esc(b.kicker).toUpperCase() + '</p><p>' + esc(b.text) + '</p></article>').join("") +
    '<button class="btn" data-act="world" data-id="pitch">Agora o pitch</button></div>';
}

function pitch() {
  const why = ["Assinaturas de inteligência artificial","Tempo de quem constrói e fica junto","Luz e gastos de operação","Anos de estudo para conseguir operar isso","Suporte técnico durante um ano","O sistema no ar, sem limite mensal do que o app promete"];
  if (S.paper) {
    const clauses = [
      ["1. Partes","Contratada: a operação que cria e acompanha a FESTI. Contratante: a casa, a produtora ou a empresa. Razão social, CNPJ e endereço entram na assinatura."],
      ["2. Objeto","A contratada cria a FESTI para a contratante, liga o sistema na operação da casa e permanece junto por 12 meses. Entram mapa, QR, pontos, cashback, conexões, salas, fila, acessos e a área do membro."],
      ["3. Prazo","O app oficial, já com a personalização da casa, fica no ar em no máximo 90 dias, contados do primeiro pagamento. Os 9 meses seguintes são de inovação, adaptação, nova personalização e suporte. Vigência total: 12 meses."],
      ["4. Preço","Valor mínimo de R$ 39.000, à vista, por PIX. Em alternativa, 12 parcelas de R$ 3.300 no cartão, sem juros. Nessa forma o total é R$ 39.600. A contratante escolhe no aceite."],
      ["5. O que o preço cobre","Assinaturas de inteligência artificial, o tempo de quem constrói e acompanha, luz, gastos de operação, os anos de estudo para fazer o sistema funcionar, e suporte técnico por 12 meses."],
      ["6. Sem trava mensal","Dentro do que o app promete — entrada, mapa, QR, pontos, cashback, conexões, salas, lives da casa, fila e acessos — não há limite de operações por mês."],
      ["7. Suporte","Durante 12 meses a contratada responde, corrige o que quebrar no combinado e acompanha a equipe. O suporte não cobre um produto diferente do apresentado."],
      ["8. Personalização","Nos primeiros 90 dias a FESTI fica com a cara e a operação da casa. Nos 9 meses seguintes a personalização continua, com inovação e adaptação."],
      ["9. O que a casa faz","A contratante entrega marca, pontos do mapa, regras de prêmio e uma pessoa para aprovar vídeo. Sem isso, a contagem dos 90 dias pausa."],
      ["10. Ensino da pista","A implantação inclui posts, carrossel, reels, live com influenciador ou modelo e peças com IA, para ensinar o gesto sem um manual longo."],
      ["11. Dados","Os dados dos perfis pertencem à casa. A contratada usa só para o sistema funcionar. Senha de pessoa não fica no celular da festa."],
      ["12. Propriedade","Marca, fotos e lista são da contratante. A base da FESTI é da contratada, licenciada durante a vigência. No fim, a casa pode receber cópia dos seus dados."],
      ["13. Rescisão","Qualquer parte encerra com aviso de 30 dias. O que já foi pago pelos meses decorridos não volta. Parcelas vencidas continuam devidas. Os dados saem em até 15 dias."],
      ["14. Foro","As partes buscam acordo primeiro. Se precisar de juízo, fica o foro da comarca da contratante. Local, data e as duas assinaturas fecham o instrumento."]
    ];
    return `<div class="wrap stack"><div class="between"><p class="mag" style="font-size:12px;font-weight:800">PARA O INVESTIDOR</p><button class="chip" data-act="paper" data-id="close">Voltar ao pitch</button></div>
      <p class="mag" style="font-size:12px;font-weight:800;letter-spacing:.08em">MODELO DE CONTRATO</p>
      <h1 class="h" style="font-size:40px">Criação, implantação e um ano junto.</h1>
      <p class="muted">Modelo para esta apresentação. Nomes e CNPJ entram na assinatura. Antes de assinar, um advogado lê com as duas partes.</p>
      ${clauses.map((c)=>`<article class="card pad"><h2 class="h" style="font-size:22px">${c[0]}</h2><p class="muted">${c[1]}</p></article>`).join("")}
      <p class="muted">Local e data. Assinatura da contratante. Assinatura da contratada.</p>
    </div>`;
  }
  return `<div class="wrap stack"><div class="between"><p class="mag" style="font-size:12px;font-weight:800">PARA O INVESTIDOR</p><div class="row"><button class="chip" data-act="world" data-id="prep">Pré-pitch</button><button class="chip" data-act="world" data-id="gate">Entrar no app</button></div></div>
    <h1 class="h" style="font-size:44px;max-width:16ch">Primeiro o acordo. Depois a festa.</h1>
    <p class="muted">A casa hoje vive de lista, grito e story. A FESTI troca isso por um gesto só. Eu crio o sistema para a empresa e fico junto por um ano.</p>
    <aside class="card pad" style="border-color:var(--magenta)">
      <p class="mag" style="font-size:12px;font-weight:800;letter-spacing:.08em">MÍNIMO PARA EXECUTAR</p>

      <p class="muted">ou 12x de R$ 3.300 no cartão, sem juros. Nessa forma o total fica R$ 39.600.</p>
      ${why.map((w)=>`<p>${w}</p>`).join("")}
    </aside>
    <div class="grid3" style="grid-template-columns:1fr 1fr">
      <section class="card pad"><p class="mag" style="font-size:12px;font-weight:800">ATÉ 90 DIAS</p><p>App oficial no ar, com a personalização da casa.</p></section>
      <section class="card pad"><p class="mag" style="font-size:12px;font-weight:800">OS 9 MESES SEGUINTES</p><p>Inovação, adaptação, mais personalização e suporte técnico.</p></section>
    </div>
    ${opsHtml()}
    <div class="row"><button class="btn" data-act="paper" data-id="open">Ver o contrato</button><button class="btn ghost" data-act="world" data-id="gate">Entrar no app</button></div>
  </div>`;
}

  else if (S.tab === "rooms") {
    const rooms = [["main","Palco principal","media/dj.jpg"],["back","Bastidores","media/aerial.jpg"],["vip","Lounge VIP","media/vip.jpg"]];
    body = `<div class="stack">${rooms.map((r) => {
      const closed = marina.blocked || !marina.rooms[r[0]] || (r[0]==="back" && !S.checks.find((c)=>c.id==="dj").done);
      return `<button class="card" data-act="room" data-id="${r[0]}"><img class="photo" style="height:120px" src="${r[1]===rooms[0][1]?r[2]:r[2]}" alt=""><div class="pad"><b>${r[1]}</b><div class="muted">${closed?"Fechada para o seu perfil":"Aberta"}</div></div></button>`;
    }).join("")}</div>`;
  }
  else if (S.tab === "rewards") body = `<div class="card pad"><div class="muted">Pontos</div><div class="h mag" style="font-size:32px">${pts(S.points)}</div><p class="muted">Cashback ${S.cashback.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</p><button class="btn" data-act="redeem">Resgatar dose da casa · 800</button></div>`;
  else if (S.tab === "map") {
    const next = S.checks.find((c) => !c.done);
    const focus = S.checks.find((c) => c.id === S.pinMap) || next;
    const pins = S.checks.map((c) => {
      const on = focus && focus.id === c.id;
      const bg = c.done ? "var(--cyan)" : on ? "var(--magenta)" : "rgba(7,6,12,.8)";
      const color = c.done || on ? "#1a0610" : "var(--fg)";
      return `<button data-act="mappin" data-id="${c.id}" aria-label="${esc(c.name)}" style="position:absolute;left:${c.x}%;top:${c.y}%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:999px;background:${bg};color:${color};font-weight:800">${c.done ? "✓" : ""}</button>`;
    }).join("");
    const can = focus && next && focus.id === next.id;
    body = `<div class="stack"><div style="position:relative;height:320px;border-radius:24px;overflow:hidden"><img class="photo" style="height:320px" src="media/aerial.jpg" alt="Mapa da festa">${pins}</div>${focus ? `<div class="card pad"><div class="mag" style="font-size:12px;font-weight:800">${esc(focus.name)}</div><p class="muted">${focus.done ? "Já validado." : can ? "Pode validar agora." : "Ainda na fila. Valide o ponto aberto primeiro."}</p>${can ? `<button class="btn" data-act="qr" style="width:100%;margin-top:8px">Validar este ponto</button>` : ""}</div>` : `<p class="muted">Mapa da noite fechado. Tudo validado.</p>`}</div>`;
  }
  else body = `<div class="card pad"><h2 class="h" style="font-size:28px">Marina Costa</h2><p class="muted">@marina.noite · membro</p><p>Esta porta não mostra a mesa da gestão.</p></div>`;
  const tabs = [["home","Início"],["rooms","Salas"],["rewards","Prêmios"],["profile","Perfil"]];
  return `<div class="phone"><header class="between" style="padding:16px">${S.gestor?'<button class="chip" data-act="world" data-id="gate">Portas</button>':'<button class="chip" data-act="login">Gestão</button>'}<div class="mark">FEST<i>I</i></div><span></span></header>
    ${marina.blocked?`<p class="mag" style="margin:0 16px 8px">A gestão pausou o seu acesso.</p>`:""}
    <div style="padding:0 16px 16px;flex:1">${body}</div>
    <nav class="nav5">${tabs.map((t)=>`<button class="${S.tab===t[0]?"on":""}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join("")}<button class="${S.tab==="map"?"on":""}" data-act="tab" data-id="map">Mapa</button></nav></div>`;
}

function manager() {
  const views = [["painel","Painel"],["acessos","Acessos"],["fila","Fila"],["numeros","Números"],["seguranca","Segurança"]];
  let body = "";
  if (S.mgr === "painel") {
    const inside = S.passes.filter((p)=>!p.blocked).length;
    body = `<div class="stack"><div class="grid3"><div class="card pad"><b>${inside}</b><div class="muted">Dentro</div></div><div class="card pad"><b>${S.queue.length}</b><div class="muted">Na fila</div></div><div class="card pad"><b>${pts(S.points)}</b><div class="muted">Pontos</div></div></div>
      <div class="card pad"><h2 class="h" style="font-size:22px">Quem pode entrar</h2>${S.passes.map((p)=>`<div class="between" style="margin-top:8px"><span>${esc(p.name)}</span><span class="muted">${p.blocked?"pausado":p.role}</span></div>`).join("")}</div></div>`;
  } else if (S.mgr === "acessos") {
    body = `<div class="stack"><p class="muted">A Marina é o perfil da porta Membro. O que você mudar nela aparece só na noite dela.</p>${S.passes.map((p)=>`<article class="card pad"><div class="between"><div><b>${esc(p.name)}</b><div class="muted">${p.role}${p.id==="marina"?" · perfil da demo":""}</div></div><button class="chip ${p.blocked?"on":""}" data-act="block" data-id="${p.id}">${p.blocked?"Liberar":"Pausar"}</button></div><div class="row" style="margin-top:10px">${["main","back","vip"].map((r)=>`<button class="pill ${p.rooms[r]?"on":""}" data-act="roompass" data-id="${p.id}" data-room="${r}">${r==="main"?"Palco":r==="back"?"Cabine":"VIP"}</button>`).join("")}</div></article>`).join("")}</div>`;
  } else if (S.mgr === "fila") {
    body = S.queue.length?`<div class="stack">${S.queue.map((q)=>`<article class="card"><img class="photo" style="height:140px" src="${q.image}" alt=""><div class="pad"><b>@${esc(q.handle)}</b><p class="muted">${esc(q.text)}</p><div class="row"><button class="btn line" style="border:1px solid var(--cyan);color:var(--cyan)" data-act="approve" data-id="${q.id}">Aprovar</button><button class="btn line" style="border:1px solid var(--magenta);color:var(--magenta)" data-act="reject" data-id="${q.id}">Recusar</button></div></div></article>`).join("")}</div>`:`<div class="card pad"><h2 class="h" style="font-size:24px">Fila limpa</h2></div>`;
  } else if (S.mgr === "numeros") body = `<div class="card pad"><h2 class="h" style="font-size:24px">Números</h2><p>Aprovados ${S.approved}</p><p>Recusados ${S.rejected}</p><p>Checkpoints ${S.checks.filter(c=>c.done).length} / 5</p></div>`;
  else {
    const layers = [
      ["1 · Superfície","O clique","Enquanto a casa responde, o mesmo botão não dispara de novo."],
      ["2 · Experiência","O QR","O mesmo carimbo não entra duas vezes.","qr","Tentar QR duplicado"],
      ["3 · Experiência","O resgate","Prêmio que já saiu não sai de novo. O saldo não fica negativo.","resgate","Tentar resgate duplicado"],
      ["4 · Variável","O número","Ponto só vive entre 0 e 20.000. Número negativo ou enorme é cortado.","teto","Tentar número absurdo"],
      ["5 · Experiência","A fila","Vídeo já julgado não vira um segundo post.","fila","Tentar fila duplicada"],
      ["6 · Porta","O acesso","Perfil pausado não carimba, não abre sala e não resgata.","acesso","Tentar acesso pausado"],
      ["7 · Volta atrás","O retrato","A gestão guarda um retrato da noite e volta pontos, fila e acessos juntos."],
      ["8 · Fundo","A casa fechada","Senha não fica no celular. Pedido sem forma é jogado fora. Na porta da internet, o segurança segura quem atrapalha. Vírus não publica sozinho: vídeo só entra depois que a equipe vê."]
    ];
    body = `<div class="stack"><p class="muted">Da tela até o fundo. O membro não vê esta biblioteca. Ele só sente que a noite não quebra.</p>
      ${layers.map((l) => `<article class="card pad"><p class="mag" style="font-size:12px;font-weight:800">${l[0].toUpperCase()}</p><h2 class="h" style="font-size:24px;margin-top:6px">${l[1]}</h2><p class="muted">${l[2]}</p>${l[3]?`<button class="chip" data-act="prove" data-id="${l[3]}">${l[4]}</button>`:""}</article>`).join("")}
      <div class="row"><button class="btn" data-act="save">Guardar retrato agora</button><button class="btn ghost" data-act="restore">Restaurar retrato</button></div>
      <section class="card pad"><h2 class="h" style="font-size:22px">O que foi barrado</h2>${S.guards.length?S.guards.map((g)=>`<p><b class="mag">${esc(g.layer)}. </b>${esc(g.text)}</p>`).join(""):`<p class="muted">Nada saiu do lugar ainda.</p>`}</section>
    </div>`;
  }
  return `<div class="mgr"><aside class="side"><div class="mark">FEST<i>I</i></div><p class="muted">Mesa interna. O membro não vê esta porta.</p><nav class="stack" style="margin-top:16px">${views.map((v)=>`<button class="${S.mgr===v[0]?"on":""}" data-act="mgr" data-id="${v[0]}">${v[1]}</button>`).join("")}</nav><button data-act="world" data-id="gate" style="margin-top:auto">Trocar de porta</button></aside>
    <section><header class="between" style="padding:16px 16px 0"><div><div class="mag" style="font-size:12px;font-weight:800">GESTÃO</div><h1 class="h" style="font-size:28px">A casa por dentro</h1></div><button class="chip mnav" data-act="world" data-id="gate">Portas</button></header>
    <div class="mnav row" style="padding:12px 16px;overflow:auto">${views.map((v)=>`<button class="chip ${S.mgr===v[0]?"on":""}" data-act="mgr" data-id="${v[0]}">${v[1]}</button>`).join("")}</div>
    <div style="padding:8px 16px 24px">${body}</div></section></div>`;
}

function sheet() {
  if (!S.login) return "";
  return `<div class="sheet" data-act="closelogin"><div class="card pad" data-act="stay" style="max-width:420px"><p class="mag" style="font-size:12px;font-weight:800">GESTÃO</p><h2 class="h" style="font-size:32px;margin-top:8px">Entre com o Gmail da casa.</h2><p class="muted">Pitch, apresentação, ideias e a parte técnica ficam nesta porta. Quem não entra continua na noite, como membro.</p><button class="btn" data-act="google" style="width:100%;margin-top:16px;background:#fff;color:#111">Continuar com Google</button>${S.loginErr?`<p class="mag">${esc(S.loginErr)}</p>`:""}<button class="chip" data-act="closelogin" style="width:100%;margin-top:8px">Continuar como membro</button></div></div>`;
}
function render() {
  if (!S.gestor && S.world !== "member") S.world = "member";
  const html = (S.world==="prep"?prep():S.world==="pitch"?pitch():S.world==="gate"?gate():S.world==="story"?story():S.world==="manager"?manager():member()) + sheet();
  document.getElementById("app").innerHTML = html;
  document.getElementById("toast").innerHTML = S.toast?`<div class="toast">${esc(S.toast)}</div>`:"";
}
document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act==="world") {
    if (id !== "member" && !S.gestor) { S.login = true; flash("Pitch, apresentação e a parte técnica abrem com o Gmail da gestão."); return; }
    S.world = id;
  }
  else if (act==="login") S.login = true;
  else if (act==="closelogin") S.login = false;
  else if (act==="stay") return;
  else if (act==="google") {
    if (!window.FestiAuth) { S.loginErr = "O Google ainda está carregando."; render(); return; }
    window.FestiAuth.google().then((email) => { S.gestor = email; S.login = false; S.loginErr = ""; S.world = "gate"; render(); }).catch((err) => {
      const code = err && err.code;
      if (code === "auth/popup-closed-by-user") return;
      S.loginErr = err && err.message === "denied" ? "Esse Gmail não libera a gestão." : "O Google não abriu agora. Tente de novo.";
      render();
    });
    return;
  }
  else if (act==="logout") {
    S.gestor = ""; S.world = "member"; S.login = false;
    if (window.FestiAuth) window.FestiAuth.out();
    return;
  }
  else if (act==="mode") S.mode = id;
  else if (act==="pin") S.pin = id;
  else if (act==="paper") S.paper = id === "open";
  else if (act==="prepmode") S.prepMode = id;
  else if (act==="beat") {
    if (id==="next" && S.beat >= beats.length - 1) { S.world = "pitch"; }
    else S.beat = Math.max(0, Math.min(beats.length - 1, S.beat + (id==="next" ? 1 : -1)));
  }
  else if (act==="reel") { S.reel = Number(id); S.line = 0; }
  else if (act==="preppause") S.prepPlay = !S.prepPlay;
  else if (act==="plug") S.open = S.open===id?null:id;
  else if (act==="story") S.story = Math.max(0, Math.min(chapters.length-1, S.story + (id==="next"?1:-1)));
  else if (act==="tab") S.tab = id;
  else if (act==="mappin") { S.pinMap = id; S.tab = "map"; }
  else if (act==="mgr") S.mgr = id;
  else if (act==="block") { const p = S.passes.find((x)=>x.id===id); p.blocked = !p.blocked; flash(p.blocked?p.name+" não entra mais.":p.name+" pode entrar de novo."); return; }
  else if (act==="roompass") { const p = S.passes.find((x)=>x.id===id); p.rooms[el.dataset.room] = !p.rooms[el.dataset.room]; flash("Acesso de sala atualizado."); return; }
  else if (act==="approve" || act==="reject") {
    const q = S.queue.find((x)=>x.id===id);
    if (!q) { guard("Fila", "Esse vídeo já tinha sido julgado. Não nasceu um post duplicado."); flash("Esse vídeo já saiu da fila."); return; }
    S.queue = S.queue.filter((x)=>x.id!==id);
    if (act==="approve") { S.approved++; S.posts.unshift({ id:"l"+id, handle:q.handle, text:q.text, image:q.image, likes:12 }); flash("@"+q.handle+" entrou no feed."); }
    else { S.rejected++; flash("@"+q.handle+" ficou fora do feed."); }
    return;
  }
  else if (act==="qr") {
    if (me().blocked) { guard("Acesso", "Perfil pausado tentou carimbar. Nada foi somado."); flash("A casa pausou o seu acesso."); return; }
    const n = S.checks.find((c)=>!c.done);
    if (!n) { guard("QR", "Esse carimbo já existia. Os pontos não dobraram."); flash("Este ponto já foi validado."); return; }
    n.done = true; S.points = clamp(S.points + 1000); S.cashback += 12; flash(n.name+" validado. +1.000 pontos."); return;
  }
  else if (act==="room") {
    const marina = me();
    if (marina.blocked || !marina.rooms[id]) { guard("Acesso", "Sala fechada ou perfil pausado. A porta ficou fechada."); flash("A gestão não liberou esta sala para o seu perfil."); return; }
    flash("Sala aberta na sua pulseira."); return;
  }
  else if (act==="redeem") {
    if (me().blocked) { guard("Acesso", "Perfil pausado tentou resgatar."); flash("A casa pausou o seu acesso."); return; }
    if (S.redeemed) { guard("Resgate", "A dose já tinha saído. O saldo não desceu de novo."); flash("Este resgate já foi feito."); return; }
    if (S.points<800) { guard("Piso", "O saldo não cobre. Não ficou negativo."); flash("Pontos ainda não cobrem."); return; }
    S.redeemed = true; S.points = clamp(S.points - 800); flash("Dose da casa reservada."); return;
  }
  else if (act==="prove") {
    const lines = {
      qr: ["QR", "O Portão Norte já estava carimbado. A segunda leitura não somou ponto.", "QR duplicado barrado."],
      resgate: ["Resgate", "A dose já tinha saído. O saldo não desceu de novo.", "Resgate duplicado barrado."],
      teto: ["Teto", "Um número enorme tentou entrar. O teto é 20.000. O resto foi cortado.", "Número absurdo barrado."],
      fila: ["Fila", "Esse vídeo já tinha sido julgado. Não nasceu um post duplicado.", "Fila duplicada barrada."],
      acesso: ["Acesso", "Perfil pausado não carimba, não abre sala e não resgata.", "Acesso pausado barrado."]
    };
    const line = lines[id];
    if (!line) return;
    if (id==="teto") clamp(S.points + 9999999);
    guard(line[0], line[1]); flash(line[2]); return;
  }
  else if (act==="save") { S.shot = snap(); guard("Retrato", "Retrato novo guardado. Dá para voltar até aqui."); flash("Retrato da noite guardado."); return; }
  else if (act==="restore") {
    const shot = S.shot;
    S.points = shot.points; S.cashback = shot.cashback; S.checks = shot.checks; S.passes = shot.passes;
    S.queue = shot.queue; S.posts = shot.posts; S.approved = shot.approved; S.rejected = shot.rejected; S.redeemed = shot.redeemed;
    guard("Retrato", "A noite voltou ao retrato. Pontos, fila e acessos foram repostos.");
    flash("Noite restaurada."); return;
  }
  render();
});
window.festiOnAuth = (email) => {
  const had = S.gestor;
  S.gestor = email || "";
  if (email && !had) { S.login = false; S.loginErr = ""; S.world = "gate"; }
  if (!email && S.world !== "member") S.world = "member";
  render();
};
render();
setInterval(() => {
  if (S.world !== "prep" || S.prepMode !== "reels" || !S.prepPlay) return;
  const film = reels[S.reel];
  if (S.line < film.lines.length - 1) S.line += 1;
  else { S.line = 0; S.reel = (S.reel + 1) % reels.length; }
  render();
}, 2800);
</script>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const GESTORS = new Set(["yanfili.simon@gmail.com","ynfli.simon@gmail.com","srklehn@gmail.com","sendatantrica@gmail.com","sendatantoque@gmail.com"]);
const name = "festi";
const app = getApps().some((item) => item.name === name) ? getApp(name) : initializeApp({
  apiKey: "AIzaSyAQXJDGfsd7RgcYKm9wfuh6nOth7dWo-v4",
  authDomain: "hub-akasha.firebaseapp.com",
  projectId: "hub-akasha",
  appId: "1:370851875474:web:29b1ba3a76b0fed7d9344b"
}, name);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });
window.FestiAuth = {
  google: async () => {
    const cred = await signInWithPopup(auth, provider);
    const email = String(cred.user.email || "").trim().toLowerCase();
    if (!GESTORS.has(email)) throw new Error("denied");
    return email;
  },
  out: () => signOut(auth)
};
onAuthStateChanged(auth, (user) => {
  const email = String(user && user.email || "").trim().toLowerCase();
  if (window.festiOnAuth) window.festiOnAuth(GESTORS.has(email) ? email : "");
});
</script>
