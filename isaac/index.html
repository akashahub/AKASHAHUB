<style>
:root{
  --bg:#f3f5f9;--paper:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --blue:#0052FF;--blue2:#0038B8;--ok:#0f766e;--warn:#b45309;--bad:#b91c1c;
  --soft:#eef2ff;--chip:#f8fafc;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.wrap{width:min(1180px,calc(100% - 24px));margin:0 auto}
.top{position:sticky;top:0;z-index:30;background:rgba(243,245,249,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.brand{font-weight:750;letter-spacing:.02em}
.brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
.search{flex:1;min-width:180px}
.search input,.field,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:8px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button,.btn{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:8px;font-size:13px}
.nav button.on,.btn-p{background:var(--blue);color:#fff;border-color:transparent}
.btn-ok{background:var(--ok);color:#fff;border-color:transparent}
.btn-w{background:#128c4a;color:#fff;border-color:transparent}
.btn-bad{color:var(--bad);border-color:#fecaca}
.who{font-size:12px;color:var(--muted);margin-left:auto}
.gate{min-height:100dvh;display:grid;place-items:center;padding:32px 16px}
.gate-box{width:min(440px,100%);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px}
.gate-box h1{font-size:1.6rem;margin:8px 0 10px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}
.muted{color:var(--muted)}
.grid{display:grid;gap:10px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.card b{display:block;font-size:1.35rem}
.card span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.item h3{font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.st{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:3px 7px;border-radius:99px}
.st.parceiro,.st.call_realizada,.st.encaminhado{color:var(--ok);border-color:#99f6e4}
.st.interessado,.st.call_agendada{color:var(--blue2);border-color:#c7d2fe}
.st.perdido,.st.nao_avancou{color:var(--bad);border-color:#fecaca}
.st.reativacao,.st.followup,.st.tentativa{color:var(--warn);border-color:#fde68a}
.cols{display:grid;gap:12px}
@media(min-width:900px){.cols-2{grid-template-columns:1.15fr .85fr}.cols-3{grid-template-columns:1fr 1fr 1fr}}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.hint{background:var(--soft);border:1px dashed #c7d2fe;padding:10px 12px;border-radius:8px;font-size:13px;color:#1e3a8a}
.warn{background:#fff7ed;border:1px dashed #fdba74;color:var(--warn);padding:10px 12px;border-radius:8px;font-size:13px}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.speak{border-left:3px solid var(--blue);padding:8px 12px;background:#fff;margin:8px 0}
.step{font-size:12px;color:var(--muted);margin-bottom:6px}
.sig{display:flex;gap:6px;flex-wrap:wrap}
.sig i{font-style:normal;background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:12px}
.sig i.on{background:var(--soft);border-color:#93c5fd;color:var(--blue2)}
.log{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.kanban{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));align-items:start}
.col{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:80px}
.col h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pill{display:block;width:100%;text-align:left;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px;margin:0 0 6px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:none;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottom button{flex:1;border:0;background:transparent;padding:8px 4px;font-size:11px}
.bottom button.on{color:var(--blue);font-weight:700}
main{padding:16px 0 88px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:50;display:none}
.toast.on{display:block}
h1,h2{font-weight:700;letter-spacing:-.02em}
h2{font-size:1.25rem;margin-bottom:8px}
.duo{display:grid;gap:8px}
@media(min-width:720px){.duo{grid-template-columns:1fr 1fr}}
.pre{white-space:pre-wrap;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
@media(max-width:820px){
  .nav{display:none}
  .bottom{display:flex}
  .who{margin-left:0;width:100%}
}
/* ISAAC SDR OS 2.0 — cockpit operacional, sem alterar a estrutura global do Hub */
:root{
  --bg:#07111f;--paper:#0e1b2b;--ink:#eef5ff;--muted:#91a1b6;--line:#213249;
  --blue:#5f88ff;--blue2:#8caaff;--ok:#43d6a0;--warn:#ffb45f;--bad:#ff7474;
  --soft:#132a48;--chip:#132235;
}
body{background:radial-gradient(circle at 88% -8%,#17365e 0,transparent 31%),var(--bg)}
.top{background:rgba(7,17,31,.93);border-color:var(--line)}
.top-in{padding:13px 0}.brand{font-size:16px}.brand small{color:#7fa2ff}

.btn-ok{background:#177a5a;color:#fff}.btn-w{background:#147448;color:#fff}.btn-bad{color:#ff9b9b;border-color:#61323a}
.card,.item,.col,.gate-box{background:linear-gradient(145deg,#0f1d2e,#0b1725);border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.card{padding:16px}.item{padding:13px}.pill{background:#101f31;border-color:var(--line);color:var(--ink)}
.pill:hover{border-color:#6288cf;transform:translateY(-1px)}
.hint{background:#102847;border-color:#31558c;color:#c7d8f3}.warn{background:#2a2015;border-color:#76542d;color:#ffd29b}
.st{border-color:#354963}.st.parceiro,.st.call_realizada,.st.encaminhado{color:#6ee7b7;border-color:#245f4f}.st.interessado,.st.call_agendada{color:#9eb7ff;border-color:#405b94}.st.perdido,.st.nao_avancou{color:#ff9999;border-color:#743941}.st.reativacao,.st.followup,.st.tentativa{color:#ffc27d;border-color:#6e512d}
.bottom{background:#0b1725;border-color:var(--line)}.bottom button{color:#8fa0b5}.bottom button.on{color:#82a3ff}
.toast{background:#edf4ff;color:#0b1725;font-weight:750}.log,td,th{border-color:var(--line)}
.today-hero{display:grid;gap:16px;padding:20px;border:1px solid #29415f;border-radius:16px;background:radial-gradient(circle at 85% 0,#244d87,transparent 38%),linear-gradient(125deg,#0f2138,#0b1827);margin-bottom:12px}
.today-hero h1{font-size:clamp(1.55rem,4vw,2.4rem);line-height:1.05;max-width:760px}.today-hero p{color:#a9bbd1;max-width:720px}
.goal-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.progress{height:7px;flex:1;min-width:180px;background:#1d3047;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#5f88ff,#43d6a0);border-radius:inherit}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:12px 0}.metric{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0c1928}.metric strong{display:block;font-size:1.6rem;letter-spacing:-.04em}.metric span{color:var(--muted);font-size:11px}
.queue-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.queue{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0c1928}.queue-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.queue-head h3{font-size:13px}.queue-head span{font-size:10px;color:var(--muted)}
.queue-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #1a2b40}.queue-item:first-of-type{border-top:0}.queue-item strong,.queue-item small{display:block}.queue-item small{color:var(--muted);font-size:10px;margin-top:2px}.score{display:inline-grid;place-items:center;min-width:38px;height:26px;border-radius:8px;background:#153052;color:#a9c2ff;font-size:10px;font-weight:800}
.call-shell{display:grid;gap:12px}.call-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.timer{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:800;color:#8fb0ff;padding:7px 10px;border-radius:9px;background:#10233c}

.meeting-box{border-color:#315a4e;background:linear-gradient(145deg,#10291f,#0b1c1a)}.meeting-box h2{color:#7ee0ba}.anchor-box{padding:12px;border:1px dashed #426254;border-radius:10px;margin-top:10px}
.proof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.proof-card{padding:15px;border:1px solid var(--line);border-radius:12px;background:#0c1928}.proof-card .approved{color:#59dda9}.proof-card .review{color:#ffc27d}.proof-card p{margin-top:6px}.proof-card small{display:block;color:var(--muted);margin-top:8px}
.danger-note{color:#ff9999}.safe-note{font-size:11px;color:var(--muted);margin-top:8px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media(max-width:900px){.metric-grid{grid-template-columns:repeat(2,1fr)}.queue-grid{grid-template-columns:1fr}}

.call-mode-switch{display:flex;gap:6px;margin-bottom:8px}.call-mode-switch button{border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:var(--muted);background:#0b1725;font-weight:750}.call-mode-switch button.on{color:#08131f;background:#8fb0ff;border-color:#8fb0ff}

.obj-ask{color:#78b7ff!important;background:#0c2743;padding:9px 10px;border-left:3px solid #5da8ff;border-radius:6px}.obj-advance{color:#7ee0ba!important;background:#0d2a20;padding:9px 10px;border-left:3px solid #54d4a4;border-radius:6px}.obj-live p{margin-top:8px}
.booking-lines{margin:10px 0;padding:11px;border:1px solid #3b725e;border-radius:9px;background:#0d2a20;color:#c5f2de}.booking-lines b{color:#7ee0ba}
@media(max-width:520px){.booking-strip{align-items:stretch;flex-direction:column}.call-mode-switch button{flex:1}}

.plain-help{max-width:760px;color:var(--muted);margin:5px 0 14px}
.record-overview,.directory-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0}
.record-overview>div,.directory-summary>div{background:linear-gradient(145deg,#fff,#f7faff);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 22px rgba(15,23,42,.05)}
.record-overview b,.directory-summary b{display:block;font-size:24px;color:var(--blue);line-height:1}
.record-overview span,.directory-summary span{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.new-record{margin-bottom:14px}.new-record summary{cursor:pointer;font-weight:800;color:var(--blue)}
.record-list,.directory-list{display:grid;gap:11px}
.record-card,.directory-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 8px 25px rgba(15,23,42,.055)}
.record-head,.directory-main{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.record-head h3,.directory-title h3{font-size:18px;margin:4px 0 2px}.record-head p,.directory-title p{color:var(--muted);font-size:13px}
.record-kind{display:inline-flex;background:#edf3ff;color:#174ea6;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}

</style>
</head>
