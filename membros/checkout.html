<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pagamento · Akasha</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
body{margin:0;background:radial-gradient(ellipse at 15% 0%,#42215c 0,transparent 40%),radial-gradient(ellipse at 95% 20%,#4a1634 0,transparent 35%),#090711;color:#fff8ea;font-family:"Josefin Sans",sans-serif;font-weight:300}
main{max-width:560px;margin:0 auto;padding:30px 20px 48px;border:1px solid rgba(233,189,88,.3);border-radius:22px;background:linear-gradient(145deg,#20152d,#100d19);box-shadow:0 18px 45px #0005}
.moon{height:160px;overflow:hidden;background:#111}
.moon img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:40px;margin:8px 0}
p{color:#c1b5d2;line-height:1.5}
.price{font-family:"Cormorant Garamond",serif;font-size:38px;color:#ffdc8a;margin:0}.cover{width:100%;max-height:360px;object-fit:contain;background:linear-gradient(145deg,#211433,#08070c 70%,#4c1837);border:1px solid rgba(233,189,88,.38);border-radius:16px;margin:12px 0 18px;box-shadow:0 12px 36px #0007}
label{display:block;margin-top:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e9bd58}
input{width:100%;margin-top:8px;background:#171122;border:1px solid rgba(233,189,88,.35);color:#fff8ea;border-radius:12px;padding:14px}
button{margin-top:18px;border:0;background:linear-gradient(100deg,#e8b84e,#ffe09a 52%,#a66dff);color:#160e20;border-radius:999px;padding:15px 18px;font-weight:700;box-shadow:0 6px 24px #d6a44230;cursor:pointer;width:100%}
a.zap{display:block;margin-top:12px;text-align:center;border:1px solid rgba(139,105,20,.45);border-radius:999px;padding:12px 18px;text-decoration:none}
a{color:#8b6914}
.note{margin-top:14px}
</style>
</head>
<body>
<div class="moon"><img alt="Lua" src="https://akashahub.com.br/afplataforma/assets/img/lua/hero/lua-hero-01.webp"></div>
<main>
  <p>Stripe · real</p>
  <h1 id="title">Pagamento</h1>
  <img class="cover" id="cover" alt="Capa do produto" hidden><p class="price" id="price"></p>
  <p id="lead">No Stripe, cartão ou Pix. O valor sai da oferta, não desta tela. Se o Pix não aparecer, feche com o mentor no WhatsApp.</p>
  <label>E-mail / Gmail</label>
  <input id="mail" type="email" placeholder="voce@gmail.com" autocomplete="email"/>
  <button id="pay" type="button">Pagar com cartão ou Pix</button>
  <a class="zap" id="zap" target="_blank" rel="noopener" href="https://wa.me/5571983448621">Fechar no WhatsApp com o mentor</a>
  <p class="note" id="note"></p>
  <p><a href="/membros/">Voltar</a></p>
</main>
<script src="./catalog.js"></script>
<script>
var params = new URLSearchParams(location.search);
var ref = params.get("ref") || "";
if (!ref && params.get("area")) ref = "area:" + params.get("area");
var oferta = window.akashaOferta(ref);
if (!oferta) location.replace("/membros/");
document.getElementById("title").textContent = oferta.nome;
document.getElementById("price").textContent = oferta.label;
if (oferta.capa) { document.getElementById("cover").src = oferta.capa; document.getElementById("cover").hidden = false; }
document.getElementById("zap").onclick = function () {
  var mail = document.getElementById("mail").value.trim();
  this.href = "https://wa.me/5571983448621?text=" + encodeURIComponent("Olá. Quero fechar no Pix, direto com o mentor.\n" + oferta.nome + "\n" + oferta.label + (mail ? "\nE-mail: " + mail : ""));
};
document.getElementById("pay").onclick = async function () {
  var mail = document.getElementById("mail").value.trim().toLowerCase();
  var note = document.getElementById("note");
  if (!mail.includes("@")) { note.textContent = "Coloca o Gmail de quem vai acessar."; return; }
  var link = (window.AKASHA_LINKS || {})[oferta.ref];
  if (link) {
    note.textContent = "Abrindo o Stripe…";
    location.href = link + "?prefilled_email=" + encodeURIComponent(mail) + "&client_reference_id=" + encodeURIComponent(mail);
    return;
  }
  note.textContent = "Abrindo o Stripe…";
  var success = "https://akashahub.com.br/members/?session_id={CHECKOUT_SESSION_ID}";
  try {
    var res = await fetch("https://jsonmxbuzagmwuucruem.supabase.co/functions/v1/createStoreCheckout", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb25teGJ1emFnbXd1dWNydWVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODAzMTMsImV4cCI6MjA5NjA1NjMxM30.qqBI_AUm_AnP4D830QNUd3JIbPE6o54yzwej0utJ6rQ", "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb25teGJ1emFnbXd1dWNydWVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODAzMTMsImV4cCI6MjA5NjA1NjMxM30.qqBI_AUm_AnP4D830QNUd3JIbPE6o54yzwej0utJ6rQ" },
      body: JSON.stringify({
        ref: oferta.ref,
        email: mail,
        success_url: success,
        cancel_url: "https://akashahub.com.br/membros/"
      })
    });
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (data.url) { location.href = data.url; return; }
    note.textContent = data.error === "unknown_ref"
      ? "Esse item ainda não está no Stripe."
      : "O Stripe não abriu. Nada foi cobrado.";
  } catch (e) {
    note.textContent = "O Stripe não abriu. Nada foi cobrado.";
  }
};
</script>
</body>
</html>
