<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · SPAVO Demo</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="demo-banner"><strong>Demo</strong> — Login da equipe (qualquer e-mail/senha entra)</div>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Entrar na equipe</h1>
      <p class="sub">Acesso para recepção e administradores</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" type="email" value="recepcao@demo.spavo.local" required />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input id="password" type="password" value="demo123" required />
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
      <p style="margin-top:1.25rem;font-size:0.8rem;color:var(--stone-500)">
        <a href="index.html" style="text-decoration:underline">Voltar ao início</a>
      </p>
    </div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
