<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://res.cloudinary.com/dcbarseus/image/upload/v1771197016/IMG_20260104_135834_828_etfko2.png">
<title>Diário de Operações · Akasha Hub</title>
<meta name="description" content="Diário de operações para estudo de trading. Registre, revise e acompanhe sua jornada sem pressão. Conteúdo educacional.">
<style>
:root{--bg:#f4f7f9;--sf:#fff;--tx:#1f2a37;--mu:#5b6b7b;--pr:#2f7f86;--onpr:#fff;--gd:#2e7d5b;--ls:#a8650f;--bd:#dbe3ea;--soft:#e8f2f3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181d;--sf:#1b242b;--tx:#e6edf2;--mu:#9fb0bd;--pr:#5fb3ba;--onpr:#0e1417;--gd:#5cc096;--ls:#e0a94f;--bd:#2b3842;--soft:#22323a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181d;--sf:#1b242b;--tx:#e6edf2;--mu:#9fb0bd;--pr:#5fb3ba;--onpr:#0e1417;--gd:#5cc096;--ls:#e0a94f;--bd:#2b3842;--soft:#22323a;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.2rem;margin:0 0 4px}
.mu{color:var(--mu);font-size:.95rem}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.streak{background:var(--soft);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:.9rem;white-space:nowrap}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
.dots{display:flex;gap:8px;margin:0 0 14px}
.dot{height:8px;flex:1;border-radius:99px;background:var(--bd)}.dot.on{background:var(--pr)}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:14px;min-height:52px}
textarea{min-height:96px;resize:vertical}
button{font:inherit;cursor:pointer;min-height:52px;border-radius:14px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 16px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
input:focus,textarea:focus{border-color:var(--pr)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 130px}
.chip[aria-pressed="true"]{background:var(--pr);color:var(--onpr);border-color:var(--pr);font-weight:600}
.go{width:100%;background:var(--pr);color:var(--onpr);border-color:var(--pr);font-weight:700;margin-top:18px}
.back{background:none;border:none;color:var(--mu);margin-top:6px;width:100%}
.msg{color:var(--ls);min-height:1.4em;margin-top:10px;font-size:.95rem}
.hint{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:.95rem;margin-bottom:14px}
.t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.win{color:var(--gd);font-weight:700}.loss{color:var(--ls);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:1.6rem;font-weight:700;line-height:1.2}
.del{min-height:40px;padding:4px 12px;font-size:.85rem;color:var(--mu)}
.wk{display:flex;gap:6px;margin-top:8px}.wk span{flex:1;text-align:center;border-radius:10px;padding:6px 0;background:var(--bg);font-size:.8rem;color:var(--mu)}.wk .ok{background:var(--pr);color:var(--onpr);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:180px;border:none;background:none;color:var(--mu);min-height:48px}
nav button[aria-current="page"]{background:var(--soft);color:var(--tx);font-weight:700}
.toast{background:var(--gd);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:14px}
nav button{padding:8px 2px;font-size:.82rem}
textarea{white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Navegação">
<button data-t="reg">✏️ Registrar</button>
<button data-t="hist">📖 Histórico</button>
<button data-t="notes">📝 Notas</button>
<button data-t="sum">📊 Resumo</button>
</nav>
<script>
var KEY="diario-operacoes-v1",tab="reg",step=1,toast="",msg="";
var d={ativo:"",dir:"",res:"",risco:"",emo:"",plano:"",stop:"",nota:""};
var EMO=["😌 Calmo","🎯 Focado","😟 Ansioso","🤩 Empolgado","😨 Com medo","😤 Frustrado"];
var TIPS=["Regra de ouro: arrisque no máximo 1% do seu dinheiro por operação.","Sem stop loss, sem operação. Ele é o seu cinto de segurança.","Perder faz parte. O que importa é seguir o plano.","Menos operações, mais qualidade. Respire antes de entrar.","Registrar já é uma vitória, mesmo em dia de prejuízo."];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
var trades=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(trades))}catch(e){}}
var NKEY="diario-notas-v1",NT=["💡 Ideia","📚 Lição","📏 Regra","❓ Dúvida"],nt="",ntag="",nfilter="";
function loadN(){try{return JSON.parse(localStorage.getItem(NKEY))||[]}catch(e){return []}}
var notes=loadN();
function saveN(){try{localStorage.setItem(NKEY,JSON.stringify(notes))}catch(e){}}
function nchips(attr,cur){return '<div class="row" role="group">'+NT.map(function(o){return '<button class="chip" data-'+attr+'="'+esc(o)+'" aria-pressed="'+(cur===o)+'">'+esc(o)+'</button>'}).join("")+'</div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&","<":"<",">":">",'"':"""}[c]})}
function brl(n){return(n<0?"−":"")+"R$ "+Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function day(t){var x=new Date(t);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function streak(){var s={};trades.forEach(function(t){s[day(t.t)]=1});var n=0,c=new Date();if(!s[day(c)])c.setDate(c.getDate()-1);while(s[day(c)]){n++;c.setDate(c.getDate()-1)}return n}
function readForm(){var g=function(i){var e=document.getElementById(i);return e?e.value:null};
 ["ativo","res","risco","nota"].forEach(function(k){var v=g(k);if(v!==null)d[k]=v})}
function chips(key,opts){return '<div class="row" role="group">'+opts.map(function(o){var v=o.v||o;var l=o.l||o;return '<button class="chip" data-k="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+(d[key]===v)+'">'+esc(l)+'</button>'}).join("")+'</div>'}
function dots(){return '<div class="dots" aria-label="Passo '+step+' de 3">'+[1,2,3].map(function(i){return '<div class="dot'+(i<=step?" on":"")+'"></div>'}).join("")+'</div>'}
function head(){var s=streak();return '<div class="top"><div><h1>Diário de Operações</h1><div class="mu">Um passo de cada vez.</div></div><div class="streak">🔥 '+s+(s===1?" dia":" dias")+'</div></div>'}
function viewReg(){
 var h=head()+(toast?'<div class="toast" role="status">'+toast+'</div>':"");
 if(step===1&&!toast)h+='<div class="hint">💡 '+TIPS[new Date().getDate()%TIPS.length]+'</div>';
 h+='<div class="card">'+dots();
 if(step===1){h+='<h2>1. O que você operou?</h2><p class="mu">Só o básico. Leva 10 segundos.</p><label for="ativo">Ativo</label><input id="ativo" placeholder="Ex.: BTCUSD, PETR4" value="'+esc(d.ativo)+'" autocomplete="off"><label>Direção</label>'+chips("dir",[{v:"Compra",l:"📈 Compra"},{v:"Venda",l:"📉 Venda"}])}
 if(step===2){h+='<h2>2. Como foi o resultado?</h2><p class="mu">Use número negativo para perda (ex.: -25).</p><label for="res">Resultado em R$</label><input id="res" type="number" inputmode="decimal" step="any" placeholder="Ex.: 40 ou -25" value="'+esc(d.res)+'"><label for="risco">Quanto você planejou arriscar? (opcional)</label><input id="risco" type="number" inputmode="decimal" step="any" placeholder="Ex.: 20" value="'+esc(d.risco)+'">'}
 if(step===3){h+='<h2>3. Como você estava por dentro?</h2><label>Emoção na hora de entrar</label>'+chips("emo",EMO)+'<label>Segui meu plano?</label>'+chips("plano",[{v:"sim",l:"✅ Sim"},{v:"mais ou menos",l:"〰️ Mais ou menos"},{v:"não",l:"❌ Não"}])+'<label>Usei stop loss?</label>'+chips("stop",[{v:"sim",l:"🛡️ Sim"},{v:"não",l:"Não"}])+'<label for="nota">O que aprendi? (1 frase basta)</label><textarea id="nota" placeholder="Ex.: Entrei com pressa. Da próxima, espero o candle fechar.">'+esc(d.nota)+'</textarea>'}
 h+='<div class="msg" role="alert">'+esc(msg)+'</div><button class="go" id="next">'+(step===3?"Salvar registro ✔":"Continuar →")+'</button>'+(step>1?'<button class="back" id="prev">← Voltar</button>':"")+'</div>';
 return h}
function viewHist(){
 var h=head();
 if(!trades.length)return h+'<div class="card"><h2>Nada por aqui ainda</h2><p class="mu">Seu primeiro registro aparece aqui. Comece pela aba Registrar.</p></div>';
 trades.slice().reverse().forEach(function(t){var w=t.res>=0;
 h+='<div class="card"><div class="t"><div><strong>'+esc(t.ativo)+'</strong> · '+esc(t.dir)+'<div class="mu">'+new Date(t.t).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+'</div></div><div class="'+(w?"win":"loss")+'">'+brl(t.res)+'</div></div><p class="mu" style="margin:10px 0 0">'+esc(t.emo||"")+(t.plano?" · plano: "+esc(t.plano):"")+(t.stop?" · stop: "+esc(t.stop):"")+'</p>'+(t.nota?'<p style="margin:8px 0 0">“'+esc(t.nota)+'”</p>':"")+'<div style="margin-top:10px"><button class="del" data-del="'+t.t+'">Apagar</button></div></div>'});
 return h}
function avg(a){return a.length?a.reduce(function(x,y){return x+y.res},0)/a.length:0}
function viewSum(){
 var h=head();
 if(!trades.length)return h+'<div class="card"><h2>Seu resumo aparece aqui</h2><p class="mu">Registre sua primeira operação e veja seus padrões. Sem pressa.</p></div>';
 var n=trades.length,wins=trades.filter(function(t){return t.res>0}).length,tot=trades.reduce(function(x,t){return x+t.res},0);
 var seg=trades.filter(function(t){return t.plano==="sim"}),nao=trades.filter(function(t){return t.plano&&t.plano!=="sim"});
 var ec={};trades.forEach(function(t){if(t.emo)ec[t.emo]=(ec[t.emo]||0)+1});
 var top=Object.keys(ec).sort(function(a,b){return ec[b]-ec[a]})[0];
 var days={};trades.forEach(function(t){days[day(t.t)]=1});var wk="",c=new Date();c.setDate(c.getDate()-6);
 for(var i=0;i<7;i++){wk+='<span class="'+(days[day(c)]?"ok":"")+'">'+["D","S","T","Q","Q","S","S"][c.getDay()]+'</span>';c.setDate(c.getDate()+1)}
 h+='<div class="grid"><div class="card"><div class="mu">Operações</div><div class="big">'+n+'</div></div><div class="card"><div class="mu">Taxa de acerto</div><div class="big">'+Math.round(wins/n*100)+'%</div></div></div>';
 h+='<div class="card"><div class="mu">Resultado total</div><div class="big '+(tot>=0?"win":"loss")+'">'+brl(tot)+'</div></div>';
 h+='<div class="card"><h2>Seu padrão mais importante</h2>';
 if(seg.length&&nao.length)h+='<p>Quando você <strong>seguiu o plano</strong>, a média foi <span class="'+(avg(seg)>=0?"win":"loss")+'">'+brl(avg(seg))+'</span>. Quando não seguiu, <span class="'+(avg(nao)>=0?"win":"loss")+'">'+brl(avg(nao))+'</span>.</p>';
 else h+='<p class="mu">Registre operações com e sem seguir o plano para ver a comparação.</p>';
 if(top)h+='<p class="mu">Emoção mais frequente: '+esc(top)+'</p>';
 h+='</div><div class="card"><h2>Últimos 7 dias</h2><div class="wk">'+wk+'</div><p class="mu" style="margin:10px 0 0">Dias preenchidos ficam coloridos. Um dia em branco não apaga seu progresso.</p></div>';
 return h}
function viewNotes(){
 var h=head();
 if(toast){h+='<div class="toast" role="status">'+toast+'</div>';toast=""}
 h+='<div class="card"><h2>Bloco de notas</h2><p class="mu">Anote ideias, regras e dúvidas. Curto já vale.</p><label>Tipo (opcional)</label>'+nchips("nt",ntag)+'<label for="ntext">Sua nota</label><textarea id="ntext" placeholder="Ex.: Só entro depois do candle fechar.">'+esc(nt)+'</textarea><div class="msg" role="alert">'+esc(msg)+'</div><button class="go" id="nsave">Salvar nota</button></div>';
 var list=notes.filter(function(n){return !nfilter||n.tag===nfilter}).slice().reverse();
 if(notes.length)h+='<label>Filtrar por tipo</label>'+nchips("nf",nfilter);
 if(!list.length)h+='<p class="mu">'+(notes.length?"Nenhuma nota neste tipo.":"Suas notas aparecem aqui.")+'</p>';
 list.forEach(function(n){h+='<div class="card"><div class="mu">'+esc(n.tag||"📝 Nota")+' · '+new Date(n.t).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+'</div><p style="margin:8px 0;white-space:pre-wrap">'+esc(n.txt)+'</p><button class="del" data-ndel="'+n.t+'">Apagar</button></div>'});
 return h}
function render(){
 var app=document.getElementById("app");
 app.innerHTML=tab==="reg"?viewReg():tab==="hist"?viewHist():tab==="notes"?viewNotes():viewSum();
 document.querySelectorAll("nav button").forEach(function(b){if(b.dataset.t===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
 window.scrollTo(0,0)}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 var ta=document.getElementById("ntext");if(ta)nt=ta.value;
 if(b.dataset.nt){ntag=ntag===b.dataset.nt?"":b.dataset.nt;render();return}
 if(b.dataset.nf){nfilter=nfilter===b.dataset.nf?"":b.dataset.nf;render();return}
 if(b.dataset.ndel){if(confirm("Apagar esta nota?")){notes=notes.filter(function(n){return String(n.t)!==b.dataset.ndel});saveN();render()}return}
 if(b.id==="nsave"){if(!nt.trim()){msg="Escreva algo antes de salvar.";render();return}notes.push({t:Date.now(),tag:ntag,txt:nt.trim()});saveN();nt="";ntag="";msg="";toast="Nota salva! 📝";render();return}
 if(b.dataset.t){tab=b.dataset.t;toast="";msg="";render();return}
 if(b.dataset.k){readForm();d[b.dataset.k]=d[b.dataset.k]===b.dataset.v?"":b.dataset.v;render();return}
 if(b.dataset.del){if(confirm("Apagar este registro?")){trades=trades.filter(function(t){return String(t.t)!==b.dataset.del});save();render()}return}
 if(b.id==="prev"){readForm();step--;msg="";render();return}
 if(b.id==="next"){readForm();msg="";
  if(step===1&&(!d.ativo.trim()||!d.dir)){msg="Preencha o ativo e escolha compra ou venda.";render();return}
  if(step===2&&(d.res===""||isNaN(parseFloat(d.res)))){msg="Digite o resultado em número. Ex.: 40 ou -25.";render();return}
  if(step<3){step++;toast="";render();return}
  trades.push({t:Date.now(),ativo:d.ativo.trim().toUpperCase(),dir:d.dir,res:parseFloat(d.res),risco:parseFloat(d.risco)||0,emo:d.emo,plano:d.plano,stop:d.stop,nota:d.nota.trim()});save();
  d={ativo:"",dir:"",res:"",risco:"",emo:"",plano:"",stop:"",nota:""};step=1;toast="Registrado! Cada registro te deixa mais consciente. 🌱";render()}
});
render();
</script>
</body>
</html>
