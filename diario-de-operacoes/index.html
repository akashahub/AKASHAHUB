<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://res.cloudinary.com/dcbarseus/image/upload/v1771197016/IMG_20260104_135834_828_etfko2.png">
<title>Diário de Operações · Akasha Hub</title>
<meta name="description" content="Diário de operações para estudo de trading. Registre, revise e acompanhe sua jornada sem pressão. Conteúdo educacional.">
<meta name="theme-color" content="#1a2332">
<style>
:root{
  --bg:#f6f7f9;--sf:#ffffff;--tx:#1a2332;--mu:#5c6b7a;--pr:#2a6f75;--onpr:#fff;
  --gd:#3a7d5c;--ls:#b07a2a;--bd:#e4e8ed;--soft:#eef4f5;--accent:#c9a227;
  --radius:16px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
  color-scheme:light
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1419;--sf:#1a222b;--tx:#e8eef3;--mu:#9aa8b5;--pr:#5eb3ba;--onpr:#0c1216;
    --gd:#6bc4a0;--ls:#e0b56a;--bd:#2a3642;--soft:#1e2c34;--accent:#d4af37;
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#0f1419;--sf:#1a222b;--tx:#e8eef3;--mu:#9aa8b5;--pr:#5eb3ba;--onpr:#0c1216;
  --gd:#6bc4a0;--ls:#e0b56a;--bd:#2a3642;--soft:#1e2c34;--accent:#d4af37;
  color-scheme:dark
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:88px}
main{max-width:540px;margin:0 auto;padding:20px 16px}
h1{font-size:1.35rem;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0 0 6px;font-weight:650}
.mu{color:var(--mu);font-size:.92rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px}
.streak{background:var(--soft);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.dots{display:flex;gap:6px;margin:0 0 16px}
.dot{height:6px;flex:1;border-radius:99px;background:var(--bd);transition:background .2s}
.dot.on{background:var(--pr)}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:.95rem}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;min-height:50px;transition:border-color .15s}
textarea{min-height:88px;resize:vertical}
button{font:inherit;cursor:pointer;min-height:50px;border-radius:12px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 16px;transition:background .15s,border-color .15s}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2.5px solid var(--pr);outline-offset:2px}
input:focus,textarea:focus{border-color:var(--pr)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.chip[aria-pressed="true"]{background:var(--pr);color:var(--onpr);border-color:var(--pr);font-weight:600}
.go{width:100%;background:var(--pr);color:var(--onpr);border-color:var(--pr);font-weight:650;margin-top:16px}
.back{background:none;border:none;color:var(--mu);margin-top:4px;width:100%;min-height:44px}
.msg{color:var(--ls);min-height:1.3em;margin-top:10px;font-size:.9rem}
.hint{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.92rem;margin-bottom:14px;border:1px solid var(--bd)}
.t{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.win{color:var(--gd);font-weight:650}
.loss{color:var(--ls);font-weight:650}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:1.55rem;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.del{min-height:36px;padding:4px 12px;font-size:.82rem;color:var(--mu);border-radius:10px}
.wk{display:flex;gap:4px;margin-top:10px}
.wk span{flex:1;text-align:center;border-radius:8px;padding:6px 0;background:var(--bg);font-size:.75rem;color:var(--mu);border:1px solid var(--bd)}
.wk .ok{background:var(--pr);color:var(--onpr);border-color:var(--pr);font-weight:650}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:4px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.04);z-index:10}
nav button{flex:1;max-width:140px;border:none;background:none;color:var(--mu);min-height:48px;font-size:.78rem;padding:6px 2px;border-radius:10px}
nav button[aria-current="page"]{background:var(--soft);color:var(--tx);font-weight:650}
.toast{background:var(--gd);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.95rem}
.theme-btn{position:absolute;top:16px;right:16px;min-height:36px;padding:6px 12px;font-size:.8rem;border-radius:10px;background:var(--soft);border:1px solid var(--bd)}
.disclaimer{font-size:.8rem;color:var(--mu);text-align:center;margin-top:20px;line-height:1.5}
.export{margin-top:12px;font-size:.9rem;color:var(--pr);background:none;border:none;text-decoration:underline;min-height:auto;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button class="theme-btn" id="themeToggle" type="button" aria-label="Alternar tema">◐ Tema</button>
<main id="app"></main>
<nav aria-label="Navegação">
  <button data-t="reg">✏️ Registrar</button>
  <button data-t="hist">📖 Histórico</button>
  <button data-t="notes">📝 Notas</button>
  <button data-t="sum">📊 Resumo</button>
</nav>
<script>
(function(){
  const KEY="diario-operacoes-v1", NKEY="diario-notas-v1";
  let tab="reg", step=1, toast="", msg="";
  let d={ativo:"",dir:"",res:"",risco:"",emo:"",plano:"",stop:"",nota:""};
  const EMO=["😌 Calmo","🎯 Focado","😟 Ansioso","🤩 Empolgado","😨 Com medo","😤 Frustrado"];
  const TIPS=["Arrisque no máximo 1% do capital por operação.","Sem stop loss, sem operação.","Perder faz parte. O plano é o que conta.","Menos operações, mais qualidade.","Registrar já é progresso, mesmo no prejuízo."];
  const NT=["💡 Ideia","📚 Lição","📏 Regra","❓ Dúvida"];
  let nt="", ntag="", nfilter="";

  function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  let trades=load(KEY), notes=load(NKEY);

  function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&","<":"<",">":">",'"':"""}[c]))}
  function brl(n){const abs=Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?"−":"")+"R$ "+abs}
  function day(t){const x=new Date(t);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
  function streak(){
    const s={};trades.forEach(t=>s[day(t.t)]=1);
    let n=0,c=new Date();
    if(!s[day(c)])c.setDate(c.getDate()-1);
    while(s[day(c)]){n++;c.setDate(c.getDate()-1)}
    return n;
  }
  function readForm(){
    ["ativo","res","risco","nota"].forEach(k=>{const el=document.getElementById(k);if(el)d[k]=el.value});
  }
  function chips(key,opts){
    return '<div class="row" role="group">'+opts.map(o=>{
      const v=o.v||o, l=o.l||o;
      return '<button type="button" class="chip" data-k="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+(d[key]===v)+'">'+esc(l)+'</button>';
    }).join("")+'</div>';
  }
  function nchips(attr,cur){
    return '<div class="row" role="group">'+NT.map(o=>'<button type="button" class="chip" data-'+attr+'="'+esc(o)+'" aria-pressed="'+(cur===o)+'">'+esc(o)+'</button>').join("")+'</div>';
  }
  function dots(){return '<div class="dots" aria-label="Passo '+step+' de 3">'+[1,2,3].map(i=>'<div class="dot'+(i<=step?" on":"")+'"></div>').join("")+'</div>'}
  function head(){
    const s=streak();
    return '<div class="top"><div><h1>Diário de Operações</h1><div class="mu">Um passo de cada vez.</div></div><div class="streak">🔥 '+s+(s===1?" dia":" dias")+'</div></div>';
  }
  function viewReg(){
    let h=head()+(toast?'<div class="toast" role="status">'+toast+'</div>':"");
    if(step===1&&!toast)h+='<div class="hint">💡 '+TIPS[new Date().getDate()%TIPS.length]+'</div>';
    h+='<div class="card">'+dots();
    if(step===1) h+='<h2>1. O que você operou?</h2><p class="mu">Só o básico.</p><label for="ativo">Ativo</label><input id="ativo" placeholder="Ex.: PETR4, BTCUSD" value="'+esc(d.ativo)+'" autocomplete="off"><label>Direção</label>'+chips("dir",[{v:"Compra",l:"📈 Compra"},{v:"Venda",l:"📉 Venda"}]);
    if(step===2) h+='<h2>2. Resultado</h2><p class="mu">Número negativo para perda.</p><label for="res">Resultado em R$</label><input id="res" type="number" inputmode="decimal" step="any" placeholder="40 ou -25" value="'+esc(d.res)+'"><label for="risco">Risco planejado (opcional)</label><input id="risco" type="number" inputmode="decimal" step="any" placeholder="20" value="'+esc(d.risco)+'">';
    if(step===3) h+='<h2>3. Como você estava?</h2><label>Emoção ao entrar</label>'+chips("emo",EMO)+'<label>Seguiu o plano?</label>'+chips("plano",[{v:"sim",l:"✅ Sim"},{v:"mais ou menos",l:"〰️ Mais ou menos"},{v:"não",l:"❌ Não"}])+'<label>Usou stop?</label>'+chips("stop",[{v:"sim",l:"🛡️ Sim"},{v:"não",l:"Não"}])+'<label for="nota">O que aprendeu?</label><textarea id="nota" placeholder="Uma frase.">'+esc(d.nota)+'</textarea>';
    h+='<div class="msg" role="alert">'+esc(msg)+'</div><button class="go" id="next" type="button">'+(step===3?"Salvar registro":"Continuar →")+'</button>'+(step>1?'<button class="back" id="prev" type="button">← Voltar</button>':"")+'</div>';
    return h;
  }
  function viewHist(){
    let h=head();
    if(!trades.length) return h+'<div class="card"><h2>Nada ainda</h2><p class="mu">Seu primeiro registro aparece aqui.</p></div>';
    trades.slice().reverse().forEach(t=>{
      const w=t.res>=0;
      h+='<div class="card"><div class="t"><div><strong>'+esc(t.ativo)+'</strong> · '+esc(t.dir)+'<div class="mu">'+new Date(t.t).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+'</div></div><div class="'+(w?"win":"loss")+'">'+brl(t.res)+'</div></div><p class="mu" style="margin:10px 0 0">'+esc(t.emo||"")+(t.plano?" · plano: "+esc(t.plano):"")+(t.stop?" · stop: "+esc(t.stop):"")+'</p>'+(t.nota?'<p style="margin:8px 0 0">“'+esc(t.nota)+'”</p>':"")+'<button class="del" data-del="'+t.t+'" type="button">Apagar</button></div>';
    });
    return h;
  }
  function avg(a){return a.length?a.reduce((x,y)=>x+y.res,0)/a.length:0}
  function viewSum(){
    let h=head();
    if(!trades.length) return h+'<div class="card"><h2>Resumo vazio</h2><p class="mu">Registre para ver padrões.</p></div>';
    const n=trades.length, wins=trades.filter(t=>t.res>0).length, tot=trades.reduce((x,t)=>x+t.res,0);
    const seg=trades.filter(t=>t.plano==="sim"), nao=trades.filter(t=>t.plano&&t.plano!=="sim");
    const ec={};trades.forEach(t=>{if(t.emo)ec[t.emo]=(ec[t.emo]||0)+1});
    const top=Object.keys(ec).sort((a,b)=>ec[b]-ec[a])[0];
    const days={};trades.forEach(t=>days[day(t.t)]=1);
    let wk="", c=new Date();c.setDate(c.getDate()-6);
    for(let i=0;i<7;i++){wk+='<span class="'+(days[day(c)]?"ok":"")+'">'+["D","S","T","Q","Q","S","S"][c.getDay()]+'</span>';c.setDate(c.getDate()+1)}
    h+='<div class="grid"><div class="card"><div class="mu">Operações</div><div class="big">'+n+'</div></div><div class="card"><div class="mu">Taxa de acerto</div><div class="big">'+Math.round(wins/n*100)+'%</div></div></div>';
    h+='<div class="card"><div class="mu">Resultado total</div><div class="big '+(tot>=0?"win":"loss")+'">'+brl(tot)+'</div></div>';
    h+='<div class="card"><h2>Padrão</h2>';
    if(seg.length&&nao.length) h+='<p>Seguindo o plano: <span class="'+(avg(seg)>=0?"win":"loss")+'">'+brl(avg(seg))+'</span>. Sem seguir: <span class="'+(avg(nao)>=0?"win":"loss")+'">'+brl(avg(nao))+'</span>.</p>';
    else h+='<p class="mu">Registre com e sem plano para comparar.</p>';
    if(top) h+='<p class="mu">Emoção mais frequente: '+esc(top)+'</p>';
    h+='</div><div class="card"><h2>Últimos 7 dias</h2><div class="wk">'+wk+'</div><p class="mu" style="margin:10px 0 0">Dias em branco não apagam progresso.</p></div>';
    h+='<button class="export" id="export" type="button">Exportar CSV</button>';
    return h;
  }
  function viewNotes(){
    let h=head();
    if(toast){h+='<div class="toast" role="status">'+toast+'</div>';toast=""}
    h+='<div class="card"><h2>Notas</h2><p class="mu">Ideias, regras, dúvidas.</p><label>Tipo</label>'+nchips("nt",ntag)+'<label for="ntext">Texto</label><textarea id="ntext" placeholder="Uma frase.">'+esc(nt)+'</textarea><div class="msg" role="alert">'+esc(msg)+'</div><button class="go" id="nsave" type="button">Salvar nota</button></div>';
    const list=notes.filter(n=>!nfilter||n.tag===nfilter).slice().reverse();
    if(notes.length) h+='<label>Filtrar</label>'+nchips("nf",nfilter);
    if(!list.length) h+='<p class="mu">'+(notes.length?"Nada neste tipo.":"Notas aparecem aqui.")+'</p>';
    list.forEach(n=>{h+='<div class="card"><div class="mu">'+esc(n.tag||"Nota")+' · '+new Date(n.t).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+'</div><p style="margin:8px 0;white-space:pre-wrap">'+esc(n.txt)+'</p><button class="del" data-ndel="'+n.t+'" type="button">Apagar</button></div>'});
    return h;
  }
  function render(){
    const app=document.getElementById("app");
    app.innerHTML=(tab==="reg"?viewReg():tab==="hist"?viewHist():tab==="notes"?viewNotes():viewSum())+'<p class="disclaimer">Conteúdo educacional. Não é recomendação de investimento. A maioria das pessoas que opera no curto prazo perde dinheiro.</p>';
    document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.t===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
    window.scrollTo(0,0);
  }
  document.addEventListener("click",function(e){
    const b=e.target.closest("button");if(!b)return;
    const ta=document.getElementById("ntext");if(ta)nt=ta.value;
    if(b.id==="themeToggle"){
      const root=document.documentElement;
      const next=root.dataset.theme==="dark"?"light":"dark";
      root.dataset.theme=next;
      localStorage.setItem("diario-theme",next);
      return;
    }
    if(b.id==="export"){
      const csv=["data,ativo,direcao,resultado,risco,emocao,plano,stop,nota"].concat(trades.map(t=>[new Date(t.t).toISOString(),t.ativo,t.dir,t.res,t.risco||"",t.emo||"",t.plano||"",t.stop||"",(t.nota||"").replace(/"/g,'""')].map(x=>'"'+x+'"').join(","))).join("\n");
      const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="diario-operacoes.csv";a.click();
      return;
    }
    if(b.dataset.nt){ntag=ntag===b.dataset.nt?"":b.dataset.nt;render();return}
    if(b.dataset.nf){nfilter=nfilter===b.dataset.nf?"":b.dataset.nf;render();return}
    if(b.dataset.ndel){if(confirm("Apagar nota?")){notes=notes.filter(n=>String(n.t)!==b.dataset.ndel);save(NKEY,notes);render()}return}
    if(b.id==="nsave"){if(!nt.trim()){msg="Escreva algo.";render();return}notes.push({t:Date.now(),tag:ntag,txt:nt.trim()});save(NKEY,notes);nt="";ntag="";msg="";toast="Nota salva.";render();return}
    if(b.dataset.t){tab=b.dataset.t;toast="";msg="";render();return}
    if(b.dataset.k){readForm();d[b.dataset.k]=d[b.dataset.k]===b.dataset.v?"":b.dataset.v;render();return}
    if(b.dataset.del){if(confirm("Apagar registro?")){trades=trades.filter(t=>String(t.t)!==b.dataset.del);save(KEY,trades);render()}return}
    if(b.id==="prev"){readForm();step--;msg="";render();return}
    if(b.id==="next"){
      readForm();msg="";
      if(step===1&&(!d.ativo.trim()||!d.dir)){msg="Preencha o ativo e a direção.";render();return}
      if(step===2&&(d.res===""||isNaN(parseFloat(d.res)))){msg="Digite o resultado (ex.: 40 ou -25).";render();return}
      if(step<3){step++;toast="";render();return}
      trades.push({t:Date.now(),ativo:d.ativo.trim().toUpperCase(),dir:d.dir,res:parseFloat(d.res),risco:parseFloat(d.risco)||0,emo:d.emo,plano:d.plano,stop:d.stop,nota:d.nota.trim()});
      save(KEY,trades);
      d={ativo:"",dir:"",res:"",risco:"",emo:"",plano:"",stop:"",nota:""};step=1;toast="Registrado.";render();
    }
  });
  // theme
  const saved=localStorage.getItem("diario-theme");
  if(saved) document.documentElement.dataset.theme=saved;
  render();
})();
</script>
</body>
</html>
