<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100c18">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Essência · Arquitetura de Legado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="essencia.css?v=12">
</head>
<body>
<div class="shell">
<aside class="side" id="sidebar">
  <div class="brand"><div class="sigil">✦</div><div><b>AKASHA · ESSÊNCIA</b><small>ARQUITETURA DE ESSÊNCIA</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-view="dashboard">Visão geral</button>
    <button data-view="historia">História pessoal</button>
    <button data-view="valores">Valores e crenças</button>
    <button data-view="posicionamento">Posicionamento</button>
    <button data-view="proposito">Propósito e direção</button>
    <button data-view="dossie">Dossiê de Essência</button>
  </nav>
  <div class="sidefoot"><strong>Construa sua essência.</strong>Identidade, história e direção com clareza.</div>
</aside>
<main class="main">
<header class="top">
  <div style="display:flex;align-items:center;gap:12px">
    <button class="btn secondary mobilemenu" id="menuBtn">☰</button>
    <div class="crumb" id="breadcrumb">ESSÊNCIA / VISÃO GERAL</div>
  </div>
  <div class="topright">
    <span class="pill" id="userPill">-</span>
    <div class="avatar" id="avatar">E</div>
  </div>
</header>
<div class="content" id="content"></div>
</main>
</div>

<!-- Modal de Descoberta -->
<div id="discoveryModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <button class="modal-close" id="modalClose">×</button>
    <div class="eyebrow">Descoberta guiada</div>
    <h2 class="title" id="modalTitle">Descobrir</h2>
    <p class="sub" id="modalSubtitle">Responda as perguntas para gerar uma sugestão.</p>
    <form id="discoveryForm">
      <div id="modalQuestions"></div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button type="button" class="btn secondary" id="modalCancel">Cancelar</button>
        <button type="submit" class="btn">Gerar sugestão</button>
      </div>
    </form>
    <div id="modalResult" class="hidden" style="margin-top:20px">
      <div class="eyebrow">Sugestão</div>
      <div class="card" id="suggestionText"></div>
      <button class="btn" id="useSuggestion">Usar esta sugestão</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="essencia.js?v=12"></script>
</body>
</html>
