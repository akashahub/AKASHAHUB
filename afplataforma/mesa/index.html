<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mesa · Francesca · Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mesa.css">
</head>
<body>
<div id="fcLock">
  <div class="lock-card">
    <p class="kicker">AF Plataforma · sessão do mentor</p>
    <h1>Mentor</h1>
    <p data-lock-msg>Só o mentor. Nada da call aparece sem a sessão.</p>
    <p class="lock-back"><a href="../index.html">Voltar à AF</a></p>
  </div>
</div>

<div class="app">
  <header class="shell">
    <button type="button" class="brand" data-view="mesa">
      Mesa <span>Francesca</span>
    </button>
    <span class="badge" id="modeBadge">Fechamento</span>
    <span class="badge badge-ok" id="closedBadge" hidden>Fechada</span>
    <div class="clock-wrap">
      <span class="clock" id="clock">00:00</span>
      <button type="button" class="btn-icon" id="btnTimer" aria-label="Iniciar cronômetro">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button type="button" class="btn-icon ghost" id="btnResetTimer" aria-label="Zerar">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav">
      <button type="button" data-view="mesa">Mesa</button>
      <button type="button" data-view="caderno">Caderno</button>
      <button type="button" data-view="fechamento">Fechamento</button>
      <button type="button" data-view="af">AF Plataforma</button>
      <button type="button" data-view="convergencia">Convergência</button>
      <button type="button" data-view="faixas">Faixas</button>
      <button type="button" data-view="objecoes">Objeções</button>
      <button type="button" data-view="ascensao">Ascensão</button>
      <button type="button" data-view="mapa">Mapa Mãe</button>
      <button type="button" data-view="acesso">Antes / Depois</button>
      <a id="fcBack" href="../index.html">Sair</a>
    </nav>
  </header>
  <main class="page" id="page"></main>
</div>
<div id="toast" hidden></div>
<script type="module" src="../assets/js/fechamento-gate.js?v=mesa3"></script>
<script src="mesa-data.js?v=mesa3"></script>
<script src="mesa.js?v=mesa3"></script>
<script src="mesa-views.js?v=mesa3"></script>
</body>
</html>
