<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Fechamento de Call · Mentor · AF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fechamento.css">
</head>
<body>
<div id="fcLock">
  <div>
    <p class="kicker">Privado</p>
    <h1>Fechamento de Call</h1>
    <p data-lock-msg>Entre com a conta do mentor.</p>
    <p><a href="../index.html">Voltar à AF</a></p>
  </div>
</div>
<div class="app">
  <header class="top">
    <div class="brand">AF · Fechamento de Call</div>
    <div class="row" style="margin:0">
      <a id="fcBack" href="../index.html">Dashboard</a>
      <div class="tabs">
        <button type="button" class="btn on" data-tab="call">Call</button>
        <button type="button" class="btn" data-tab="dna">DNA comercial</button>
      </div>
    </div>
  </header>
  <div id="viewCall">
    <div class="layout">
      <aside class="map" id="map"></aside>
      <section class="main" id="main"></section>
      <aside class="side" id="side"></aside>
    </div>
    <p id="saved" class="hint" style="margin:0 16px 16px"></p>
  </div>
  <div id="viewDna" class="hidden main">
    <p class="kicker">Pesquisa</p>
    <h2>DNA comercial da AF</h2>
    <p>Síntese nossa. Não é método oficial de Igor Mello. Cada bloco diz se foi verificado, interpretação, adaptação ou pendente.</p>
    <div id="dnaList"></div>
  </div>
</div>
<div class="tp" id="tp">
  <div class="meta">
    <button class="btn" type="button" data-act="closeTp">Sair do teleprompt</button>
    <label>Letra <input id="tpSize" type="range" min="20" max="48" value="28"></label>
  </div>
  <div id="tpBody"></div>
</div>
<script type="module" src="../assets/js/fechamento-gate.js"></script>
<script src="fechamento.js"></script>
</body>
</html>
