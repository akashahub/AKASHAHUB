<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Biblioteca de Soluções · Império Digital</title>
<link rel="stylesheet" href="biblioteca.css">
</head>
<body>
<header class="top"><div class="wrap" style="display:flex;justify-content:space-between;gap:12px;width:min(1180px,100%)"><a class="brand" href="./">Império Digital</a><a class="back" href="/afplataforma/">Voltar à plataforma</a></div></header>
<main class="wrap">
  <section class="hero" data-forma="poeira" data-alfa="0.5">
    <p class="eyebrow">Fase 2 · Biblioteca</p>
    <h1>Soluções <span>digitais</span></h1>
    <p class="lead">Cada card abre uma página. O portfólio de plataformas e o laboratório de anúncios continuam. Nada aqui envia mensagem sozinho.</p>
  </section>
  <div class="filters">
    <label class="f">Busca<input id="q" type="search" placeholder="Problema, segmento ou nome"></label>
    <label class="f">Categoria<select id="cat"><option value="">Todas</option>
<option value="sites">Sites e experiência visual</option>
<option value="web">Sites funcionais e aplicações web</option>
<option value="agenda">Agendamento e gestão de horários</option>
<option value="comercio">Comércio digital e pagamentos</option>
<option value="ads">Publicidade e criativos com IA</option>
<option value="vendas">Vendas e CRM</option>
<option value="atendimento">Atendimento e relacionamento</option>
<option value="automacao">Automação e integrações</option>
<option value="gestao">Gestão e inteligência empresarial</option>
<option value="seguranca">Segurança digital e infraestrutura</option>
<option value="educacao">Educação e treinamento</option>
<option value="comunidade">Comunidades e assinaturas</option>
<option value="rh">RH, recrutamento e seleção</option>
<option value="restaurante">Restaurantes, bares e gastronomia</option>
<option value="criadores">Criadores, streamers e entretenimento</option>
<option value="eventos">Eventos e experiências</option>
<option value="imoveis">Imobiliário e gestão de propriedades</option>
<option value="logistica">Logística, distribuição e operações</option>
<option value="saude">Saúde, clínicas e serviços profissionais</option>
<option value="saas">SaaS, plataformas multiempresa e produtos próprios</option>
<option value="video">Edição profissional de vídeos e pós-produção</option>
    </select></label>
    <button class="btn ghost" type="button" id="limpar">Limpar</button>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grade" data-forma="onda" data-alfa="0.4"></div>
</main>
<script src="catalogo.js"></script>
<script src="biblioteca.js"></script>
<script>
document.getElementById("limpar").onclick = function () {
  document.getElementById("q").value = "";
  document.getElementById("cat").value = "";
  document.getElementById("q").dispatchEvent(new Event("input"));
};
</script>
</body>
</html>
