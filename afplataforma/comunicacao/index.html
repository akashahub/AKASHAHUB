<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100c18">
<title>Comunicação · Arquitetura de Essência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comunicacao.css">
</head>
<body>
<div class="shell">
<aside class="side" id="sidebar">
  <div class="brand"><div class="sigil">✦</div><div><b>AKASHA · COMUNICAÇÃO</b><small>COMUNICAÇÃO E AUTORIDADE</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-view="dashboard">Visão geral</button>
    <button data-view="estilo">Estilo de comunicação</button>
    <button data-view="mensagens">Mensagens-chave</button>
    <button data-view="presenca">Presença e impacto</button>
    <button data-view="autoridade">Autoridade</button>
    <button data-view="plano">Plano de Comunicação</button>
  </nav>
  <div class="sidefoot"><strong>Comunicação com essência.</strong>Clareza, presença e autoridade.</div>
</aside>
<main class="main">
<header class="top">
  <div style="display:flex;align-items:center;gap:12px">
    <button class="btn secondary mobilemenu" id="menuBtn">☰</button>
    <div class="crumb" id="breadcrumb">COMUNICAÇÃO / VISÃO GERAL</div>
  </div>
  <div class="topright">
    <span class="pill" id="userPill">-</span>
    <div class="avatar" id="avatar">C</div>
  </div>
</header>
<div class="content" id="content"></div>
</main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="comunicacao.js"></script>
</body>
</html>
