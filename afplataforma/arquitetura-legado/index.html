<html lang="pt-BR">

<style>
:root{color-scheme:dark;--bg:#100c18;--panel:#191322;--panel2:#211a2d;--gold:#d6b45d;--gold2:#f0d991;--text:#f8f4fc;--muted:#b6adbf;--line:#3a2e47;--violet:#a78bfa;--green:#7ed6ac;--red:#ff8a94;--r:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#39224f 0,transparent 38%),radial-gradient(ellipse at -10% 80%,#302039 0,transparent 35%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.side{padding:24px 15px;border-right:1px solid var(--line);background:#100c18d9;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 25px;border-bottom:1px solid var(--line);margin-bottom:20px}.sigil{height:42px;width:42px;border:1px solid #d6b45d88;border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:22px}.brand b{letter-spacing:.17em;font-size:12px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-top:3px}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;text-align:left;background:transparent;color:var(--muted);padding:12px 13px;border-radius:12px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{color:white;background:#a78bfa16;border-color:#a78bfa45}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.ni{width:20px;text-align:center;color:var(--gold2)}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:17px 7px 0;color:var(--muted);font-size:11px}.sidefoot strong{color:var(--text);display:block;font-size:12px;margin-bottom:5px}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,44px);gap:12px}.crumb{color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);padding:6px 10px;border-radius:999px;color:var(--muted);font-size:10px;letter-spacing:.08em}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#352342;border:1px solid #d6b45d55;color:var(--gold2)}.content{max-width:1280px;padding:clamp(20px,4vw,42px);margin:auto}.eyebrow{color:var(--gold2);text-transform:uppercase;letter-spacing:.19em;font-size:10px;font-weight:700}.title{font:600 clamp(34px,4.5vw,56px)/1.02 'Cormorant Garamond',serif;margin:10px 0}.sub{color:var(--muted);max-width:760px;margin:0}.hero{padding:clamp(22px,4vw,38px);border:1px solid #d6b45d40;border-radius:24px;background:linear-gradient(115deg,#21182dcc,#17111fdd);position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:7%;top:4%;font-size:130px;color:#d6b45d0c;pointer-events:none}.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:24px;align-items:center}.ring{width:154px;height:154px;border-radius:50%;background:conic-gradient(var(--gold) var(--progress,0%),#ffffff12 0);display:grid;place-items:center;margin:auto;position:relative}.ring:before{content:'';position:absolute;inset:9px;background:#1b1426;border-radius:50%}.ringin{position:relative;text-align:center}.ringin b{font:600 37px 'Cormorant Garamond',serif;display:block}.ringin span{font-size:10px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{border:1px solid #d6b45d65;border-radius:11px;padding:11px 15px;background:linear-gradient(120deg,#d6b45d,#9d7830);color:#1b1420;font-weight:700;font-size:12px}.btn.secondary{background:#ffffff08;color:var(--text);border-color:var(--line)}.btn.ghost{background:transparent;color:var(--gold2)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0 28px}.card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(145deg,#20182bd9,#17111fdd);padding:19px;min-width:0}.statlabel{font-size:11px;color:var(--muted)}.statnum{font:600 32px 'Cormorant Garamond',serif;margin:3px 0}.statnote{font-size:10px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:30px 0 14px}.sectionhead h2{font:600 29px 'Cormorant Garamond',serif;margin:0}.sectionhead p{color:var(--muted);font-size:11px;margin:3px 0 0}.linkbtn{background:none;border:0;color:var(--gold2);font-size:11px}.phases{grid-template-columns:repeat(5,minmax(0,1fr))}.phase{padding:17px;position:relative;overflow:hidden}.phase .num{font:600 26px 'Cormorant Garamond',serif;color:var(--gold2)}.phase h3{font-size:13px;line-height:1.3;margin:8px 0}.phase p{color:var(--muted);font-size:11px;min-height:50px;margin:0}.status{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:5px 8px;font-size:9px;letter-spacing:.06em;background:#ffffff0a;border:1px solid var(--line);color:var(--muted)}.status:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.status.done{color:var(--green)}.status.current{color:var(--gold2)}.bar{height:4px;border-radius:9px;background:#ffffff12;overflow:hidden;margin:13px 0 11px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--violet));width:0}.two{grid-template-columns:1.2fr .8fr}.nextitem{display:flex;gap:14px;align-items:start;padding:13px 0;border-bottom:1px solid #ffffff0c}.nextitem:last-child{border:0}.iconbox{width:38px;height:38px;border-radius:12px;background:#d6b45d13;border:1px solid #d6b45d35;display:grid;place-items:center;color:var(--gold2);flex-shrink:0}.nextitem h3{font-size:12px;margin:0 0 3px}.nextitem p{font-size:11px;color:var(--muted);margin:0}.tag{font-size:9px;color:var(--violet);text-transform:uppercase;letter-spacing:.1em}.viewhead{margin-bottom:24px}.viewhead h1{font:600 clamp(33px,4vw,48px)/1.05 'Cormorant Garamond',serif;margin:8px 0}.phase-list{display:grid;gap:12px}.phase-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:start}.phase-row .numtile{height:52px;width:52px;border:1px solid #d6b45d55;border-radius:15px;display:grid;place-items:center;font:600 27px 'Cormorant Garamond',serif;color:var(--gold2)}.phase-row h3{margin:0 0 4px;font-size:14px}.phase-row p{margin:0;color:var(--muted);font-size:11px}.phase-row .rowtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:end}.meetinglist{display:grid;gap:10px}.meeting{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;align-items:start}.meetingno{font:600 25px 'Cormorant Garamond',serif;color:var(--gold2);text-align:center}.meeting h3{font-size:13px;margin:0 0 4px}.meeting p{font-size:11px;color:var(--muted);margin:0}.meetingmeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.meetingmeta span{font-size:9px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:var(--muted)}.donebtn{border:1px solid var(--line);background:#ffffff08;color:var(--muted);border-radius:9px;padding:8px 10px;font-size:10px;white-space:nowrap}.donebtn.done{border-color:#7ed6ac55;color:var(--green);background:#7ed6ac0b}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#100c18;color:var(--text);padding:11px 12px;border-radius:10px;outline:none}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--gold)}.asset{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #ffffff0c}.asset:last-child{border:0}.asset h3{font-size:12px;margin:0 0 3px}.asset p{font-size:10px;color:var(--muted);margin:0}.notice{padding:13px 15px;border-radius:12px;border:1px solid #d6b45d35;background:#d6b45d0b;color:var(--muted);font-size:11px;margin:18px 0}.notice strong{color:var(--gold2)}.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}.mobilemenu{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#282035;border:1px solid #d6b45d55;padding:12px 16px;border-radius:12px;box-shadow:0 15px 50px #0008;z-index:10}.footer{color:var(--muted);font-size:10px;margin-top:35px;padding-top:15px;border-top:1px solid var(--line)}
@media(max-width:1050px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.side{position:fixed;z-index:5;left:0;top:0;bottom:0;width:275px;height:100dvh;transform:translateX(-105%);transition:transform .2s}.side.open{transform:translateX(0)}.mobilemenu{display:inline-flex}.top{padding:0 17px}.topright .pill{display:none}.content{padding:20px 15px 32px}.hero-grid{grid-template-columns:1fr}.ring{width:125px;height:125px}.ringin b{font-size:31px}.phases,.formgrid{grid-template-columns:1fr}.phase p{min-height:0}.stats{gap:9px}.card{padding:15px}.statnum{font-size:28px}.meeting{grid-template-columns:39px minmax(0,1fr)}.meeting .donebtn{grid-column:2;justify-self:start}.phase-row{grid-template-columns:45px minmax(0,1fr)}.phase-row .numtile{width:42px;height:42px}.phase-row .rowtools{grid-column:2;justify-content:start}.sectionhead h2{font-size:25px}}
</style>

<body>
<div class="shell">
<aside class="side" id="sidebar">
  <div class="brand"><div class="sigil">✦</div><div><b>AKASHA · LEGADO</b><small>ARQUITETURA DE ESSÊNCIA</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-view="dashboard"><span class="ni">⌂</span>Visão geral</button>
    <button data-view="jornada"><span class="ni">◈</span>Minha jornada</button>
    <button data-view="encontros"><span class="ni">◎</span>Encontros em grupo</button>
    <button data-view="executivo"><span class="ni">✧</span>Produção executiva</button>
    <button data-view="essencia"><span class="ni">◇</span>Meu projeto</button>
  </nav>
  <div class="sidefoot"><strong>Uma construção por vez.</strong>Este ambiente organiza a jornada, as decisões e os próximos passos do seu legado.</div>
</aside>
<main class="main">
<header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn secondary mobilemenu" id="menuBtn" aria-label="Abrir menu">☰</button><div class="crumb" id="breadcrumb">CULTURA DE LEGADO / VISÃO GERAL</div></div><div class="topright"><span class="pill">JORNADA DE 12 MESES</span><div class="avatar">A</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const PHASES=[
 {id:1,name:"Arquitetura de Essência",short:"Essência",desc:"História, identidade, capacidades, valores e direção.",outcome:"Dossiê de Essência e direção inicial",tools:["História e contexto","Valores e capacidades","Visão de futuro","Direção estratégica"]},
 {id:2,name:"Arquitetura de Marca e Negócio",short:"Marca & negócio",desc:"Posicionamento, oferta, identidade e arquitetura comercial.",outcome:"Mapa de marca, oferta e negócio",tools:["Posicionamento e narrativa","Público e proposta de valor","Oferta e modelo de negócio","Ativos digitais prioritários"]},
 {id:3,name:"Construção e Consolidação",short:"Construção",desc:"Ativos, processos, operação e sustentação econômica.",outcome:"Plano de construção e operação",tools:["Plano de ativos","Processos e operação","Indicadores e finanças","Validação e consolidação"]},
 {id:4,name:"Expansão e Escala",short:"Expansão",desc:"Aquisição, comunicação, distribuição e crescimento sustentável.",outcome:"Plano de expansão priorizado",tools:["Aquisição e relacionamento","Conteúdo e distribuição","Canais e parcerias","Experimentos de crescimento"]},
 {id:5,name:"Governança e Legado",short:"Legado",desc:"Autonomia, documentação, continuidade e transmissão.",outcome:"Mapa de continuidade do legado",tools:["Documentação e governança","Responsabilidades e autonomia","Comunidade e transmissão","Plano de continuidade"]}
];
const MEETINGS=[
["Essência: ponto de partida","Mapear contexto, expectativas e o resultado que precisa mudar ao longo da jornada.",1],
["História, identidade e repertório","Transformar experiências e capacidades em matéria-prima estratégica.",1],
["Valores, critérios e visão de futuro","Definir princípios que orientam decisões e limites.",1],
["Capacidades e oportunidades","Identificar forças, ativos existentes e lacunas prioritárias.",1],
["Direção estratégica do legado","Consolidar a primeira leitura e definir as perguntas do próximo ciclo.",1],
["Posicionamento e diferenciação","Explicar para quem o projeto existe e por que importa.",2],
["Público e proposta de valor","Relacionar necessidades reais, valor entregue e evidências.",2],
["Narrativa, marca e comunicação","Organizar linguagem, mensagem e consistência da marca.",2],
["Oferta e modelo de negócio","Estruturar produtos, serviços, entrega e lógica comercial.",2],
["Arquitetura comercial e ativos","Priorizar presença digital e os ativos que sustentam a oferta.",2],
["Plano de construção priorizado","Transformar objetivos em entregas, responsáveis e dependências.",3],
["Ativos digitais e experiência","Definir como os ativos se conectam à jornada do cliente.",3],
["Operação, processos e sistemas","Reduzir improviso e tornar a execução repetível.",3],
["Indicadores e sustentabilidade","Escolher métricas úteis para acompanhar saúde e progresso.",3],
["Consolidação e revisão de decisões","Revisar evidências, gargalos e próximos movimentos.",3],
["Aquisição e relacionamento","Desenhar caminhos para atrair, converter e manter clientes.",4],
["Conteúdo e distribuição","Conectar mensagem, canais, frequência e objetivos.",4],
["Parcerias e oportunidades","Mapear relações que podem ampliar alcance e capacidade.",4],
["Experimentos de crescimento","Testar hipóteses com critérios claros e custo controlado.",4],
["Expansão sem perder essência","Ajustar capacidade, processos e prioridades antes de escalar.",4],
["Governança e documentação","Registrar como o projeto funciona e como as decisões são tomadas.",5],
["Autonomia e responsabilidades","Diminuir dependências desnecessárias do fundador.",5],
["Transmissão, comunidade e continuidade","Organizar conhecimento, relações e formas de perpetuar o legado.",5],
["Mapa do legado e próximo ciclo","Consolidar aprendizados, resultados e plano de continuidade.",5]
];
const EXEC=[
 {n:1,title:"Diagnóstico e definição",desc:"Revisar o contexto, validar prioridades e definir o escopo de produção executiva.",out:"Plano executivo acordado",questions:["Qual resultado é prioritário agora?","O que já existe e pode ser reaproveitado?","Quais entregas fazem parte do escopo acordado?"]},
 {n:2,title:"Construção e validação",desc:"Trabalhar nos ativos prioritários, revisar versões e tomar decisões com tela compartilhada.",out:"Versões e decisões registradas",questions:["O que precisa ser validado nesta sessão?","Quais informações ainda estão faltando?","Qual é o próximo ponto de controle?"]},
 {n:3,title:"Consolidação e continuidade",desc:"Revisar entregas, organizar acessos e registrar os próximos movimentos.",out:"Entregas consolidadas e plano de continuidade",questions:["O que foi entregue e aprovado?","Como o cliente usará cada ativo?","O que fica para o próximo ciclo?"]}
];
const KEY="akasha_legado_experience_v1";
const defaults={project:{name:"Meu projeto de legado",stage:"Ainda estou definindo",goal:"",audience:"",strengths:"",priority:"",notes:""},tasks:{},meetings:{},assets:[],execNotes:{},form:{},started:false};
let state=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render();toast("Informações salvas neste navegador.");}
function toast(s){const el=document.getElementById("toast");el.textContent=s;el.classList.remove("hidden");clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.add("hidden"),2600)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function doneMeetings(){return Object.values(state.meetings).filter(Boolean).length}
function taskCount(){return Object.values(state.tasks).filter(Boolean).length}
function progress(){return Math.round((doneMeetings()/24)*65+(Math.min(taskCount(),10)/10)*20+(state.started?15:0))}
function setView(v){state.view=v;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));document.getElementById("sidebar").classList.remove("open");render()}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b)setView(b.dataset.view)});
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
function head(kicker,title,sub){return '<div class="viewhead"><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div>'}
function phaseCards(){return PHASES.map(p=>{let count=MEETINGS.filter(m=>m[2]===p.id).length,done=MEETINGS.filter((m,i)=>m[2]===p.id&&state.meetings[i+1]).length;return '<article class="card phase"><div class="num">0'+p.id+'</div><h3>'+p.name+'</h3><p>'+p.desc+'</p><div class="bar"><span style="width:'+(count?done/count*100:0)+'%"></span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:7px"><span class="status '+(done===count?'done':done?'current':'')+'">'+(done===count?'Concluída':done?'Em andamento':'Planejada')+'</span><span style="font-size:10px;color:var(--muted)">'+done+'/'+count+'</span></div></article>'}).join("")}
function nextMeeting(){let i=MEETINGS.findIndex((m,idx)=>!state.meetings[idx+1]);return i<0?null:{i,m:MEETINGS[i]}}
function dashboard(){let nm=nextMeeting(),p=progress();return '<section class="hero"><div class="hero-grid"><div><div class="eyebrow">SUA JORNADA COMEÇA AQUI</div><h1 class="title">'+esc(state.project.name||"Meu legado")+'</h1><p class="sub">Um espaço para transformar clareza em decisões, decisões em ativos e ativos em continuidade. Você avança no seu ritmo, com orientação ao longo de todo o ecossistema.</p><div class="actions"><button class="btn" data-go="essencia">Continuar meu projeto →</button><button class="btn secondary" data-go="jornada">Explorar as cinco fases</button></div></div><div class="ring" style="--progress:'+p+'%"><div class="ringin"><b>'+p+'%</b><span>JORNADA</span></div></div></div></section><div class="grid stats"><div class="card"><div class="statlabel">Encontros coletivos</div><div class="statnum">'+doneMeetings()+' <span style="font-size:15px;color:var(--muted)">/ 24</span></div><div class="statnote">12 meses de acompanhamento</div></div><div class="card"><div class="statlabel">Fases da arquitetura</div><div class="statnum">5</div><div class="statnote">Um ecossistema conectado</div></div><div class="card"><div class="statlabel">Marcos executivos</div><div class="statnum">'+Object.values(state.execNotes).filter(x=>x&&x.trim()).length+' <span style="font-size:15px;color:var(--muted)">/ 3</span></div><div class="statnote">Sessões individuais planejadas</div></div><div class="card"><div class="statlabel">Ativos registrados</div><div class="statnum">'+state.assets.length+'</div><div class="statnote">Conforme o escopo do projeto</div></div></div><div class="sectionhead"><div><h2>As cinco fases</h2><p>O tema muda. A visão do legado permanece integrada.</p></div><button class="linkbtn" data-go="jornada">Ver jornada completa ↗</button></div><div class="grid phases">'+phaseCards()+'</div><div class="grid two"><section><div class="sectionhead"><div><h2>Seu próximo movimento</h2><p>Uma ação clara para manter o projeto em movimento.</p></div></div><div class="card">'+(nm?'<div class="nextitem"><div class="iconbox">◎</div><div><span class="tag">Próximo encontro · '+String(nm.i+1).padStart(2,"0")+'</span><h3>'+nm.m[0]+'</h3><p>'+nm.m[1]+'</p><div class="actions"><button class="btn secondary" data-go="encontros">Preparar encontro</button></div></div></div>':'<div class="empty">Todos os encontros foram marcados como concluídos.</div>')+'<div class="nextitem"><div class="iconbox">◇</div><div><h3>Preencha sua direção inicial</h3><p>Compartilhe o objetivo principal e o estágio atual do projeto.</p><div class="actions"><button class="btn secondary" data-go="essencia">Abrir meu projeto</button></div></div></div></div></section><section><div class="sectionhead"><div><h2>Como a jornada funciona</h2><p>Preparação, encontro, decisão e execução.</p></div></div><div class="card"><div class="nextitem"><div class="iconbox">01</div><div><h3>Prepare</h3><p>Preencha ferramentas e reúna informações antes dos encontros.</p></div></div><div class="nextitem"><div class="iconbox">02</div><div><h3>Explore</h3><p>Conecte o tema coletivo à realidade do seu projeto.</p></div></div><div class="nextitem"><div class="iconbox">03</div><div><h3>Decida</h3><p>Registre prioridades, responsabilidades e próximos passos.</p></div></div><div class="nextitem"><div class="iconbox">04</div><div><h3>Construa</h3><p>Acompanhe ativos e entregas conforme o escopo combinado.</p></div></div></div></section></div><div class="notice"><strong>Importante:</strong> esta primeira experiência é um protótipo funcional de navegação. As informações são salvas apenas neste navegador e ainda não se conectam à conta, ao Firestore ou à gestão do mentor.</div>'}
function journey(){return head("MAPA DA JORNADA","Sua Arquitetura de Legado","Cinco fases conectadas para organizar essência, negócio, construção, expansão e continuidade. Você pode estar em uma fase diferente do grupo; o diagnóstico orienta seu percurso individual.")+'<div class="phase-list">'+PHASES.map(p=>{let ms=MEETINGS.map((m,i)=>({...m,i})).filter(m=>m[2]===p.id),done=ms.filter(m=>state.meetings[m.i+1]).length;return '<article class="card phase-row"><div class="numtile">0'+p.id+'</div><div><h3>'+p.name+'</h3><p>'+p.desc+'</p><div class="bar"><span style="width:'+(done/ms.length*100)+'%"></span></div><div style="font-size:10px;color:var(--muted)">Resultado esperado: '+p.outcome+'</div><div class="meetingmeta">'+p.tools.map(t=>'<span>'+t+'</span>').join("")+'</div></div><div class="rowtools"><span class="status '+(done===ms.length?'done':done?'current':'')+'">'+(done===ms.length?'Concluída':done?'Em andamento':'Planejada')+'</span><button class="btn secondary" data-phase="'+p.id+'">Ver encontros</button></div></article>'}).join("")+'</div><div class="notice"><strong>Princípio:</strong> a fase do encontro coletivo é um tema comum, não uma obrigação de que todos os participantes estejam no mesmo estágio. Cada aplicação precisa considerar a maturidade e as prioridades do projeto.</div>'}
function meetings(){let chosen=state.phaseFilter||0;return head("RITMO COLETIVO","24 encontros · 12 meses","Cada encontro tem um tema central, mas considera o ecossistema completo. Marque um encontro como concluído para acompanhar seu próprio histórico; isso não representa presença oficial nem validação do mentor.")+'<div class="actions" style="margin:0 0 18px">'+['Todos',...PHASES.map(p=>p.short)].map((t,i)=>'<button class="btn '+((i===chosen)?'':'secondary')+'" data-filter="'+i+'">'+t+'</button>').join("")+'</div><div class="meetinglist">'+MEETINGS.map((m,i)=>({m,i})).filter(x=>!chosen||x.m[2]===chosen).map(({m,i})=>'<article class="card meeting"><div class="meetingno">'+String(i+1).padStart(2,"0")+'</div><div><h3>'+m[0]+'</h3><p>'+m[1]+'</p><div class="meetingmeta"><span>Mês '+Math.ceil((i+1)/2)+'</span><span>Fase '+m[2]+' · '+PHASES[m[2]-1].short+'</span><span>Preparação + aplicação</span></div></div><button class="donebtn '+(state.meetings[i+1]?'done':'')+'" data-meeting="'+(i+1)+'">'+(state.meetings[i+1]?'✓ Marcado':'Marcar concluído')+'</button></article>').join("")+'</div><div class="notice">Estrutura curricular inicial proposta. Datas, duração, links das chamadas, gravações, materiais oficiais e presença deverão ser conectados ao calendário real da mentoria.</div>'}
function executive(){return head("SESSÕES INDIVIDUAIS","Produção executiva","Três marcos individuais para transformar diagnóstico em decisões, decisões em ativos e ativos em continuidade. O escopo é definido por projeto; nem todo ativo é automaticamente incluído.")+'<div class="grid formgrid">'+EXEC.map(e=>'<article class="card"><div class="eyebrow">MARCO EXECUTIVO 0'+e.n+'</div><h2 style="font:600 27px Cormorant Garamond;margin:8px 0">'+e.title+'</h2><p class="sub" style="font-size:12px">'+e.desc+'</p><div class="notice"><strong>Resultado esperado:</strong> '+e.out+'</div><h3 style="font-size:12px">Perguntas de preparação</h3><ul style="color:var(--muted);font-size:11px;padding-left:18px">'+e.questions.map(q=>'<li style="margin:7px 0">'+q+'</li>').join("")+'</ul><div class="field"><label>Notas de preparação / decisões</label><textarea data-exec="'+e.n+'" placeholder="Registre informações para discutir com o mentor...">'+esc(state.execNotes[e.n]||"")+'</textarea></div><button class="btn secondary" data-save-exec="'+e.n+'">Salvar preparação</button></article>').join("")+'</div><div class="sectionhead"><div><h2>Ativos e entregas</h2><p>Registre apenas itens discutidos e combinados no escopo do projeto.</p></div></div><div class="card"><form id="assetForm" class="grid formgrid"><div class="field"><label>Nome do ativo</label><input name="name" required placeholder="Ex.: site institucional"></div><div class="field"><label>Objetivo</label><input name="goal" placeholder="Que resultado deve apoiar?"></div><div class="field"><label>Responsável</label><select name="owner"><option>Definir em conjunto</option><option>Mentor</option><option>Mentorando</option><option>Terceiro</option></select></div><div class="field"><label>Status</label><select name="status"><option>Planejado</option><option>Aguardando informações</option><option>Em produção</option><option>Em validação</option><option>Entregue</option></select></div><div class="field" style="grid-column:1/-1"><label>Escopo / dependências / observações</label><textarea name="notes" placeholder="O que foi combinado, dependências e aprovação necessária"></textarea></div><div><button class="btn" type="submit">Adicionar ativo</button></div></form><div id="assetsList">'+assetRows()+'</div></div>'}
function assetRows(){if(!state.assets.length)return '<div class="empty">Nenhum ativo registrado ainda. Adicione um item acima quando houver escopo combinado.</div>';return state.assets.map((a,i)=>'<div class="asset"><div><h3>'+esc(a.name)+'</h3><p>'+esc(a.goal||"Objetivo ainda não registrado")+' · '+esc(a.owner)+' · '+esc(a.status)+'</p>'+(a.notes?'<p style="margin-top:5px">'+esc(a.notes)+'</p>':'')+'</div><button class="donebtn" data-remove-asset="'+i+'">Remover</button></div>').join("")}
function essence(){let p=state.project;return head("SEU PROJETO","A essência por trás do legado","Comece com o que já sabe. Você pode voltar, revisar e amadurecer as respostas ao longo da jornada. Este formulário é uma preparação inicial, não um diagnóstico concluído.")+'<form id="projectForm" class="card"><div class="grid formgrid"><div class="field"><label>Nome do projeto ou legado</label><input name="name" value="'+esc(p.name)+'" required placeholder="Como você chama este projeto?"></div><div class="field"><label>Estágio atual</label><select name="stage">'+["Ainda estou definindo","Ideia inicial","Marca ou oferta em construção","Negócio em operação","Negócio em expansão","Reorganização ou reposicionamento"].map(x=>'<option '+(p.stage===x?'selected':'')+'>'+x+'</option>').join("")+'</select></div><div class="field" style="grid-column:1/-1"><label>Qual é o principal resultado que você deseja construir nos próximos 12 meses?</label><textarea name="goal" placeholder="Descreva o que deseja construir, organizar ou transformar...">'+esc(p.goal)+'</textarea></div><div class="field"><label>Quem você deseja servir ou impactar?</label><textarea name="audience" placeholder="Pessoas, empresas, comunidade, mercado...">'+esc(p.audience)+'</textarea></div><div class="field"><label>Quais capacidades, ativos ou recursos você já possui?</label><textarea name="strengths" placeholder="Experiência, marca, equipe, audiência, produtos, sistemas...">'+esc(p.strengths)+'</textarea></div><div class="field" style="grid-column:1/-1"><label>Qual é a prioridade mais importante neste momento?</label><textarea name="priority" placeholder="O que, se avançar primeiro, fará a maior diferença?">'+esc(p.priority)+'</textarea></div><div class="field" style="grid-column:1/-1"><label>Contexto adicional que deseja levar para a mentoria</label><textarea name="notes" placeholder="Dúvidas, desafios, oportunidades ou decisões pendentes...">'+esc(p.notes)+'</textarea></div></div><div class="actions"><button class="btn" type="submit">Salvar meu projeto</button><button class="btn secondary" type="button" id="exportBtn">Exportar minhas respostas</button></div></form><div class="notice"><strong>Privacidade nesta versão:</strong> os dados ficam no armazenamento local deste navegador. Não inclua senhas, documentos pessoais ou informações altamente sensíveis. A conexão segura com a conta e a gestão do mentor ainda precisa ser integrada.</div>'}
function render(){let v=state.view||"dashboard";document.getElementById("breadcrumb").textContent="CULTURA DE LEGADO / "+({dashboard:"VISÃO GERAL",jornada:"MINHA JORNADA",encontros:"ENCONTROS EM GRUPO",executivo:"PRODUÇÃO EXECUTIVA",essencia:"MEU PROJETO"}[v]||"VISÃO GERAL");let html=({dashboard,jornada,encontros:meetings,executivo,essencia}[v]||dashboard)();document.getElementById("content").innerHTML=html;document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.go)));document.querySelectorAll("[data-phase]").forEach(b=>b.addEventListener("click",()=>{state.phaseFilter=Number(b.dataset.phase);setView("encontros")}));document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{state.phaseFilter=Number(b.dataset.filter);render()}));document.querySelectorAll("[data-meeting]").forEach(b=>b.addEventListener("click",()=>{let id=b.dataset.meeting;state.meetings[id]=!state.meetings[id];localStorage.setItem(KEY,JSON.stringify(state));render()}));document.querySelectorAll("[data-save-exec]").forEach(b=>b.addEventListener("click",()=>{let n=b.dataset.saveExec;state.execNotes[n]=document.querySelector('[data-exec="'+n+'"]').value;localStorage.setItem(KEY,JSON.stringify(state));toast("Preparação salva neste navegador.");render()}));document.querySelectorAll("[data-remove-asset]").forEach(b=>b.addEventListener("click",()=>{state.assets.splice(Number(b.dataset.removeAsset),1);localStorage.setItem(KEY,JSON.stringify(state));render()}));let pf=document.getElementById("projectForm");if(pf)pf.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(pf);for(const k of Object.keys(state.project))state.project[k]=d.get(k)||"";state.started=true;localStorage.setItem(KEY,JSON.stringify(state));toast("Projeto salvo.");render()});let af=document.getElementById("assetForm");if(af)af.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(af);state.assets.push(Object.fromEntries(d.entries()));localStorage.setItem(KEY,JSON.stringify(state));toast("Ativo registrado.");render()});let ex=document.getElementById("exportBtn");if(ex)ex.addEventListener("click",()=>{const blob=new Blob([JSON.stringify(state.project,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="meu-projeto-legado.json";a.click();URL.revokeObjectURL(a.href)});}
render();
</script>
