<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>30 Frases · Gestão do Mentor · Akasha Hub</title>
<style>
:root{--bg:#100c18;--text:#f8f4fc;--muted:#b6adbf;--gold:#d6b45d;--line:#3a2e47}
*{box-sizing:border-box}body{margin:0;background:#0e0b14;color:var(--text);font:15px/1.5 system-ui,sans-serif}
header{padding:28px 20px 12px;border-bottom:1px solid var(--line)}
h1{font-size:28px;margin:0 0 6px;color:var(--gold)}
.sub{color:var(--muted);margin:0}
main{max-width:1100px;margin:auto;padding:20px}
.phase{margin:32px 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#191322;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
.card .meta{padding:12px 14px}
.card .n{font-size:11px;color:var(--gold);letter-spacing:.08em}
.card p{margin:6px 0 0;font-size:13px;color:var(--muted)}
a{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>30 Frases · Gestão do Mentor</h1>
  <p class="sub">Biblioteca de identificação · Arquitetura de Legado · Uso interno</p>
</header>
<main>
  <p>As imagens estão organizadas por fase. Clique para ampliar ou baixar.</p>
  <div id="gallery"></div>
</main>
<script>
const frases = [
  {n:"01",fase:"Arquitetura de Essência",img:"01.jpg",texto:"Você pode ter capacidade para fazer coisas extraordinárias e ainda estar se apresentando ao mundo de uma forma que não representa nem metade de quem você é."},
  {n:"02",fase:"Arquitetura de Essência",img:"02.jpg",texto:"Talvez você não precise descobrir quem quer ser. Talvez precise entender por que passou tanto tempo tentando ser alguém que os outros conseguiriam aceitar."},
  {n:"03",fase:"Arquitetura de Essência",img:"03.jpg",texto:"Tem gente que passa anos tentando melhorar a própria imagem sem perceber que o problema começa na forma como enxerga a si mesma."},
  {n:"04",fase:"Arquitetura de Essência",img:"04.jpg",texto:"Você sabe conversar sobre o seu trabalho, mas, quando alguém pergunta o que realmente torna você diferente, parece que todas as respostas ficam pequenas demais."},
  {n:"05",fase:"Arquitetura de Essência",img:"05.jpg",texto:"Às vezes, o que você chama de falta de disciplina é uma vida inteira tentando sustentar uma identidade que já não combina com a pessoa que está se tornando."},
  {n:"06",fase:"Arquitetura de Essência",img:"06.jpg",texto:"Antes de construir uma marca que o mundo reconheça, você precisa entender o que existe em você que merece ser reconhecido."},
  {n:"07",fase:"Império Digital",img:"07.jpg",texto:"Você não precisa começar com uma grande empresa. Precisa parar de tratar como improviso aquilo que poderia se tornar um ativo do seu negócio."},
  {n:"08",fase:"Império Digital",img:"08.jpg",texto:"Se todo o conhecimento do seu negócio está na sua cabeça, você não construiu apenas uma empresa. Você também construiu um gargalo."},
  {n:"09",fase:"Império Digital",img:"09.jpg",texto:"Tem gente tentando vender mais com o mesmo processo desorganizado, quando deveria estar construindo um sistema capaz de vender sem depender de improvisos todos os dias."},
  {n:"10",fase:"Império Digital",img:"10.jpg",texto:"A inteligência artificial não precisa substituir o que você sabe fazer. Ela pode ajudar você a transformar o que sabe em algo que outras pessoas consigam usar, aprender e comprar."},
  {n:"11",fase:"Império Digital",img:"11.jpg",texto:"Talvez o próximo passo do seu negócio não seja contratar mais pessoas. Talvez seja construir a estrutura que está faltando para as pessoas certas conseguirem trabalhar melhor."},
  {n:"12",fase:"Império Digital",img:"12.jpg",texto:"Um conhecimento pode virar um método. Um método pode virar um treinamento. Um treinamento pode virar uma plataforma. E uma plataforma pode continuar gerando valor muito depois da primeira conversa."},
  {n:"13",fase:"Alinhamento Financeiro",img:"13.jpg",texto:"Ganhar mais dinheiro não resolve automaticamente a forma como você lida com ele. Às vezes, você só passa a cometer os mesmos erros com valores maiores."},
  {n:"14",fase:"Alinhamento Financeiro",img:"14.jpg",texto:"Você pode saber exatamente quanto ganha e ainda não entender por que nunca sente que tem dinheiro suficiente."},
  {n:"15",fase:"Alinhamento Financeiro",img:"15.jpg",texto:"Se você evita olhar para a própria conta bancária porque sabe que vai sentir ansiedade, talvez o primeiro investimento que precise fazer seja aprender a encarar seus números sem fugir deles."},
  {n:"16",fase:"Alinhamento Financeiro",img:"16.jpg",texto:"Tem gente que trabalha para conquistar liberdade financeira, mas constrói uma rotina em que não consegue parar de trabalhar nem por um dia."},
  {n:"17",fase:"Alinhamento Financeiro",img:"17.jpg",texto:"Você não precisa esperar ganhar muito para aprender a administrar dinheiro. É justamente quando os valores são pequenos que os hábitos começam a ser construídos."},
  {n:"18",fase:"Alinhamento Financeiro",img:"18.jpg",texto:"A sua relação com dinheiro aparece nas compras que você esconde, nas oportunidades que não aproveita, nos riscos que evita e nas decisões que toma quando está com medo."},
  {n:"19",fase:"Expansão",img:"19.jpg",texto:"Se o seu negócio é bom, os clientes gostam de você, mas as vendas continuam imprevisíveis, talvez não falte qualidade. Talvez falte um processo consistente para transformar atenção em receita."},
  {n:"20",fase:"Expansão",img:"20.jpg",texto:"Você não pode depender de estar inspirado para divulgar sua empresa, lembrar de responder clientes e correr atrás das vendas. Crescimento precisa de método, não apenas de vontade."},
  {n:"21",fase:"Expansão",img:"21.jpg",texto:"Enquanto você tenta convencer cada cliente individualmente, pode existir uma oportunidade de construir um sistema que atraia, eduque, qualifique e encaminhe as pessoas certas até a compra."},
  {n:"22",fase:"Expansão",img:"22.jpg",texto:"Contratar alguém para vender sem ensinar como sua empresa pensa, negocia e atende é entregar uma meta sem entregar o caminho para alcançá-la."},
  {n:"23",fase:"Expansão",img:"23.jpg",texto:"Anunciar um negócio desorganizado pode fazer você descobrir seus problemas mais rápido e pagar mais caro para descobri-los."},
  {n:"24",fase:"Expansão",img:"24.jpg",texto:"Existe uma diferença enorme entre ter clientes suficientes para sobreviver este mês e construir uma operação capaz de encontrar novas oportunidades todos os meses."},
  {n:"25",fase:"Legado",img:"25.jpg",texto:"Construir uma empresa que depende de você para tudo pode ser uma conquista. Construir uma empresa que funciona bem sem você é outro nível de conquista."},
  {n:"26",fase:"Legado",img:"26.jpg",texto:"Quem quer comprar uma empresa precisa aprender a olhar além do faturamento. O que sobra depois dos custos? Quanto depende do dono? Quais riscos estão escondidos? O que realmente está sendo comprado?"},
  {n:"27",fase:"Legado",img:"27.jpg",texto:"Uma boa sociedade não se sustenta apenas porque duas pessoas gostam uma da outra. Ela precisa de interesses alinhados, responsabilidades claras, números compreendidos e regras para os momentos difíceis."},
  {n:"28",fase:"Legado",img:"28.jpg",texto:"Talvez a sua maior ambição não seja ganhar dinheiro a vida inteira. Talvez seja construir algo que continue gerando valor mesmo quando você decidir fazer outra coisa."},
  {n:"29",fase:"Legado",img:"29.jpg",texto:"Você não precisa ser um investidor profissional para começar a pensar como alguém que protege o próprio patrimônio. Precisa aprender a avaliar riscos, entender números e parar de confundir oportunidade com promessa."},
  {n:"30",fase:"Legado",img:"30.jpg",texto:"O verdadeiro teste de uma empresa não é apenas quanto ela vale enquanto você está no comando. É quanto da sua visão, dos seus valores e da sua capacidade de gerar valor continua existindo quando você sai da sala."}
];
const phases = [...new Set(frases.map(f=>f.fase))];
const host = document.getElementById("gallery");
phases.forEach(fase=>{
  const h = document.createElement("div");
  h.className = "phase";
  h.textContent = fase;
  host.appendChild(h);
  const grid = document.createElement("div");
  grid.className = "grid";
  frases.filter(f=>f.fase===fase).forEach(f=>{
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `<a href="${f.img}" target="_blank"><img src="${f.img}" alt="Frase ${f.n}"></a><div class="meta"><div class="n">${f.n}</div><p>${f.texto}</p></div>`;
    grid.appendChild(card);
  });
  host.appendChild(grid);
});
</script>
</body>
</html>
