<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf9ff"/><stop offset="1" stop-color="#f0e9f8"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#332044" flood-opacity=".12"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="55" text-anchor="middle" font-family="Arial" font-size="30" letter-spacing="4" fill="#9a7834">AKASHA HUB · MAPA MENTAL</text><text x="800" y="98" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="42" fill="#4d2d74">A ARTE DA CONQUISTA</text><text x="800" y="130" text-anchor="middle" font-family="Arial" font-size="20" fill="#655e6c">Vendas pela analogia dos encontros · da atração à continuidade</text><g stroke="#b7a2d0" stroke-width="5" fill="none" stroke-linecap="round"><path d="M800 450 C650 360 520 280 350 250"/><path d="M800 450 C950 360 1080 280 1250 250"/><path d="M800 475 C630 490 470 500 320 520"/><path d="M800 475 C970 490 1130 500 1280 520"/><path d="M800 500 C780 640 790 700 800 760"/></g><g filter="url(#sh)" font-family="Arial"><rect x="590" y="380" width="420" height="150" rx="28" fill="#4d2d74"/><text x="800" y="430" text-anchor="middle" font-size="28" fill="#e8d6a3">O MÉTODO</text><text x="800" y="470" text-anchor="middle" font-size="23" fill="#fff">Conexão + clareza + valor</text><text x="800" y="502" text-anchor="middle" font-size="18" fill="#e9e0f3">Analogia para aprender, não coerção</text><rect x="90" y="175" width="430" height="160" rx="22" fill="#fff" stroke="#d8c8e8" stroke-width="2"/><text x="305" y="215" text-anchor="middle" font-size="26" font-weight="bold" fill="#4d2d74">1 · ATRAIR</text><text x="305" y="253" text-anchor="middle" font-size="20" fill="#211b2b">Posicionamento · perfil</text><text x="305" y="283" text-anchor="middle" font-size="20" fill="#211b2b">Prospecção · primeiro contato</text><text x="305" y="313" text-anchor="middle" font-size="17" fill="#655e6c">Encontro: apresentação e abertura</text><rect x="1080" y="175" width="430" height="160" rx="22" fill="#fff" stroke="#d8c8e8" stroke-width="2"/><text x="1295" y="215" text-anchor="middle" font-size="26" font-weight="bold" fill="#4d2d74">2 · QUALIFICAR</text><text x="1295" y="253" text-anchor="middle" font-size="20" fill="#211b2b">Perguntas · escuta</text><text x="1295" y="283" text-anchor="middle" font-size="20" fill="#211b2b">Necessidade · compatibilidade</text><text x="1295" y="313" text-anchor="middle" font-size="17" fill="#655e6c">Encontro: conhecer e decidir</text><rect x="75" y="445" width="470" height="160" rx="22" fill="#fff" stroke="#d8c8e8" stroke-width="2"/><text x="310" y="485" text-anchor="middle" font-size="26" font-weight="bold" fill="#4d2d74">3 · PREPARAR A CALL</text><text x="310" y="523" text-anchor="middle" font-size="20" fill="#211b2b">Objetivo · diagnóstico · oferta</text><text x="310" y="553" text-anchor="middle" font-size="20" fill="#211b2b">Preço · escopo · onboarding</text><text x="310" y="583" text-anchor="middle" font-size="17" fill="#655e6c">Saber entregar antes de vender</text><rect x="1055" y="445" width="470" height="160" rx="22" fill="#fff" stroke="#d8c8e8" stroke-width="2"/><text x="1290" y="485" text-anchor="middle" font-size="26" font-weight="bold" fill="#4d2d74">4 · NEGOCIAR</text><text x="1290" y="523" text-anchor="middle" font-size="20" fill="#211b2b">Valor · dúvidas · objeções</text><text x="1290" y="553" text-anchor="middle" font-size="20" fill="#211b2b">Decisão · próximos passos</text><text x="1290" y="583" text-anchor="middle" font-size="17" fill="#655e6c">Clareza, encaixe e consentimento</text><rect x="470" y="690" width="660" height="150" rx="22" fill="#fff" stroke="#d8c8e8" stroke-width="2"/><text x="800" y="730" text-anchor="middle" font-size="26" font-weight="bold" fill="#4d2d74">5 · ENTREGAR E CONTINUAR</text><text x="800" y="768" text-anchor="middle" font-size="20" fill="#211b2b">Pagamento · onboarding · entrega</text><text x="800" y="798" text-anchor="middle" font-size="20" fill="#211b2b">Acompanhamento · retenção · indicação</text><text x="800" y="825" text-anchor="middle" font-size="17" fill="#655e6c">A venda não termina no sim</text></g><text x="800" y="925" text-anchor="middle" font-family="Arial" font-size="20" fill="#655e6c">Regra ética: esclarecer uma objeção não é quebrar uma recusa. Pessoas não são produtos.</text></svg>