<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Oratória · Akasha Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f4efe6; --ink:#1a1714; --muted:#6b6258; --gold:#8b6914; --card:#fffdf8; --line:rgba(139,105,20,.28); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--ink); font-family:"Josefin Sans",sans-serif; }
    button:not(:disabled) { cursor:pointer; }
    .wrap { max-width:720px; margin:0 auto; padding:22px 16px 72px; }
    .kicker { font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:var(--gold); }
    h1 { font-family:"Cormorant Garamond",serif; font-size:clamp(2rem,7vw,3rem); font-weight:500; line-height:1.05; margin:8px 0 10px; }
    .lead,.hint,.foot { color:var(--muted); font-size:14px; line-height:1.55; }
    .tabs { display:flex; gap:8px; overflow:auto; padding:14px 0; }
    .tabs button { flex:none; min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font:inherit; font-size:12px; }
    .tabs button.on { background:var(--gold); color:#fffdf8; border-color:var(--gold); }
    .stage { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
    .row { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
    .clock { font-family:"Cormorant Garamond",serif; font-size:3.4rem; line-height:1; }
    .bar { height:6px; background:rgba(139,105,20,.15); border-radius:6px; margin:12px 0; overflow:hidden; }
    .bar b { display:block; height:100%; width:0; background:var(--gold); }
    .tele { font-family:"Cormorant Garamond",serif; font-size:clamp(1.25rem,4vw,1.7rem); line-height:1.4; min-height:180px; white-space:pre-wrap; }
    .tele .on { background:var(--gold); color:#fffdf8; border-radius:3px; padding:0 2px; }
    .tele .gone { color:var(--gold); }
    textarea { width:100%; min-height:180px; border:1px solid var(--line); border-radius:12px; padding:12px; font-family:"Cormorant Garamond",serif; font-size:1.2rem; line-height:1.4; background:#fff; color:var(--ink); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .chips button,.acts button { min-height:42px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:#fff; font:inherit; font-size:12px; }
    .acts { display:flex; gap:8px; margin-top:14px; }
    .acts .p { flex:1; background:var(--gold); color:#fffdf8; border-color:var(--gold); text-transform:uppercase; letter-spacing:1.2px; }
    .acts .g { flex:1; text-transform:uppercase; letter-spacing:1.2px; }
    input[type=range] { width:100%; margin-top:6px; }
    .msg { text-align:center; color:var(--gold); font-size:13px; margin-top:12px; min-height:1.2em; }
    .foot { text-align:center; margin-top:18px; font-size:12px; }
  </style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Akasha Hub · Módulo 5</p>
  <h1>Oratória não é dom.</h1>
  <p class="lead">Texto longo. Teleprompter que marca a palavra. Sugestão pronta. Você edita, cola o pitch, varia.</p>
  <div class="tabs" id="tabs"></div>
  <section class="stage">
    <div class="row">
      <div>
        <p class="kicker" id="name">Velocidade</p>
        <p class="hint" id="brief">Karaoke palavra a palavra.</p>
      </div>
      <div class="clock" id="clk">60</div>
    </div>
    <div class="bar"><b id="bar"></b></div>
    <div class="tele" id="tele"></div>
    <textarea id="edit" hidden></textarea>
    <p class="hint" id="meta"></p>
    <div class="chips" id="chips"></div>
    <label class="hint">Ritmo do karaoke</label>
    <input id="bpm" type="range" min="50" max="160" value="90" />
    <div class="acts">
      <button class="p" type="button" id="go">Ler agora</button>
      <button class="g" type="button" id="ok">Marquei</button>
    </div>
    <p class="msg" id="msg"></p>
  </section>
  <p class="foot">Cola um texto da internet, muda duas frases, lê no ouro.</p>
</div>
<script>
const DRILLS = [
  {id:"vel",name:"Velocidade",brief:"Karaoke palavra a palavra.",hint:"Acompanhe o ouro. Se atrasar, diminui o ritmo."},
  {id:"pau",name:"Pausas",brief:"Silêncio depois da ideia.",hint:"No ponto, conte dois no peito."},
  {id:"vol",name:"Volume",brief:"Baixo, médio, alto limpo.",hint:"Muda o volume a cada parágrafo."},
  {id:"cla",name:"Clareza",brief:"Consoante no lugar.",hint:"Termina cada palavra."},
  {id:"pal",name:"Palavras",brief:"Corta muletilla.",hint:"Tira tipo, né, então. Lê de novo."},
  {id:"pos",name:"Postura",brief:"Corpo segura a voz.",hint:"Pés no chão. Ombro baixo."},
  {id:"esc",name:"Escuta",brief:"Repete o ponto.",hint:"Lê em silêncio. Depois fala o essencial."},
  {id:"pitch",name:"Meu pitch",brief:"O texto dela.",hint:"Cola o pitch. Edita. Lê no ouro."}
];
const PACKS = {
  vel:[
    "Trava a trava da trave travada. A trave trava e a trava trava a trave. Quem trava a trave hoje cobra amanhã sem gaguejar.\nO rato roeu a roupa do rei de Roma e o rei de Roma ralhou. Rápido não é atropelar. Rápido é chegar inteiro no final da frase.\nO lucro não espera quem enrola. Fala limpo. Fecha o ponto. Segue.",
    "Ela entra na sala com o verso na boca e o verso não quebra. Palavra em cima de palavra, concreto no peito, silêncio no meio.\nSe o ritmo cair, sobe sem gritar. Se a língua tropeçar, volta duas palavras e reconstrói.\nQuem fala bonito e não fecha, conversa. Quem fecha, cobra.",
    "Três pratos de trigo para três tigres tristes. Depois outra vez, mais rápido, sem perder o T.\nO tempo que você gasta pedindo desculpa pela voz é tempo que o cliente já decidiu outro.\nTreina agora. Cobra depois."
  ],
  pau:["Eu resolvo um vazamento de caixa para quem fatura e não sobra.\n\nO método tem sete módulos e uma prova por semana.\n\nSe a reserva não existe, a ideia não sobe.\n\nPausa. Respira. Fecha.","Lucro não é ganância.\n\nLucro é oxigênio do legado.\n\nSem oxigênio o propósito morre no boleto."],
  vol:["Isto é baixo: a reserva é o chão da casa.\nIsto é médio: sem chão, o segundo andar cai na primeira emergência.\nIsto é alto e limpo: três a seis meses de despesa. Número. Prazo. Transferência automática."],
  cla:["Pa ta ka. Pa ta ka. Pa ta ka.\nMa me mi mo mu. La le li lo lu.\nO pedido chega claro. O preço chega claro. O prazo chega claro."],
  pal:["Eu resolvo desorganização financeira para quem trabalha muito e sobra pouco. Em oito a dezesseis semanas a pessoa sai com reserva, oferta e voz para cobrar.\nTira o tipo. Tira o né. Tira o então. Lê de novo só com osso."],
  pos:["Pés no chão. Peso igual. Ombro longe da orelha.\nEu estou aqui. Eu tenho um número. Eu tenho um prazo.\nA frase começa no ventre e termina no ponto."],
  esc:["O cliente disse: eu faturo e no dia vinte e oito já estou no vermelho.\nPonto essencial: sobra zero. Não é falta de esforço. É vazamento.\nResposta: vamos achar o buraco em quarenta e oito horas."],
  pitch:["Eu resolvo [problema] para [quem] com [método], gerando [resultado visível] em [prazo].\nHoje a pessoa entra desorganizada. Sai com reserva, oferta e voz.\nSe isto descreve você, a próxima conversa é a aplicação."]
};
const STORE="oratoria_texts_v2";
let texts=JSON.parse(localStorage.getItem(STORE)||"{}");
let active="vel", running=false, idx=0, left=60, timer=null, editing=false, bpm=90;
const $ = (id)=>document.getElementById(id);
function tokens(){ return text().split(/(\s+)/).filter(Boolean); }
function text(){ return texts[active] || PACKS[active][0]; }
function renderTabs(){
  $("tabs").innerHTML = DRILLS.map(d=>`<button type="button" class="${d.id===active?"on":""}" data-id="${d.id}">${d.name}</button>`).join("");
}
function paintTele(){
  const toks=tokens();
  $("tele").innerHTML = toks.map((t,i)=>{
    const word=/\S/.test(t);
    if(running && word && i===Math.min(idx,toks.length-1)) return `<span class="on">${t}</span>`;
    if(running && i<idx) return `<span class="gone">${t}</span>`;
    return t;
  }).join("");
}
function render(){
  const d=DRILLS.find(x=>x.id===active);
  $("name").textContent=d.name; $("brief").textContent=d.brief;
  $("clk").textContent=String(left);
  $("bar").style.width=((60-left)/60*100)+"%";
  $("edit").hidden=!editing; $("tele").hidden=editing;
  $("edit").value=text();
  if(!editing) paintTele();
  const wc=tokens().filter(t=>/\S/.test(t)).length;
  $("meta").textContent=`${d.hint} · ${wc} palavras · ritmo ${bpm}`;
  $("chips").innerHTML = PACKS[active].map((_,i)=>`<button type="button" data-s="${i}">Sugestão ${i+1}</button>`).join("")
    + `<button type="button" id="tg">${editing?"Ver teleprompter":"Editar texto"}</button>`;
  $("tg").onclick=()=>{ editing=!editing; if(editing) running=false; render(); };
}
function start(){
  clearInterval(timer); idx=0; left=60; editing=false; running=true; $("msg").textContent="";
  const step=()=>{
    const toks=tokens();
    idx++;
    while(idx<toks.length && !/\S/.test(toks[idx])) idx++;
    left=Math.max(0,left- (60000/bpm)/1000 );
    if(idx>=toks.length || left<=0){
      running=false; clearInterval(timer); left=Math.max(0,Math.round(left));
      $("msg").textContent="Acabou. Se sobrou texto, diminui o ritmo ou corta o texto.";
    }
    $("clk").textContent=String(Math.ceil(left));
    $("bar").style.width=((60-left)/60*100)+"%";
    paintTele();
  };
  render();
  timer=setInterval(step, Math.max(180, Math.round(60000/bpm)));
}
$("tabs").onclick=e=>{
  const b=e.target.closest("[data-id]"); if(!b) return;
  active=b.dataset.id; running=false; clearInterval(timer); idx=0; left=60; editing=false;
  renderTabs(); render();
};
$("chips").addEventListener("click",e=>{
  const s=e.target.closest("[data-s]"); if(!s) return;
  texts[active]=PACKS[active][+s.dataset.s];
  localStorage.setItem(STORE,JSON.stringify(texts));
  idx=0; running=false; render();
});
$("edit").oninput=()=>{ texts[active]=$("edit").value; localStorage.setItem(STORE,JSON.stringify(texts)); };
$("bpm").oninput=()=>{ bpm=+$("bpm").value; $("meta").textContent=$("meta").textContent.replace(/ritmo \d+/,"ritmo "+bpm); };
$("go").onclick=start;
$("ok").onclick=()=>{ $("msg").textContent="Marcado. Amanhã outro músculo ou o mesmo texto mais rápido."; };
renderTabs(); render();
</script>
</body>
</html>
