<div id="sleepOverlay" class="sleep-overlay">
  <div class="sleep-stage">
    <p class="sleep-sim">Modo de visualização financeira</p>
    <p class="sleep-hi" id="sleepHi">Olá</p>
    <p class="sleep-acc">Sua conta</p>
    <p class="sleep-bal" id="sleepBal">R$ 0,00</p>
    <div class="sleep-in" id="sleepIn" hidden>
      <span id="sleepInVal">+ R$ 0,00</span>
      <small>Entrada recebida</small>
    </div>
    <div class="sleep-goal" id="sleepGoalWrap" hidden>
      <div class="sleep-goal-lab"><span id="sleepGoalLab">Meta visual</span><span id="sleepGoalPct">0%</span></div>
      <div class="sleep-goal-bar"><b id="sleepGoalBar"></b></div>
    </div>
  </div>
  <div class="sleep-dock" id="sleepDock">
    <p class="sleep-freq" id="sleepFreqLab">Raiz · 396 Hz</p>
    <div class="sleep-vol">
      <span>Volume</span>
      <button type="button" data-act="afSleepVol" data-d="-1">−</button>
      <input id="sleepVol" type="range" min="0" max="100" value="35" />
      <button type="button" data-act="afSleepVol" data-d="1">+</button>
      <b id="sleepVolLab">35</b>
    </div>
    <div class="sleep-acts">
      <button type="button" data-act="afSleepPause" id="sleepPauseBtn">Pausar</button>
      <button type="button" data-act="afCloseSleep">Encerrar</button>
    </div>
    <div class="sleep-freqs" id="sleepFreqs"></div>
  </div>
</div>
