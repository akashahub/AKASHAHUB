<div id="sleepOverlay" class="sleep-overlay">
  <button class="sleep-x" type="button" onclick="window.afCloseSleep()">Sair</button>
  <div class="nu-app">
    <header class="nu-top">
      <div>
        <p class="nu-hi" id="sleepHi">Olá</p>
        <p class="nu-sub">Conta · Alinhamento</p>
      </div>
      <div class="nu-avatar" id="sleepAv">AF</div>
    </header>
    <section class="nu-card">
      <p class="nu-card-lab">Saldo em conta</p>
      <p class="nu-bal" id="sleepBal">R$ 0,00</p>
      <p class="nu-yield" id="sleepYield">Rendimento de hoje R$ 0,00</p>
    </section>
    <section class="nu-list" id="sleepTx"></section>
    <div class="nu-vol">
      <span>Volume</span>
      <button type="button" class="nu-vol-btn" data-act="afSleepVol" data-d="-1">−</button>
      <input type="range" id="sleepVol" min="0" max="100" value="35" />
      <button type="button" class="nu-vol-btn" data-act="afSleepVol" data-d="1">+</button>
      <b id="sleepVolLab">35</b>
    </div>
    <p class="sleep-freq" id="sleepFreqLab">Raiz · 396 Hz</p>
  </div>
  <div class="sleep-freqs" id="sleepFreqs"></div>
</div>
