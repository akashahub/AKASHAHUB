<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F4EDE1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Akasha Hub</title>
<link rel="canonical" href="https://akashahub.com.br/"/>
<link rel="icon" type="image/png" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta property="og:image" content="https://akashahub.com.br/img/lua-home-salon.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#E8DFD2;--sheet:#F7F1E7;--ink:#16120F;--muted:#7A7268;--violet:#4A2170;--gold:#C4A04A;--line:#E6DCCE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.app{width:min(560px,100%);margin:0 auto;background:var(--sheet);padding-bottom:84px}
@media(min-width:900px){
  body{padding:20px 0;background:#D9CFC0}
  .app{width:min(640px,92vw);border-radius:24px;box-shadow:0 24px 60px rgba(22,18,15,.14)}
}
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--sheet)}
.top img{width:20px;height:20px}
.top b{font-size:12px;letter-spacing:.16em;font-weight:500}
.pill{font-size:11px;border:1px solid var(--gold);padding:6px 10px;border-radius:999px}
.cover{margin:0 16px;border-radius:16px;overflow:hidden}
.cover img{width:100%;height:280px;object-fit:cover;object-position:center 16%}
@media(min-width:900px){.cover img{height:340px}}
.body{padding:18px 16px 12px}
.k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--violet)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:1.85rem;line-height:1.12;margin:8px 0 10px}
.sub{color:var(--muted);font-size:.95rem}
.list{margin-top:16px;display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:14px 14px;min-height:56px}
.row strong{font-weight:500}
.row span{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.cover2{margin:8px 16px 20px;border-radius:16px;overflow:hidden}
.cover2 img{width:100%;height:180px;object-fit:cover;object-position:center 18%}
.dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:var(--sheet);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
@media(min-width:900px){.dock{width:min(640px,92vw);bottom:20px;border-radius:0 0 24px 24px}}
.dock a{text-align:center;font-size:10px;letter-spacing:.04em;color:var(--muted);padding:8px 0}
.dock a.on{color:var(--violet)}
.dock a b{display:block;font-size:16px;line-height:1;margin-bottom:3px;font-weight:500}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a href="/" style="display:flex;align-items:center;gap:8px">
      <img src="/img/akasha-mark-28.png" alt=""/>
      <b>AKASHA</b>
    </a>
    <a class="pill" href="/login/">Entrar</a>
  </header>

  <figure class="cover"><img src="/img/lua-home-salon.jpg" alt=""/></figure>

  <section class="body">
    <p class="k">Alinhamento Financeiro</p>
    <h1>O dinheiro segue o rumo.</h1>
    <p class="sub">Sessão primeiro. Mentoria depois.</p>
    <div class="list">
      <a class="row" href="/alinhamentofinanceiro/"><strong>Alinhamento</strong><span>abrir</span></a>
      <a class="row" href="/magnetismo/"><strong>Magnetismo</strong><span>campo</span></a>
      <a class="row" href="/flow/"><strong>Flow</strong><span>privê</span></a>
      <a class="row" href="/livros/"><strong>Bibliotheca</strong><span>estudo</span></a>
    </div>
  </section>

  <figure class="cover2"><img src="/img/lua-home-library.jpg" alt=""/></figure>
</div>

<nav class="dock">
  <a class="on" href="/"><b>○</b>Início</a>
  <a href="/alinhamentofinanceiro/"><b>◇</b>Alinhar</a>
  <a href="/magnetismo/"><b>△</b>Campo</a>
  <a href="/login/"><b>□</b>Entrar</a>
</nav>
</body>
</html>
