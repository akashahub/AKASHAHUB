<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0B0B0F"/>
<title>Convergencia 01</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0b0f;--bg2:#14141b;--ink:#f4ede0;--dim:#b7ae9f;--mute:#7d766b;--gold:#d4af6a;--ok:#7dcea0;--line:rgba(244,237,224,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,sans-serif}
body{min-height:100dvh;background:radial-gradient(900px 520px at 80% -10%,rgba(212,175,106,.16),transparent 52%),var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 108px}
.brand{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-family:Fraunces,serif;font-size:13px}
h1,h3{font-family:Fraunces,serif;margin:0;font-weight:560}h1{font-size:28px;line-height:1.08}h3{font-size:16px}
.k{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-bottom:8px}
.q{color:var(--dim);font-size:13px;line-height:1.5}.m{color:var(--mute);font-size:12px}
.card{background:linear-gradient(#ffffff08,#ffffff04);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{width:100%;border:0;border-radius:999px;padding:13px 18px;background:var(--gold);color:#1a1408;font-weight:600;margin-top:12px;font-family:inherit}
.btn2{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn3{background:#2a2010;color:var(--gold);border:0}.danger{background:#3a1515;color:#f2c2c2;border:0}
input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;color:inherit;font:inherit}
textarea{min-height:80px}label{display:block;font-size:12px;color:var(--dim);margin:10px 0 6px}
.pill{display:inline-flex;background:#1c1c26;border-radius:999px;padding:5px 10px;font-size:11px;text-transform:uppercase;color:var(--dim)}
.ok{background:#16301f;color:var(--ok)}.wait{background:#2a2410;color:var(--gold)}
.xp{height:6px;background:#1c1c26;border-radius:99px;overflow:hidden;margin-top:10px}.xp>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f0d59a)}
.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(448px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);background:#0e0e14e6;border:1px solid var(--line);border-radius:22px;padding:10px 6px;z-index:20}
.nav button{background:0;border:0;color:var(--mute);font-size:11px;font-family:inherit}.nav button.on{color:var(--gold)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1d1912;border:1px solid #d4af6a59;color:#f0d59a;padding:10px 14px;border-radius:999px;font-size:13px;z-index:40}
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:36px 20px;max-width:480px;margin:0 auto}
.banner{font-size:12px;color:#c9b48a;background:#1d1912;border:1px solid #d4af6a33;border-radius:12px;padding:10px 12px;margin-top:12px}
.qr{font-family:ui-monospace,monospace;letter-spacing:.12em;font-size:13px;background:#0a0a0c;border:1px dashed #d4af6a55;border-radius:12px;padding:18px 10px;text-align:center;margin-top:10px;color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/livekit-client@2.15.7/dist/livekit-client.umd.js"></script>
<script src="converge.js?v=20260917b"></script>
</body>
</html>
