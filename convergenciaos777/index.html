<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0B0B0F"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="description" content="Convergência OS. Infraestrutura da experiência: acesso, salas, live global, feed, replay e comunidade."/>
<link rel="canonical" href="https://akashahub.com.br/convergenciaos777/"/>
<title>Convergência OS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0b0f;--bg2:#14141b;--ink:#f4ede0;--dim:#b7ae9f;--mute:#7d766b;--gold:#d4af6a;--ok:#7dcea0;--line:rgba(244,237,224,.08);--hot:#e07a72}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,sans-serif}
body{min-height:100dvh;background:radial-gradient(900px 520px at 80% -10%,rgba(212,175,106,.16),transparent 52%),var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 118px}
.brand{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-family:Fraunces,serif;font-size:13px}
h1,h3{font-family:Fraunces,serif;margin:0;font-weight:560}
h1{font-size:28px;line-height:1.08}
h3{font-size:16px}
.k{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-bottom:8px}
.q{color:var(--dim);font-size:13px;line-height:1.5}
.m{color:var(--mute);font-size:12px}
.card{background:linear-gradient(#ffffff08,#ffffff04);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;text-align:left;width:100%}
button.card{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{width:100%;border:0;border-radius:999px;padding:13px 18px;background:var(--gold);color:#1a1408;font-weight:600;margin-top:12px}
.btn2{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn3{background:#2a2010;color:var(--gold);border:0}
.inline{width:auto;margin:0;padding:8px 12px;font-size:12px}
input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}
textarea{min-height:74px}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#1c1c26;border-radius:999px;padding:5px 10px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.ok{background:#16301f;color:var(--ok)}
.hot{background:#3a1818;color:#f0b2ac}
.xp{height:6px;background:#1c1c26;border-radius:99px;overflow:hidden;margin-top:10px}
.xp>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f0d59a);width:var(--w)}
.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(448px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);background:#0e0e14ee;border:1px solid var(--line);border-radius:22px;padding:8px 4px 10px;z-index:20;backdrop-filter:blur(10px)}
.nav button{background:0;border:0;color:var(--mute);font-size:11px;padding:6px 0}
.nav button.on{color:var(--gold)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1d1912;border:1px solid #d4af6a59;color:#f0d59a;padding:10px 14px;border-radius:999px;font-size:13px;z-index:40;max-width:min(420px,calc(100% - 24px))}
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:36px 20px;max-width:480px;margin:0 auto}
.chips{display:flex;gap:8px;overflow:auto;margin-top:10px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:#14141b;color:var(--dim);border-radius:999px;padding:7px 10px;font-size:11px;white-space:nowrap}
.chip.on{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--hot);display:inline-block}
.qr{font-family:ui-monospace,monospace;letter-spacing:.08em;font-size:12px;background:#0a0a0c;border:1px dashed #d4af6a55;border-radius:12px;padding:14px 10px;text-align:center;margin-top:10px;color:var(--gold);word-break:break-all}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#241c10;color:var(--gold);font-size:12px;flex:none}
.who{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/livekit-client@2.15.7/dist/livekit-client.umd.js"></script>
<script src="app.js?v=20260924b"></script>
</body>
</html>
