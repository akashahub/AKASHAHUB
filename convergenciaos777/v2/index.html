<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f7f4ef"/>
<title>Convergência OS 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f7f4ef;--bg2:#ffffff;--ink:#1a1612;--dim:#5c564e;--mute:#8a847c;--gold:#b8956a;--line:rgba(26,22,18,.1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,sans-serif}
body{min-height:100dvh}.wrap{max-width:560px;margin:0 auto;padding:0 0 100px}
h1,h2,h3{font-family:Fraunces,serif;margin:0;font-weight:560}h1{font-size:28px}
.k{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.q{color:var(--dim);font-size:14px;line-height:1.55}.m{color:var(--mute);font-size:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.btn{width:100%;border-radius:999px;padding:13px 16px;background:var(--gold);color:#1a1408;font-weight:600;margin-top:10px;border:0}
.top{position:sticky;top:0;background:rgba(247,244,239,.92);backdrop-filter:blur(12px);z-index:10;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1px solid var(--line);padding:8px 0;z-index:20;max-width:560px;margin:0 auto}
#notepad-btn{position:fixed;bottom:78px;right:18px;width:56px;height:56px;border-radius:50%;background:var(--gold);color:#1a1408;display:none;place-items:center;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:22px;border:0}
body.is-admin #notepad-btn{display:grid}
#notepad-panel{position:fixed;bottom:140px;right:14px;width:min(420px,calc(100vw - 28px));height:min(70dvh,560px);background:var(--bg2);border:1px solid var(--line);border-radius:20px;z-index:31;display:none;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden}
#notepad-panel.open{display:flex}
#notepad-panel header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#notepad-panel textarea{flex:1;border:0;resize:none;padding:14px 16px;font-size:13.5px;line-height:1.55;background:transparent;outline:none}
#notepad-panel .tabs{display:flex;gap:6px;padding:8px 12px 0;overflow:auto}
#notepad-panel .tabs button{padding:6px 10px;border-radius:999px;font-size:12px;background:#f0ebe4;color:var(--dim);border:0}
#notepad-panel .tabs button.on{background:var(--gold);color:#1a1408}
.hero-img{width:100%;height:180px;object-fit:cover;border-radius:16px;margin-top:8px}
.pill{display:inline-flex;background:#f0ebe4;border-radius:999px;padding:4px 10px;font-size:11px;text-transform:uppercase;color:var(--dim)}
.highlight{background:#fff8e8;border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 12px 12px 0;margin:12px 0}
</style>
</head>
<body>
<div id="app"></div>
<button id="notepad-btn" title="Bloco de Notas">📝</button>
<div id="notepad-panel">
  <header><strong>Bloco de Notas · Mentor</strong><button id="close-notepad" style="border:0;background:none;font-size:18px">✕</button></header>
  <div class="tabs">
    <button class="on" data-tab="visao">Visão Completa</button>
    <button data-tab="checklist">Checklist</button>
    <button data-tab="app">App a Criar</button>
    <button data-tab="hoteis">Hotéis</button>
    <button data-tab="ideias">Ideias</button>
  </div>
  <textarea id="notes-area"></textarea>
</div>
<script>
const ADMINS=["yanfili.simon@gmail.com","sendatantrica@gmail.com"];
let currentUser="";
const NOTES={
visao:`VISÃO INTEGRAL DO EVENTO · CONVERGÊNCIA OS 2.0\n(Preservado integralmente conforme descrito + complementos)\n\n=== CAMADAS INICIAIS (3 SIMULTÂNEAS) ===\nEvento começa em 3 camadas. Hotel fechado com infraestrutura para gastronomia, salas e 3 palcos + 1 sala por área.\n\nÁrea Business: 3 palcos + 1 sala acontecendo simultaneamente.\nOutras áreas (Tech/Mindset etc.): mesmo modelo — 3 palcos + 1 sala.\nDigital + Presencial simultâneo. Gente gravando, plateia, tudo organizado e chique.\n\n=== GASTRONOMIA ===\nNo hotel. Mesa, cozinha, natural. Alimentação durante todo o processo (serviço contínuo).\n\n=== WELLNESS ===\nDepois das 3 salas/palcos. Hotel com:\n- Sala vaga só para terapias\n- Palestras terapia, exercícios, práticas\n- Reservas\n- Hidromassagem\n- Pessoas guiando exercícios, massagens e outras atividades\n- Salas de aprendizado (tudo gravado)\n\n=== ENTRETENIMENTO / FESTIVAL DE MÚSICA ===\nA partir de ~16h ou 18h até de madrugada.\nHotel na frente da praia.\n3–4 palcos:\n1. Lado de fora (mais fechado / aberto controlado)\n2. Lado de dentro\n3. Dentro do hotel ou outro lado\nDiferentes tipos de música em cada palco.\nFilmado como grande festival. Online + Presencial.\nSalas online autorizadas (pessoas liberadas fazem lives/vídeos).\nEcossistema de rede social gigante dentro do festival (posts + lives autorizadas após missões).\n\n=== MANHÃ SEGUINTE (ABERTO AO PÚBLICO) ===\nÁrea aberta do hotel ou ao lado.\nCafé aberto. Música eletrônica. Galera tomando cafezinho.\nMini-eventos, corridas (3 km e 7 km), influenciadores.\nFestival de surf / campeonato de surf.\nGrupos: corrida, futevôlei, vôlei.\nGastronomia + suplementos + produtos naturais.\nParceria possível com prefeitura para abrir ao mar.\n\n=== SÓCIOS / INVESTIDORES / INFLUENCIADORES ===\nNegociação por porcentagem do ingresso (não só cachê fixo).\nSmart money: líderes dominantes investem com a cara, entram de graça ou com equity.\nSociedade / parceria / oportunidade de influenciar sem pagar ingresso.\nOutros sócios também.\nReunião final (online + presencial) com todos que participaram como sócios — para próximos eventos.\n\n=== PLATAFORMA / REDE SOCIAL DO EVENTO ===\nTodos podem fazer posts (estilo Instagram).\nLives só liberadas após missões (para o ecossistema de eventos).\nPessoas autorizadas gravam e divulgam.\n\n=== ÚLTIMO DIA ===\nEsporte, atividades inovadoras, café da manhã sem álcool.\nTudo aberto, menos compromisso direto com audiovisual da plataforma (mas quem já está autorizado continua).\n\n=== COMPLEMENTOS ===\n- Modelo replicável e legado (funciona sem depender de uma pessoa).\n- Modais de escala (nunca pequeno/nichado demais).\n- Checklist operacional e de sistema abaixo.\n- App exclusivo dos sócios/franqueados/CEOs em destaque.`,
checklist:`CHECKLIST DO SISTEMA · O QUE PRECISA FUNCIONAR\n\n[ ] Hotel fechado com 3 palcos + salas por área (Business, Tech, Mindset, Wellness...)\n[ ] Infraestrutura de gastronomia contínua\n[ ] Streaming simultâneo digital + presencial\n[ ] Autorização de lives (missões + liberação)\n[ ] Salas de wellness: terapias, hidromassagem, práticas, aprendizado (gravado)\n[ ] Palcos de entretenimento (3–4) com sonorização e filmagem\n[ ] Área aberta matinal + café + eletrônica\n[ ] Corridas 3 km e 7 km + grupos de surf, futevôlei, vôlei\n[ ] Parcerias: prefeitura, gastronomia, suplementos, influenciadores\n[ ] Modelo de sócios (porcentagem / smart money / equity)\n[ ] Reunião final de sócios (online + presencial)\n[ ] Plataforma de posts + lives autorizadas\n[ ] App dos sócios/CEOs\n[ ] Bloco de notas do mentor\n[ ] Checklist de operação replicável\n[ ] Manuais e treinamentos no app de sócios`,
app:`★ APLICATIVO QUE EU TENHO QUE CRIAR ★\n(Destaque)\n\nAPLICATIVO CONVERGENCE DOS SÓCIOS / FRANQUEADOS / CEOs\n\nReferência: Barra Academy (parte dos investidos, franqueados e sócios CEOs).\n\nConteúdo obrigatório:\n- Informações de sócios\n- Manuais de operação\n- Treinamentos\n- Parte audiovisual dos CEOs (como mandar, dar as ideias)\n- Ideias de hotéis e estrutura\n- Como o evento funciona (modelo de negócio de evento)\n- Modelo replicável para todos os festivais Convergence\n- Legado: funciona sozinho, sem depender de ninguém\n- Englobar tudo sempre (nunca algo pequeno ou nichado demais)\n- Modais de escala\n\nEste app é o sistema operacional dos sócios. Precisa ser criado e destacado.`,
hoteis:`DICAS DE HOTÉIS (para encaixar no app)\n\nBuscar hotéis:\n- Frente de praia\n- Com salas múltiplas + áreas externas para palcos\n- Infraestrutura de gastronomia\n- Spa / wellness / hidromassagem\n- Possibilidade de fechar para o evento e depois abrir ao público\n- Próximo de espaço para corrida e atividades ao ar livre\n\nExemplos conceituais (adaptar localmente):\n- Hotéis all-inclusive com múltiplos espaços de evento\n- Resorts com palco externo + salões internos\n- Propriedades com área aberta matinal e acesso à praia`,
ideias:`IDEIAS COMPLEMENTARES\n\n1. Sistema de missões para liberar live (engajamento + autoridade).\n2. Porcentagem variável por performance de influenciador/sócio.\n3. Café da manhã aberto como “porta de entrada” do público.\n4. Gravação total para criar conteúdo legado (cursos, replays, manuais).\n5. Grupos temáticos (surf, corrida, futevôlei) com líderes parceiros.\n6. Gastronomia + suplementos como receita própria do evento.\n7. Reunião de sócios como ritual de fechamento e planejamento do próximo.\n8. App de sócios com dashboard de equity, manuais e treinamentos.\n9. Bloco de notas do mentor sempre acessível.\n10. Modais: o mesmo formato se replica em outros hotéis/cidades sem perder a essência.`
};
function render(){
  const root=document.getElementById("app");
  const isAdmin=ADMINS.includes(currentUser.toLowerCase());
  document.body.classList.toggle("is-admin",isAdmin);
  root.innerHTML=`<div class="wrap"><header class="top"><b>Convergência OS 2.0</b><div style="display:flex;gap:8px;align-items:center"><span class="pill">${isAdmin?"Mentor":"Visitante"}</span><button onclick="toggleLogin()" style="font-size:12px;border:0;background:none">${currentUser?"Sair":"Entrar (demo)"}</button></div></header><div style="padding:16px"><div class="k">Versão 2.0 · Fundo claro</div><h1>Ecossistema de Evento em Camadas</h1><p class="q">Hotel fechado → 3 palcos + salas simultâneas → Wellness → Festival de música → Manhã aberta com café, corridas, surf e gastronomia.</p><img class="hero-img" src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800" alt="Hotel"/><div class="card"><h3>Estrutura do Evento</h3><p class="q">3 camadas iniciais simultâneas · Gastronomia contínua · Wellness com terapias e hidromassagem · 3–4 palcos de música · Manhã aberta ao público.</p></div><div class="highlight"><strong>★ App dos Sócios / CEOs a criar</strong><br><span class="q">Aplicativo Convergence para franqueados e sócios (referência Barra Academy). Manuais, treinamentos, modelo replicável e legado. Ver bloco de notas.</span></div><p class="m" style="margin-top:20px">Tudo o que você descreveu está preservado integralmente no Bloco de Notas (canto inferior direito — visível para o mentor).</p><button class="btn" onclick="document.getElementById('notepad-panel').classList.add('open')">Abrir Bloco de Notas</button></div></div><nav class="nav"><button style="border:0;background:none;color:#1a1612">⌂</button><button style="border:0;background:none;color:#8a847c">⌕</button><button style="border:0;background:none;color:#8a847c">+</button><button style="border:0;background:none;color:#8a847c">▶</button><button style="border:0;background:none;color:#8a847c">☺</button></nav>`;
}
function toggleLogin(){currentUser=currentUser?"":"yanfili.simon@gmail.com";render();}
const btn=document.getElementById("notepad-btn");const panel=document.getElementById("notepad-panel");const area=document.getElementById("notes-area");const closeBtn=document.getElementById("close-notepad");const tabs=panel.querySelectorAll(".tabs button");
btn.onclick=()=>panel.classList.toggle("open");
closeBtn.onclick=()=>panel.classList.remove("open");
tabs.forEach(t=>{t.onclick=()=>{tabs.forEach(x=>x.classList.remove("on"));t.classList.add("on");area.value=NOTES[t.dataset.tab]||"";}});
area.value=NOTES.visao;
render();
</script>
</body>
</html>
