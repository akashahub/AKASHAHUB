<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#07040a"/>
<title>CIRCUITO</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@600;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07040a;--ink:#f6efe6;--dim:#c7b7a4;--mute:#8a7a6c;--gold:#e8c37a;--rose:#e35d7a;--line:rgba(246,239,230,.12)}
*{box-sizing:border-box}html,body{margin:0;background:#07040a;color:var(--ink);font-family:Syne,system-ui,sans-serif}
body{min-height:100dvh;background:radial-gradient(800px 480px at 100% -10%,rgba(227,93,122,.2),transparent 50%),#07040a}
h1,h2{font-family:"Instrument Serif",serif;font-weight:400}h1{font-size:clamp(32px,6vw,54px);line-height:.95;margin:0 0 10px}h2{font-size:24px;margin:0 0 6px}
.k{letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--gold);margin:0 0 8px}
.lead{color:var(--dim);line-height:1.55;max-width:36rem}.mute{color:var(--mute);font-size:13px;line-height:1.45}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 120px}
.btn{border:0;border-radius:999px;padding:12px 16px;background:var(--gold);color:#1a1208;font:inherit;font-weight:800;margin:6px 6px 0 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.rose{background:var(--rose);color:#fff}
.card{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;background:#12080e;text-align:left;width:100%;color:inherit;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}
.tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.dock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(640px,calc(100% - 14px));display:grid;grid-template-columns:repeat(6,1fr);background:#07040af5;border:1px solid var(--line);border-radius:22px;padding:7px;z-index:20}
.dock button{background:0;border:0;color:var(--mute);font:inherit;font-size:9px;text-transform:uppercase}
.dock button.on{color:var(--gold)}
.bar{height:6px;background:#2a1510;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
.chat{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
input{width:100%;background:#0d070a;border:1px solid var(--line);border-radius:12px;padding:10px;color:inherit;font:inherit}
.chip{display:inline-flex;border-radius:99px;padding:3px 8px;background:#2a1510;color:var(--gold);font-size:11px}
</style>
</head>
<body>
<div id="app">abrindo</div>
<script>
(function(){
  var KEY="circuito.v02";
  function load(){try{return Object.assign({r:"capa",done:{},pts:80,conn:12,liveOn:false,chat:["bar: primeira rodada","pista: drop"]},JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch(e){return{r:"capa",done:{},pts:80,conn:12,liveOn:false,chat:[]}}}
  function save(){localStorage.setItem(KEY,JSON.stringify(S))}
  var S=load();
  function go(r){S.r=r;save();draw()}
  function dock(){
    var xs=["capa","palcos","pessoas","circuito","feed","eu"];
    return '<nav class="dock">'+xs.map(function(x){return '<button class="'+(S.r===x?"on":"")+'" data-go="'+x+'">'+x+'</button>'}).join("")+'</nav>';
  }
  function tile(id,t,d){return '<button class="card" data-go="'+id+'"><div class="tag">'+id+'</div><h2>'+t+'</h2><p class="mute">'+d+'</p></button>'}
  function bloco(t,d){return '<div class="card"><h2>'+t+'</h2><p class="mute">'+d+'</p></div>'}
  function chatBox(){return '<div class="card"><div class="tag">comentarios</div><div class="chat" id="ch">'+(S.chat||[]).map(function(x){return '<div class="mute">'+x+'</div>'}).join('')+'</div><input id="ci" placeholder="escreve e enter"/></div>'}
  function capa(){
    return '<div class="wrap"><p class="k">CIRCUITO · Amsterdam / San Sebastian</p><h1>Seis portas.<br/>Uma casa.</h1><p class="lead">Cada card e um mundo. Live oficial e live de gente nao se misturam.</p><div class="grid">'+
      tile("palcos","Palcos","2 ou 3 salas oficiais. Principal, eletronico, backstage.")+
      tile("pessoas","Pessoas","Perfil tipo Twitch. Live so com 50 conexoes na festa ou staff.")+
      tile("circuito","Circuito","Seis balizas QR. Roteiro, nao corrida.")+
      tile("feed","Feed","UGC aprovado no QG. Fica na casa.")+
      tile("bau","Bau","Aftermovie, teaser, setlist.")+
      tile("eu","Perfil","Seu QR. Conexoes. Trava da live. Carteira.")+
    '</div><button class="btn ghost" data-go="como">Como funciona</button><button class="btn ghost" data-go="qg">QG staff</button></div>'+dock();
  }
  function palcos(){
    return '<div class="wrap"><p class="k">oficiais</p><h1>Palco 1, 2 e back.</h1><p class="lead">Transmissao da casa. Passaporte assiste do sofa.</p>'+bloco("Palco 1 · principal","Linha oficial.")+bloco("Palco 2 · eletronico","Segunda sala.")+bloco("Backstage · spoiler","10 a 15 min. Recado, nao o show.")+chatBox()+dock()+'</div>';
  }
  function pessoas(){
    var lock=S.conn>=50||S.liveOn;
    return '<div class="wrap"><p class="k">twitch da noite</p><h1>Cada perfil pode virar live.</h1><p class="lead">Trava: 50 conexoes NA FESTA ou botao do staff. Nao e 5 mil celulares no ar.</p>'+bloco("Bar · ambiente","Drink. TikTok chato de proposito. Staff liga sem 50.")+bloco("Pista · ambiente","Quem filma o drop.")+bloco("Camarote · ambiente","Quem o manager autorizou.")+'<div class="card"><b>Sua live</b><p class="mute">'+S.conn+'/50. '+(lock?'Trava aberta.':'Ainda fechada.')+'</p><div class="bar"><i style="width:'+Math.min(100,S.conn*2)+'%"></i></div>'+(lock?'<span class="chip">pode ir ao ar</span>':'<button class="btn ghost" id="addc">Simular +1 conexao</button>')+'</div>'+chatBox()+dock()+'</div>';
  }
  function circuito(){
    var B=[["Porta","5s da fila"],["Pista","video no drop"],["Bar","foto do drink"],["Camarote","some dois QRs"],["Back","spoiler 10s"],["After","still do fim"]];
    var n=Object.keys(S.done).length;
    return '<div class="wrap"><p class="k">orientacao</p><h1>Seis balizas.</h1><p class="lead">QR. Upload. Proxima na hora. QG olha depois.</p><p class="mute">'+n+'/6</p><div class="grid">'+B.map(function(x,i){var id="b"+i;var on=S.done[id];return '<div class="card"><b>'+x[0]+'</b><p class="mute">'+x[1]+'</p>'+(on?'<span class="chip">ok</span>':'<button class="btn ghost" data-b="'+id+'">cumprir</button>')+'</div>'}).join('')+'</div>'+dock()+'</div>';
  }
  function feed(){return '<div class="wrap"><p class="k">moments</p><h1>Aprovado cai aqui.</h1><div class="card">Livia · pista</div><div class="card">Rafa · bar</div>'+dock()+'</div>'}
  function bau(){return '<div class="wrap"><p class="k">reliquia</p><h1>Aftermovie nao some.</h1><div class="card">2019 · San Sebastian</div>'+dock()+'</div>'}
  function eu(){return '<div class="wrap"><p class="k">perfil</p><h1>Seu QR da noite.</h1><p class="lead">50 conexoes ou staff = voce vira canal.</p><div class="card"><div class="tag">codigo</div><h2>SS-7K2</h2></div><div class="card"><b>Conexoes</b> '+S.conn+'/50<div class="bar"><i style="width:'+Math.min(100,S.conn*2)+'%"></i></div></div><div class="card"><b>Carteira</b> '+S.pts+' pts</div></div>'+dock()}
  function qg(){return '<div class="wrap"><p class="k">staff · manager · ceo</p><h1>QG da noite.</h1><div class="card"><h2>Fila UGC</h2><button class="btn rose" id="no">rejeitar</button><button class="btn" id="yes">aprovar</button></div><div class="card"><h2>Pedido de live</h2><p class="mute">Bar pede ambiente.</p><button class="btn" id="grant">autorizar</button></div></div>'}
  function como(){return '<div class="wrap"><p class="k">manual</p><h1>Como mostrar.</h1><p class="lead">Capa = seis mundos. Palcos = casa. Pessoas = Twitch com trava. 50 mil pessoas nao sao 50 mil lives.</p><div class="card"><b>Live chata vale.</b><p class="mute">Bar filmando o drink e produto.</p></div><button class="btn" data-go="capa">Entendi</button></div>'}
  function draw(){
    var map={capa:capa,palcos:palcos,pessoas:pessoas,circuito:circuito,feed:feed,bau:bau,eu:eu,qg:qg,como:como};
    document.getElementById("app").innerHTML=(map[S.r]||capa)();
    document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-go"))}});
    document.querySelectorAll("[data-b]").forEach(function(b){b.onclick=function(){S.done[b.getAttribute("data-b")]=1;S.pts+=20;save();draw()}});
    var a=document.getElementById("addc"); if(a) a.onclick=function(){S.conn++;save();draw()};
    var g=document.getElementById("grant"); if(g) g.onclick=function(){S.liveOn=true;save();go("pessoas")};
    var y=document.getElementById("yes"); if(y) y.onclick=function(){go("feed")};
    var i=document.getElementById("ci"); if(i) i.onkeydown=function(e){if(e.key==="Enter"&&i.value){S.chat.push(i.value);save();draw()}};
  }
  draw();
})();
</script>
</body></html>
