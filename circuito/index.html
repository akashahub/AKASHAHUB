<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#07040a"/>
<title>CIRCUITO</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07040a;--ink:#f6efe6;--dim:#c7b7a4;--mute:#8a7a6c;--gold:#e8c37a;--rose:#e35d7a;--line:rgba(246,239,230,.1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Syne,system-ui,sans-serif}
body{min-height:100dvh;background:radial-gradient(900px 520px at 110% -10%,rgba(227,93,122,.22),transparent 46%),var(--bg)}
h1,h2{font-family:"Instrument Serif",serif;font-weight:400}h1{font-size:clamp(34px,7vw,58px);line-height:.95;margin:0 0 12px}h2{font-size:26px;margin:0 0 8px}
.k{letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold)}
.lead{color:var(--dim);max-width:36rem;line-height:1.55}.mute{color:var(--mute);font-size:13px}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 120px}
.btn{border:0;border-radius:999px;padding:13px 18px;background:var(--gold);color:#1a1208;font-weight:800;font:inherit;margin:6px 6px 0 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.rose{background:var(--rose);color:#fff}
.card{border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;background:#11080d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.baliza{border:1px solid var(--line);border-radius:16px;padding:14px;min-height:110px}.baliza.on{border-color:#e8c37a88}
.dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(620px,calc(100% - 16px));display:grid;grid-template-columns:repeat(5,1fr);background:#07040af2;border:1px solid var(--line);border-radius:24px;padding:8px;z-index:20}
.dock button{background:0;border:0;color:var(--mute);font:inherit;font-size:10px;text-transform:uppercase}
.dock button.on{color:var(--gold)}
.chip{display:inline-flex;border-radius:999px;padding:4px 10px;background:#2a1510;color:var(--gold);font-size:11px}
.stage{aspect-ratio:16/9;border-radius:16px;background:#11060c;margin:10px 0;display:grid;place-items:center;border:1px solid var(--line);color:var(--mute)}
</style>
</head>
<body>
<div id="app">abrindo...</div>
<script>
(function(){
  var KEY="circuito.v01";
  var B=[
    {id:"b1",t:"Porta",j:"5s da fila"},
    {id:"b2",t:"Pista",j:"Video no drop"},
    {id:"b3",t:"Bar",j:"Foto do drink"},
    {id:"b4",t:"Camarote",j:"Some dois QRs"},
    {id:"b5",t:"Back",j:"Spoiler 10s"},
    {id:"b6",t:"After",j:"Still do fim"}
  ];
  function load(){try{return Object.assign({done:{},pts:120,r:"gate"},JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch(e){return{done:{},pts:120,r:"gate"}}}
  function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
  var S=load();
  function go(r){S.r=r;save(S);draw()}
  function toast(t){var e=document.createElement("div");e.style.cssText="position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#2a1510;border:1px solid #e8c37a55;padding:10px 14px;border-radius:99px;z-index:40";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},1600)}
  function dock(){
    return '<nav class="dock">'+["casa","lives","circuito","feed","bau"].map(function(x){return '<button class="'+(S.r===x?"on":"")+'" data-go="'+x+'">'+x+'</button>'}).join("")+'</nav>'
  }
  function gate(){
    return '<section class="wrap" style="min-height:80dvh;display:flex;flex-direction:column;justify-content:flex-end"><p class="k">casa de festa</p><h1>Quem nao veio<br/>ainda esta na casa.</h1><p class="lead">Passaporte, bau, live de palco e camarim, seis balizas, carteira.</p><p class="mute">Amsterdam / San Sebastian · pele 01</p><div><button class="btn" data-go="casa">Entrar na casa</button><button class="btn ghost" data-go="qg">QG</button></div></section>'
  }
  function casa(){
    return '<div class="wrap"><p class="k">esta noite</p><h1>San Sebastian<br/>abre o circuito.</h1><p class="lead">Pista joga. Sofa assiste. UGC fica na casa.</p><div class="stage">palco · demo</div><div class="card"><b>Spoiler camarim</b><p class="mute">10 min de recado. Passaporte entra.</p><button class="btn rose" data-go="lives">Abrir lives</button></div><div class="card"><b>Carteira</b> <span class="chip">'+S.pts+' pts</span></div>'+dock()+'</div>'
  }
  function lives(){
    return '<div class="wrap"><p class="k">transmissao</p><h1>Duas salas.</h1><div class="stage">PALCO PRINCIPAL</div><div class="card"><h2>Spoiler no camarim</h2><p class="mute">Nao e o show. E o recado.</p></div>'+dock()+'</div>'
  }
  function circuito(){
    var n=B.filter(function(x){return S.done[x.id]}).length;
    return '<div class="wrap"><p class="k">orientacao</p><h1>Seis balizas.</h1><p class="mute">'+n+'/6</p><div class="grid">'+B.map(function(x){var on=S.done[x.id];return '<article class="baliza'+(on?' on':'')+'"><b>'+x.t+'</b><p class="mute">'+x.j+'</p>'+(on?'<span class="chip">ok</span>':'<button class="btn ghost" data-b="'+x.id+'">cumprir</button>')+'</article>'}).join("")+'</div>'+(n>=6?'<div class="card"><h2>Circuito fechado.</h2></div>':'')+dock()+'</div>'
  }
  function feed(){
    return '<div class="wrap"><p class="k">moments</p><h1>A festa posta<br/>para a casa.</h1><div class="card">Livia · pista</div><div class="card">Rafa · bar</div><div class="card">Nalu · camarote</div>'+dock()+'</div>'
  }
  function bau(){
    return '<div class="wrap"><p class="k">reliquia</p><h1>O aftermovie<br/>nao some.</h1><div class="stage">aftermovie · url</div>'+dock()+'</div>'
  }
  function qg(){
    return '<div class="wrap"><p class="k">qg</p><h1>Tinder da noite.</h1><div class="card"><h2>Pista · 5s</h2><p class="mute">Livia · baliza 02</p><button class="btn rose" id="no">rejeitar</button><button class="btn" id="yes">aprovar</button></div><button class="btn ghost" data-go="casa">voltar</button></div>'
  }
  function draw(){
    var el=document.getElementById("app");
    var map={gate:gate,casa:casa,lives:lives,circuito:circuito,feed:feed,bau:bau,qg:qg};
    el.innerHTML=(map[S.r]||gate)();
    el.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-go"))}});
    el.querySelectorAll("[data-b]").forEach(function(b){b.onclick=function(){S.done[b.getAttribute("data-b")]=true;S.pts+=40;save(S);toast("Baliza +40");draw()}});
    var y=document.getElementById("yes"); if(y) y.onclick=function(){toast("No feed")};
    var n=document.getElementById("no"); if(n) n.onclick=function(){toast("Manda de novo")};
  }
  draw();
})();
</script>
</body>
</html>
