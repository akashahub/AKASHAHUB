<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reservas · SPAVO Demo</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="demo-banner"><strong>Demo</strong> — Reservas</div>
  <div class="painel-layout">
    <aside class="sidebar">
      <div class="brand">SPAVO Digital</div>
      <nav>
        <a href="painel.html">Resumo</a>
        <a href="painel-reservas.html" class="active">Reservas</a>
        <a href="painel-agenda.html">Agenda</a>
        <a href="painel-salas.html">Salas</a>
        <a href="index.html">Hub demo</a>
      </nav>
    </aside>
    <div class="painel-main">
      <div class="painel-top"><h1>Reservas</h1><a href="painel.html" class="btn btn-outline btn-sm">← Voltar</a></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Solicitante</th><th>Sala</th><th>Início</th><th>Status</th><th>Pagamento</th><th>Ações</th></tr></thead>
          <tbody>
            <tr>
              <td><strong>Ana Paula</strong></td><td>Sala Luz</td><td>20/10 14:00</td>
              <td><span class="badge badge-requested status-badge">Solicitada</span></td>
              <td><span class="badge badge-unpaid">Não pago</span></td>
              <td class="actions"><button type="button" class="btn btn-success" data-action="approve">Aprovar</button><button type="button" class="btn btn-danger" data-action="reject">Recusar</button></td>
            </tr>
            <tr>
              <td><strong>Grupo Aurora</strong></td><td>Sala Luz</td><td>18/10 18:00</td>
              <td><span class="badge badge-confirmed status-badge">Confirmada</span></td>
              <td><span class="badge badge-paid">Pago</span></td>
              <td class="actions"><button type="button" class="btn btn-outline" data-action="cancel">Cancelar</button></td>
            </tr>
            <tr>
              <td><strong>Marina Silva</strong></td><td>Sala Terra</td><td>19/10 09:00</td>
              <td><span class="badge badge-approved status-badge">Aprovada</span></td>
              <td><span class="badge badge-unpaid">Não pago</span></td>
              <td class="actions"><button type="button" class="btn btn-success" data-action="confirm">Confirmar</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
