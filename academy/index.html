<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#06151a"/>
<title>Fluir Academy</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#06151a;--bg2:#0b2229;--ink:#eef6f4;--dim:#9bb7b6;--mute:#6d8887;
  --teal:#2ec4b6;--teal2:#7ee0d4;--ok:#7dcea0;--warn:#e7c56a;
  --line:rgba(238,246,244,.08);--card:#0c1f25;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
body{min-height:100dvh;background:
  radial-gradient(800px 420px at 90% -20%,rgba(46,196,182,.18),transparent 50%),
  radial-gradient(600px 300px at -10% 110%,rgba(46,196,182,.08),transparent 46%),
  var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 118px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2ec4b6,#0e7c74);display:grid;place-items:center;font-weight:700;color:#042226}
.brand b{font-family:Fraunces,serif;font-size:16px;letter-spacing:.04em}
.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
h1,h2,h3{font-family:Fraunces,serif;margin:0;font-weight:560}
h1{font-size:28px;line-height:1.1}h2{font-size:20px}h3{font-size:16px}
.k{color:var(--teal);letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-bottom:6px}
.q{color:var(--dim);font-size:13px;line-height:1.55}
.m{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:220px 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.side{display:none}}
.side{background:linear-gradient(#ffffff07,#ffffff03);border:1px solid var(--line);border-radius:18px;padding:12px;height:fit-content}
.side button{width:100%;text-align:left;background:0;border:0;color:var(--dim);padding:10px 10px;border-radius:12px;font:inherit}
.side button.on{background:#12343a;color:var(--teal2)}
.card{background:linear-gradient(#ffffff08,#ffffff03);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{width:100%;border:0;border-radius:999px;padding:12px 16px;background:var(--teal);color:#042226;font-weight:700;margin-top:10px;font-family:inherit}
.btn2{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn3{background:#12343a;color:var(--teal2)}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px;color:inherit;font:inherit}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 6px}
.pill{display:inline-flex;background:#12343a;border-radius:999px;padding:4px 10px;font-size:11px;text-transform:uppercase;color:var(--teal2)}
.ok{background:#16301f;color:var(--ok)}.wait{background:#2a2410;color:var(--warn)}
.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(640px,calc(100% - 16px));display:grid;grid-template-columns:repeat(6,1fr);background:#06151af2;border:1px solid var(--line);border-radius:22px;padding:8px 4px;z-index:20}
.nav button{background:0;border:0;color:var(--mute);font-size:10px;font-family:inherit;padding:8px 2px}
.nav button.on{color:var(--teal2)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#12343a;border:1px solid #2ec4b659;color:#d7fff8;padding:10px 14px;border-radius:999px;font-size:13px;z-index:40}
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 18px;max-width:480px;margin:0 auto}
.roles{display:grid;gap:8px}
.roles button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:inherit;font:inherit}
.roles button b{display:block}
.qr{font-family:ui-monospace,monospace;letter-spacing:.1em;font-size:14px;background:#041014;border:1px dashed #2ec4b655;border-radius:12px;padding:18px 10px;text-align:center;margin-top:10px;color:var(--teal2)}
.player{aspect-ratio:16/9;background:#041014;border-radius:14px;overflow:hidden;margin-top:10px}
.player iframe,.player video{width:100%;height:100%;border:0}
.item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#081b20}
.prog{height:6px;background:#12343a;border-radius:99px;overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#d7fff8)}
.avatar{width:36px;height:36px;border-radius:50%;background:#12343a;display:grid;place-items:center;font-size:12px;color:var(--teal2)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/livekit-client@2.15.7/dist/livekit-client.umd.js"></script>
<script src="https://cdn.jsdelivr.net/gh/akashahub/AKASHAHUB@main/academy/academy.js"></script>
</body>
</html>
