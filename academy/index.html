<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#041014"/>
<title>Fluir Academy</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#041014;--bg2:#07181d;--ink:#eefaf7;--dim:#9ab5b1;--mute:#6d8884;
  --teal:#3ee0c8;--teal2:#9ff3e6;--line:rgba(238,250,247,.08);--ok:#7dcea0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
body{min-height:100dvh;background:
  radial-gradient(900px 480px at 110% -10%,rgba(62,224,200,.16),transparent 50%),
  radial-gradient(700px 380px at -20% 120%,rgba(62,224,200,.07),transparent 50%),
  var(--bg)}
h1,h2,h3,b{font-family:Fraunces,serif;font-weight:560}
h1{font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0 0 10px}
h2{font-size:22px;margin:0}h3{font-size:18px;margin:8px 0}
.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--teal);margin:0 0 8px}
.lead{color:var(--dim);max-width:36rem;line-height:1.55}
.muted{color:var(--mute);font-size:13px}
.hint{color:var(--mute);font-size:12px;margin-top:14px}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100dvh}
.rail{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100dvh}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.logo i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#3ee0c8,#0e7c74);color:#042226;font-style:normal;font-weight:700}
.logo small{display:block;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:10px}
.nav-i{display:block;width:100%;text-align:left;background:0;border:0;color:var(--dim);padding:10px 12px;border-radius:12px;font:inherit;margin-bottom:4px}
.nav-i.on{background:#0d2a30;color:var(--teal2)}
.rail-foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:6px}
.stage{padding:28px 28px 110px;max-width:920px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.top-r{display:flex;align-items:center;gap:10px}
.meter{width:72px;height:6px;background:#0d2a30;border-radius:99px;overflow:hidden;display:block}
.meter i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#e8fffa)}
.bar{height:6px;background:#0d2a30;border-radius:99px;overflow:hidden;margin:10px 0}
.ava{width:34px;height:34px;border-radius:50%;background:#0d2a30;display:grid;place-items:center;color:var(--teal2);font-size:12px}
.card{background:linear-gradient(#ffffff0a,#ffffff03);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;background:#0d2a30;color:var(--teal2);border-radius:999px;padding:4px 10px;font-size:11px;text-transform:uppercase}
.chip.ok{background:#16301f;color:var(--ok)}.chip.dim{color:var(--dim)}
.btn{border:0;border-radius:999px;padding:12px 16px;background:var(--teal);color:#042226;font-weight:700;font:inherit;margin-top:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.slim{width:auto;padding:8px 14px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.line a{color:var(--teal2);text-decoration:none}
.player{aspect-ratio:16/9;background:#02090b;border-radius:16px;overflow:hidden;margin:12px 0}
.player iframe,.player video{width:100%;height:100%;border:0}
.grid-center{display:grid;place-items:center;color:var(--mute)}
.qr{font-family:ui-monospace,monospace;letter-spacing:.12em;text-align:center;padding:20px;margin:12px 0;border:1px dashed #3ee0c855;border-radius:14px;color:var(--teal2);background:#02090b}
input,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px;color:inherit;font:inherit}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 6px}
.gate{max-width:640px;margin:0 auto;padding:48px 20px 80px}
.role-grid{display:grid;gap:8px;margin-top:22px}
.role-card{text-align:left;background:#07181d;border:1px solid var(--line);border-radius:16px;padding:14px;color:inherit;font:inherit}
.role-card b{display:block;margin:4px 0}.role-card span{color:var(--dim);font-size:13px}
.role-card .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.stack{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.layers{margin-top:28px;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.dock{display:none}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#0d2a30;border:1px solid #3ee0c855;color:#d7fff8;padding:10px 14px;border-radius:999px;z-index:40;font-size:13px}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .stage{padding:18px 16px 120px}
  .duo,.stack{grid-template-columns:1fr}
  .dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 16px));display:grid;grid-template-columns:repeat(5,1fr);background:#041014f2;border:1px solid var(--line);border-radius:22px;padding:8px;z-index:20}
  .dock .nav-i{text-align:center;font-size:11px;margin:0}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/livekit-client@2.15.7/dist/livekit-client.umd.js"></script>
<script type="module" src="./js/boot.js?v=20260917c"></script>
</body>
</html>
