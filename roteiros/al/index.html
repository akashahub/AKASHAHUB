        { label: "Teoria", time: "8–32", lines: [
          "Tese: obra que só existe na memória do fundador ainda não é legado.",
          "Comunidade é o lugar onde o método se repete com outras pessoas.",
          "Doutrina, aqui, é o conjunto de princípios que a casa não negocia.",
          "Movimento é o nome do que junta essas pessoas em volta do princípio.",
          "Ler o negócio como quem compra: o que está documentado, o que depende de uma pessoa, o que gera caixa.",
          "Ler como quem vende: o que o próximo dono precisaria para não recomeçar do zero.",
          "Propósito não substitui boleto. Sustenta a decisão quando o boleto aperta."
        ]},
        { label: "Hermética", time: "mapa", lines: [
          "Ajna é mapa de visão. Coroa é mapa de governo.",
          "Lei da correspondência: como se governa por dentro, se governa o patrimônio.",
          "Artha a serviço de um princípio. Não acúmulo vazio.",
          "As fases anteriores são o sistema. Esta fase nomeia o sistema."
        ]},
        { label: "Objeção fixa", time: "ler sem improvisar", lines: [
          "Ainda é cedo para falar de legado.",
          "Legado não espera o auge. Legado é o hábito de escrever o que continua.",
          "Quem deixa para o fim descreve uma memória.",
          "Quem escreve agora descreve um método.",
          "O documento pode estar incompleto. Não pode estar ausente."
        ]},
        { label: "Diagnóstico", time: "32–72", lines: [
          "Declaração de legado. Uma página.",
          "O que continua funcionando se você sair trinta dias.",
          "O que ainda para.",
          "Nomear: comunidade, movimento, doutrina. Mesmo que um dos três ainda seja rascunho.",
          "Pergunta-gatilho: se alguém assumisse amanhã, qual pasta essa pessoa abriria primeiro?",
          "Encerrar quando a declaração couber em uma página e a pasta tiver nome."
        ]},
        { label: "Fechamento", time: "72–82", lines: [
          "Exercício: escrever a declaração em sete dias.",
          "Listar os princípios que a casa não negocia.",
          "Um mecanismo de continuidade. Grupo, rito, revisão. Um só.",
          "Tarefa: apresentar a página e a pasta no próximo encontro.",
          "As cinco fases são um sistema. Cada uma segura a próxima.",
          "Prova é o que outra pessoa consegue operar."
        ]},
        { label: "Complementar", time: "82–90", lines: [
          "Lucas 12:48. A quem muito foi dado, muito será pedido.",
          "Habacuque 2:2. Escreve a visão.",

};

const state = { fase: -1, reading: false, line: 0, size: 46 };

function esc(v){
  return String(v ?? "").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
}
function linesOf(fase){
  const out = [];
  fase.blocks.forEach(b => b.lines.forEach(l => out.push({ label: b.label, text: l })));
  return out;
}
function paint(){
  const app = document.getElementById("app");
  if (state.reading) { paintReader(); return; }
  if (state.fase < 0) { paintHome(); return; }
  const f = SERIES.fases[state.fase];
  app.innerHTML = `
    <div class="wrap phase">
      <a class="back" href="#visao" data-go="home">← As cinco fases</a>
      <header class="phase-head">
        <p class="kicker">Fase ${esc(f.code)} · ${esc(f.map)} · ${esc(f.time)}</p>
        <h1>${esc(f.title)}</h1>
        <p class="sub">${esc(f.objetivo)}</p>
        <div class="meta"><span class="tag g">${esc(f.tool)}</span><span class="tag p">chakra é mapa</span></div>
      </header>
      <div class="tese"><b>Tese</b><p>${esc(f.tese)}</p></div>
      <div class="actions">
        <button class="go" data-act="read">Ler no teleprompter</button>
        <a class="ghost" href="/afplataforma/" style="display:inline-flex;align-items:center">Abrir a plataforma</a>
      </div>
      <div class="blocks">
        ${f.blocks.map(b => `
          <article class="block">
            <p class="label">${esc(b.label)} <span>${esc(b.time)}</span></p>
            ${b.lines.map(l => `<p>${esc(l)}</p>`).join("")}
          </article>`).join("")}
      </div>
    </div>`;
  bind();
}
function paintHome(){
  document.getElementById("app").innerHTML = `
    <div class="wrap">
      <a class="back" href="/roteiros/">Biblioteca de roteiros</a>
      <p class="kicker">${esc(SERIES.kicker)}</p>
      <h1>${esc(SERIES.title)}</h1>
      <p class="sub">${esc(SERIES.subtitle)}</p>
      <div class="pills">${SERIES.pills.map(p => `<span class="pill">${esc(p)}</span>`).join("")}</div>
      <div class="logic">${SERIES.logic.map(p => `<p>${esc(p)}</p>`).join("")}</div>
      <div class="grid">
        ${SERIES.fases.map((f,i) => `
          <button class="card" data-fase="${i}">
            <p class="ep-num">Fase ${esc(f.code)} · ${esc(f.map)}</p>
            <h2>${esc(f.title)}</h2>
            <p>${esc(f.tese)}</p>
            <div class="meta"><span class="tag">${esc(f.time)}</span><span class="tag g">${esc(f.tool)}</span></div>
          </button>`).join("")}
      </div>
    </div>`;
  bind();
}
function paintReader(){
  const f = SERIES.fases[state.fase];
  const lines = linesOf(f);
  const i = Math.max(0, Math.min(state.line, lines.length - 1));
  const cur = lines[i];
  const next = lines[i+1];
  document.documentElement.style.setProperty("--read", state.size + "px");
  document.getElementById("app").innerHTML = `
    <div class="reader">
      <div class="reader-bar">
        <button data-act="exit">Fechar</button>
        <span class="kicker" style="margin:0">${esc(f.title)} · ${i+1}/${lines.length}</span>
        <span>
          <button data-act="smaller">A−</button>
          <button data-act="bigger">A+</button>
        </span>
      </div>
      <div class="progress"><i style="width:${Math.round((i+1)/lines.length*100)}%"></i></div>
      <div class="reader-stage" data-act="next">
        <p class="reader-kicker">${esc(cur.label)}</p>
        <p class="reader-line">${esc(cur.text)}</p>
        <p class="reader-next">${next ? esc(next.text) : "Fim desta fase."}</p>
      </div>
    </div>`;
  bind();
}
function bind(){
  document.querySelectorAll("[data-fase]").forEach(el => {
    el.addEventListener("click", () => { state.fase = Number(el.dataset.fase); location.hash = SERIES.fases[state.fase].id; paint(); });
  });
  document.querySelectorAll("[data-go='home']").forEach(el => {
    el.addEventListener("click", (e) => { e.preventDefault(); state.fase = -1; state.reading = false; location.hash = "visao"; paint(); });
  });
  document.querySelectorAll("[data-act='read']").forEach(el => {
    el.addEventListener("click", () => { state.reading = true; state.line = 0; paint(); });
  });
  document.querySelectorAll("[data-act='exit']").forEach(el => {
    el.addEventListener("click", () => { state.reading = false; paint(); });
  });
  document.querySelectorAll("[data-act='next']").forEach(el => {
    el.addEventListener("click", () => advance(1));
  });
  document.querySelectorAll("[data-act='bigger']").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); state.size = Math.min(72, state.size + 4); paint(); });
  });
  document.querySelectorAll("[data-act='smaller']").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); state.size = Math.max(28, state.size - 4); paint(); });
  });
}
function advance(dir){
  if (!state.reading) return;
  const lines = linesOf(SERIES.fases[state.fase]);
  state.line = Math.max(0, Math.min(lines.length - 1, state.line + dir));
  paint();
}
document.addEventListener("keydown", (e) => {
  if (!state.reading) return;
  if (e.key === " " || e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); advance(1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); advance(-1); }
  if (e.key === "Escape") { state.reading = false; paint(); }
});
function fromHash(){
  const id = decodeURIComponent(location.hash.replace("#",""));
  const i = SERIES.fases.findIndex(f => f.id === id);
  state.fase = i;
  state.reading = false;
  paint();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
