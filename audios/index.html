<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pack de áudios · Akasha Hub</title>
<style>
  body { margin: 0; background: #f7f4ee; color: #161513; font-family: Georgia, serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px 80px; }
  a { color: inherit; }
  h1 { font-weight: 500; font-size: 40px; line-height: .95; margin: 12px 0; }
  p, li { font: 16px/1.45 system-ui, sans-serif; }
  #list { margin-top: 8px; }
  .ah-track { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .ah-track button { flex: 1; text-align: left; min-height: 52px; border-radius: 12px; border: 1px solid #161513; background: #fff; padding: 0 12px; cursor: pointer; font: 600 16px/1.2 system-ui, sans-serif; }
  .ah-track a { font: 600 14px/1 system-ui, sans-serif; }
  audio { width: 100%; margin: 14px 0; }
  .keep { display: inline-block; margin-top: 14px; padding: 12px 16px; border-radius: 999px; background: #161513; color: #f7f4ee; text-decoration: none; font: 650 14px/1 system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <p><a href="/">Akasha Hub</a></p>
  <h1>Pack de áudios</h1>
  <p id="lead">Confirmando o acesso…</p>
  <div id="list"></div>
</main>
<script type="module">
import { auth } from "/login/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { confirm, markOwned, ownsPack, fillPlayer, saveIfLogged } from "/audios/player.js";

const q = new URLSearchParams(location.search);
const lead = document.getElementById("lead");
const list = document.getElementById("list");

function show(note) {
  lead.textContent = note;
  fillPlayer(list, { download: true });
  if (!auth.currentUser) {
    const a = document.createElement("a");
    a.className = "keep";
    a.href = "/login/?next=/audios/";
    a.textContent = "Entrar para guardar neste acesso";
    list.appendChild(a);
  }
}

onAuthStateChanged(auth, async () => {
  if (await ownsPack()) {
    show("Os áudios estão no seu acesso. Ouça aqui ou baixe.");
    return;
  }
  const sessionId = q.get("session_id") || "";
  if (!sessionId) {
    lead.textContent = "Este pack abre depois do pagamento.";
    return;
  }
  try {
    const paid = await confirm(sessionId);
    if (!paid) {
      lead.textContent = "O pagamento ainda não entrou. O pack continua fechado.";
      return;
    }
    markOwned(sessionId);
    await saveIfLogged();
    show("Pagamento confirmado. Ouça aqui. Entre para o pack ficar neste e-mail em qualquer aparelho.");
  } catch (e) {
    lead.textContent = "Não consegui confirmar agora. Atualize a página.";
  }
});
</script>
</body>
</html>
