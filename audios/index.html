<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pack de áudios · Akasha Hub</title>
<style>
  body { margin: 0; background: #f7f4ee; color: #161513; font-family: Georgia, serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px 80px; }
  a { color: inherit; }
  h1 { font-weight: 500; font-size: 40px; line-height: .95; margin: 12px 0; }
  p, li { font: 16px/1.45 system-ui, sans-serif; }
  article { background: #fff; border: 1px solid #161513; border-radius: 14px; padding: 14px; margin-top: 12px; }
  audio { width: 100%; margin-top: 8px; }
  .wait { font: 15px/1.4 system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <p><a href="/">Akasha Hub</a></p>
  <h1 id="title">Pack de áudios</h1>
  <p id="lead" class="wait">Confirmando o pagamento…</p>
  <div id="list"></div>
</main>
<script>
const API = "https://jsonmxbuzagmwuucruem.supabase.co/functions/v1/akashaConversa";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb25teGJ1emFnbXd1dWNydWVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODAzMTMsImV4cCI6MjA5NjA1NjMxM30.qqBI_AUm_AnP4D830QNUd3JIbPE6o54yzwej0utJ6rQ";
const PACK = [
  { title: "O código secreto do universo", file: "/audios/codigo.mp3" },
  { title: "Cura das feridas invisíveis", file: "/audios/feridas.mp3" },
  { title: "Mente crística", file: "/audios/mente.mp3" },
];
const q = new URLSearchParams(location.search);
function show() {
  document.getElementById("lead").textContent = "Os três áudios estão abertos neste aparelho. Ouça quando quiser. Para ouvir em outro aparelho, use o mesmo pagamento.";
  const list = document.getElementById("list");
  PACK.forEach((item) => {
    const box = document.createElement("article");
    const h = document.createElement("strong");
    h.textContent = item.title;
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = item.file;
    box.append(h, audio);
    list.appendChild(box);
  });
}
async function confirm(sessionId) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY },
    body: JSON.stringify({ action: "pack_confirm", session_id: sessionId }),
  });
  const data = await res.json().catch(() => ({}));
  return data.paid === true;
}
(async function () {
  const saved = localStorage.getItem("akasha-pack");
  const sessionId = q.get("session_id") || saved || "";
  if (!sessionId) {
    document.getElementById("lead").textContent = "Este pack abre depois do pagamento.";
    return;
  }
  try {
    const paid = await confirm(sessionId);
    if (!paid) {
      document.getElementById("lead").textContent = "O pagamento ainda não entrou. O pack continua fechado.";
      return;
    }
    localStorage.setItem("akasha-pack", sessionId);
    show();
  } catch (e) {
    document.getElementById("lead").textContent = "Não consegui confirmar agora. Atualize a página.";
  }
})();
</script>
</body>
</html>
