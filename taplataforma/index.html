<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tecnologia da Alma · Plataforma</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/webp" href="https://res.cloudinary.com/dcbarseus/image/upload/v1773707211/IMG_20260104_135834_828_nsimow.webp">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=ta1">
</head>
<body>
<div id="authShell">
  <div class="auth-card">
    <div class="auth-logo"><img src="https://res.cloudinary.com/dcbarseus/image/upload/v1773707211/IMG_20260104_135834_828_nsimow.webp" alt=""><span>AK<b>A</b>SHA · <b>TA</b></span></div>
    <h1>Tecnologia da Alma</h1>
    <p class="sub">Área da mentoria. Conta não é acesso. A liberação é do mentor, depois da entrevista.</p>
    <div class="field"><label>E-mail</label><input type="email" id="loginEmail" autocomplete="username" placeholder="voce@email.com"></div>
    <div class="field"><label>Senha</label><input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="btnLogin" type="button">Entrar</button>
    <div class="auth-divider">ou</div>
    <button class="btn btn-google" id="btnGoogle" type="button">Continuar com Google</button>
    <p class="auth-msg" id="authMsg"></p>
  </div>
</div>
<div id="accessDenied">
  <h2>Acesso ainda não liberado</h2>
  <p>A entrevista vem antes da sala. Quando o mentor liberar, esta mesma conta entra.</p>
  <button class="btn btn-inline" id="btnDeniedBack" type="button">Voltar</button>
</div>
<div id="appShell">
  <div class="side-backdrop" id="sideBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="side-logo"><img src="https://res.cloudinary.com/dcbarseus/image/upload/v1773707211/IMG_20260104_135834_828_nsimow.webp" alt=""><span>AL<b>M</b>A</span></div>
    <nav id="navMain"></nav>
    <div class="side-foot">
      <div class="user-chip"><div class="av" id="userAv">A</div><div class="meta"><div class="name" id="userName">—</div><div class="role" id="userRole">—</div></div></div>
      <button class="btn-logout" id="btnLogout" type="button">Sair</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="top-left"><button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu">☰</button><div class="top-title" id="topTitle">Início</div></div>
      <span class="badge" id="planBadge">—</span>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js?v=ta1"></script>
</body>
</html>
