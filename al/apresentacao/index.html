<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Apresentação para o cliente · Arquitetura de Legado</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f4efe6;--ink:#17130f;--muted:#6d645b;--violet:#5c3d78;--gold:#9b7330;--line:rgba(23,19,15,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex:none}
header{border-bottom:1px solid var(--line);letter-spacing:.12em;font-size:11px;text-transform:uppercase;color:var(--muted);background:var(--bg)}
header b{color:var(--violet);font-weight:600;letter-spacing:.14em}
a{color:var(--violet);text-decoration:none}
button{font:inherit;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 14px;cursor:pointer}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:12px}
.frame{width:min(1180px,calc(100vw - 28px),calc((100dvh - 128px) * 16 / 9));aspect-ratio:16/9;background:#fbf8f2;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(48,35,20,.12);position:relative}
.slide{position:absolute;inset:0;display:none;overflow:auto}
.slide.on{display:block}
.photo{background-size:cover;background-position:center 20%;color:#fff}
.photo .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,10,20,.82),rgba(16,10,20,.42) 52%,rgba(16,10,20,.16))}
.inner{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:7% 6% 8%;max-width:68%}
.paper{background:radial-gradient(circle at 100% 0%,rgba(92,61,120,.12),transparent 34%),#fbf8f2;color:var(--ink)}
.paper .inner{justify-content:center;max-width:86%}
.for{letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#e2c48a;margin-bottom:8px}
.paper .for{color:var(--gold)}
.kicker{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#e2c48a;margin-bottom:8px}
.paper .kicker{color:var(--violet)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(28px,3.6vw,58px);line-height:1;letter-spacing:-.03em;margin:0 0 12px}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(18px,1.8vw,28px);line-height:1.25;margin:0;color:#f4efe6}
.paper .sub{color:#4d453d}
ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
li{font-size:clamp(15px,1.35vw,20px);padding-top:8px;border-top:1px solid rgba(255,255,255,.22)}
.paper li{border-color:var(--line)}
.live{outline:none;border-radius:8px}
.live:focus{background:rgba(92,61,120,.06)}
.hint{margin-top:14px;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.notes{display:none;background:#fff;border-top:1px solid var(--line);padding:14px 18px;font-size:14px;max-height:30vh;overflow:auto}
.notes.on{display:block}
.notes b{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--violet)}
footer{background:var(--bg);border-top:1px solid var(--line)}
footer span{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(92,61,120,.15);z-index:4}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8d6aa8,#c49a50)}
@media(max-width:860px){
  body{height:auto}
  header{position:sticky;top:0;z-index:6;flex-wrap:wrap}
  .stage{padding:0;display:block}
  .frame{width:100%;aspect-ratio:auto;min-height:calc(100dvh - 124px);height:auto;border-radius:0;overflow:visible;box-shadow:none}
  .slide{position:relative;min-height:calc(100dvh - 124px)}
  .slide.on{display:flex;flex-direction:column}
  .inner,.paper .inner{max-width:100%;padding:28px 20px 36px;justify-content:flex-end}
  .paper .inner{justify-content:flex-start}
  h1{font-size:clamp(34px,10vw,48px)}
  li{font-size:17px}
  footer{position:sticky;bottom:0;z-index:6}
  .notes{max-height:40vh}
}
</style>
</head>
<body>
<header>
  <div>Tela da call · <b>o cliente vê o negócio dela</b></div>
  <div style="display:flex;gap:12px;align-items:center">
    <a href="../central/#script">Script</a>
    <button type="button" id="notesBtn">Notas da fala</button>
  </div>
</header>
<main class="stage">
  <div class="frame" id="frame">
    <div class="bar"><i id="bar"></i></div>
  </div>
</main>
<div class="notes" id="notes"></div>
<footer>
  <button type="button" id="prev">Anterior</button>
  <span id="count"></span>
  <button type="button" id="next">Próximo</button>
</footer>
<script>
const IMG = {
  moon: "../assets/lua-moon.jpg",
  hero: "../assets/lua-hero.jpg",
  lib: "../assets/lua-origem.jpg",
  mesa: "../assets/lua-mesa.jpg",
  silk: "../assets/lua-seda.jpg"
};
const SLIDES = [
  {kind:"photo", img:IMG.moon, k:"para você", t:"O que vamos arquitetar no seu negócio", s:"Uma casa. Não mais um produto solto.", n:"Diga o nome do negócio dela antes de falar de você. Esta tela é o negócio dela. Você conduz. Ela reconhece."},
  {kind:"paper", k:"com as palavras dela", t:"Você não começa do zero.", live:true, items:["O que você já entrega","Onde isso trava quando precisa crescer","O que precisa ficar de pé em doze meses"], hint:"Clique e troque pelas palavras dela.", n:"Preencha na tela, em voz alta. Hoje você faz X. Quando Y, trava Z. O que quer de pé é W. Confirme. Não invente o silêncio."},
  {kind:"photo", img:IMG.lib, k:"a casa", t:"Três forças. Uma arquitetura.", s:"Essência, alma e dinheiro deixam de competir no seu negócio.", n:"Ela não compra três mentorias. No negócio dela, identidade, operação e valor passam a ser cômodos da mesma casa."},
  {kind:"paper", k:"onde cada parte mora", t:"O mapa do seu negócio", items:["Essência: quem você é e o método que é seu","Alma: como você opera. Mente, corpo, campo","Alinhamento: valor, decisão e a mesa","Estrutura: o que continua quando você sai da sala"], n:"Aponte o cômodo vazio no caso dela. A mesa, os modos e o som continuam. Não ofereça a plataforma como produto separado."},
  {kind:"photo", img:IMG.mesa, k:"a decisão", t:"A mesa decide no seu negócio.", s:"Oferta, conversa e fechamento deixam de ser improviso.", n:"A mesa não é um curso à parte. É onde a oferta dela passa a ter critério. Se ela já conhece o alinhamento, mostre que a ferramenta entrou na casa, não foi embora."},
  {kind:"paper", k:"o caminho", t:"O trabalho dentro do seu negócio", items:["Anamnese: de onde vem a sua prática","Codificação: o que você repete vira etapa","Essência: para quem isso serve","Síntese: a oferta, com limite","Sistema: a mesa, a alma e o valor juntos","Operação: doze meses em uso"], n:"O gargalo que ela trouxe está numa etapa. Nomeie. Se a leitura não servir, ajuste. Não troque o método."},
  {kind:"paper", k:"o que fica de pé", t:"Em doze meses, isto existe no seu negócio", items:["Um método com nome","Uma oferta que outra pessoa explica","Uma estrutura que não pede você repetindo tudo","O ciclo: grupo, imersão e três encontros individuais"], n:"Isto é escopo, não faturamento. 24 encontros, 3 imersões de 2 dias, comunidade, plataforma, laboratório. Sem execução ilimitada."},
  {kind:"photo", img:IMG.silk, k:"o combinado", t:"A arquitetura pede você na sala.", s:"Eu conduzo o método. Você traz o negócio.", n:"Yan revisa e segura o escopo. Ela traz repertório, material e o que acontece entre os encontros. Pergunte que tempo real ela reserva."},
  {kind:"paper", k:"como acontece", t:"Um ciclo. Uma recomendação.", items:["Mentoria em grupo: R$ 39.000 e 3 individuais","Consultoria: R$ 60.000 e 6 individuais, só se o diagnóstico pedir","A página pública mostra um plano","A conversa escolhe, com evidência"], n:"Não abra os dois como cardápio. Recomende um. A mentoria não é desconto da consultoria. Condições de pagamento ficam na proposta."},
  {kind:"photo", img:IMG.hero, k:"o investimento", t:"R$ 39.000", s:"O ciclo do seu negócio. Não uma promessa.", n:"Diga o número do formato que você recomendou. Cale. Não preencha o silêncio com desconto. Se ela perguntou cedo demais, volte ao problema antes do preço."},
  {kind:"paper", k:"a decisão", t:"Agora, no seu negócio", items:["Este é o trabalho deste ano?","Quem mais decide? A gente chama agora","Se não couber, a gente registra e encerra"], n:"Nota interna: se não for 10, não empurre. Se outra pessoa decide, ligue na call. Não mande a decisão para um áudio frio."},
  {kind:"photo", img:IMG.moon, k:"o próximo desenho", t:"Proposta. Confirmação. Primeiro encontro.", s:"A construção começa do lugar que você trouxe hoje.", n:"Se for seguir, escopo e condições por escrito. Depois da confirmação, o material de entrada. Registre com as palavras dela."}
];
const frame = document.getElementById("frame");
const notes = document.getElementById("notes");
SLIDES.forEach((s)=>{
  const el = document.createElement("section");
  el.className = "slide "+(s.kind==="photo"?"photo":"paper");
  if(s.img) el.style.backgroundImage = "url('"+s.img+"')";
  const items = (s.items||[]).map(x=>"<li"+(s.live?' class="live" contenteditable="true" spellcheck="false"':'')+">"+x+"</li>").join("");
  el.innerHTML = (s.kind==="photo"?'<div class="veil"></div>':'')+'<div class="inner"><div class="for">O seu negócio</div><div class="kicker">'+s.k+'</div><h1>'+s.t+'</h1>'+(s.s?'<p class="sub">'+s.s+'</p>':'')+(items?'<ul>'+items+'</ul>':'')+(s.hint?'<p class="hint">'+s.hint+'</p>':'')+'</div>';
  frame.appendChild(el);
});
const nodes = [...frame.querySelectorAll(".slide")];
function index(){
  const n = Number((location.hash||"#1").replace("#",""));
  return Number.isFinite(n) && n>=1 && n<=SLIDES.length ? n-1 : 0;
}
function render(){
  const i = index();
  nodes.forEach((n,k)=>n.classList.toggle("on", k===i));
  notes.innerHTML = "<b>Fala, só você</b><p>"+SLIDES[i].n+"</p>";
  document.getElementById("count").textContent = (i+1)+" / "+SLIDES.length;
  document.getElementById("bar").style.width = ((i+1)/SLIDES.length*100)+"%";
  document.title = SLIDES[i].t+" · para o cliente";
}
function go(d){ location.hash = String(Math.min(SLIDES.length, Math.max(1, index()+1+d))); }
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.getElementById("notesBtn").onclick=()=>notes.classList.toggle("on");
addEventListener("hashchange", render);
addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea,[contenteditable='true']")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") { e.preventDefault(); go(1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp") { e.preventDefault(); go(-1); }
  if(e.key==="n"||e.key==="N") notes.classList.toggle("on");
});
render();
</script>
</body>
</html>
