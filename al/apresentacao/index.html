<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Apresentação de vendas · Arquitetura de Legado</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0c0b09;--ink:#f4efe6;--gold:#c6a15a;--muted:#cbbfae;--line:rgba(244,239,230,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Outfit,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;flex:none}
header{border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.12em}
a{color:var(--gold);text-decoration:none}
button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);min-height:42px;padding:8px 14px;cursor:pointer}
.stage{flex:1;min-height:0;margin:10px 12px;padding:6vh 6vw;overflow:auto;background:
  radial-gradient(520px 320px at 110% 120%, rgba(198,161,90,.16), transparent 60%),
  #100e0c;
  border:1px solid var(--line)}
.kicker{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(34px,5vw,68px);line-height:1.05;letter-spacing:-.02em;max-width:16ch;margin:14px 0}
.sub{color:var(--muted);font-size:clamp(16px,2vw,20px);max-width:40rem}
ul{list-style:none;padding:0;margin:22px 0 0;max-width:46rem}
li{font-size:clamp(18px,2.2vw,26px);padding:10px 0;border-bottom:1px solid var(--line);font-family:"Cormorant Garamond",Georgia,serif}
.notes{display:none;background:#f4efe6;color:#1a140c;padding:14px 18px;font-size:14px;line-height:1.55;max-height:32vh;overflow:auto}
.notes.on{display:block}
.notes b{font-family:"Cormorant Garamond",serif;font-size:18px}
footer span{font-size:12px;letter-spacing:.08em;color:var(--muted)}
@media(max-width:700px){
  header{flex-wrap:wrap}
  .stage{padding:28px 18px}
  h1{font-size:36px}
}
</style>
</head>
<body>
<header>
  <div>AKASHA · ARQUITETURA DE LEGADO</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <a href="../central/index.html">Central</a>
    <a href="../legado/index.html">Página</a>
    <button type="button" id="notesBtn">Notas</button>
  </div>
</header>
<main class="stage" id="stage"></main>
<div class="notes" id="notes"></div>
<footer>
  <button type="button" id="prev">Anterior</button>
  <span id="count"></span>
  <button type="button" id="next">Próximo</button>
</footer>
<script>
const SLIDES = [
  {k:"01 · abertura", t:"Sua origem já é repertório. Agora ela ganha arquitetura.", s:"Yan Klehn · AKASHA Hub", n:"Você construiu experiência. Hoje a gente olha a estrutura que torna isso claro, transmissível e aplicável. Não são três mentorias. É uma: Arquitetura de Legado. Conecte cada etapa ao que a pessoa acabou de contar."},
  {k:"02 · leitura", t:"O que você já construiu. O que ainda depende de você. O que precisa mudar.", items:["Situação atual","Onde trava","O que quer ver construído"], n:"Retome três fatos com as palavras dela. Hoje você [situação]. Quando [evento], acontece [problema]. O que você quer ver construído é [objetivo]. Acertei? Corrija antes de avançar. Não invente dado."},
  {k:"03 · hipótese", t:"Quando o repertório cresce e a forma não acompanha.", items:["Conhecimento disperso","Método ainda implícito","Obra que não avança"], n:"Isso é uma hipótese de trabalho: Colapso de Repertório. O conhecimento aumenta e a forma de organizar, transmitir e sustentar não acompanha. A evidência, no caso dela, é [exemplo dito]. Se a leitura não representar, ajuste. O que antes estava em mentorias separadas — essência, alma, dinheiro, mesa — aqui é um sistema."},
  {k:"04 · custo", t:"Adiar a forma tem um preço que ela já sente.", items:["Tempo refeito","Oportunidade difícil de atender","Conhecimento preso na agenda"], n:"Qual consequência pesa mais hoje? Se ela estimou um custo, separe perda já observada de oportunidade hipotética. Estimativa de receita não é retorno prometido. Pergunte o que acontece se o cenário continuar doze meses. Sem drama."},
  {k:"05 · ordem", t:"A prática define o método. O método define a oferta. A oferta define a estrutura.", n:"A construção começa pelo que ela faz bem e pelo problema que resolve. Origem esclarece a essência. Essência esclarece a operação. Operação esclarece o valor. Valor pede estrutura. Estrutura, se ficar de pé, é legado. A ferramenta não escolhe o negócio por ela."},
  {k:"06 · entrega", t:"O que fica construído neste ciclo.", items:["Origem nomeada","Método documentado","Oferta definida","Ativo digital em uso"], n:"O método registra o raciocínio em etapas. O posicionamento diz para quem serve. A oferta delimita a transformação. O ativo coloca isso em circulação. No onboarding se define o primeiro ativo e o escopo que cabe no ciclo. Sem execução ilimitada."},
  {k:"07 · método", t:"A.C.E.S.S.O. atravessa o todo.", items:["Anamnese · origem","Codificação · etapas","Essência · para quem","Síntese · oferta","Sistema · mesa, alma, valor","Operação · doze meses"], n:"Anamnese investiga a prática e a história. Codificação extrai o método. Essência define identidade e princípios. Síntese organiza mensagem e oferta. Sistema junta mesa, Tecnologia da Alma e alinhamento na estrutura. Operação acompanha uso e ajuste. O gargalo que ela trouxe está sobretudo em [etapa]."},
  {k:"08 · tempo", t:"Um ciclo de doze meses. Uma prioridade por vez.", n:"Primeiro o foco e a base do método. Depois oferta, estrutura e operação. A sequência respeita o estágio. Calendário e marcos entram na proposta e no onboarding. Encontro decide. Entre um encontro e outro, ela executa."},
  {k:"09 · base", t:"A base da jornada não mudou.", items:["24 encontros online em grupo","3 imersões presenciais de 2 dias","Comunidade, plataforma e laboratório"], n:"Coletivo sustenta cadência e hotseat. Imersão aprofunda a construção. Plataforma organiza trilha e gravação. Laboratório materializa o ativo dentro do escopo. Os individuais complementam essa base, conforme o formato."},
  {k:"10 · formato", t:"O diagnóstico escolhe o acompanhamento. A aplicação pública não.", items:["Mentoria em grupo · 3 individuais","Consultoria premium · 6 individuais","A base da jornada é a mesma"], n:"Mentoria: autonomia para executar e cadência coletiva. Três marcos — origem e prioridade, método e oferta, estrutura e operação. Consultoria: só se o diagnóstico mostrar necessidade concreta de mais revisão. Seis encontros. Não ofereça os dois como cardápio. Não trate a mentoria como desconto da consultoria."},
  {k:"11 · autor", t:"Uma casa. Uma mentoria. Vários artefatos.", items:["AKASHA Hub é a marca","Arquitetura de Legado é a mentoria","Códigos de Origem é a obra de origem"], n:"Tecnologia da Alma, alinhamento e essência não são prateleira. São camadas deste trabalho. Mostre o livro e a estrutura pública da AKASHA como artefato, não como prova de faturamento de cliente. Resultado de terceiro só entra com evidência e autorização."},
  {k:"12 · pacto", t:"Yan conduz o processo. Você traz repertório e decisão.", n:"A responsabilidade de Yan é o método, a revisão e a construção dentro do escopo. A dela é participar, entregar material e executar o combinado. Mais encontros individuais não substituem essa participação. Pergunte que espaço real ela reserva."},
  {k:"13 · recomendação", t:"A recomendação nasce de evidência, não de pressa.", n:"Minha recomendação é [formato], por [duas evidências concretas]. O primeiro foco será [prioridade]. O que ainda precisa ficar claro? Só fale de investimento quando ela tiver entendido entrega e formato."},
  {k:"14 · investimento", t:"O número é o do ciclo. Não é uma promessa.", items:["R$ 39.000 · mentoria · 3 individuais","R$ 60.000 · consultoria · 6 individuais","Condições na proposta"], n:"Diga um número, o do formato recomendado. Base da jornada que ela acabou de ver, mais a quantidade de individuais. Pause e ouça. Não ofereça desconto antes de entender a resposta. Não prometa faturamento."},
  {k:"15 · decisão", t:"Encaixe. Disponibilidade. Investimento compatível.", n:"Esse é o trabalho que você quer realizar agora? Se houver dúvida, nomeie. Se depender de outro decisor, combine quem entra e quando se retoma. Se não houver encaixe, registre com tranquilidade. Sem lead fictício. Sem métrica de enfeite."},
  {k:"16 · passo", t:"Proposta. Confirmação. Primeiro encontro.", n:"Se a decisão for seguir, envie escopo, investimento e condições por escrito. Depois da confirmação, materiais de entrada e o primeiro individual. Registre o que ela trouxe hoje para a construção começar do lugar certo."}
];
const stage = document.getElementById("stage");
const notes = document.getElementById("notes");
const count = document.getElementById("count");
function index(){
  const n = Number((location.hash||"#1").slice(1));
  return Number.isFinite(n) && n>=1 && n<=SLIDES.length ? n-1 : 0;
}
function render(){
  const i = index();
  const s = SLIDES[i];
  const items = (s.items||[]).map(x=>"<li>"+x+"</li>").join("");
  stage.innerHTML = '<div class="kicker">'+s.k+'</div><h1>'+s.t+'</h1>'+(s.s?'<p class="sub">'+s.s+'</p>':'')+(items?'<ul>'+items+'</ul>':'');
  notes.innerHTML = "<b>Fala</b><p>"+s.n+"</p>";
  count.textContent = (i+1)+" / "+SLIDES.length;
  document.title = s.t+" · Arquitetura de Legado";
}
function go(d){
  const i = Math.min(SLIDES.length, Math.max(1, index()+1+d));
  location.hash = String(i);
}
document.getElementById("prev").onclick = ()=>go(-1);
document.getElementById("next").onclick = ()=>go(1);
document.getElementById("notesBtn").onclick = ()=>notes.classList.toggle("on");
addEventListener("hashchange", render);
addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown") go(1);
  if(e.key==="ArrowLeft"||e.key==="PageUp") go(-1);
  if(e.key==="n"||e.key==="N") notes.classList.toggle("on");
});
render();
</script>
</body>
</html>
