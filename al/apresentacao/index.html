<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Apresentação · Arquitetura de Legado</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f4efe6;--ink:#17130f;--muted:#6d645b;--violet:#5c3d78;--gold:#9b7330;--line:rgba(23,19,15,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex:none}
header{border-bottom:1px solid var(--line);letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:var(--muted)}
a{color:var(--violet);text-decoration:none}
button{font:inherit;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:8px 14px;cursor:pointer}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:12px}
.frame{width:min(1180px,calc(100vw - 28px));aspect-ratio:16/9;background:#fbf8f2;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(48,35,20,.12);position:relative}
.slide{position:absolute;inset:0;display:none;z-index:1}
.slide.on{display:block}
.photo{background-size:cover;background-position:center 20%;color:#fff}
.photo .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,10,20,.78) 0%,rgba(16,10,20,.42) 46%,rgba(16,10,20,.12) 100%)}
.inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:6% 6% 7%;max-width:62%}
.paper{background:
  radial-gradient(circle at 100% 0%,rgba(92,61,120,.12),transparent 32%),
  #fbf8f2;color:var(--ink)}
.paper .inner{justify-content:center;max-width:78%}
.kicker{letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#e2c48a;margin-bottom:10px}
.paper .kicker{color:var(--violet)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(32px,4.4vw,64px);line-height:.98;letter-spacing:-.03em;margin:0 0 12px}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(18px,2vw,28px);line-height:1.25;margin:0;color:#f4efe6}
.paper .sub{color:#4d453d}
ul{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
li{font-size:clamp(15px,1.5vw,20px);padding-top:8px;border-top:1px solid rgba(255,255,255,.2)}
.paper li{border-color:var(--line)}
.notes{display:none;background:#fff;border-top:1px solid var(--line);padding:14px 18px;font-size:14px;max-height:28vh;overflow:auto}
.notes.on{display:block}
.notes b{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--violet)}
footer span{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(92,61,120,.15);z-index:4}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8d6aa8,#c49a50)}
@media(max-width:760px){
  .frame{width:100%;border-radius:0}
  .stage{padding:0}
  .inner{max-width:88%;padding:8%}
  h1{font-size:30px}
  header{flex-wrap:wrap}
}
</style>
</head>
<body>
<header>
  <div>Akasha · Arquitetura de Legado</div>
  <div style="display:flex;gap:12px;align-items:center">
    <a href="../central/">Central</a>
    <a href="../legado/">Página</a>
    <button type="button" id="notesBtn">Notas da fala</button>
  </div>
</header>
<main class="stage">
  <div class="frame" id="frame">
    <div class="bar"><i id="bar"></i></div>
  </div>
</main>
<div class="notes" id="notes"></div>
<footer>
  <button type="button" id="prev">Anterior</button>
  <span id="count"></span>
  <button type="button" id="next">Próximo</button>
</footer>
<script>
const IMG = {
  moon: "../assets/lua-moon.jpg",
  hero: "../assets/lua-hero.jpg",
  lib: "../assets/lua-origem.jpg",
  mesa: "../assets/lua-mesa.jpg",
  silk: "../assets/lua-seda.jpg",
  books: "../assets/lua-biblioteca.jpg"
};
const SLIDES = [
  {kind:"photo", img:IMG.moon, k:"01", t:"Arquitetura de Legado", s:"Uma mentoria. A casa inteira.", n:"Você já construiu experiência. Hoje a gente não vai olhar três produtos. Vai olhar uma arquitetura. Eu conecto cada parte ao que você acabou de me contar."},
  {kind:"paper", k:"02 · leitura", t:"O que você já tem. O que ainda depende de você.", items:["A situação, com as palavras dela","Onde trava de verdade","O que quer ver de pé daqui a doze meses"], n:"Hoje você [situação]. Quando [evento], acontece [problema]. O que você quer construído é [objetivo]. Acertei? Não invente dado para preencher o silêncio."},
  {kind:"photo", img:IMG.lib, k:"03", t:"Três mentorias viraram uma.", s:"Essência. Alma. Alinhamento.", n:"Arquitetura de Essência, Tecnologia da Alma e Alinhamento Financeiro deixam de ser páginas vizinhas. São integrações. A pessoa não compra um pedaço. Códigos de Origem é a linguagem, o livro, não uma quarta mentoria."},
  {kind:"paper", k:"04 · o lugar de cada uma", t:"Nada foi jogado fora. Cada uma ganhou um cômodo.", items:["Essência: identidade e método próprio","Alma: mente, corpo e campo","Alinhamento: valor, decisão e mesa","A plataforma continua de pé"], n:"Diga com calma: a mesa, os modos, o som e as ferramentas não foram reescritos. Continuam. O que mudou é a casa. Elas servem esta mentoria. Não ofereça a plataforma como um produto separado nesta conversa."},
  {kind:"photo", img:IMG.mesa, k:"05", t:"A mesa continua.", s:"Agora ela decide dentro do legado.", n:"A mesa não é um curso à parte. É onde oferta, conversa e fechamento acontecem. Se a pessoa já conhece o alinhamento, mostre que ela não perdeu a ferramenta. Ela entrou numa arquitetura maior."},
  {kind:"paper", k:"06 · método", t:"A.C.E.S.S.O. atravessa as três.", items:["Anamnese — origem","Codificação — etapas","Essência — para quem","Síntese — oferta","Sistema — mesa, alma, valor","Operação — doze meses"], n:"O método não foi trocado. Ele deixa de parar no ativo digital e passa pela alma e pelo dinheiro também. O gargalo que ela trouxe está sobretudo em [etapa]. Se a leitura não servir, ajuste."},
  {kind:"paper", k:"07 · o ciclo", t:"O que está combinado não se renegocia agora.", items:["12 meses","24 encontros online em grupo","3 imersões presenciais de 2 dias","3 encontros individuais na mentoria","Comunidade, plataforma e laboratório"], n:"Um plano na aplicação pública. A base é esta. Os individuais da mentoria são três marcos: origem e prioridade, método e oferta, estrutura e operação. Sem execução ilimitada. Sem promessa de faturamento."},
  {kind:"photo", img:IMG.silk, k:"08", t:"Construir pede a pessoa na sala.", s:"Yan conduz. Ela executa.", n:"A responsabilidade de Yan é o método, a revisão e o escopo. A dela é repertório, material e o que acontece entre os encontros. Mais encontro individual não substitui isso. Pergunte que espaço real ela reserva."},
  {kind:"paper", k:"09 · formato", t:"O diagnóstico escolhe. A página não.", items:["Mentoria em grupo · R$ 39.000 · 3 individuais","Consultoria · R$ 60.000 · 6 individuais","Só uma recomendação, com evidência"], n:"Não abra os dois como cardápio. Mentoria quando ela sustenta a cadência coletiva. Consultoria só se o diagnóstico mostrar necessidade concreta de mais revisão. A mentoria não é desconto da consultoria."},
  {kind:"photo", img:IMG.hero, k:"10", t:"R$ 39.000", s:"O ciclo. Não uma promessa.", n:"Diga um número, o do formato que você recomendou. Pause. Ouça. Não ofereça desconto antes de entender a resposta. Condições de pagamento ficam na proposta, por escrito."},
  {kind:"paper", k:"11 · decisão", t:"Encaixe. Tempo. Investimento.", items:["É este o trabalho agora?","Quem mais decide?","Se não couber, a gente registra"], n:"Se a dúvida tiver nome, nomeie. Se depender de outra pessoa, combine quem entra e quando se retoma. Se não houver encaixe, encerre com tranquilidade. Sem lead inventado."},
  {kind:"photo", img:IMG.moon, k:"12", t:"Proposta. Confirmação. Primeiro encontro.", s:"A construção começa do lugar que ela trouxe hoje.", n:"Se for seguir, envie escopo, investimento e condições por escrito. Depois da confirmação, o material de entrada e o primeiro individual. Registre o que ela disse, com as palavras dela."}
];
const frame = document.getElementById("frame");
const notes = document.getElementById("notes");
SLIDES.forEach((s,i)=>{
  const el = document.createElement("section");
  el.className = "slide "+(s.kind==="photo"?"photo":"paper");
  if(s.img) el.style.backgroundImage = "url('"+s.img+"')";
  const items = (s.items||[]).map(x=>"<li>"+x+"</li>").join("");
  el.innerHTML = '<div class="veil"></div><div class="inner"><div class="kicker">'+s.k+'</div><h1>'+s.t+'</h1>'+(s.s?'<p class="sub">'+s.s+'</p>':'')+(items?'<ul>'+items+'</ul>':'')+'</div>';
  if(s.kind!=="photo") el.querySelector(".veil").remove();
  frame.appendChild(el);
});
const nodes = [...frame.querySelectorAll(".slide")];
function index(){
  const n = Number((location.hash||"#1").replace("#",""));
  return Number.isFinite(n) && n>=1 && n<=SLIDES.length ? n-1 : 0;
}
function render(){
  const i = index();
  nodes.forEach((n,k)=>n.classList.toggle("on", k===i));
  notes.innerHTML = "<b>Fala</b><p>"+SLIDES[i].n+"</p>";
  document.getElementById("count").textContent = (i+1)+" / "+SLIDES.length;
  document.getElementById("bar").style.width = ((i+1)/SLIDES.length*100)+"%";
  document.title = SLIDES[i].t+" · Apresentação";
}
function go(d){ location.hash = String(Math.min(SLIDES.length, Math.max(1, index()+1+d))); }
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.getElementById("notesBtn").onclick=()=>notes.classList.toggle("on");
addEventListener("hashchange", render);
addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") { e.preventDefault(); go(1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp") { e.preventDefault(); go(-1); }
  if(e.key==="n"||e.key==="N") notes.classList.toggle("on");
});
render();
</script>
</body>
</html>
