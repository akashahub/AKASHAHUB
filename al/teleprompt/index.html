<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teleprompt · Akasha Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07060c; --fg:#f6f3fb; --muted:#a79fb8; --line:#2c2738; --mag:#ff2f9b; --cyan:#3ee0ff; --surface:#14121c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Manrope, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(7,6,12,.92); border-bottom: 1px solid var(--line); }
  .brand { font-family: Syne, sans-serif; font-weight: 800; letter-spacing: -.04em; }
  .brand i { color: var(--mag); font-style: normal; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip, .btn { border: 0; border-radius: 999px; background: var(--surface); padding: 8px 14px; font-weight: 700; }
  .chip.on, .btn.on { background: var(--fg); color: var(--bg); }
  .btn.mag { background: var(--mag); color: #1a0610; }
  a.chip { text-decoration: none; }
  main { max-width: 980px; margin: 0 auto; padding: 18px; }
  #stage { position: relative; height: calc(100dvh - 132px); overflow: hidden; border-radius: 28px; background: #05040a; }
  #stage:before { content: ""; position: absolute; left: 8%; right: 8%; top: 22%; height: 2px; background: var(--mag); opacity: .8; z-index: 1; }
  #script { padding: 22vh 7vw 70vh; font-family: Syne, sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 64px); line-height: 1.18; letter-spacing: -.04em; }
  #script.mirror { transform: scaleX(-1); }
  .kicker { display: block; margin-top: 1.4em; color: var(--cyan); font-family: Manrope, sans-serif; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
  .block { margin: .35em 0 0; }
  .panel { display: none; }
  .panel.on { display: block; }
  article { border: 1px solid var(--line); background: var(--surface); border-radius: 24px; padding: 16px; margin-top: 12px; }
  h1, h2 { font-family: Syne, sans-serif; letter-spacing: -.04em; margin: 0; }
  .muted { color: var(--muted); line-height: 1.5; }
  .reel { position: relative; height: 78vh; max-height: 760px; border-radius: 28px; overflow: hidden; }
  .reel img { width: 100%; height: 100%; object-fit: cover; }
  .reel .cap { position: absolute; inset: auto 0 0 0; padding: 24px; background: linear-gradient(transparent, #07060c 70%); }
  .bars { display: flex; gap: 4px; margin-bottom: 10px; }
  .bars button { flex: 1; height: 4px; border: 0; border-radius: 99px; background: var(--line); padding: 0; }
  .bars button.on { background: var(--mag); }
  input[type="range"] { accent-color: var(--mag); width: 120px; }
</style>
</head>
<body>
<header>
  <div class="brand">AKASHA <i>HUB</i></div>
  <div class="row">
    <button class="chip on" data-view="tele">Teleprompt</button>
    <button class="chip" data-view="fala">A fala</button>
    <button class="chip" data-view="reels">Reels</button>
    <a class="chip" href="/festi/">FESTI</a>
  </div>
</header>
<main>
  <section id="tele" class="panel on">
    <div class="row" style="margin-bottom:12px">
      <button class="btn mag" id="play">Ler</button>
      <label class="muted">Velocidade <input id="speed" type="range" min="2" max="18" value="7"></label>
      <button class="chip" id="mirror">Espelho</button>
      <span class="muted" id="status">Pausado</span>
    </div>
    <div id="stage"><div id="script"></div></div>
  </section>
  <section id="fala" class="panel">
    <h1 style="font-size:40px">Por que eu pensei nisso.</h1>
    <p class="muted">A fala inteira. Akasha Hub abre e fecha. O preço fica no pitch da FESTI.</p>
    <div id="full"></div>
  </section>
  <section id="reels" class="panel">
    <h1 style="font-size:40px">Reels pra outra casa.</h1>
    <p class="muted">A mesma fala, cortada. A frase grande é o vídeo. A linha de baixo é como vender.</p>
    <div class="bars" id="bars"></div>
    <div class="reel" id="reel"></div>
  </section>
</main>
<script>
const data = {"beats":[{"id":"hub-abre","kicker":"Akasha Hub","text":"Antes da FESTI, rapidinho: eu sou do Akasha Hub. A FESTI mora aqui. Agora eu vou contar por que eu pensei nisso, com as minhas palavras."},{"id":"domum","kicker":"A casa","text":"Eu já trabalhei em casa de show, casa de eventos, há muito tempo, como promoter. Eu colocava gente na casa. A casa se chamava Domum, em São José, Santa Catarina."},{"id":"dentro","kicker":"Por dentro","text":"Lá eu conseguia ver como funciona uma casa de show por dentro, por fora, e até na parte mais obscura, a parte da diretoria. Eu tinha acesso a camarim, acesso à produtora, acesso à área VIP. E colocava sempre gente lá. Me divertia. Estava sempre lá."},{"id":"lado","kicker":"Do lado","text":"Toda semana. Eu morava do lado. Uma casa do lado, que eu tinha alugado. Justamente porque eu tinha dois empregos nessa época. Um era essa casa de show. O outro era de garçom, numa lanchonete do lado, em outra empresa."},{"id":"pulo","kicker":"O pulo","text":"Aí eu percebi, depois de um tempo trabalhando com soluções digitais, que os eventos podem ser muito mais otimizados. No sentido da pessoa que está no evento participar. E conseguir uma certa gamificação."},{"id":"registro","kicker":"O registro","text":"Através de uma plataforma que registra tudo o que está acontecendo no evento. De forma que o registro é oficial do evento."},{"id":"salas","kicker":"Três salas","text":"Tem audiovisual fazendo live em três salas diferentes. Vamos dizer que tem três salas. Se estiver acontecendo tudo de uma vez, uma câmera profissional pode estar registrando tanto uma sala só quanto as três. Cada uma pode ter o seu audiovisual, ou pode ser um só que participa de uma, ou de outra, ou de outra."},{"id":"celular","kicker":"O celular","text":"E pode ser gravado também pelo celular. Qualquer pessoa pode chegar, abrir o celular e gravar."},{"id":"hibrido","kicker":"Quem está fora","text":"Sistemas de live dentro do evento. A pessoa que está participando assiste. A pessoa que não está no evento, presencialmente, também assiste. E essa pessoa que está lá de fora pode comprar esse acesso. Comprar como um ingresso virtual."},{"id":"padrao","kicker":"O padrão","text":"E a pessoa, sempre que for participar de um evento presencial, vai estar com acesso híbrido. Tanto no presencial quanto no virtual. Como padronizar? A minha dica: deixar todos os ingressos presenciais no híbrido. A pessoa comprou um presencial, ela já tem acesso à parte online, na plataforma."},{"id":"influencia","kicker":"A influência","text":"Aí algumas influências vão se encarregar de viralizar essa parte de ensinar. De ver o aplicativo funcionando, com engenharia da atenção, engenharia do consentimento. Pra que as pessoas comecem a usar isso."},{"id":"futuro","kicker":"O futuro que já começou","text":"De uma maneira que a gente consegue imaginar um Black Mirror. Uma parte sci-fi, adiantando já o futuro que já começou. Que é a inteligência artificial, o digital, presente na vida de todas as pessoas."},{"id":"so-app","kicker":"Só pela plataforma","text":"Muitas pessoas, acredito eu, vão querer participar do evento somente pela dinâmica do aplicativo, da plataforma. Muitas pessoas que não se compactuam muito com a essência, com o pertencimento que existe dentro da casa de show, vão querer participar só pela plataforma."},{"id":"missao","kicker":"A mini missão","text":"E como isso pode acontecer? Através da grande atração dentro do digital, que seria a gamificação. Fazer a pessoa fazer um jogo. Uma missão. Mini missão. Dentro do aplicativo. Pra que essa missão, essa vibe que vai ficar lá no mapa, seja bem atraente, seja divertida, e seja uma coisa totalmente nova. Porque é uma coisa nova."},{"id":"todas","kicker":"Todas as casas","text":"Vai ser implementado em casas de show. Cada uma vai ter a sua forma de gamificação. Vai ter padrões. E vai ter também personalização. Eu acredito fielmente, tenho certeza absoluta, que isso vai ser implementado em breve em todas as casas de show, em todas as casas de entretenimento, seja lá qual for."},{"id":"youtube","kicker":"Por que não no YouTube","text":"A ideia é ter salas onde se grave o conteúdo. Aí: por que eu não faço isso no YouTube? É a mesma coisa que eu pegar o YouTube e fazer uma live lá. A questão é que fica integrado. Você não vai chegar e abrir uma gaveta lá fora da sua plataforma. Você vai ter uma plataforma dentro do seu ecossistema. Do seu produtor de eventos, produtor de entretenimento, casa de show. Vai ter a sua própria."},{"id":"patrimonio","kicker":"Patrimônio","text":"E não só ter a sua própria. Você também vai ter a sua própria rede social. Porque isso, em um evento, em dois eventos, é um grande sistema funcionando de uma forma bem divertida e dinâmica. Uma grande ideia sendo aplicada. Só que, se isso for padronizado, transformado e visto como um patrimônio da tua empresa, você vai conseguir ver isso como uma rede social sua própria."},{"id":"dentro-plataforma","kicker":"Tudo dentro","text":"Então você vai ter o seu próprio Instagram. O seu próprio sistema do YouTube. O seu próprio Hotmart. Porque você pode vender produtos, pode fazer propaganda. Você vai ter tudo isso dentro da sua plataforma. Essa dinâmica eu quero que vocês entendam muito bem."},{"id":"apps","kicker":"Vários aplicativos","text":"Vocês vão ter vários aplicativos. Como rede social. Como sistema de academy, onde você pode passar dicas, pode passar aulas, pode passar vídeos, teasers do evento, do que vai acontecer, flyers, divulgação. Você pode passar entrevistas, tipo dentro da cabine, com o artista. Lives que podem aparecer tanto no telão quanto só no celular da pessoa."},{"id":"rede","kicker":"Networking","text":"Sistema de networking. Onde as pessoas que fazem o cadastro vão dizer: eu trabalho com tal, faço tal coisa. A pessoa que quiser se conectar, dentro da rede social da plataforma, no perfil, vai poder saber que essa pessoa tem esse perfil, que você pode se conectar. Pô, essa pessoa maneira já participou de outros eventos. E vai ter um sistema de cadastro bem personalizado, estratégico, pra esse networking funcionar melhor."},{"id":"guardar","kicker":"Guardar o vídeo","text":"Entrevistas podem ser salvas, podem estar gravadas. Podemos registrar e armazenar vídeos e conteúdos lá. E, se você quiser gastar menos, você pode ainda armazenar em outro lugar. Uma plataforma que armazena vídeo de graça, por exemplo o YouTube, e depois integrar o YouTube num plugin que vai estar dentro da plataforma. E até o vice-versa. E até os dois ao mesmo tempo."},{"id":"autonomia","kicker":"Autonomia","text":"Você ter o seu próprio sistema de armazenamento, dentro do app, do site, vai ter um valorzinho a mais. Porque você vai ter a autonomia. E não da minha parte, mas do sistema de armazenamento. Do Bunny, do que você preferir. Tem Panda, tem vários. Ou o grátis do YouTube. E até os dois juntos. O seu autônomo junto com o do YouTube, através de links que a gente vai estar criptografando."},{"id":"quem-ve","kicker":"Quem vê","text":"Pra as pessoas verem. Aí vai ter os vídeos livres. Os vídeos que vão estar só dentro da plataforma. Com sistema de segurança. O padrão não é uma caixa só. O padrão é visto como a sua necessidade."},{"id":"live-barata","kicker":"A live","text":"Por exemplo: eu quero gastar menos. Eu não quero depender de billing. Como é que eu faço a live? Quanto custa pra fazer o delivery de live? Quanto custa tudo isso? E como é que eu posso fazer também de graça? Por exemplo, você integrar a Twitch. Aí links. Acessa links que vão liberar a live numa plataforma que já tem a sua própria base. Que você não precisa fazer a sua própria base. Você pode integrar através de outras plataformas que já fornecem streams. Você não tem que lidar com valores de delivery de live."},{"id":"pagamento","kicker":"O ingresso","text":"E assim como a parte de pagamentos. Por exemplo, por Stripe ou Mercado Pago. É automatizada para os ingressos, onde você não precisa de Sympla. Ou você pode também integrar o Sympla. O Stripe cobre na taxa mínima pra você operar, a partir da venda que for feita."},{"id":"fecho-ideia","kicker":"A dinâmica","text":"Dá pra ter o seu próprio Sympla. Dá pra ter o seu próprio Instagram dentro da plataforma. Seu próprio YouTube. E ao mesmo tempo integrar tudo isso de uma forma que só quem tem acesso é quem está liberado dentro da plataforma."},{"id":"hub-fecha","kicker":"Akasha Hub","text":"Isso é o Akasha Hub. A FESTI é a casa. O hub é o lugar onde essa fala vira sistema, teleprompt e os reels pra levar a mesma ideia pra outra empresa."}],"reels":[{"id":"lado","title":"A casa do lado","image":"/festi/crowd.jpg","lines":["Eu morava do lado da casa de show.","Domum. São José, Santa Catarina.","Promoter. Camarim, produtora, área VIP.","Eu via a casa por dentro, por fora, e na diretoria."],"strategy":"Abre com a Domum. Atrai dono de casa que desconfia de quem nunca pisou na operação."},{"id":"salas","title":"Três salas","image":"/festi/dj.jpg","lines":["Três salas ao mesmo tempo.","Pode ser três equipes de audiovisual.","Ou uma câmera que passa de uma pra outra.","E qualquer pessoa abre o celular e grava."],"strategy":"Mostra pra produtora que o primeiro dia não exige três equipes. O registro oficial já nasce."},{"id":"hibrido","title":"O ingresso já é híbrido","image":"/festi/aerial.jpg","lines":["Quem está na pista assiste.","Quem está fora também assiste.","E compra isso como ingresso virtual.","Comprou presencial, já entrou no online."],"strategy":"Vende o ingresso novo sem tirar o presencial que a casa já sabe vender."},{"id":"so-app","title":"Quem não entra na pista","image":"/festi/selfie.jpg","lines":["Tem gente que não se compactua com a essência da casa.","Essa gente entra pela dinâmica do aplicativo.","Engenharia da atenção. Engenharia do consentimento.","O futuro que já começou."],"strategy":"Abre um público que a casa hoje não cobra. A influência ensina o gesto."},{"id":"missao","title":"Mini missão no mapa","image":"/festi/drinks.jpg","lines":["A grande atração digital é a gamificação.","Um jogo. Uma missão. Uma mini missão.","A vibe fica no mapa.","Atraente, divertida, e nova. Porque é nova."],"strategy":"É o motivo de abrir o app de novo. Cada casa personaliza em cima do mesmo padrão."},{"id":"gaveta","title":"Não abre gaveta fora","image":"/festi/vip.jpg","lines":["Por que eu não faço isso no YouTube?","Porque você não abre uma gaveta lá fora.","Fica dentro do ecossistema da casa.","Visto como patrimônio da tua empresa."],"strategy":"Responde o “a gente já posta no YouTube”. O ativo fica com a casa, não com a gaveta."},{"id":"rede","title":"Seu Instagram. Seu Hotmart.","image":"/festi/crowd.jpg","lines":["Sua própria rede social.","Seu YouTube. Seu Hotmart.","Aula, teaser, flyer, entrevista na cabine.","No telão e no celular. E a pessoa diz com o que trabalha."],"strategy":"Faz o dono ver plataforma, não custo de uma noite. O networking é o cadastro estratégico."},{"id":"custo","title":"Gasta menos ou fica dono","image":"/festi/aerial.jpg","lines":["Quer gastar menos? YouTube e Twitch, por link.","Quer autonomia? Bunny, Panda, os dois juntos.","Ingresso no Stripe ou no Mercado Pago.","Sympla se quiser. Só entra quem a casa liberou."],"strategy":"Tira o medo do custo de live, vídeo e ingresso. A casa escolhe a peça. O padrão é a necessidade dela."}]};
const script = document.getElementById("script");
script.innerHTML = data.beats.map((b) => '<span class="kicker">' + b.kicker + '</span><p class="block">' + b.text + '</p>').join("");
document.getElementById("full").innerHTML = data.beats.map((b) => '<article><p class="kicker">' + b.kicker + '</p><p>' + b.text + '</p></article>').join("");
let y = 0, playing = false, mirror = false, reel = 0, line = 0, reelPlay = true;
const speed = document.getElementById("speed");
const status = document.getElementById("status");
function tick() {
  if (playing) {
    y += Number(speed.value) / 10;
    const max = script.scrollHeight - 80;
    if (y > max) { y = max; playing = false; status.textContent = "Fim"; }
    script.style.transform = mirror ? "scaleX(-1) translateY(" + (-y) + "px)" : "translateY(" + (-y) + "px)";
  }
  requestAnimationFrame(tick);
}
tick();
document.getElementById("play").onclick = () => {
  playing = !playing;
  status.textContent = playing ? "Lendo" : "Pausado";
  document.getElementById("play").textContent = playing ? "Pausar" : "Ler";
};
document.getElementById("stage").onclick = () => document.getElementById("play").click();
document.getElementById("mirror").onclick = () => {
  mirror = !mirror;
  document.getElementById("mirror").classList.toggle("on", mirror);
  script.style.transform = mirror ? "scaleX(-1) translateY(" + (-y) + "px)" : "translateY(" + (-y) + "px)";
};
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); document.getElementById("play").click(); }
  if (e.key === "ArrowRight") speed.value = Math.min(18, Number(speed.value) + 1);
  if (e.key === "ArrowLeft") speed.value = Math.max(2, Number(speed.value) - 1);
});
document.querySelectorAll("[data-view]").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("on", b === btn));
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("on"));
    document.getElementById(btn.dataset.view).classList.add("on");
  };
});
const bars = document.getElementById("reel");
const barRow = document.getElementById("bars");
function drawReel() {
  const film = data.reels[reel];
  barRow.innerHTML = data.reels.map((item, i) => '<button class="' + (i === reel ? "on" : "") + '" data-reel="' + i + '"></button>').join("");
  bars.innerHTML = '<img alt="" src="' + film.image.replace("/festi/", "/festi/media/").replace("media/media", "media") + '"><div class="cap"><p class="kicker">' + film.title + '</p><h2 style="font-size:34px;margin-top:8px">' + film.lines[line] + '</h2><p class="muted">' + film.strategy + '</p></div>';
  barRow.querySelectorAll("[data-reel]").forEach((b) => b.onclick = () => { reel = Number(b.dataset.reel); line = 0; drawReel(); });
}
function reelSrc(image) {
  return image.startsWith("/festi/") ? "/festi/media/" + image.slice("/festi/".length) : image;
}
function drawReelFixed() {
  const film = data.reels[reel];
  barRow.innerHTML = data.reels.map((item, i) => '<button class="' + (i === reel ? "on" : "") + '" data-reel="' + i + '"></button>').join("");
  bars.innerHTML = '<img alt="" src="' + reelSrc(film.image) + '"><div class="cap"><p class="kicker">' + film.title + '</p><h2 style="font-size:34px;margin-top:8px">' + film.lines[line] + '</h2><p class="muted">' + film.strategy + '</p></div>';
  barRow.querySelectorAll("[data-reel]").forEach((b) => b.onclick = () => { reel = Number(b.dataset.reel); line = 0; drawReelFixed(); });
}
drawReelFixed();
bars.onclick = () => { reelPlay = !reelPlay; };
setInterval(() => {
  if (!reelPlay || !document.getElementById("reels").classList.contains("on")) return;
  const film = data.reels[reel];
  if (line < film.lines.length - 1) line += 1;
  else { line = 0; reel = (reel + 1) % data.reels.length; }
  drawReelFixed();
}, 2800);
</script>
</body>
</html>
