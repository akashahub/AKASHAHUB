<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contexto Geral · Arquivo de Legado · Akasha Hub</title><style>:root{color-scheme:dark;--bg:#0b0a10;--panel:#17141e;--gold:#d8b56d;--text:#f5f0e8;--muted:#c2b9cc;--line:#393143}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#21192f,var(--bg) 65%);color:var(--text);font:16px/1.7 system-ui,sans-serif}main{max-width:950px;margin:auto;padding:24px 18px 60px}h1,h2{line-height:1.2}h1{font-size:clamp(2rem,5vw,3.2rem)}.muted{color:var(--muted)}.bar{position:sticky;top:0;background:#0b0a10ee;padding:12px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}button,a{border:1px solid var(--gold);border-radius:9px;padding:10px 14px;background:var(--gold);color:#17120a;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:transparent;color:var(--text)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;font:15px/1.75 system-ui,sans-serif}.toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#17120a;padding:10px 16px;border-radius:24px}.toast.on{display:block}</style></head><body><div class="bar"><a class="secondary" href="/al/teleprompt/">← Voltar ao Teleprompt</a><button id="copy">Copiar contexto completo</button><button id="download">Baixar TXT</button></div><main><p class="muted">AKASHA HUB · DOCUMENTO DE CONTINUIDADE</p><h1>Contexto Geral — Arquivo de Legado</h1><p class="muted">Referência para retomar o projeto nesta ou em outras IAs. Este documento é uma síntese estruturada, não uma transcrição literal palavra por palavra de toda a conversa.</p><pre id="context"></pre></main><div class="toast" id="toast">Contexto copiado</div><script>const CONTEXT="CONTEXTO GERAL — ARQUIVO DE LEGADO / AKASHA HUB\nVersão de referência: 21/10/2026\nFinalidade: retomar este projeto em futuras conversas com ChatGPT ou outras IAs. Copie o contexto completo antes de pedir novas edições.\n\n1. OBJETIVO DO PROJETO\nO Arquivo de Legado é uma central audiovisual autobiográfica de Yan Simon. Reúne capítulos de vida, mapas mentais, roteiros em fala natural e notas para preservar memórias e conectar a história pessoal aos projetos atuais. O teleprompter é apoio para gravar; não deve transformar a fala em propaganda ou texto artificial. A meta é ter material que continue significativo daqui a décadas, não apenas viralizar.\n\n2. VOZ E DIREÇÃO EDITORIAL\n- Português brasileiro, conversado, autêntico, direto e humano.\n- Preservar humor e expressões espontâneas; não polir tanto a ponto de apagar a voz do narrador.\n- Verdade sem personagem; ambição sem ostentação; não fingir riqueza, resultados ou conquistas que ainda estão em construção.\n- Não soar como anúncio ou venda agressiva. Explicar a experiência real, separar fatos de hipóteses e reconhecer o que ainda não está pronto.\n- Preferência por gravar em movimento, em lugares que tenham relação com a história, com imagens de arquivo e cenas de apoio quando autorizadas.\n- O teleprompter é guia. O mapa mental serve para improvisar sem perder o fio.\n- Não inventar acontecimentos, datas, resultados, testemunhos ou detalhes biográficos. Marcar dúvidas para confirmar com Yan.\n\n3. ESTRUTURA DA VERSÃO MAIS RECENTE\nO arquivo HTML “Akasha Hub — Arquivo de Legado” (versão 2) tem 12 episódios, filtro de busca, mapas mentais, notas de gravação, roteiros, modo teleprompter com texto grande e rolagem, botões para copiar roteiro e baixar TXT, além de impressão/PDF.\n01 — Ser grande sem precisar parecer grande.\n02 — A casa onde minha história começou — e a história da casa da minha avó.\n03 — A casa da minha bisavó e a história que veio antes.\n04 — O sítio: a fase que parecia um paraíso.\n05 — Aprender espanhol e sentir que eu era estrangeiro.\n06 — Jumilla / “Romília”: a festa do vinho e a primeira bebedeira.\n07 — Florianópolis: começar a vida cedo.\n08 — Projeto MAR: Música, Arte na Rua.\n09 — A casa, a herança e a minha versão da história.\n10 — Akasha Hub e Arquitetura de Legado: transformar experiência em estrutura.\n11 — Do Zero ao Zen Negócios: aprender a entender o jogo.\n12 — Da produção de eventos à Convergência: uma ideia muito maior.\nO episódio “Alinhamento gratuito” foi retirado do conjunto. Os três episódios finais conectam a trajetória aos projetos atuais.\n\n4. HISTÓRIAS E FATOS A PRESERVAR COM CUIDADO\n- Yan teve experiências como promoter, produtor de eventos e artista/músico. O Projeto MAR significa Música, Arte na Rua; envolveu eventos de rap em Stella Maris, Rio Vermelho e Florianópolis, alguns gratuitos e um pago, além da experiência de pagar artistas e também se apresentar como artista/fundador.\n- Teve contato com grupos de promoters, listas de convidados e uma casa de shows, e com a cena de música eletrônica. Essa experiência ajudou a formar a ideia de criar uma comunidade/movimento maior.\n- Houve uma fase muito feliz em um sítio, entre plantas, árvores frutíferas e frutas à mão; era distante. Não elaborar detalhes sobre a casa além do necessário, conforme orientação do narrador.\n- A avó de Yan teve uma disputa relacionada à casa em Stella Maris. Segundo o relato familiar, quando ela foi pagar a última parcela, a casa teria sido tomada por um processo de documentação/burocracia. A família relata ter vencido judicialmente, mas ainda busca recuperar valores. Antes de publicar, conferir com advogado o alcance da decisão e a situação dos valores.\n- Não afirmar que a casa da infância e a casa da avó são o mesmo imóvel sem confirmação.\n- Há menção a cerca de 12 outras pessoas afetadas; não divulgar nomes, endereços, dados pessoais, números de processo ou documentos brutos. Convites a pessoas com experiências semelhantes devem ser feitos por contato privado e responsável, sem acusações públicas não revisadas.\n- Confirmar grafia e contexto de “Jumilla/Romília” antes de publicar.\n- Florianópolis aparece como parte importante da história desde jovem; confirmar datas e sequência sempre que necessário.\n\n5. AKASHA HUB E AF PLATAFORMA\nAkasha Hub é um ecossistema de arquitetura digital e de legado. Áreas de trabalho incluem Arquitetura de Essência, Império Digital, Alinhamento Financeiro, Execução/Expansão e Comunidade/Movimento/Continuidade, com Tecnologia da Alma como camada de integração. A AF Plataforma organiza ferramentas, processos e materiais do ecossistema.\nMétodo ACESSO: Anamnese, Codificação, Essência, Síntese, Sistema e Operação.\n“Arquitetura de Legado” é o processo executivo que transforma identidade, conhecimento e visão em estrutura, marca, oferta, sistemas e continuidade. Evitar apresentar recursos em desenvolvimento como se todos já estivessem prontos ou em produção.\n\n6. DO ZERO AO ZEN NEGÓCIOS\nProjeto de aprendizagem e pesquisa integrado a finanças e investimentos, criptoativos, economia, geopolítica, sociologia/comportamento, mídia, inteligência de mercado, IA, programação, criação de aplicativos, empreendedorismo, negociação, valuation e aquisições. Inclui caráter, disciplina, responsabilidade e pensamento crítico. A proposta é educação, pesquisa e simulação, sem promessas de lucro nem recomendações financeiras individuais. Aprender e testar antes de arriscar dinheiro real.\n\n7. CONVERGÊNCIA OS 777\nNome provisório de um conceito digital/presencial que conecta negócios, tecnologia, mente/comportamento, bem-estar, terapias, entretenimento, música/arte e gastronomia. O protótipo de repositório descreve perfis, conteúdos, universos temáticos e salas de conversa ao vivo. A ideia deriva também da experiência de produção de eventos e do Projeto MAR. O nome, formato, local, data, programação, escala e ingressos não estão confirmados; não anunciar como evento confirmado. Tratar como conceito e protótipo em desenvolvimento.\n\n8. ORIENTAÇÕES PARA FUTURAS EDIÇÕES\n- Yan pretende acrescentar novos temas e novos teleprompters no futuro; esta estrutura é viva, não final.\n- Não apagar nem substituir roteiros, funcionalidades ou conteúdos existentes sem pedido explícito.\n- Ao atualizar HTML, preservar busca/filtro, mapas mentais, modo teleprompter, tamanho de fonte/rolagem, copiar, download TXT e impressão/PDF.\n- Fazer alterações aditivas e validar JavaScript/links antes de publicar.\n- Manter o episódio 10 sobre Akasha Hub/Arquitetura de Legado/AF Plataforma; episódio 11 sobre Do Zero ao Zen Negócios; episódio 12 sobre Convergência.\n- Não recolocar o tema “alinhamento gratuito” no conjunto atual.\n- Quando Yan pedir “recapitular o contexto”, usar este documento como referência, mas conferir com ele qualquer dado incerto.\n\n9. LIMITAÇÃO SOBRE A TRANSCRIÇÃO\nEste documento é um contexto geral organizado para continuidade, não uma transcrição literal palavra por palavra de todas as conversas. Se for necessária uma transcrição integral, ela precisa ser compilada a partir das mensagens originais disponíveis, sem alegar que uma síntese é a conversa completa.\n";document.getElementById('context').textContent=CONTEXT;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(CONTEXT)}catch(e){const t=document.createElement('textarea');t.value=CONTEXT;document.body.append(t);t.select();document.execCommand('copy');t.remove()}const x=document.getElementById('toast');x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1600)};document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([CONTEXT],{type:'text/plain;charset=utf-8'}));a.download='contexto-geral-arquivo-de-legado.txt';a.click();URL.revokeObjectURL(a.href)};</script></body></html>
