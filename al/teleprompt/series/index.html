<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séries · Arquitetura de Legado</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #0f0f0f; color: #e5e5e5; }
    h1 { font-size: 1.8rem; }
    .serie { border: 1px solid #333; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    a { color: #a78bfa; }
    .roteiros { display:inline-block; margin: .4rem .8rem .2rem 0; }
  </style>
</head>
<body>
  <h1>Séries por Fase</h1>
  <p>Estrutura aditiva. Os registros das séries permanecem separados dos roteiros já existentes.</p>
  <div id="hub"></div>
  <script>
    fetch('series.json').then(r => r.json()).then(data => {
      const hub = document.getElementById('hub');
      data.series.forEach(s => {
        const div = document.createElement('div');
        div.className = 'serie';
        const h = document.createElement('h2'); h.textContent = s.codigo + ' · ' + s.nome;
        const p = document.createElement('p'); p.textContent = 'Fase ' + s.fase + ' · ' + s.episodios + ' episódios · Status: ' + s.status;
        const json = document.createElement('a'); json.href = s.id + '.json'; json.textContent = 'Ver estrutura JSON';
        div.append(h,p,json);
        if (s.id === 'cas') {
          const br = document.createElement('br');
          const scripts = document.createElement('a'); scripts.className='roteiros'; scripts.href='cas-temporada1-e01-e10.html'; scripts.textContent='Abrir teleprompters E01–E10 · Temporada 1 · Reconhecer ↗';
          div.append(br,scripts);
          const br2 = document.createElement('br');
          const scripts2 = document.createElement('a'); scripts2.className='roteiros'; scripts2.href='cas-temporada2-e11-e20.html'; scripts2.textContent='Abrir teleprompters E11–E20 · Temporada 2 · Construir ↗';
          div.append(br2,scripts2);
          const br3 = document.createElement('br');
          const scripts3 = document.createElement('a'); scripts3.className='roteiros'; scripts3.href='cas-temporada3-e21-e30.html'; scripts3.textContent='Abrir teleprompters E21–E30 · Temporada 3 · Sustentar ↗';
          div.append(br3,scripts3);
        }
        if (s.id === 'din') {
          const br = document.createElement('br');
          const scripts = document.createElement('a'); scripts.className='roteiros'; scripts.href='din-temporada1-e01-e10.html'; scripts.textContent='Abrir teleprompters E01–E10 · Temporada 1 · Reconhecer ↗';
          div.append(br,scripts);
        }
        if (s.id === 'eix') {
          const br = document.createElement('br');
          const scripts = document.createElement('a'); scripts.className='roteiros'; scripts.href='eix-abertura.html'; scripts.textContent='Abrir teleprompters E01–E03 ↗';
          div.append(br,scripts);
          const br2 = document.createElement('br');
          const scripts2 = document.createElement('a'); scripts2.className='roteiros'; scripts2.href='eix-temporada1-e04-e10.html'; scripts2.textContent='Abrir teleprompters E04–E10 ↗';
          div.append(br2,scripts2);
          const br3 = document.createElement('br');
          const scripts3 = document.createElement('a'); scripts3.className='roteiros'; scripts3.href='eix-temporada2-e11-e20.html'; scripts3.textContent='Abrir teleprompters E11–E20 · Temporada 2 ↗';
          div.append(br3,scripts3);
          const br4 = document.createElement('br');
          const scripts4 = document.createElement('a'); scripts4.className='roteiros'; scripts4.href='eix-temporada3-e21-e30.html'; scripts4.textContent='Abrir teleprompters E21–E30 · Temporada 3 ↗';
          div.append(br4,scripts4);
        }
        hub.appendChild(div);
      });
    });
  </script>
</body>
</html>
