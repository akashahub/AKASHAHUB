<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balcão · a venda só fecha quando bate</title>
<meta name="description" content="Etiqueta, gôndola e caixa na mesma peça. Se um dos três não bater, a venda não fecha.">
<link rel="canonical" href="https://akashahub.com.br/comercio/">
<meta property="og:title" content="Balcão · a venda só fecha quando bate">
<meta property="og:description" content="A loja, o caixa e o estoque olham a mesma peça.">
<meta property="og:image" content="https://akashahub.com.br/comercio/media/loja.jpg">
<meta name="theme-color" content="#07060c">
<link rel="icon" href="https://res.cloudinary.com/dcbarseus/image/upload/v1771197016/IMG_20260104_135834_828_etfko2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060c;--raise:#121018;--ink:#f6f1e6;--muted:#c4b8a8;--gold:#c9a961;--violet:#5c3d86;--line:rgba(246,241,230,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:transparent;border:0}
img{display:block;width:100%;height:220px;object-fit:cover;border-radius:16px}
h1,h2{font-weight:500;letter-spacing:-.04em;line-height:1;margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;padding:16px 18px 10px;flex-wrap:wrap}
.mark{font-family:Cinzel,serif;letter-spacing:.16em;font-size:13px;color:var(--gold)}
.nav{display:flex;gap:6px}
.nav button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line)}
.nav button.on{background:var(--violet);border-color:var(--violet)}
.notice{margin:0 18px 8px;color:var(--gold)}
.shell{display:flex;flex-direction:column}
.shelf{display:flex;gap:8px;overflow-x:auto;padding:0 18px 8px}
.shelf button{min-width:168px;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--raise)}
.shelf button.on{border-color:rgba(201,169,97,.7)}
.stage{padding:8px 18px 108px}
.ticket{background:var(--raise);border:1px solid var(--line);border-radius:22px;padding:18px;max-width:460px}
.ticket b{display:block;font-size:clamp(56px,10vw,84px);font-weight:500;letter-spacing:-.05em;line-height:.9}
.gap{color:var(--gold)}
.btn{min-height:48px;padding:0 16px;border-radius:999px;background:var(--violet);color:var(--ink)}
.btn.quiet{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.side{padding:8px 18px 120px}
.mist{color:var(--muted)}
.side li{margin:8px 0}
@media(min-width:980px){
 .shell{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;align-items:start;min-height:calc(100dvh - 74px)}
 .shelf{display:block;padding:0;border-right:1px solid var(--line)}
 .shelf button{width:100%;min-width:0;border-radius:0;border:0;border-top:1px solid var(--line);background:transparent}
 .stage{padding:8px 28px 40px}
 .side{border-left:1px solid var(--line);padding:18px 18px 24px}
}
@media(max-width:979px){
 .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px;background:#0c0a12;border-top:1px solid var(--line)}
 .nav button{flex:1}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
 <div>
  <div class="mark">BALCÃO</div>
  <h1 style="font-size:clamp(28px,4vw,40px)">A venda só fecha quando bate.</h1>
 </div>
 <nav class="nav" id="nav" aria-label="Onde você está"></nav>
</header>
<p id="notice" class="notice" role="status"></p>
<main id="app"></main>
<script>
const foto={loja:"media/loja.jpg",pecas:"media/pecas.jpg",vazio:"media/vazio.jpg"};
let goods=[
 {id:"cafe",name:"Café da casa",tag:28,caixa:28,gondola:4,fundo:12},
 {id:"sabao",name:"Sabonete",tag:18,caixa:18,gondola:0,fundo:6},
 {id:"caderno",name:"Caderno",tag:36,caixa:32,gondola:3,fundo:3}
];
let orders=[{id:"w1",who:"Pedido da porta",item:"cafe",qty:1,status:"esperando"}];
let lens="loja", id="cafe", notice="";
function esc(s){return String(s??"").replace(/[&<>"]/g,(ch)=>({"&":"\u0026amp;","<":"\u0026lt;",">":"\u0026gt;","\"":"\u0026quot;"})[ch])}
const br=n=>"R$ "+n;
const item=()=>goods.find(g=>g.id===id)||goods[0];
function gaps(){
 const list=[];
 goods.forEach(g=>{
  if(g.tag!==g.caixa) list.push({id:g.id,text:g.name+": a etiqueta diz "+br(g.tag)+" e o caixa diz "+br(g.caixa)+"."});
  if(g.gondola===0&&g.fundo>0) list.push({id:g.id,text:g.name+": a gôndola está vazia e o fundo tem "+g.fundo+"."});
 });
 orders.filter(o=>o.status==="esperando").forEach(o=>{
  const g=goods.find(x=>x.id===o.item);
  list.push({id:o.item,text:(g?g.name:"Pedido")+" esperado na porta, ainda sem separar."});
 });
 return list;
}
function flash(t){notice=t;draw()}
function draw(){
 document.getElementById("nav").innerHTML=[["loja","Loja"],["caixa","Caixa"],["estoque","Estoque"]].map(i=>`<button class="${lens===i[0]?"on":""}" data-go="${i[0]}" aria-current="${lens===i[0]?"page":"false"}">${i[1]}</button>`).join("");
 document.getElementById("notice").textContent=notice;
 const g=item();
 const shelf=goods.map(p=>`<button class="${p.id===g.id?"on":""}" data-id="${p.id}"><span style="font-size:18px">${esc(p.name)}</span><span class="mist" style="display:block">${p.gondola?p.gondola+" na gôndola":"gôndola vazia"}</span><span>${br(lens==="loja"?p.tag:p.caixa)}</span></button>`).join("");
 const wrong=g.tag!==g.caixa;
 const empty=g.gondola<1;
 const side=`<aside class="side"><p class="${gaps().length?"gap":"mist"}">O que não bate</p><ul style="padding-left:18px">${gaps().map(x=>`<li><button data-id="${x.id}">${esc(x.text)}</button></li>`).join("")||"<li>Nada fora do lugar.</li>"}</ul></aside>`;
 let stage="";
 if(lens==="loja"){
  stage=`<img src="${g.id==="cafe"?foto.pecas:foto.loja}" alt="${esc(g.name)} na loja"><div class="ticket"><span class="mist">etiqueta</span><b>${br(g.tag)}</b><h2 style="font-size:32px;margin-top:8px">${esc(g.name)}</h2><p>${empty?"Não está na gôndola. Dá para pedir, e a casa separa do fundo.":"Está na gôndola."}</p><button class="btn" data-act="pedir">Pedir</button><p class="mist">Preços de exemplo. Não é uma loja real.</p></div>`;
 }else if(lens==="caixa"){
  const fila=orders.map(o=>{const p=goods.find(x=>x.id===o.item);return `<p>${esc(o.who)} · ${p?esc(p.name):""} · ${esc(o.status)} ${o.status==="esperando"?`<button class="btn quiet" data-act="separar" data-order="${o.id}">Separar</button>`:""}</p>`}).join("");
  stage=`<div class="ticket"><span class="mist">caixa</span><b class="${wrong?"gap":""}">${br(g.caixa)}</b><h2 style="font-size:32px;margin-top:8px">${esc(g.name)}</h2>${wrong?`<p class="gap">A etiqueta está ${br(g.tag)}. O caixa não cobra os dois.</p><button class="btn" data-act="igualar">Igualar a etiqueta ao caixa</button>`:`<p>Etiqueta e caixa dizem a mesma coisa.</p>`}<p>${g.gondola} na gôndola · ${g.fundo} no fundo</p><button class="btn" data-act="cobrar" ${wrong||empty?"disabled":""}>Cobrar 1</button></div><h2 style="font-size:28px;margin-top:22px">Na porta</h2>${fila||"<p class='mist'>Nenhum pedido esperando.</p>"}`;
 }else{
  stage=`<img src="${empty?foto.vazio:foto.loja}" alt="${empty?"Gôndola com um vão":esc(g.name)}"><h2 style="font-size:40px;margin-top:12px">${esc(g.name)}</h2><p>${g.gondola} na gôndola. ${g.fundo} no fundo.</p>${wrong?`<p class="gap">Etiqueta ${br(g.tag)} · caixa ${br(g.caixa)}</p>`:""}<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" data-act="repor" ${g.fundo<1||g.gondola>8?"disabled":""}>Repor a gôndola</button><button class="btn quiet" data-act="igualar" ${wrong?"":"disabled"}>Corrigir a etiqueta</button></div>`;
 }
 document.getElementById("app").innerHTML=`<div class="shell"><aside class="shelf">${shelf}</aside><section class="stage">${stage}</section>${side}</div>`;
}
document.body.addEventListener("click",(e)=>{
 const go=e.target.closest("[data-go]");
 if(go){lens=go.dataset.go;notice="";draw();return}
 const pick=e.target.closest("[data-id]");
 if(pick&&!e.target.closest("[data-act]")){id=pick.dataset.id;draw();return}
 const act=e.target.closest("[data-act]");
 if(!act||act.disabled) return;
 const g=item();
 if(act.dataset.act==="pedir"){
  orders.unshift({id:"w"+Math.random().toString(36).slice(2,6),who:"Pedido da loja",item:g.id,qty:1,status:"esperando"});
  flash("Pedido anotado. O caixa separa. A gôndola ainda não baixou.");
  return;
 }
 if(act.dataset.act==="igualar"){g.tag=g.caixa;flash("A etiqueta agora diz o mesmo que o caixa.");return}
 if(act.dataset.act==="repor"){
  if(g.fundo<1){flash("Não há no fundo.");return}
  g.fundo-=1; g.gondola+=1;
  flash("Uma peça saiu do fundo e foi para a gôndola.");
  return;
 }
 if(act.dataset.act==="cobrar"){
  if(g.tag!==g.caixa){flash("Primeiro a etiqueta e o caixa precisam dizer o mesmo.");return}
  if(g.gondola<1){flash("Não está na gôndola. Reponha antes de cobrar.");return}
  g.gondola-=1;
  flash("Venda feita. Saiu uma peça da gôndola.");
  return;
 }
 if(act.dataset.act==="separar"){
  const o=orders.find(x=>x.id===act.dataset.order);
  const p=goods.find(x=>x.id===o.item);
  if(p.gondola<1&&p.fundo<1){flash("Não há peça para separar.");return}
  if(p.gondola<1){p.fundo-=1}else{p.gondola-=1}
  o.status="separado";
  flash("Pedido separado. O estoque baixou uma vez só.");
 }
 draw();
});
draw();
</script>
</body>
</html>
