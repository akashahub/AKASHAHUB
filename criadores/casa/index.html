<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa · demonstração</title>
<meta name="description" content="Modelo de casa para criadores. Aula, produto, comunidade e o painel. Sem cobrança real.">
<link rel="canonical" href="https://akashahub.com.br/criadores/casa/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#04030a;--gold:#c9a961;--violet:#4a2d6b;--ink:#f6f1e6;--mist:#b7ab9a;--line:rgba(201,169,97,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Cormorant Garamond",Georgia,serif}
button,input,textarea,select{font:inherit;color:inherit;background:transparent;border:0}
button{cursor:pointer}
img{width:100%;height:100%;object-fit:cover;display:block}
h1,h2{font-weight:500;margin:0;line-height:1}
a{color:var(--gold)}
header{display:flex;justify-content:space-between;gap:8px;align-items:flex-end;padding:14px 16px;position:sticky;top:0;background:rgba(4,3,10,.94);z-index:3}
.mark{font-family:Cinzel,serif;letter-spacing:.16em;color:var(--gold)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button,.btn{min-height:44px;padding:0 12px;border:1px solid var(--line)}
.nav button.on,.btn{background:var(--violet)}
.btn.gold{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.4}
main{padding:8px 16px 96px;max-width:820px}
.aviso{color:var(--gold);padding:0 16px}
.aula{border-top:1px solid var(--line);padding:12px 0;width:100%;text-align:left}
input,textarea,select{width:100%;border-bottom:1px solid var(--line);padding:8px 0}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;background:#0a0812;border-top:1px solid var(--line)}
.dock button{flex:1 1 30%;min-height:48px}
.mist{color:var(--mist)}
</style>
</head>
<body>
<header>
 <div><div class="mark" id="marca">CASA</div><a href="../">voltar à oferta</a></div>
 <div class="nav" id="papel"></div>
</header>
<p class="aviso" id="aviso"></p>
<main id="app"></main>
<nav class="dock" id="dock"></nav>
<script>
const KEY="criadores-casa";
const nivelPeso={livre:0,aluno:1,casa:2};
const aulas=[
 {id:"a1",titulo:"A porta",nivel:"livre",texto:["A casa começa por uma porta só.","A pessoa entende o que recebe.","O resto abre por nível."]},
 {id:"a2",titulo:"A aula",nivel:"aluno",texto:["Quem é aluno vê esta aula.","O progresso fica na trilha.","A anotação fica com a pessoa."]},
 {id:"a3",titulo:"A casa",nivel:"casa",texto:["Este nível é o de dentro.","Nem todo aluno precisa chegar aqui.","O criador decide o que abre."]}
];
function semente(){
 return {papel:"aluno",tela:"trilha",nivel:"livre",visto:{},nota:{},aula:"a1",batida:0,tocando:false,posts:[{id:"p1",autor:"A casa",texto:"Bem-vinda. Este recado é um exemplo.",reacoes:1,comentarios:[]}],visitas:0,pedidos:[],marca:"CASA",cor:"#c9a961",aviso:""};
}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||semente()}catch{state=semente()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??"").replace(/[&<>"]/g,(ch)=>({"&":"\u0026amp;","<":"\u0026lt;",">":"\u0026gt;","\"":"\u0026quot;"})[ch])}
function aberto(nivel){return state.papel==="criador"||nivelPeso[state.nivel]>=nivelPeso[nivel]}
function flash(t){state.aviso=t;save();draw()}
function trilha(){
 const a=aulas.find((x)=>x.id===state.aula);
 const lista=aulas.map((x)=>`<button class="aula" data-aula="${x.id}">${esc(x.titulo)} · ${esc(x.nivel)} ${state.visto[x.id]?"· vista":""} ${aberto(x.nivel)?"":"· fechada"}</button>`).join("");
 const livre=aberto(a.nivel);
 const player=livre?`<img src="../media/aula.jpg" alt=""><p>${esc(a.texto[state.batida]||a.texto.at(-1))}</p><button class="btn" data-act="tocar">${state.tocando?"seguindo":"assistir"}</button><label>Anotação<textarea id="nota">${esc(state.nota[a.id]||"")}</textarea></label><button class="btn gold" data-act="guardar-nota">Guardar anotação</button>`:`<p>Esta aula abre no nível ${esc(a.nivel)}. O seu agora é ${esc(state.nivel)}.</p><button class="btn" data-act="ir-acesso">Ver o acesso</button>`;
 const feitas=aulas.filter((x)=>state.visto[x.id]).length;
 return `<h1>A trilha</h1><p>${feitas} de ${aulas.length}. ${feitas===aulas.length?"A trilha fechou. O certificado desta demonstração é esta frase.":""}</p>${player}${lista}`;
}
function produtos(){
 const ok=aberto("aluno");
 return `<h1>O que se leva</h1><img src="../media/caixa.jpg" alt="" style="height:180px"><p>Caderno da casa. Exemplo de produto.</p>${ok?"<button class='btn' data-act='baixar'>Baixar o exemplo</button>":"<p>O arquivo abre quando o nível é de aluno.</p>"}`;
}
function sala(){
 const posts=state.posts.map((p)=>`<article style="border-top:1px solid var(--line);padding:12px 0"><b>${esc(p.autor)}</b><p>${esc(p.texto)}</p><button data-act="reagir" data-id="${p.id}">${p.reacoes} acolheu</button>${(p.comentarios||[]).map((c)=>`<p class="mist">${esc(c)}</p>`).join("")}<form data-comentario="${p.id}"><input name="texto" placeholder="Um comentário" required><button class="btn">Comentar</button></form></article>`).join("");
 return `<h1>A sala</h1><img src="../media/sala.jpg" alt="" style="height:160px">${state.papel==="criador"?"<form id='post'><input name='texto' required placeholder='Um recado da casa'><button class='btn'>Publicar</button></form>":""}${posts}<h2 style="margin-top:18px">Live</h2><p>Amanhã, um encontro de exemplo. A sala de verdade pede um serviço de vídeo. Aqui fica o replay escrito.</p><button class="btn gold" data-act="replay">Abrir o replay de exemplo</button><p id="replay"></p>`;
}
function acesso(){
 return `<h1>Acesso</h1><p>Nível atual: ${esc(state.nivel)}. Isto não cobra cartão, Pix nem boleto.</p><label>Como seria o pagamento<select id="meio"><option>Pix</option><option>Cartão</option><option>Boleto</option></select></label><p class="mist">Gateway ainda não ligado. Stripe, Mercado Pago ou Hotmart entram com a chave e o webhook.</p><button class="btn" data-act="liberar">Liberar o nível de aluno nesta demonstração</button><button class="btn gold" data-act="casa-nivel">Liberar o nível de casa</button><button class="btn gold" data-act="cancelar">Cancelar o acesso de exemplo</button>`;
}
function painel(){
 if(state.papel!=="criador") return `<p>O painel é de quem cria.</p>`;
 const vistas=Object.keys(state.visto).length;
 return `<h1>O criador</h1><p>Visitas nesta demonstração: ${state.visitas}. Pedidos de acesso: ${state.pedidos.length}. Aulas vistas: ${vistas}. Nível do aluno de exemplo: ${esc(state.nivel)}.</p><p>${state.nivel==="livre"&&state.pedidos.length===0?"Funil: a pessoa ainda não pediu acesso.":state.nivel==="livre"?"Funil: pediu e cancelou.":"Funil: o acesso de exemplo está aberto."}</p><h2 style="margin-top:16px">A cara</h2><label>Nome da casa<input id="nome" value="${esc(state.marca)}"></label><label>Cor do ouro<input id="cor" value="${esc(state.cor)}"></label><button class="btn" data-act="marca">Aplicar</button><p class="mist">Domínio próprio não muda daqui. Isso é da entrega.</p><h2 style="margin-top:16px">Avisos prontos</h2><p>Boas-vindas, carrinho parado, aniversário, quem sumiu. O texto copia. O envio espera o serviço de mensagem.</p><button class="btn gold" data-act="copiar-aviso">Copiar boas-vindas</button>`;
}
function draw(){
 document.documentElement.style.setProperty("--gold", state.cor||"#c9a961");
 document.getElementById("marca").textContent=state.marca||"CASA";
 document.getElementById("papel").innerHTML=["aluno","criador"].map((p)=>`<button class="${state.papel===p?"on":""}" data-papel="${p}">${p}</button>`).join("");
 const telas=[["trilha","Trilha"],["produtos","Produto"],["sala","Sala"],["acesso","Acesso"],["painel","Painel"]];
 document.getElementById("dock").innerHTML=telas.map((t)=>`<button class="${state.tela===t[0]?"on":""}" data-tela="${t[0]}">${t[1]}</button>`).join("");
 document.getElementById("app").innerHTML={trilha,produtos,sala,acesso,painel}[state.tela]();
 document.getElementById("aviso").textContent=state.aviso||"Demonstração neste aparelho. O Firebase entra com a chave do projeto.";
}
let timer=null;
document.body.addEventListener("click",(e)=>{
 const papel=e.target.closest("[data-papel]");
 if(papel){state.papel=papel.dataset.papel;state.aviso="";save();draw();return}
 const tela=e.target.closest("[data-tela]");
 if(tela){state.tela=tela.dataset.tela;state.aviso="";save();draw();return}
 const aula=e.target.closest("[data-aula]");
 if(aula){state.aula=aula.dataset.aula;state.batida=0;state.tocando=false;clearInterval(timer);save();draw();return}
 const act=e.target.closest("[data-act]");
 if(!act) return;
 if(act.dataset.act==="tocar"){
  const a=aulas.find((x)=>x.id===state.aula);
  if(!aberto(a.nivel)||state.tocando) return;
  state.tocando=true; state.batida=0; draw();
  timer=setInterval(()=>{state.batida++;if(state.batida>=a.texto.length){clearInterval(timer);state.tocando=false;state.visto[a.id]=true;state.aviso="Aula vista."}save();draw()},1600);
  return;
 }
 if(act.dataset.act==="guardar-nota"){state.nota[state.aula]=document.getElementById("nota").value.slice(0,500);flash("Anotação guardada neste aparelho.");return}
 if(act.dataset.act==="ir-acesso"){state.tela="acesso";save();draw();return}
 if(act.dataset.act==="baixar"){const blob=new Blob(["Caderno da casa. Exemplo. Sem arquivo real do criador.\n"],{type:"text/plain"});const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download="caderno-exemplo.txt";l.click();flash("Exemplo baixado.");return}
 if(act.dataset.act==="reagir"){const p=state.posts.find((x)=>x.id===act.dataset.id);p.reacoes++;save();draw();return}
 if(act.dataset.act==="replay"){const el=document.getElementById("replay"); if(el) el.textContent="Replay de exemplo: a casa se encontra, a aula fica, a pessoa volta no próprio tempo.";return}
 if(act.dataset.act==="liberar"||act.dataset.act==="casa-nivel"){state.nivel=act.dataset.act==="casa-nivel"?"casa":"aluno";state.pedidos.unshift({quando:new Date().toISOString(),meio:document.getElementById("meio")?.value||"Pix",demonstracao:true});flash("Nível de exemplo aberto. Nenhuma cobrança foi feita.");return}
 if(act.dataset.act==="cancelar"){state.nivel="livre";flash("Acesso de exemplo cancelado.");return}
 if(act.dataset.act==="marca"){state.marca=document.getElementById("nome").value.slice(0,24)||"CASA";state.cor=document.getElementById("cor").value||"#c9a961";flash("A cara mudou nesta demonstração.");return}
 if(act.dataset.act==="copiar-aviso"){navigator.clipboard?.writeText("Bem-vinda à casa. A sua primeira aula já está aberta.");flash("Boas-vindas copiadas. Não foram enviadas.");return}
});
document.body.addEventListener("submit",(e)=>{
 e.preventDefault();
 const f=e.target, texto=String(new FormData(f).get("texto")||"").trim();
 if(texto.length<2) return;
 if(f.id==="post"){state.posts.unshift({id:"p"+Date.now(),autor:state.marca,texto,reacoes:0,comentarios:[]});flash("Recado publicado nesta demonstração.");return}
 const p=state.posts.find((x)=>x.id===f.dataset.comentario);
 if(!p) return;
 p.comentarios.push(texto);
 flash("Comentário guardado neste aparelho.");
});
state.visitas=(state.visitas||0)+1;save();
draw();
</script>
</body>
</html>
