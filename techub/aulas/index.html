<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Hub · Gravar as 63 aulas</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F3EC">
<link rel="icon" href="https://res.cloudinary.com/dcbarseus/image/upload/v1771197016/IMG_20260104_135834_828_etfko2.png">
<style>
:root{
  --bg:#F6F3EC;--ink:#14110E;--muted:#5C564C;--gold:#9A7420;--paper:#FFFDF8;
  --line:rgba(20,17,14,.12);--dir:#6B4A12;--dirbg:#F3EBD8;--ok:#2A7A58;--warn:#B33A3A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100%}
button,select{font-family:system-ui,sans-serif;cursor:pointer}
a{color:var(--gold)}
header{
  position:sticky;top:0;z-index:20;background:rgba(246,243,236,.97);
  border-bottom:1px solid var(--line);padding:10px 14px;
  display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
}
header .brand{font:11px/1.2 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-decoration:none}
header .meta{font:12px system-ui;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools button,.tools a{
  min-height:40px;padding:8px 12px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);font:11px system-ui;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;
  display:inline-flex;align-items:center;
}
.tools button.on, .tools button.g{background:#14110E;color:#F6F3EC;border-color:#14110E}
.tools button.gold{background:linear-gradient(135deg,#9A7420,#C4A24A);color:#fff;border:0}
#mods,#list{display:flex;gap:6px;overflow:auto;padding:10px 14px}
#list{padding-top:0;padding-bottom:12px}
#mods button,#list button{
  border:1px solid var(--line);background:var(--paper);padding:8px 10px;
  font:11px system-ui;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;min-height:40px;
}
#list button{text-transform:none;font-size:12px;letter-spacing:0}
#mods button.on{background:#14110E;color:#F6F3EC}
#list button.on{border-color:var(--gold);color:var(--gold)}
main{width:min(760px,calc(100% - 28px));margin:0 auto 96px}
.kicker{font:13px/1.4 system-ui;color:var(--muted);margin:6px 0 10px}
h1{font-size:clamp(22px,5vw,34px);line-height:1.15;margin:0 0 14px}
.dir{
  background:var(--dirbg);color:var(--dir);padding:14px 16px;border-radius:12px;
  font:14px/1.5 system-ui;margin:0 0 18px;border:1px solid rgba(154,116,32,.28);
}
.dir b{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;color:#6B4A12}
.dir.hid{display:none}
.tele{font-weight:700;line-height:1.7}
.tele p{margin:0 0 1.15em}
.row{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.row button{
  min-height:44px;padding:10px 14px;border:0;background:#14110E;color:#fff;
  font:12px system-ui;letter-spacing:.12em;text-transform:uppercase;
}
.row button.g{background:linear-gradient(135deg,#9A7420,#C4A24A)}
.legend{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:0 0 18px;
}
.legend i{
  font-style:normal;background:var(--paper);border:1px solid var(--line);padding:10px;
  font:12px/1.35 system-ui;border-radius:10px;
}
.legend i b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.stage{
  position:relative;height:160px;background:#1a1714;border-radius:12px;margin:0 0 18px;overflow:hidden;
  color:#F6F3EC;font:11px system-ui;
}
.stage .cam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:.2em;text-transform:uppercase;opacity:.45}
.stage .pip{position:absolute;right:10px;bottom:10px;width:28%;height:38%;border:2px solid #C4A24A;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(20,17,14,.55)}
.stage .card{position:absolute;left:12%;top:42%;width:54%;padding:8px 10px;background:#F6F3EC;color:#6B4A12;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.stage .note{position:absolute;left:10px;top:8px;opacity:.7;letter-spacing:.12em;text-transform:uppercase}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14110E;color:#fff;padding:8px 14px;font:12px system-ui;display:none;z-index:30}
body.rec header .tools, body.rec #mods, body.rec .legend, body.rec .stage, body.rec .dir, body.rec .row{display:none}
body.rec header{justify-content:center}
body.rec .tele{font-size:28px}
body.rec main{width:min(820px,calc(100% - 20px));margin-top:12px}
.guide{background:var(--paper);border:1px solid var(--line);padding:16px;border-radius:12px;font:15px/1.55 Georgia;margin:0 0 18px}
.guide h2{font-size:18px;margin:0 0 10px}
.guide ol{padding-left:18px;margin:0}
.guide li{margin:0 0 8px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <a class="brand" href="/techub/">Tech Hub · Produção</a>
  <span class="meta" id="prog">63 aulas</span>
  <div class="tools">
    <button type="button" id="btnGuide">Guia</button>
    <button type="button" id="btnEdit" class="on">Edição</button>
    <button type="button" id="btnMinus" aria-label="Diminuir texto">A−</button>
    <button type="button" id="btnPlus" aria-label="Aumentar texto">A+</button>
    <button type="button" id="btnRec">Modo gravar</button>
    <button type="button" class="gold" id="copy">Copiar tele</button>
  </div>
</header>
<nav id="mods"></nav>
<nav id="list"></nav>
<main id="main"></main>
<div id="toast">Copiado</div>
<script src="aulas.js?v=2"></script>
<script>
const mods=[...new Set(AULAS.map(a=>a.m))];
let mi=0, li=0, fs=22, showEdit=true, showGuide=false;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg||"Copiado";
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1400);
}
function current(){
  const group=AULAS.filter(a=>a.m===mods[mi]);
  li=Math.max(0,Math.min(li,group.length-1));
  return {group, a:group[li], n:AULAS.findIndex(x=>x.id===group[li].id)};
}
function render(){
  const {group,a,n}=current();
  document.getElementById("prog").textContent=`${n+1} / ${AULAS.length} · ${a.id}`;
  document.getElementById("mods").innerHTML=mods.map((m,i)=>`<button type="button" class="${i===mi?"on":""}" data-m="${i}">${m}</button>`).join("");
  document.getElementById("list").innerHTML=group.map((x,i)=>`<button type="button" class="${i===li?"on":""}" data-l="${i}">${x.id} ${x.t}</button>`).join("");
  const tele=a.tele.trim().split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
  const guide=`<div class="guide ${showGuide?"":"hidden"}">
    <h2>Como gravar e editar (simples)</h2>
    <ol>
      <li>Hoje grave só a câmera lendo o tele. Celular na horizontal ou vertical, luz na cara, fundo quieto.</li>
      <li>Não leia a caixa dourada. Ela é receita de edição.</li>
      <li>Depois grave o pedaço de TELA (código, site, feed) numa segunda passada, se a aula pedir.</li>
      <li>No CapCut: camada de baixo = sua fala. Por cima: CARD, DIAG, TELA, PIP.</li>
      <li>PIP: sua cara no canto inferior direito, uns 25%. Nunca em cima da boca. Nunca em cima do botão que você mostra.</li>
      <li>CARD: uma ou duas linhas, 3 segundos, na altura do peito. Não tape a boca. Não cole no rodapé.</li>
      <li>Não corte os silêncios escritos. Eles são o ritmo.</li>
      <li>Nome do arquivo: M1-1-informacao.mp4. Capa: um frame real da aula, não arte solta.</li>
    </ol>
  </div>`;
  document.getElementById("main").innerHTML=`
    ${guide}
    <div class="legend">
      <i><b>CAM</b>Você falando. Grave isso primeiro, tele inteiro.</i>
      <i><b>TELA</b>Segunda gravada. Código, site, feed. Voz já está no CAM.</i>
      <i><b>PIP</b>Sua cara 25% no canto. Só quando a tela precisa de presença.</i>
      <i><b>CARD</b>Frase curta 3s. Peito, não boca.</i>
      <i><b>DIAG</b>Um slide Canva 8–12s. Depois volta pra cara.</i>
      <i><b>BROLL</b>Corte de 3–5s. Pedra, céu, mão, rua. Pouco.</i>
    </div>
    <div class="stage" aria-hidden="true">
      <div class="note">Onde colar na edição</div>
      <div class="cam">Câmera cheia</div>
      <div class="card">CARD · peito</div>
      <div class="pip">PIP 25%</div>
    </div>
    <p class="kicker">${a.id} · ${a.dur} · ${a.mix}</p>
    <h1>${a.t}</h1>
    <div class="dir ${showEdit?"":"hid"}"><b>Edição · não ler agora</b>${a.edit.replace(/\n/g,"<br>")}</div>
    <div class="tele" style="font-size:${fs}px">${tele}</div>
    <div class="row">
      <button type="button" class="g" id="copy2">Copiar teleprompt</button>
      <button type="button" id="prev">Anterior</button>
      <button type="button" id="next">Próxima</button>
    </div>`;
  document.getElementById("copy2").onclick=copyTele;
  document.getElementById("prev").onclick=()=>{if(li>0){li--;render()}else if(mi>0){mi--;li=999;render()}};
  document.getElementById("next").onclick=()=>{if(li<group.length-1){li++;render()}else if(mi<mods.length-1){mi++;li=0;render()}};
}
function copyTele(){
  const {a}=current();
  navigator.clipboard.writeText(a.tele.trim());
  toast("Tele copiado");
}
document.getElementById("mods").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;mi=+b.dataset.m;li=0;render()});
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(!b)return;li=+b.dataset.l;render()});
document.getElementById("copy").onclick=copyTele;
document.getElementById("btnEdit").onclick=()=>{showEdit=!showEdit;document.getElementById("btnEdit").classList.toggle("on",showEdit);render()};
document.getElementById("btnGuide").onclick=()=>{showGuide=!showGuide;document.getElementById("btnGuide").classList.toggle("on",showGuide);render()};
document.getElementById("btnMinus").onclick=()=>{fs=Math.max(16,fs-2);render()};
document.getElementById("btnPlus").onclick=()=>{fs=Math.min(40,fs+2);render()};
document.getElementById("btnRec").onclick=()=>{
  document.body.classList.toggle("rec");
  document.getElementById("btnRec").classList.toggle("on",document.body.classList.contains("rec"));
  document.getElementById("btnRec").textContent=document.body.classList.contains("rec")?"Sair do modo":"Modo gravar";
};
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") document.getElementById("next")?.click();
  if(e.key==="ArrowLeft") document.getElementById("prev")?.click();
});
render();
</script>
</body>
</html>
